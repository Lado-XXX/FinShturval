  ].filter(l => isFinite(l.value));

  levers.sort((a, b) => b.value - a.value);
  return { base, levers, strongest: levers[0] || null };
}

/**
 * Чего стоит концентрация — в рублях, а не в нравоучениях.
 *
 * «Не больше 25% в одной бумаге» — правило, которое легко пропустить мимо
 * ушей. Здесь считается разница исходов: каким был бы плохой год, если бы
 * лишнее из крупнейшей бумаги было распределено по остальным акциям.
 * Ничего не продаётся и не советуется — это сравнение двух портфелей.
 */
function concentrationCost({ byClass, securities, positions, monthly = 0, rates, limit = 0.25 }) {
  if (!(securities > 0) || !positions || !positions.length) return null;

  const stocks = positions.filter(p => allocationClass(p) === 'stocks' && p.qty > 0);
  if (stocks.length < 2) return null;

  const valued = stocks.map(p => ({ p, v: positionValue(p) }));
  const biggest = valued.reduce((a, b) => (b.v > a.v ? b : a));
  const share = biggest.v / securities;
  if (share <= limit) return null;                 // перекоса нет — считать нечего

  // Портфель-двойник: лишнее переложено в остальные акции пропорционально.
  const excess = biggest.v - limit * securities;
  const othersTotal = valued.reduce((a, x) => a + (x === biggest ? 0 : x.v), 0);
  if (!(othersTotal > 0)) return null;
  const trimmed = valued.map(x => ({
    kind: 'stock',
    qty: 1,
    price: x === biggest ? x.v - excess : x.v + excess * (x.v / othersTotal)
  }));

  const volNow = portfolioVolatility(byClass, securities, positions);
  const volTrim = portfolioVolatility(byClass, securities,
    [...trimmed, ...positions.filter(p => allocationClass(p) !== 'stocks')]);
  const expected = expectedReturn(byClass, securities, rates || ASSUMED_RETURN);

  // Считаем аналитически, а не прогонкой случайных сценариев: разница между
  // портфелями здесь меньше собственного шума симуляции, и от прогона к
  // прогону ответ прыгал бы на тысячи рублей. Плохой год — это примерно
  // доходность минус 1,28 разброса (нижняя десятая часть исходов).
  const Z = 1.2816;
  const badCase = vol => futureValue(securities, monthly, expected - Z * vol, 1, 0);
  const now = { bad: badCase(volNow) };
  const trim = { bad: badCase(volTrim) };

  return {
    share, limit,
    volNow, volTrim,
    badNow: now.bad, badTrim: trim.bad,
    // Во сколько обходится перекос в плохой год: разница нижних исходов.
    // Прогонка случайная, поэтому крохотную разницу считаем шумом.
    costInBadYear: Math.max(0, Math.round(trim.bad - now.bad)),
    name: biggest.p.name || biggest.p.ticker
  };
}

/**
 * Насколько облигация подешевеет, если ставка вырастет.
 *
 * Главное недоразумение с облигациями: их считают «безрисковыми», а потом
 * удивляются красной цифре. Риск здесь не в банкротстве государства, а в
 * ставке: выросла — бумага с прежним купоном стала менее интересной и
 * подешевела. Величина этого движения известна заранее.
 *
 * Считается через дюрацию — средний срок возврата вложенного. Если биржа
 * её прислала, берём её; если нет, приближаем формулой для бумаги около
 * номинала, и приближение честно помечается.
 */
function rateSensitivity({ ytm, yearsLeft, durationYears = 0, value = 0, step = 0.01 }) {
  if (!(ytm > 0) || !(yearsLeft > 0)) return null;

  let duration = durationYears > 0 ? durationYears : null;
  const approximate = duration == null;
  if (approximate) {
    // Дюрация Маколея для бумаги у номинала: (1+y)/y × (1 − 1/(1+y)^n).
    const y = ytm, n = yearsLeft;
    duration = (1 + y) / y * (1 - 1 / Math.pow(1 + y, n));
    duration = Math.min(duration, n);        // дюрация не бывает длиннее срока
  }

  const modified = duration / (1 + ytm);
  const movePct = modified * step;
  return {
    duration, modified, approximate, movePct,
    moveMoney: value > 0 ? Math.round(value * movePct) : 0,
    step
  };
}

/**
 * Что цель будет стоить в сегодняшних деньгах.
 *
 * Шесть миллионов через пять лет — это не шесть миллионов сегодня.
 * Инфляция съедает часть, и умалчивать об этом — самый мягкий и самый
 * распространённый способ обмануть человека: план вроде сходится, а
 * купить на эти деньги можно меньше задуманного.
 *
 * Инфляция — допущение (её будущего не знает никто), поэтому она
 * настраивается и всегда называется допущением.
 */
function inTodaysMoney(amount, years, inflation) {
  if (!(amount > 0) || !(years > 0) || !(inflation > 0)) return null;
  return amount / Math.pow(1 + inflation, years);
}

/** Доходность сверх инфляции: то, на что реально растёт покупательная способность. */
function realReturn(nominal, inflation) {
  if (!(inflation > 0)) return nominal;
  return (1 + nominal) / (1 + inflation) - 1;
}

/** Вероятность дойти до цели за срок. */
function chanceOfGoal(range, goal) {
  if (!range?.all?.length || !(goal > 0)) return null;
  const hits = range.all.filter(v => v >= goal).length;
  return hits / range.all.length;
}

function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/**
 * Полный разбор цели: сходится план или нет, и какие есть рычаги.
 * Возвращает готовый ответ на вопрос «дойду ли я и что менять».
 */
function analyzeGoal({ current, monthly, goal, years, byClass, securities, taxRefund = 0, rates, positions = null }) {
  if (!(goal > 0)) {
    return { hasGoal: false, message: 'Цель не задана — укажи сумму, и я посчитаю план.' };
  }

  const expected = expectedReturn(byClass, securities, rates || ASSUMED_RETURN);
  const volatility = portfolioVolatility(byClass, securities, positions);

  const reachIn = yearsToGoal(current, monthly, goal, expected, taxRefund);
  const needed = requiredMonthly(current, goal, expected, years, taxRefund);
  const range = outcomeRange(current, monthly, years, expected, volatility, taxRefund);
  const chance = chanceOfGoal(range, goal);
  const fits = reachIn != null && reachIn <= years + 0.1;

  return {
    hasGoal: true, fits, expected, volatility,
    reachIn, needed, range, chance,
    projected: futureValue(current, monthly, expected, years, taxRefund),
    levers: buildLevers({ current, monthly, goal, years, expected, taxRefund, reachIn, needed })
  };
}

/** Рычаги: что можно изменить, чтобы план сошёлся. */
function buildLevers({ current, monthly, goal, years, expected, taxRefund, reachIn, needed }) {
  const out = [];

  if (needed != null && needed > monthly) {
    out.push({
      kind: 'contribution',
      text: `Вносить ${needed.toLocaleString('ru-RU')} ₽/мес вместо ${monthly.toLocaleString('ru-RU')} — тогда уложишься в ${years} лет`,
      delta: needed - monthly
    });
  }

  if (reachIn != null && reachIn > years) {
    out.push({
      kind: 'time',
      text: `Растянуть срок до ${Math.ceil(reachIn)} лет — при нынешнем взносе цель придёт тогда`,
      delta: Math.ceil(reachIn) - years
    });
  }

  const reachable = futureValue(current, monthly, expected, years, taxRefund);
  if (reachable < goal) {
    out.push({
      kind: 'goal',
      text: `Уменьшить цель до ${Math.round(reachable / 100000) * 100000} ₽ — столько накопится за ${years} лет при нынешнем темпе`,
      delta: goal - reachable
    });
  }

  return out;
}

return {expectedReturn, portfolioVolatility, futureValue, requiredMonthly, yearsToGoal, outcomeRange, chanceOfGoal, analyzeGoal, yearOutlook, goalProgress, whatMovesTheNeedle, ratesFor, stockVolatility, concentrationCost, inTodaysMoney, realReturn, rateSensitivity, ASSUMED_RATES: ASSUMED_RETURN};
})());

/* ─── data/db.js ─── */
Object.assign(SH, (function(){
/**
 * БАЗА ДАННЫХ (IndexedDB).
 *
 * Настоящая база внутри браузера — на телефоне и на компьютере одинаково.
 * Данные не покидают устройство: ни сервера, ни аккаунта, ни синхронизации.
 *
 * Почему не localStorage, с которого начинали:
 *  · лимит ~5 МБ против сотен мегабайт здесь
 *  · localStorage хранит одну строку — приходится читать и писать всё целиком
 *  · нет поиска: чтобы найти операции за год, надо разобрать весь объём
 *  · запись блокирует интерфейс, здесь работа асинхронная
 *
 * Хранилища:
 *  ops       история операций (покупки, продажи, пополнения) — источник истины
 *  prices    котировки по дням, для графиков и истории портфеля
 *  meta      настройки, цель, стратегия, резерв
 */

const DB_NAME = 'shturval';
const DB_VERSION = 1;

let dbPromise = null;

/** Диапазон ключей: в запасном режиме настоящего IDBKeyRange может не быть. */
const KeyRange = typeof IDBKeyRange !== 'undefined' ? IDBKeyRange : {
  bound: (lower, upper, lowerOpen = false, upperOpen = false) => ({ lower, upper, lowerOpen, upperOpen }),
  only: v => ({ lower: v, upper: v }),
  lowerBound: (lower, lowerOpen = false) => ({ lower, lowerOpen }),
  upperBound: (upper, upperOpen = false) => ({ upper, upperOpen })
};

/**
 * ЗАПАСНОЕ ХРАНИЛИЩЕ.
 *
 * Когда файл открыт напрямую с устройства, браузер считает страницу «ничьей»
 * и запрещает ей базу — indexedDB.open падает. Раньше на этом обрывался
 * запуск и экран оставался пустым: человек видел белый лист вместо причины.
 *
 * Теперь при отказе работаем в памяти, подстраховываясь localStorage, и прямо
 * говорим об ограничении. Приложение остаётся живым, а данные — настолько
 * надёжными, насколько позволяет браузер.
 */
let storageMode = 'idb';        // idb | local | memory
let storageReason = null;
const LOCAL_KEY = 'shturval:fallback';
const memory = { ops: [], prices: [], meta: [] };
let memoryLoaded = false;

const memKey = (store, r) =>
  store === 'prices' ? r.ticker + '\u0000' + r.date : (store === 'ops' ? r.id : r.key);

function loadMemory() {
  if (memoryLoaded) return;
  memoryLoaded = true;
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) Object.assign(memory, JSON.parse(raw));
    storageMode = 'local';
  } catch { storageMode = 'memory'; }
}

function saveMemory() {
  if (storageMode === 'memory') return;
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(memory)); }
  catch { storageMode = 'memory'; }   // переполнение или запрет — дальше только память
}

/** Достаточно узкая замена объектному хранилищу: get, getAll, put, delete, index. */
function memoryStore(name) {
  const rows = memory[name];
  const key = r => memKey(name, r);
  const inRange = (v, range) => {
    if (range == null) return true;
    if (typeof range !== 'object') return v === range;
    const okLow = range.lower == null || (range.lowerOpen ? v > range.lower : v >= range.lower);
    const okHigh = range.upper == null || (range.upperOpen ? v < range.upper : v <= range.upper);
    return okLow && okHigh;
  };
  return {
    get: k => ({ result: rows.find(r => key(r) === k) }),
    getAll: () => ({ result: rows.slice() }),
    put: rec => {
      const i = rows.findIndex(r => key(r) === key(rec));
      if (i < 0) rows.push(rec); else rows[i] = rec;
      return { result: key(rec) };
    },
    delete: k => {
      const i = rows.findIndex(r => key(r) === k);
      if (i >= 0) rows.splice(i, 1);
      return { result: undefined };
    },
    clear: () => { rows.length = 0; return { result: undefined }; },
    index: field => ({ getAll: range => ({ result: rows.filter(r => inRange(r[field], range)) }) })
  };
}

function runInMemory(store, mode, fn) {
  loadMemory();
  const out = fn(memoryStore(store));
  if (mode !== 'readonly') saveMemory();
  const value = out && out.__req ? out.__req.result : out;
  return Promise.resolve(value);
}

/**
 * Открыт ли файл локально, а не по ссылке.
 *
 * Проверять надо `http`, а не `file:`. Браузеры открывают скачанный файл
 * и по своим внутренним адресам — `content:` в Яндекс.Браузере на Android,
 * `blob:` в других. Условие «не file: — значит по ссылке» объявляло такой
 * файл страницей с сервера: диагностика писала «страница по ссылке», а
 * соседняя строка тут же возражала «открыто не по ссылке». Обе смотрели
 * на один и тот же адрес и приходили к разным выводам.
 */
function openedLocally() {
  return typeof location === 'undefined' || !String(location.protocol || '').startsWith('http');
}

/** Почему база недоступна — человеческим языком, а не кодом ошибки. */
function explainStorage(err) {
  const local = openedLocally();
  return local
    ? 'Файл открыт напрямую с устройства, а в таком режиме браузер запрещает странице '
      + 'постоянную базу. Приложение работает, но данные держатся в памяти браузера '
      + 'и могут пропасть при очистке. Чтобы это ушло, размести файл на бесплатном '
      + 'хостинге (GitHub Pages) и открывай по ссылке.'
    : 'Браузер не дал доступ к локальной базе' + (err?.name ? ' (' + err.name + ')' : '')
      + '. Возможно, включён приватный режим. Данные держатся в памяти браузера.';
}

function open() {
  if (dbPromise) return dbPromise;

  dbPromise = new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') {
      return reject(new Error('Браузер не поддерживает локальную базу'));
    }
    let req;
    try { req = indexedDB.open(DB_NAME, DB_VERSION); }
    catch (err) { return reject(err); }     // file:// бросает прямо здесь

    req.onupgradeneeded = e => {
      const db = e.target.result;

      if (!db.objectStoreNames.contains('ops')) {
        const ops = db.createObjectStore('ops', { keyPath: 'id' });
        ops.createIndex('date', 'date');              // выборка за период
        ops.createIndex('type', 'type');              // все пополнения, все сделки
        ops.createIndex('ticker', 'ticker');          // история по бумаге
      }

      if (!db.objectStoreNames.contains('prices')) {
        const prices = db.createObjectStore('prices', { keyPath: ['ticker', 'date'] });
        prices.createIndex('date', 'date');
        prices.createIndex('ticker', 'ticker');
      }

      if (!db.objectStoreNames.contains('meta')) {
        db.createObjectStore('meta', { keyPath: 'key' });
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });

  return dbPromise;
}

function tx(store, mode, fn) {
  if (storageMode !== 'idb') return runInMemory(store, mode, fn);

  return open().catch(err => {
    // База недоступна — переходим на запасное хранилище один раз и навсегда
    storageReason = explainStorage(err);
    storageMode = 'local';
    loadMemory();
    return null;
  }).then(db => {
    if (!db) return runInMemory(store, mode, fn);
    return new Promise((resolve, reject) => {
    const t = db.transaction(store, mode);
    const s = t.objectStore(store);
    let result;
    try { result = fn(s); } catch (e) { reject(e); return; }
      t.oncomplete = () => resolve(result && result.__req ? result.__req.result : result);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  });
}

const wrap = req => {
  const holder = { __req: req };
  return holder;
};

/* ─────────────────── ОПЕРАЦИИ ─────────────────── */

async function addOp(op) {
  await tx('ops', 'readwrite', s => wrap(s.put(op)));
  return op;

async function addOps(list) {
  await tx('ops', 'readwrite', s => { for (const op of list) s.put(op); });
  return list.length;
}

async function deleteOp(id) {
  return tx('ops', 'readwrite', s => wrap(s.delete(id)));
}

async function allOps() {
  const list = await tx('ops', 'readonly', s => wrap(s.getAll()));
  return (list || []).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
}

/** Операции за период — выборка по индексу, без чтения всей базы. */

    wrap(s.index('date').getAll(KeyRange.bound(from, to))));
}

/** История по одной бумаге. */
async function opsByTicker(ticker) {
  return tx('ops', 'readonly', s => wrap(s.index('ticker').getAll(ticker)));
}

async function savePrices(records) {
  await tx('prices', 'readwrite', s => { for (const r of records) s.put(r); });
  return records.length;
}

async function priceHistory(ticker, days = 90) {
  const all = await tx('prices', 'readonly', s => wrap(s.index('ticker').getAll(ticker)));
  return (all || []).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-days);
}

/** Снимок стоимости портфеля по дням — для графика. */
async function valueHistory(days = 90) {
  const all = await tx('prices', 'readonly', s => wrap(s.getAll()));
  const byDate = {};
  for (const p of all || []) {
    byDate[p.date] = (byDate[p.date] || 0) + (p.value || 0);
  }
  return Object.entries(byDate)
    .sort(([a], [b]) => (a < b ? -1 : 1))
    .slice(-days)
    .map(([date, value]) => ({ date, value }));

async function setMeta(key, value) {

async function exportAll() {

/** Загрузка копии. Существующие данные заменяются. */
async function importAll(backup) {

  for (const store of ['ops', 'prices', 'meta']) {
    await tx(store, 'readwrite', s => wrap(s.clear()));

/** Перенос данных из localStorage прошлой версии. Выполняется один раз. */
async function migrateFromLocalStorage(legacyState) {

const FAIL = { OFFLINE: 'offline', BLOCKED: 'blocked', TIMEOUT: 'timeout', SERVER: 'server' };

 * Запасной путь к бирже.
 *
 * Браузер запрещает странице читать ответ чужого сайта, если тот не разрешил

 * а скрипты со стороннего сайта грузить можно. Никаких третьих лиц в цепочке
 * не появляется — запрос идёт напрямую на биржу.

function fetchJSONP(url, timeoutMs = 10000) {
  return new Promise((resolve, reject) => {
    const name = `__shturvalIss${Date.now()}${Math.floor(Math.random() * 1e6)}`;
    const script = document.createElement('script');
    let done = false;

    const cleanup = () => {
      done = true;
      try { delete window[name]; } catch { window[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
    };
    const timer = setTimeout(() => {
      if (done) return;
      cleanup();
      const e = new Error('биржа не ответила'); e.reason = FAIL.TIMEOUT; reject(e);
    }, timeoutMs);

    window[name] = data => { if (done) return; clearTimeout(timer); cleanup(); resolve(data); };
    script.onerror = () => {
      if (done) return;
      clearTimeout(timer); cleanup();
      const e = new Error('биржа недоступна'); e.reason = FAIL.NETWORK; reject(e);
    };

    script.src = url + (url.includes('?') ? '&' : '?') + `callback=${name}`;
    document.head.appendChild(script);
  });
}

async function fetchJSON(url, timeoutMs = 8000) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    const e = new Error('нет сети'); e.reason = FAIL.OFFLINE; throw e;
  }
  const startedAt = Date.now();
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.reason = FAIL.SERVER; throw e; }
    return await r.json();
  } catch (err) {

    // путь: очень часто дело в запрете читать чужой ответ, а не в том, что
    // биржа недоступна.
    if (err.name !== 'AbortError' && typeof document !== 'undefined'
        && String(url).startsWith('https://iss.moex.com')) {

      // Раньше запрос с заявленными двадцатью секундами мог занять сорок:

      const left = timeoutMs - (Date.now() - startedAt);

    err.reason = openedLocally() ? FAIL.BLOCKED : FAIL.OFFLINE;

  } finally {
    clearTimeout(timer);
  }

 * строго по приоритету. Смешивать единицы нельзя.
 */
function pickPrice(row, boardId) {
  const isPercentBoard = ['TQOB', 'TQCB', 'TQTF'].includes(boardId);
  const candidates = isPercentBoard
    ? [row[2], row[5], row[6]]              // последняя сделка → закрытие → предыдущая
    : [row[2], row[3], row[4], row[5], row[6]];
  return candidates.find(v => v != null && Number.isFinite(v) && v > 0) ?? null;
}

/** Запрос по одному инструменту на конкретном рынке. */
async function fetchOne(secId, engine, market) {
  const url = `${ISS}/engines/${engine}/markets/${market}/securities/${encodeURIComponent(secId)}.json`
            + `?iss.meta=off&iss.only=marketdata,securities&marketdata.columns=${COLS}`
            + `&securities.columns=BOARDID,ACCRUEDINT,FACEVALUE,LOTVALUE,LOTSIZE`;

  const j = await fetchJSON(url);
  const mdRows = j?.marketdata?.data || [];
  const secRows = j?.securities?.data || [];

  // накопленный купон и номинал по площадке
  const secByBoard = {};
  // Размер лота: на бирже покупают лотами, а не штуками. Сбер торгуется
  // по 10 акций в лоте — совет «купи 111 штук» исполнить невозможно.
  for (const r of secRows) secByBoard[r[0]] = { accrued: r[1], face: r[2], lot: r[4] };

  for (const row of mdRows) {
    const board = row[1];
    const raw = pickPrice(row, board);
    if (raw == null) continue;

    const isBondBoard = ['TQOB', 'TQCB'].includes(board);
    if (isBondBoard) {
      const info = secByBoard[board] || {};
      const face = info.face > 0 ? info.face : 1000;
      const accrued = Number(info.accrued) || 0;
      // цена в процентах номинала → рубли, плюс накопленный купон (как показывает брокер)
      return { price: roundPrice(raw / 100 * face + accrued), accrued, board,
               lot: Number(info.lot) > 0 ? Number(info.lot) : 1 };
    }
    const lot = Number((secByBoard[board] || {}).lot) || 1;
    return { price: roundPrice(raw), accrued: 0, board, lot };
  }
  return null;
}

 * доступ к ответу. Поэтому: пробуем, и если не вышло — приложение просит
 * вписать ставку руками, а не подсовывает похожее число вместо неё.
 */
async function fetchKeyRate(timeoutMs = 8000) {
  const soap = `<?xml version="1.0" encoding="utf-8"?>`
    + `<soap:Envelope xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">`
    + `<soap:Body><KeyRateXML xmlns="http://web.cbr.ru/">`
    + `<fromDate>${new Date(Date.now() - 400 * 86400000).toISOString().slice(0, 10)}</fromDate>`
    + `<ToDate>${new Date().toISOString().slice(0, 10)}</ToDate>`
    + `</KeyRateXML></soap:Body></soap:Envelope>`;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch('https://www.cbr.ru/DailyInfoWebServ/DailyInfo.asmx', {
      method: 'POST', signal: ctrl.signal,
      headers: { 'Content-Type': 'text/xml; charset=utf-8',
                 'SOAPAction': 'http://web.cbr.ru/KeyRateXML' },
      body: soap
    });
    if (!r.ok) return null;
    const text = await r.text();
    // Берём последнюю пару <DT>дата</DT><Rate>значение</Rate>
    const items = [...text.matchAll(/<DT>([^<]+)<\/DT>\s*<Rate>([\d.,]+)<\/Rate>/g)];
    if (!items.length) return null;
    const last = items[items.length - 1];
    const value = parseFloat(String(last[2]).replace(',', '.'));
    return value > 0 && value < 100 ? { rate: value / 100, date: last[1].slice(0, 10) } : null;
  } catch (err) { noteSwallowed('ключевая ставка ЦБ', err); return null; }
  finally { clearTimeout(timer); }
}

  }, err => { pingMemo = null; throw err; });

async function pingExchangeRaw(timeout = 5000) {

 * Страницы истории листаются с потолком, чтобы не зависнуть на длинной истории.

async function fetchIndexHistory(from, secid = 'MCFTR') {

function tableRows(block) {
  if (!block || !block.columns || !block.data) return [];
  const c = block.columns;
  return block.data.map(row => {
    const o = {};
    c.forEach((name, i) => { o[name] = row[i]; });
    return o;
  });

/**
 * Все акции основного режима торгов (TQBR) с ценой и капитализацией.
 * P/E и прибыли ISS не отдаёт — ни здесь, ни где-либо ещё: см. screener.js,
 * где об этом сказано прямо, вместо того чтобы подсунуть выдуманное число.
 */
/**
 * КОРОТКАЯ ПАМЯТЬ О ДОСКЕ БИРЖИ.
 *
 * Список акций нужен сразу двум разделам: «что подходит портфелю» и «что
 * можно поменять». Каждый качал его сам, и на медленной сети выходило
 * нелепое: идеи по рынку загрузились, а замены на том же экране написали
 * «биржа не ответила за 60 секунд — не дождался: список акций». Один и тот
 * же вопрос, заданный дважды с разницей в секунды, получал разные ответы.
 *
 * Держим ответ пару минут. Дольше нельзя: цены на экране должны быть
 * сегодняшними, а не позавчерашними.
 */
const BOARD_TTL = 120000;
const boardCache = new Map();
function cachedBoard(key, load) {
  const hit = boardCache.get(key);
  if (hit && Date.now() - hit.at < BOARD_TTL) return Promise.resolve(hit.rows);
  // В память кладётся само ожидание, а не готовый ответ. Иначе разделы,
  // стартующие одновременно, оба видят пустой кэш и оба идут на биржу —
  // ровно та беда, ради которой кэш и заводился: «биржа не ответила за
  // 60 секунд» при бирже, отвечающей за 0,2 с.
  const p = load().then(rows => {
    boardCache.set(key, { at: Date.now(), rows });
    return rows;
  }, err => { boardCache.delete(key); throw err; });
  boardCache.set(key, { at: Date.now(), rows: p });
  return p;
}

async function fetchAllStocksRaw() {

  // (обычные и привилегированные) от фондов и расписок, которые торгуются

  const j = await fetchJSON(`${ISS}/engines/stock/markets/shares/boards/TQBR/securities.json`
    + `?iss.meta=off&iss.only=securities,marketdata`
    + `&securities.columns=SECID,SHORTNAME,PREVPRICE,ISSUESIZE,LOTSIZE,SECTYPE`
    + `&marketdata.columns=SECID,LAST,MARKETPRICE,ISSUECAPITALIZATION,VALTODAY`, 20000);

    if (r.SECTYPE && !['1', '2'].includes(String(r.SECTYPE))) continue;
    const m = md.get(r.SECID) || {};
    const price = m.LAST > 0 ? m.LAST : (m.MARKETPRICE > 0 ? m.MARKETPRICE : r.PREVPRICE);
    if (!(price > 0)) continue;
    out.push({
      ticker: r.SECID, name: r.SHORTNAME || r.SECID, price,
      lot: r.LOTSIZE || 1,
      // Оборот за день: мера того, насколько легко войти и выйти. Бумагу
      // без оборота можно купить, но продавать придётся со скидкой —
      // и эта скидка съест любую расчётную выгоду.
      turnover: m.VALTODAY > 0 ? m.VALTODAY : 0,
      cap: m.ISSUECAPITALIZATION > 0 ? m.ISSUECAPITALIZATION
         : (r.ISSUESIZE > 0 ? r.ISSUESIZE * price : null)
    });
  }
  return out;
}

/**
 * Облигации: ОФЗ (TQOB) и корпоративные (TQCB). Доходность к погашению
 * и срок биржа отдаёт сама — здесь ничего считать на глазок не нужно.
 */
async function fetchAllBondsRaw(kinds = ['gov'], maxPages = 3) {
  // По умолчанию только ОФЗ: их шесть десятков, ответ приходит мгновенно.
  // Доска корпоративных — тысячи выпусков и мегабайты, из-за неё поиск
  // не доживал до конца. Корпоративные просим отдельно и тоже страницами.
  const boards = [];
  if (kinds.includes('gov')) boards.push(['TQOB', 'gov']);
  if (kinds.includes('corp')) boards.push(['TQCB', 'corp']);
  const out = [];
  for (const [board, type] of boards) {
    const rows = [], yieldRows = [], turnoverRows = [];
    for (let page = 0; page < maxPages; page++) {
      let j;
      try {
        j = await fetchJSON(`${ISS}/engines/stock/markets/bonds/boards/${board}/securities.json`
          + `?iss.meta=off&iss.only=securities,marketdata_yields,marketdata&start=${page * 100}`
          + `&securities.columns=SECID,SHORTNAME,SECNAME,MATDATE,OFFERDATE,COUPONVALUE,COUPONPERCENT,COUPONPERIOD,FACEVALUE,PREVPRICE`
          + `&marketdata_yields.columns=SECID,EFFECTIVEYIELD,DURATION`
          + `&marketdata.columns=SECID,VALTODAY`, 15000);
      } catch (err) { noteSwallowed('страница доски облигаций', err); break; }
      const secPage = tableRows(j?.securities);
      rows.push(...secPage);
      yieldRows.push(...tableRows(j?.marketdata_yields));
      turnoverRows.push(...tableRows(j?.marketdata));
      if (secPage.length < 100) break;
    }
    const yields = new Map(yieldRows.map(r => [r.SECID, r]));
    const turnovers = new Map(turnoverRows.map(r => [r.SECID, r.VALTODAY || 0]));
    for (const r of rows) {
      const y = yields.get(r.SECID) || {};
      const face = r.FACEVALUE > 0 ? r.FACEVALUE : 1000;
      const price = r.PREVPRICE > 0 ? r.PREVPRICE * face / 100 : null;
      const mat = r.MATDATE && r.MATDATE !== '0000-00-00' ? r.MATDATE : null;
      const yearsLeft = mat ? Math.round(daysBetween(today(), mat) / 365.25 * 10) / 10 : null;
      // Оферта — день, когда эмитент вправе выкупить бумагу (или обязан по
      // требованию держателя). До неё известен купон, после — часто нет.
      // Доходность к погашению для такой бумаги считается до срока, которого
      // может не быть: это самая частая ловушка в корпоративных облигациях.
      const offer = r.OFFERDATE && r.OFFERDATE !== '0000-00-00' ? r.OFFERDATE : null;
      const yearsToOffer = offer ? Math.round(daysBetween(today(), offer) / 365.25 * 10) / 10 : null;
      if (!(y.EFFECTIVEYIELD > 0) || !(yearsLeft > 0)) continue;
      // Три разных инструмента под одним словом «облигация»:
      // • постоянный купон — известен до конца, страдает от роста ставки;
      // • плавающий (ПК, флоатер) — купон привязан к ставке, защищает от её роста;
      // • индексируемый номинал (ИН, линкер) — тело растёт с инфляцией,
      //   и доходность к погашению у него означает доход СВЕРХ инфляции.
      const idText = `${r.SECID} ${r.SHORTNAME || ''} ${r.SECNAME || ''}`;
      const bondKind = /SU52|ИН(?![А-Яа-я])|индексируем/i.test(idText) ? 'linker'
                     : (/SU29|ПК(?![А-Яа-я])|перемен|плавающ/i.test(idText)
                        || (!(r.COUPONVALUE > 0))) ? 'floater' : 'fixed';
      const bondLabel = bondKind === 'linker' ? 'номинал растёт с инфляцией'
                      : bondKind === 'floater' ? 'купон привязан к ставке'
                      : 'купон постоянный';

      out.push({
        ticker: r.SECID, name: r.SHORTNAME || r.SECID, issuer: r.SECNAME || r.SHORTNAME,
        bondKind, bondLabel,
        ytm: y.EFFECTIVEYIELD / 100, yearsLeft, matDate: mat, price, face,
        offerDate: offer, yearsToOffer: yearsToOffer > 0 ? yearsToOffer : null,
        turnover: turnovers.get(r.SECID) || 0,
        durationYears: y.DURATION > 0 ? Math.round(y.DURATION / 365 * 100) / 100 : 0,
        coupon: r.COUPONVALUE > 0 ? r.COUPONVALUE : null,
        couponPct: r.COUPONPERCENT > 0 ? r.COUPONPERCENT / 100 : null,
        // ПОСТОЯННЫЙ КУПОН ИЛИ НЕТ. Признак «биржа не назвала ближайший
        // купон» ненадёжен: у ОФЗ 29008 ближайший купон известен — он уже
        // объявлен, — и бумага проходила как обычная. Из-за этого приложение
        // предлагало обменять ОФЗ 26235 на 29008 «ради лишних 1,6% к
        // погашению», хотя у флоатера эта доходность держится ровно до
        // следующего решения ЦБ.
        //
        // У государственных бумаг тип зашит в номер серии, и это факт, а не
        // догадка: 29 и 24 — переменный купон, 52 — индексируемый номинал.
        // Для остальных остаётся прежний признак.
        // Через SH: модули закрыты друг от друга, и голое имя из ядра здесь
        // не видно. Раньше тут стоял прямой вызов, и разбор ЛЮБОЙ облигации
        // падал с «ofzKind is not defined» — а наружу это выходило как
        // «биржа не ответила», потому что доска ОФЗ нужна обоим поискам.
        couponType: SH.ofzKind(r.SECID) || (r.COUPONVALUE > 0 ? 'fixed' : 'float'),
        type
      });
    }
  }
  return out;
}

/**
 * Биржевые фонды (доска TQTF): золото, денежный рынок, облигации, акции.
 * Это третий вид инструментов рядом с акциями и облигациями, и для двух
 * задач он незаменим: защита (золото) и деньги под ставку без срока.
 *
 * Вид фонда определяется по названию — биржа его не размечает. Комиссию
 * управляющего ISS не отдаёт вовсе, поэтому приложение о ней честно
 * молчит и говорит, где смотреть: она уменьшает результат каждый год.
 */
const FUND_KINDS = [
  [/золот|gold/i, 'gold', 'золото'],
  [/денежн|ликвидн|money|сберегательн/i, 'money', 'денежный рынок'],
  [/облигац|бонд|bond|офз/i, 'bonds', 'облигации'],
  [/акци|индекс|широк|equity/i, 'stocks', 'акции']
];

async function fetchAllFundsRaw() {
  const j = await fetchJSON(`${ISS}/engines/stock/markets/shares/boards/TQTF/securities.json`
    + `?iss.meta=off&iss.only=securities,marketdata`
    + `&securities.columns=SECID,SHORTNAME,SECNAME,PREVPRICE,LOTSIZE`
    + `&marketdata.columns=SECID,LAST,MARKETPRICE,VALTODAY`, 20000);
  const md = new Map(tableRows(j?.marketdata).map(r => [r.SECID, r]));
  const out = [];
  for (const r of tableRows(j?.securities)) {
    const m = md.get(r.SECID) || {};
    const price = m.LAST > 0 ? m.LAST : (m.MARKETPRICE > 0 ? m.MARKETPRICE : r.PREVPRICE);
    if (!(price > 0)) continue;
    const text = `${r.SHORTNAME || ''} ${r.SECNAME || ''}`;
    const found = FUND_KINDS.find(([re]) => re.test(text));
    out.push({
      ticker: r.SECID, name: r.SHORTNAME || r.SECID, price,
      lot: r.LOTSIZE || 1,
      turnover: m.VALTODAY || 0,        // оборот за день — мера ликвидности
      fundKind: found ? found[1] : 'other',
      fundLabel: found ? found[2] : 'прочее',
      kind: 'fund'
    });
  }
  return out;
}

/** История дивидендов бумаги: суммы и даты закрытия реестра. */
async function fetchDividendHistoryRaw(ticker) {
  const j = await fetchJSON(`${ISS}/securities/${encodeURIComponent(ticker)}/dividends.json?iss.meta=off`, 8000);
  return tableRows(j?.dividends)
    .filter(r => r.value > 0 && r.registryclosedate)
    .map(r => ({ date: r.registryclosedate, value: r.value, currency: r.currencyid || 'RUB' }))
    .sort((a, b) => (a.date < b.date ? -1 : 1));
}

/**
 * История выплат живёт дольше доски: дивиденды объявляют раз в квартал,
 * а не раз в секунду. Запросов же тут больше всего — по одному на каждую
 * бумагу рынка, и половина из них повторяется между разделами «что купить»
 * и «что поменять». Держим полчаса.
 */
const DIVIDENDS_TTL = 30 * 60000;
const dividendCache = new Map();
function fetchDividendHistory(ticker) {
  const key = String(ticker || '').toUpperCase();
  const hit = dividendCache.get(key);
  if (hit && Date.now() - hit.at < DIVIDENDS_TTL) return Promise.resolve(hit.rows);
  // Кладём в память само обещание: если два раздела спросят одну бумагу
  // одновременно, запрос уйдёт один раз, а не два.
  const p = fetchDividendHistoryRaw(key).then(rows => {
    dividendCache.set(key, { at: Date.now(), rows });
    return rows;
  }, err => { dividendCache.delete(key); throw err; });
  dividendCache.set(key, { at: Date.now(), rows: p });
  return p;
}

/** Забыть всё, что помним о бирже: нужно проверкам и после смены счёта. */
function clearMarketMemory() {
  boardCache.clear();
  dividendCache.clear();
  pingMemo = null;
}

/** Те же три запроса, но с короткой памятью — см. cachedBoard. */
const fetchAllStocks = () => cachedBoard('stocks', fetchAllStocksRaw);
const fetchAllFunds = () => cachedBoard('funds', fetchAllFundsRaw);
const fetchAllBonds = (kinds = ['gov'], maxPages = 3) =>
  cachedBoard(`bonds:${[...kinds].sort().join(',')}:${maxPages}`, () => fetchAllBondsRaw(kinds, maxPages));

return {FAIL, clearMarketMemory, fetchJSON, fetchPrices, search, fetchMarketPulse, fetchIndexHistory, pingExchange, probeExchange,
        fetchKeyRate, fetchAllStocks, fetchAllBonds, fetchAllFunds, fetchDividendHistory};
})());

/* ─── data/screener.js ─── */
Object.assign(SH, (function(){
/**
 * ОТБОР БУМАГ: чистые функции над строками, которые принёс moex.js.
 *
 * Главное ограничение названо прямо, а не спрятано: Мосбиржа НЕ отдаёт
 * P/E, прибыль и её рост. Поэтому таких фильтров здесь нет — вместо
 * выдуманного мультипликатора отбор идёт по проверяемому: фактические
 * выплаты, годы подряд, доходность к погашению, срок, сектор.
 */

const UNAVAILABLE = {
  pe: 'P/E и прибыль Мосбиржа не публикует, а бесплатного источника с покрытием российских бумаг нет — фильтра по мультипликаторам нет, чтобы не выдумывать числа.',
  growth: 'Рост прибыли — оттуда же: только из отчётности эмитента, вручную.'
};

/** Сколько лет подряд платят дивиденды, считая от последнего года выплат. */
function payoutStreak(history, now = new Date()) {
  if (!history || !history.length) return 0;
  const years = [...new Set(history.map(h => Number(String(h.date).slice(0, 4))))].sort((a, b) => b - a);
  const thisYear = now.getFullYear();
  // Разрешаем начать с прошлого года: реестр текущего года мог ещё не закрыться.
  let cursor = years[0];
  if (cursor < thisYear - 1) return 0;
  let streak = 0;
  for (const y of years) {
    if (y === cursor) { streak += 1; cursor -= 1; }
    else if (y < cursor) break;
  }
  return streak;
}

/**
 * Во сколько раз должна упасть выплата, чтобы считать ряд разорванным
 * дроблением акций. Сплит 1:10 делит дивиденд ровно на десять, 1:100 —
 * на сто; сплитов меньше пяти к одному почти не бывает. Разница между
 * щедрым и скромным годом одной компании до пяти раз доходит редко,
 * а если и дойдёт — выплату отбросят и доходность выйдет заниженной.
 * Занизить безопаснее, чем пообещать: заниженное число видно и помечено,
 * завышенное толкает продать треть портфеля.
 */
const SPLIT_DROP = 5;

/**
 * Выше этой дивидендной доходности данные не бывают правдой. Рекорды
 * российского рынка — около 25% годовых, и то по разовым дивидендам.
 * Сорок процентов оставляют запас даже на самый щедрый год, а всё, что
 * выше, — испорченные данные: не та валюта, не тот масштаб, не на акцию.
 */
const IMPLAUSIBLE_YIELD = 0.40;

/**
 * Фактические выплаты за год к текущей цене.
 *
 * Тонкость, которая стоила приложению правдоподобия: данные биржи по
 * дивидендам отстают на месяцы. Считать «за последние 12 календарных
 * месяцев» — значит получать ноль у компаний, которые исправно платят,
 * и выдавать это за факт о рынке. Поэтому окно считается от ПОСЛЕДНЕЙ
 * известной выплаты, а вызывающий код получает её дату и может сказать,
 * насколько данные свежи.
 *
 * Возвращает null, когда данным верить нельзя. Ноль и null здесь —
 * РАЗНЫЕ ответы: ноль значит «не платит», null — «посчитать не из чего».
 * Спутать их дорого: вызывающий код меряет от доходности выгоду обмена,
 * и ноль вместо неизвестности раздувает эту выгоду на пустом месте.
 */
function trailingYield(history, price, now = new Date()) {
  const r = trailingYieldDetailed(history, price, now);
  return r ? r.yieldPct : 0;
}

function trailingYieldDetailed(history, price, now = new Date()) {
  if (!(price > 0) || !history || !history.length) return null;

  // ЧУЖАЯ ВАЛЮТА. Биржа отдаёт выплату в той валюте, в какой её объявили,
  // а цена у нас рублёвая. Поделить доллары на рубли — выдумать число;
  // курса на дату выплаты приложение не знает и знать не обязано.
  // Такие строки не считаются вовсе, а вызывающий код узнаёт, сколько
  // их отброшено, чтобы не выдавать остаток за полную картину.
  const isRub = h => !h.currency || h.currency === 'RUB' || h.currency === 'SUR';
  const skippedForeign = history.filter(h => !isRub(h)).length;
  const sorted = [...history].filter(isRub).sort((a, b) => (a.date < b.date ? -1 : 1));
  if (!sorted.length) {
    return { yieldPct: null, payouts: 0, lastDate: null, ageDays: null,
             stale: false, splitAdjusted: false, skippedForeign, suspect: 'currency' };
  }

  const last = sorted[sorted.length - 1];
  const lastTime = new Date(last.date).getTime();
  if (!isFinite(lastTime)) return null;

  // Окно — год до последней известной выплаты, но не в будущее.
  //
  // 350 дней, а не 365: годовые дивиденды объявляют с шагом чуть меньше
  // года (реестр то в начале мая, то в конце апреля). При окне ровно в год
  // прошлогодняя выплата попадала внутрь, и доходность удваивалась.
  // Полугодовые и квартальные выплаты при этом остаются все.
  const anchor = Math.min(lastTime, now.getTime());
  const since = new Date(anchor - 350 * 86400000).toISOString().slice(0, 10);
  let window = sorted.filter(h => h.date >= since);

  // ДРОБЛЕНИЕ АКЦИЙ. Биржа хранит выплату в том масштабе, в каком её
  // объявляли, и задним числом не пересчитывает. У Полюса до сплита 1:10
  // дивиденд был 1301,75 ₽ на акцию, после — 73 ₽. Сложить их и поделить
  // на сегодняшнюю цену — получить 105% «доходности», которой никогда
  // не существовало; ровно это приложение и предлагало Ладо как повод
  // обменять треть портфеля.
  //
  // Сплит виден по обрыву ряда: выплата больше ВСЕХ последующих в пять
  // и более раз. Именно всех, а не соседней: одна скромная четверть
  // среди щедрых — не сплит, и терять из-за неё год выплат нельзя.
  // Всё, что было до обрыва, посчитано в других акциях и к нынешней
  // цене отношения не имеет.
  let splitAdjusted = false;
  for (let i = window.length - 1; i > 0; i--) {
    const after = Math.max(...window.slice(i).map(h => h.value));
    if (window[i - 1].value >= after * SPLIT_DROP) {
      window = window.slice(i);
      splitAdjusted = true;
      break;
    }
  }

  const sum = window.reduce((a, h) => a + h.value, 0);
  const raw = sum / price;
  // ПОСЛЕДНЯЯ ПРОВЕРКА НА ВМЕНЯЕМОСТЬ. Ряд может выглядеть ровным и всё
  // равно врать: выплата не на акцию, цена не той бумаги, масштаб не тот.
  // Доходность выше 40% означает не щедрую компанию, а битые данные —
  // и такую бумагу нельзя показывать как кандидата ни при каких условиях.
  const implausible = raw > IMPLAUSIBLE_YIELD;

  const ageDays = Math.round((now.getTime() - lastTime) / 86400000);
  return {
    yieldPct: implausible ? null : raw,
    rawYieldPct: raw,               // что вышло до проверки — чтобы объяснить отказ
    payouts: window.length,
    lastDate: last.date,
    ageDays,
    // Столько без выплат — это уже не «текущая доходность», а история.
    // Порог общий с тем, по которому бумага перестаёт быть кандидатом
    // на обмен: иначе два экрана скажут о ней разное.
    stale: ageDays > PAYOUT_AGE.stopped,
    splitAdjusted,
    skippedForeign,
    suspect: implausible ? 'implausible'
           : splitAdjusted ? 'split'
           : skippedForeign ? 'currency' : null
  };
}

/**
 * Насколько бумага подходит именно этому портфелю, 0–100.
 * Ни одного балла за прогноз: только выплаты, стабильность, срок и
 * соответствие стратегии. Уже купленная бумага получает штраф —
 * докупка увеличивает концентрацию, а не разнообразие.
 */
function fitScore(row, ctx = {}) {
  const owned = new Set(ctx.ownedTickers || []);
  const targets = ctx.targets || {};
  let score = 0;
  const why = [];

  // Ликвидность — первое, что проверяют перед покупкой. Бумагу без оборота

  // будет примерно столько же, сколько покупаешь.
  const need = Math.max(30000, Number(ctx.tradeSize) || 0);
  const turnover = Number(row.turnover) || 0;
  if (row.turnover !== undefined) {
    if (turnover <= 0) {
      why.push('сегодня по ней не торговали — выйти будет трудно');
      score -= 25;
    } else if (turnover < need * 20) {
      why.push(`оборот за день ${Math.round(turnover / 1000).toLocaleString('ru-RU')} тыс \u20bd — `

    }

  if (row.kind === 'bond') {
    const rate = moneyRate(ctx.moneyRate);
    const over = (row.ytm || 0) - rate;
    const yPts = Math.max(0, Math.min(45, Math.round(45 * (over + 0.02) / 0.06)));
    score += yPts;
    if (yPts >= 25) why.push(`доходность ${pct(row.ytm)} против ставки ${(rate * 100).toFixed(0)}%`);
    // Срок не длиннее цели — приём пенсионных фондов: погашение вернёт номинал.
    const goalYears = ctx.goalYears || 0;
    if (goalYears > 0 && row.yearsLeft > 0) {
      if (row.yearsLeft <= goalYears) { score += 25; why.push('погашается до цели — номинал вернут к сроку'); }
      else if (row.yearsLeft <= goalYears + 2) score += 10;
    } else if (row.yearsLeft <= 5) score += 12;
    if (row.type === 'gov') { score += 12; why.push('госдолг: риск не в банкротстве, а в ставке'); }
    if (row.couponType === 'fixed') { score += 8; why.push('купон известен заранее'); }

    // Вид облигации меняет смысл её доходности, и об этом стоит сказать.
    if (row.bondKind === 'linker') {
      score += 8;
      why.push('номинал растёт с инфляцией — доходность указана СВЕРХ неё');
    } else if (row.bondKind === 'floater') {
      why.push('купон привязан к ставке: защищает от её роста, но падает вместе с ней');
    }
    // Оферта раньше погашения обесценивает саму доходность к погашению:
    // считать её до срока, которого не будет, — самообман.
    if (row.yearsToOffer > 0 && row.yearsLeft > row.yearsToOffer + 0.1) {
      score -= 20;
      why.push(`оферта через ${row.yearsToOffer} ${row.yearsToOffer < 2 ? 'года' : 'лет'} — доходность к погашению может не сбыться`);
    }
  } else {
    const avg = share(ctx.marketYield, ASSUMED.marketYield);
    const yPts = Math.max(0, Math.min(40, Math.round(40 * (row.yieldPct || 0) / (avg * 1.8))));
    score += yPts;
    if ((row.yieldPct || 0) > avg) why.push(`выплаты ${pct(row.yieldPct)} — выше средних по рынку`);
    const st = row.streak || 0;
    score += Math.min(25, st * 5);
    if (st >= 3) why.push(`платит ${st} ${st < 5 ? 'года' : 'лет'} подряд`);
    // Данные биржи по дивидендам отстают: если последняя известная выплата
    // старая, доходность посчитана по ней, и об этом надо сказать.
    if (row.payoutStale) {
      // Раньше это трактовалось как «данные биржи могут отставать» и стоило
      // 10 баллов. Но больше года без выплат — чаще не отставание данных, а
      // прекращение выплат, и цена вопроса выше.
      score -= 25;
      why.push(`последняя выплата — ${String(row.payoutLastDate || '').split('-').reverse().join('.')}`
        + (row.payoutAgeDays ? `, это ${Math.round(row.payoutAgeDays / 30)} мес назад` : '')
        + `: больше года без выплат, компания могла перестать платить`);
    }
    // Данные биржи о выплатах не сошлись с ценой. Молча занулить их —
    // значит сказать «не платит», чего мы не знаем. Говорим как есть.
    if (row.yieldSuspect === 'implausible') {
      score -= 30;
      why.push(`выплаты по данным биржи дают ${((row.rawYieldPct || 0) * 100).toFixed(0)}% к цене — `
        + `такой доходности не бывает, данные считаем негодными и в оценку не берём`);
    } else if (row.yieldSuspect === 'split') {
      score -= 5;
      why.push(`часть выплат отброшена: суммы до дробления акций несопоставимы с нынешней ценой, `
        + `доходность посчитана только по новым и потому занижена`);
    }
    if (row.cap > 2e11) { score += 10; why.push('крупная компания'); }
    else if (row.cap > 5e10) score += 5;

    // Сектор, который в портфеле уже у предела. Бумаги одной отрасли падают
    // вместе, поэтому «хорошая бумага» из перегруженного сектора добавляет
    // портфелю не разнообразия, а веса тому же риску. Предел тот же, что и
    // в карточке секторного перекоса, — правило одно на всё приложение.
    const secShare = (ctx.sectorShares || {})[row.sector] || 0;
    const secMax = ctx.sectorMax || 0.35;
    if (secShare >= secMax) {
      score -= 20;
      why.push(`отрасль «${row.sector}» уже ${pct(secShare)} портфеля при пределе `
        + `${pct(secMax)} — покупка усилит перекос`);
    } else if (secShare >= secMax * 0.8) {
      score -= 8;
      why.push(`отрасль «${row.sector}» уже ${pct(secShare)} портфеля — близко к пределу`);
    }
  }

  // Соответствие стратегии: недобранный класс важнее добранного.
  const cls = row.kind === 'bond' ? 'bonds' : 'stocks';
  const gap = (targets[cls] || 0) - ((ctx.currentShares && ctx.currentShares[cls]) || 0);
  if (gap > 0.05) { score += 15; why.push('этого класса не хватает до плана'); }
  else if (gap < -0.05) { score -= 10; why.push('класс и так с перевесом'); }

  // УЖЕ КУПЛЕННАЯ БУМАГА. Штраф был один на всех — минус двадцать любой
  // своей бумаге с формулировкой «докупка усилит концентрацию». Но у МТС
  // доля восемь процентов при пределе двадцать пять: докупка её не усилит,
  // а вердикт на соседнем экране прямо советовал направить в неё взнос.
  // Два экрана спорили об одном действии.
  //
  // Теперь штраф следует за долей. Малая доля — знакомая бумага без нового
  // риска, и это скорее плюс, чем минус; большая — настоящий перекос.
  if (owned.has(row.ticker)) {
    const held = (ctx.positionShares && ctx.positionShares[row.ticker]) || 0;
    const limit = ctx.singleMax || 0.25;
    if (held >= limit) {
      score -= 25;
      why.push(`уже ${pct(held)} портфеля при пределе ${pct(limit)} — докупка усилит перекос`);
    } else if (held >= limit * 0.7) {
      score -= 12;
      why.push(`уже ${pct(held)} портфеля — близко к пределу на одну бумагу`);
    } else {
      score -= 3;
      why.push('уже есть в портфеле — знакомая бумага, новый риск не добавляет');
    }
  }

  return { score: Math.max(0, Math.min(100, Math.round(score))), why };
}

/** Отбор акций. Фильтры — только по данным, которые действительно есть. */
function screenStocks(rows, filters = {}, ctx = {}) {
  const f = filters || {};
  const out = (rows || []).filter(r => {
    if (f.minYield > 0 && !((r.yieldPct || 0) >= f.minYield)) return false;
    if (f.minStreak > 0 && !((r.streak || 0) >= f.minStreak)) return false;
    if (f.sector && (r.sector || sectorOf({ ticker: r.ticker, name: r.name, kind: 'stock' })) !== f.sector) return false;
    if (f.maxPrice > 0 && !(r.price <= f.maxPrice)) return false;
    if (f.minCap > 0 && !((r.cap || 0) >= f.minCap)) return false;
    return true;
  }).map(r => {
    const row = { ...r, kind: 'stock',
      sector: r.sector || sectorOf({ ticker: r.ticker, name: r.name, kind: 'stock' }) };
    return { ...row, ...fitScore(row, ctx) };
  });
  out.sort((a, b) => b.score - a.score);
  return out;
}

/** Отбор облигаций. */
function screenBonds(rows, filters = {}, ctx = {}) {
  const f = filters || {};
  const out = (rows || []).filter(r => {
    if (f.minYTM > 0 && !((r.ytm || 0) >= f.minYTM)) return false;
    if (f.maxYears > 0 && !((r.yearsLeft || 0) <= f.maxYears)) return false;
    if (f.type && r.type !== f.type) return false;
    if (f.couponType && r.couponType !== f.couponType) return false;
    return true;
  }).map(r => {
    const row = { ...r, kind: 'bond' };
    return { ...row, ...fitScore(row, ctx) };
  });
  out.sort((a, b) => b.score - a.score);
  return out;
}

return {screenStocks, screenBonds, fitScore, payoutStreak, trailingYield, trailingYieldDetailed,
        YIELD_LIMITS: { implausible: IMPLAUSIBLE_YIELD, splitDrop: SPLIT_DROP },
        SCREENER_UNAVAILABLE: UNAVAILABLE};
})());

/**

 *
 * Пользователь копирует экран портфеля и вставляет сюда. Задача — понять

 *

 *  · «ОФЗ 26244» — нужен биржевой код SU26244…, а не мусорный «ОФЗ26»
 *  · «ВИМ – Фонд Золото» — узнаётся как GOLD, а не как чужой фонд по похожести

/** Известные бумаги: название у брокера → биржевой код. */
const KNOWN = [
  { re: /корпоративн[а-яё]*\s*центр\s*икс\s*5|^x5\b/i,      ticker: 'X5',      name: 'X5' },
  { re: /^мтс(?![а-яё])|^mts/i,                                  ticker: 'MTSS',    name: 'МТС' },
  { re: /озон\s*фарм/i,                                  ticker: 'OZPH',    name: 'Озон Фармацевтика' },
  { re: /^озон(?![а-яё])(?!\s*фарм)|^ozon/i,                     ticker: 'OZON',    name: 'Озон' },
  { re: /сбер\s*банк|^сбер(?![а-яё])(?!\s*банк\s*п)/i,           ticker: 'SBER',    name: 'Сбер' },

  { re: /татнефт.*привилег|татнефть-п/i,                 ticker: 'TATNP',   name: 'Татнефть-п' },
  { re: /^татнефт/i,                                     ticker: 'TATN',    name: 'Татнефть' },
  { re: /яндекс|^yandex/i,                               ticker: 'YDEX',    name: 'Яндекс' },
  { re: /вим.*золот|фонд\s*золот|^gold\b/i,              ticker: 'GOLD',    name: 'ВИМ — Фонд Золото' },
  { re: /т-?капитал\s*золот|^tgld/i,                     ticker: 'TGLD',    name: 'Т-Капитал Золото' },
  { re: /фонд\s*ликвидн|денежн[а-яё]*\s*рынк|^lqdt/i,        ticker: 'LQDT',    name: 'Фонд денежного рынка' },
  { re: /лукойл|^lkoh/i,                                 ticker: 'LKOH',    name: 'Лукойл' },
  { re: /газпром\s*нефт/i,                               ticker: 'SIBN',    name: 'Газпром нефть' },
  { re: /^газпром(?![а-яё])/i,                                   ticker: 'GAZP',    name: 'Газпром' },
  { re: /новатэк|^nvtk/i,                                ticker: 'NVTK',    name: 'Новатэк' },
  { re: /норникел|гмк|^gmkn/i,                           ticker: 'GMKN',    name: 'Норникель' },
  { re: /полюс|^plzl/i,                                  ticker: 'PLZL',    name: 'Полюс' },
  { re: /фосагро|^phor/i,                                ticker: 'PHOR',    name: 'ФосАгро' },
  { re: /^роснефт|^rosn/i,                               ticker: 'ROSN',    name: 'Роснефть' },
  { re: /сургут.*привилег|сургутнефтегаз-п/i,            ticker: 'SNGSP',   name: 'Сургутнефтегаз-п' },
  { re: /^磁|^хэдхантер|headhunter|^head\b/i,             ticker: 'HEAD',    name: 'ХэдХантер' },
  { re: /^лента(?![а-яё])|^lent/i,                               ticker: 'LENT',    name: 'Лента' },
  { re: /^т-?банк|^тинькофф|^t\b/i,                      ticker: 'T',       name: 'Т-Банк' }

/**
 * Число из текста брокера: «1 226,5» → 1226.5
 *
 * Разделителем разряда бывает обычный пробел, неразрывный или узкий — какой
 * именно, зависит от приложения. Поэтому оставляем только цифры, точку и минус,
 * предварительно превратив запятую в точку. Одно правило вместо перечисления
 * всех возможных разделителей: список всё равно окажется неполным.
 */
/** Стоимость позиции из ближайших строк — она включает накопленный купон. */
function findPositionValue(lines, qtyLineIndex, qty, currentPrice) {
  const expected = qty * currentPrice;
  for (let j = qtyLineIndex + 1; j <= qtyLineIndex + 3 && j < lines.length; j++) {
    const v = parseNumber(lines[j]);
    if (v == null) continue;
    if (Math.abs(v - expected) / expected <= 0.12) return v;
  }
  return null;
}

/**
 * Восстановление средней цены покупки из строк результата.
 *
 * Брокер показывает стоимость позиции и прибыль/убыток. Вложенное равно
 * разнице, а средняя цена — вложенному, делённому на количество. Проверка
 * на реальных данных даёт совпадение с брокером до копеек.
 */
function deriveAverage(lines, qtyLineIndex, qty, currentPrice) {
  const expectedValue = qty * currentPrice;

  // ищем в ближайших строках стоимость позиции и результат
  for (let j = qtyLineIndex + 1; j <= qtyLineIndex + 3 && j < lines.length; j++) {
    const value = parseNumber(lines[j]);
    if (value == null) continue;
    // У облигаций стоимость включает накопленный купон и превышает
    // количество × цену — допуск шире, но не безграничный.
    const gap = Math.abs(value - expectedValue) / expectedValue;
    if (gap > 0.12) continue;

    // следующая строка — результат: «−2 277,5 ₽ · 10,03%»
    const resultLine = lines[j + 1] || '';
    const m = resultLine.match(/([−\-+]?)\s*([\d\s\u00a0.,]+)\s*₽/);
    if (!m) return null;

    const magnitude = parseNumber(m[2]);
    if (magnitude == null) return null;
    const sign = /[−\-]/.test(m[1]) ? -1 : 1;
    const invested = value - sign * magnitude;

    if (!(invested > 0) || !(qty > 0)) return null;
    const avg = invested / qty;
    // защита от бессмыслицы: средняя не может отличаться от текущей в разы
    if (avg <= 0 || avg > currentPrice * 10 || avg < currentPrice / 10) return null;
    return avg;
  }
  return null;
}

/** Распознавание бумаги по названию. Облигации — по номеру выпуска. */
function recognize(name) {
  if (!name) return null;
  const text = String(name).trim();

  // ОФЗ: всегда по номеру выпуска, иначе получается мусорный тикер
  const gov = text.match(/офз[\s-]*(\d{5})/i);
  if (gov) {
    return {
      ticker: `SU${gov[1]}`,
      name: `ОФЗ ${gov[1]}`,
      moexId: `SU${gov[1]}RMFS${guessIssueSuffix(gov[1])}`,
      kind: 'bond'
    };
  }

  for (const k of KNOWN) {
    if (k.re.test(text)) return { ticker: k.ticker, name: k.name };
  }

  // неизвестная бумага: тикер из латиницы, если она есть
  const latin = text.match(/\b[A-Z]{3,6}\b/);
  if (latin) return { ticker: latin[0], name: text.slice(0, 60) };
  return null;
}

/** Суффикс выпуска ОФЗ. Точное значение подтвердится при загрузке цен с биржи. */
function guessIssueSuffix(number) {
  const known = { '26244': '2', '26238': '4', '26247': '5', '26233': '8', '26226': '3' };
  return known[number] || '0';
}

/**
 * Разбор вставленного текста.
 * Формат приложений брокеров: строка с названием, ниже «N шт · цена ₽»,
 * ниже итоговая стоимость. Свободные деньги — строкой «Рубль».
 */
function parsePortfolio(text) {
  const lines = String(text || '').split('\n').map(l => l.trim()).filter(Boolean);
  const rows = [];
  let cash = null;
  const unknown = [];

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];

    // свободные деньги
    if (/^рубл|^rub\b|^₽/i.test(line)) {
      const inline = parseNumber(line.replace(/^[^\d]*/, ''));
      cash = inline ?? parseNumber(lines[i + 1]);
      continue;
    }

    // строка вида «7 шт · 1 959 ₽» — значит предыдущая строка была названием
    const qtyLine = line.match(/^([\d\s\u00a0]+)\s*шт\D*([\d\s\u00a0.,]+)/i);
    if (qtyLine) {
      const qty = parseNumber(qtyLine[1]);
      const price = parseNumber(qtyLine[2]);
      const nameLine = lines[i - 1];
      const match = recognize(nameLine);

      if (match && qty > 0) {
        // В списке брокера цена — ТЕКУЩАЯ. Но рядом обычно есть строка результата
        // вида «20 415 ₽» и «−2 277,5 ₽ · 10,03%». Из неё выводится цена покупки:
        //   вложено = стоимость − результат,  средняя = вложено / количество.
        // Так доходность считается сразу, без ручного ввода.
        const derived = deriveAverage(lines, i, qty, price);
        // У облигаций строка «832,14 ₽» — чистая цена без накопленного купона,
        // а стоимость позиции его включает. Берём цену из стоимости: иначе
        // сумма портфеля разойдётся с брокером на величину купона.
        const positionValue = findPositionValue(lines, i, qty, price);
        const effectivePrice = (match.kind === 'bond' && positionValue)
          ? positionValue / qty : price;

        rows.push({
          ...match,
          qty,
          price: roundPrice(effectivePrice),
          cleanPrice: roundPrice(price),
          avgPrice: derived != null ? roundPrice(derived) : roundPrice(price),
          avgPriceUnknown: derived == null,
          rawName: nameLine
        });
      } else if (nameLine && qty > 0) {
        unknown.push(nameLine);
      }
    }
  }

  return { rows, cash, unknown };
}

/**
 * Сравнение распознанного с текущим портфелем.
 * Возвращает список различий — что именно изменится, до применения.
 */
function diff(parsed, positions) {
  const changes = [];
  const seen = new Set();

  for (const row of parsed.rows) {
    seen.add(row.ticker);
    const current = positions.find(p =>
      p.ticker === row.ticker || p.ticker.startsWith(row.ticker.slice(0, 7)));

    if (!current) {
      changes.push({ kind: 'add', ticker: row.ticker, name: row.name,
                     qty: row.qty, price: row.price, avgPrice: row.avgPrice,
                     avgPriceUnknown: row.avgPriceUnknown, moexId: row.moexId });
    } else if (Math.abs(current.qty - row.qty) > 0.0001) {
      changes.push({ kind: 'qty', ticker: current.ticker, name: row.name,
                     from: current.qty, to: row.qty, price: row.price,
                     avgPrice: row.avgPrice, avgPriceUnknown: row.avgPriceUnknown,
                     moexId: row.moexId });
    }
  }

  for (const p of positions) {
    if (p.qty > 0 && !seen.has(p.ticker) &&
        !parsed.rows.some(r => p.ticker.startsWith(r.ticker.slice(0, 7)))) {
      changes.push({ kind: 'gone', ticker: p.ticker, name: p.name, from: p.qty });
    }
  }

  return changes;
}

return {recognize, parsePortfolio, diff};

Object.assign(SH, (function(){
/**
 * ЧТЕНИЕ ФАЙЛОВ EXCEL (.xlsx).
 *
 * Брокеры отдают отчёты таблицами Excel, а не текстом. Готовые библиотеки для
 * этого весят сотни килобайт — больше, чем всё приложение. Поэтому читаем сами:
 * файл .xlsx — это архив ZIP с XML внутри, а распаковку умеет сам браузер.
 *
 * Поддерживается только чтение и только то, что нужно: значения ячеек.
 * Формулы, стили и оформление игнорируются.
 */

/** Чтение 16- и 32-битных чисел из двоичных данных. */
const u16 = (v, o) => v.getUint16(o, true);
const u32 = (v, o) => v.getUint32(o, true);

/**
 * Разбор архива ZIP. Возвращает содержимое нужных файлов.
 * Читаем оглавление с конца архива — так надёжнее, чем идти по заголовкам.
 */
async function unzip(buffer, wanted) {
  const view = new DataView(buffer);
  const bytes = new Uint8Array(buffer);

  // ищем конец центрального каталога: подпись 0x06054b50

        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify(body)
      });
    } catch (err) {
      // Браузер не отличает «сеть не дошла» от «сайт не пустил чужую
      // страницу»: и то и другое приходит одинаковой ошибкой. Поэтому
      // не гадаем о причине, а называем самую частую: Мосбиржа может
      // отвечать, а Т-Банк — нет, если запрос идёт через VPN.
      // Браузер сообщает одним словом две разные беды: сети нет и сеть есть,
      // но брокер не пускает запрос с чужой страницы. Утверждать что-то одно
      // мы не вправе — поэтому отправляем туда, где это различают.
      // Браузер сообщает одним словом «Failed to fetch» и обрыв сети, и отказ
      // по сертификату. Второе в 2026-м стало частым: банки перешли на
      // сертификаты Минцифры, а Chrome, Safari и Edge их не принимают.
      // Различить можно только замером — им и занимается проверка доступа.
      last = new Error('Нет связи с Т-Банком. Это может быть сеть, а может — сертификат '
        + 'безопасности: Chrome, Safari и Edge не принимают сертификаты Минцифры, на которые '
        + 'перешли российские банки. В Яндекс.Браузере такой сертификат встроен. Что именно — '
        + 'скажет «Проверить доступ к Т-Банку» в диагностике.');
      continue;
    }

    if (res.ok) { tiHost = host; return res.json(); }

    if (res.status === 401 || res.status === 403) {
      throw new Error('Токен не принят. Проверь, что скопирован целиком и не отозван');
    }
    if (res.status === 429) throw new Error('Слишком много запросов подряд — подожди минуту');

    let detail = '';
    try { detail = (await res.json()).message || ''; } catch { /* тело не разобралось */ }
    last = new Error(`Т-Банк ответил кодом ${res.status}${detail ? ': ' + detail : ''}`);
  }
  throw last || new Error('Т-Банк недоступен');
}

/** {units, nano} → число. Так API отдаёт все деньги и количества. */
function tiAmount(v) {
  if (v == null) return 0;
  if (typeof v === 'number') return v;
  const units = Number(v.units || 0), nano = Number(v.nano || 0);
  return units + nano / 1e9;
}

const TI_DATE = iso => String(iso || '').slice(0, 10);

async function tiAccounts(token) {
  const data = await tiCall(token, 'UsersService', 'GetAccounts', {});
  return (data.accounts || []).map(a => ({
    id: a.id,
    name: a.name || 'Счёт',
    isIis: /IIS/i.test(a.type || ''),
    opened: TI_DATE(a.openedDate),
    readOnly: /READ_ONLY/i.test(a.accessLevel || '')
  }));
}

/** Тикер и название по идентификатору бумаги. Запрашивается по разу на бумагу. */
async function tiInstrument(token, id, cache, figi) {
  // ДВА ПУТИ, А НЕ ОДИН. У старых операций брокер сплошь и рядом отдаёт
  // только FIGI, без внутреннего кода бумаги. Раньше спрашивали лишь по
  // коду: нет кода — имени не будет никогда, сколько ни повторяй. А бумаги,
  // которых уже нет в портфеле (проданные), взять имя больше неоткуда —
  // и журнал переставал пересобираться навсегда.
  const key = id || figi;
  if (!key) return null;
  if (cache.has(key)) return cache.get(key);
  const tries = [];
  if (id) tries.push({ idType: 'INSTRUMENT_ID_TYPE_UID', id });
  if (figi) tries.push({ idType: 'INSTRUMENT_ID_TYPE_FIGI', id: figi });
  let found = null;
  for (const q of tries) {
    try {
      const data = await tiCall(token, 'InstrumentsService', 'GetInstrumentBy', q);
      const i = data.instrument;
      // Размер лота: на бирже покупают лотами. Берём его здесь, потому что
      // цены в приложении обновляются от брокера, а не с биржи — иначе лот
      // так и остался бы неизвестным, и план советовал бы «111 штук».
      if (i && (i.ticker || i.name)) {
        found = { ticker: (i.ticker || '').toUpperCase(), name: i.name || i.ticker,
                  kind: i.instrumentKind || '', lot: Number(i.lot) > 0 ? Number(i.lot) : 1 };
        break;
      }
    } catch (err) { noteSwallowed('карточка бумаги у брокера', err); }
  }
  // Брокер ответил, но бумаги не назвал — это не ошибка связи, и молчать о
  // ней нельзя: именно из таких случаев складывается «не назвал имена N бумаг».
  if (!found) noteSwallowed('бумага без имени у брокера', new Error(`не назвал ${key}`));
  cache.set(key, found);
  return found;
}

const TI_KIND = {
  OPERATION_TYPE_BUY: 'buy',
  OPERATION_TYPE_BUY_CARD: 'buy',
  OPERATION_TYPE_BUY_MARGIN: 'buy',
  OPERATION_TYPE_SELL: 'sell',
  OPERATION_TYPE_SELL_MARGIN: 'sell',
  OPERATION_TYPE_INPUT: 'deposit',
  OPERATION_TYPE_OUTPUT: 'withdraw',
  OPERATION_TYPE_DIVIDEND: 'dividend',
  OPERATION_TYPE_COUPON: 'dividend',
  OPERATION_TYPE_DIVIDEND_TAX: 'tax',
  OPERATION_TYPE_TAX: 'tax',
  OPERATION_TYPE_TAX_CORRECTION: 'tax',
  OPERATION_TYPE_BROKER_FEE: 'fee',
  OPERATION_TYPE_SERVICE_FEE: 'fee',
  OPERATION_TYPE_MARGIN_FEE: 'fee'
};

/**
 * История операций по счёту. Листается курсором, пока API не скажет «всё».
 * Возвращает операции в том же виде, в каком их даёт разбор отчётов, —
 * дальше они идут по общему пути.
 */
async function tiOperations(token, accountId, from = '2000-01-01', known = {}) {
  // `known` — ранее выясненные имена бумаг. Без них при молчании брокера в
  // ЖУРНАЛ попадали технические коды, сверка потом не сходилась, и человек
  // видел список «у нас BBG…, у брокера МТС». Данные при этом были целы —
  // расходились только имена.
  const cache = new Map();
  let unresolved = 0;
  // Найденные имена — чтобы записать их в память и больше не терять.
  // Отдельно копим сами неопознанные коды: сказать «не назвал имена 19 бумаг»
  // и не сказать каких — значит оставить человека без единой зацепки.
  const resolved = {};
  const unnamed = new Set();
  const raw = [];
  let cursor = '', guard = 0;

  while (guard++ < 60) {
    const data = await tiCall(token, 'OperationsService', 'GetOperationsByCursor', {
      accountId,
      from: new Date(from).toISOString(),
      to: new Date().toISOString(),
      cursor,
      limit: 1000,
      state: 'OPERATION_STATE_EXECUTED'
    });
    for (const it of (data.items || [])) raw.push(it);
    if (!data.hasNext || !data.nextCursor) break;
    cursor = data.nextCursor;
  }

  const trades = [], cash = [], skipped = [];
  let feesInTrades = 0, feesSeparate = [];

  for (const it of raw) {
    const kind = TI_KIND[it.type];
    const date = TI_DATE(it.date);
    const payment = Math.abs(tiAmount(it.payment));
    const commission = Math.abs(tiAmount(it.commission));

    if (kind === 'buy' || kind === 'sell') {
      const qty = Math.abs(Number(it.quantityDone || it.quantity || 0));
      if (!(qty > 0) || !(payment > 0)) { skipped.push(it.description || it.type); continue; }
      let sec = null;
      try { sec = await tiInstrument(token, it.instrumentUid, cache, it.figi); }
      catch (err) { sec = null; noteSwallowed('бумага по операции брокера', err); }
      if (!(sec && sec.ticker)) {
        // Память ищется по обоим ключам: у части операций есть только FIGI.
        const remembered = known[it.instrumentUid] || known[it.figi];
        if (remembered && remembered.ticker) sec = remembered;
        else { unresolved += 1; unnamed.add(it.figi || it.instrumentUid || '?'); }
      }
      // Найденное имя запоминаем под обоими ключами. Раньше запоминались
      // только бумаги из ТЕКУЩЕГО портфеля, а проданные — нет: после первой
      // же полной пересборки их имена терялись насовсем.
      if (sec && sec.ticker) {
        if (it.instrumentUid) resolved[it.instrumentUid] = sec;
        if (it.figi) resolved[it.figi] = sec;
      }
      const ticker = sec && sec.ticker ? sec.ticker : (it.figi || '').toUpperCase();
      if (!ticker) { skipped.push(it.description || it.type); continue; }
      feesInTrades += commission;
      trades.push({
        type: kind, date, ticker,
        moexId: /^[A-Z]{2}\d/.test(ticker) ? ticker : undefined,
        name: sec ? sec.name : ticker,
        qty,
        price: roundPrice(payment / qty),   // столько реально стоила одна бумага
        fee: Math.round(commission * 100) / 100
      });
      continue;
    }

    if (kind === 'deposit' || kind === 'withdraw') {
      if (payment > 0) cash.push({ type: kind, date, amount: payment });
      continue;
    }

    if (kind === 'dividend') {
      const sec = await tiInstrument(token, it.instrumentUid, cache, it.figi);
      if (payment > 0) cash.push({ type: 'dividend', date, amount: payment,
        ticker: sec ? sec.ticker : '', name: sec ? sec.name : '' });
      continue;
    }

    if (kind === 'tax') {
      if (payment > 0) cash.push({ type: 'fee', date, amount: payment, note: 'налог' });
      continue;
    }

    if (kind === 'fee') { feesSeparate.push({ date, amount: payment }); continue; }

    if (payment > 0) skipped.push(it.description || it.type || 'без названия');
  }

  // Комиссия приходит и внутри сделки, и отдельной операцией. Берём что-то
  // одно, иначе деньги спишутся дважды.
  if (feesInTrades < 0.005) {
    for (const f of feesSeparate) if (f.amount > 0) cash.push({ type: 'fee', ...f, note: 'комиссия' });
  }

  return { trades, cash, skipped: [...new Set(skipped)], total: raw.length, unresolved,
           resolved, unnamed: [...unnamed] };
}

/** Портфель и остаток по версии брокера — для сверки того, что мы насчитали. */
/**
 * Портфель у брокера.
 *
 * `known` — ранее выясненные имена бумаг: uid → {ticker, name}. Нужны потому,
 * что запрос названия может не ответить (сеть, лимит запросов), и тогда без
 * запаса пришлось бы выдать технический код брокера за тикер. Так рождались
 * ложные расхождения в сверке («GOLD 2533 ≠ 0» рядом с «TCSM… 0 ≠ 2533»)
 * и, что хуже, цены могли записаться под чужим именем.
 *
 * Возвращает `resolved` — то, что удалось выяснить: вызывающий сохранит это
 * и в следующий раз обойдётся без запроса.
 */
async function tiPortfolio(token, accountId, known = {}) {
  const cache = new Map();
  const data = await tiCall(token, 'OperationsService', 'GetPortfolio', { accountId });
  const rows = [], prices = [];
  const resolved = {};
  let cash = 0, unresolved = 0;

  for (const p of (data.positions || [])) {
    const qty = tiAmount(p.quantity);
    if (p.instrumentType === 'currency') { cash += qty; continue; }
    if (!(qty > 0)) continue;

    let sec = null;
    try { sec = await tiInstrument(token, p.instrumentUid, cache, p.figi); }
    catch (err) { sec = null; noteSwallowed('бумага в портфеле брокера', err); }

    const remembered = known[p.instrumentUid];
    let ticker, name;
    if (sec && sec.ticker) {
      ticker = sec.ticker; name = sec.name || sec.ticker;
      resolved[p.instrumentUid] = { ticker, name, lot: sec.lot || 1 };
    } else if (remembered && remembered.ticker) {
      // Имя не ответило — берём выясненное раньше. Это факт, а не догадка.
      ticker = remembered.ticker; name = remembered.name || ticker;
    } else {
      ticker = (p.figi || p.instrumentUid || '').toUpperCase();
      name = ticker;
      unresolved += 1;
    }

    const price = tiAmount(p.currentPrice) + tiAmount(p.currentNkd);
    const lot = (sec && sec.lot) || (remembered && remembered.lot) || 1;
    rows.push({ ticker, name, qty, price: roundPrice(price), lot,
                uid: p.instrumentUid, kind: p.instrumentType,
                unresolved: !(sec && sec.ticker) && !(remembered && remembered.ticker) });
    if (price > 0) prices.push({ ticker, price: roundPrice(price), lot });
  }

  if (!cash) cash = tiAmount(data.totalAmountCurrencies);
  return { rows, prices, cash: Math.round(cash * 100) / 100, resolved, unresolved };
}

/**
 * ФАКТЫ ПО БУМАГАМ ОТ БРОКЕРА: выплаты, купоны, погашения.
 *
 * Нужно потому, что Мосбиржу браузер пускает не всегда, а Т-Банк — всегда.
 * Возвращает то же, что даёт разбор биржевых данных, чтобы советы и
 * денежный поток считались одинаково независимо от источника.
 *
 * Если ответ окажется не той формы, какую я жду, бумага просто не попадёт
 * в список. Выдуманная дата хуже отсутствующей.
 */
async function tiFacts(token, positions, settings = {}) {
  const now = new Date();
  const from = now.toISOString();
  const yearAhead = new Date(now.getTime() + 366 * 864e5).toISOString();
  const yearBack = new Date(now.getTime() - 366 * 864e5).toISOString();

  const rows = [], dividends = [];

  for (const p of positions) {
    if (!p.uid || !(p.qty > 0)) continue;
    const value = p.qty * (p.price || 0);

    if (/bond/i.test(p.kind || '')) {
      let maturity = null, nominal = 0, perYear = 0;
      try {
        const b = (await tiCall(token, 'InstrumentsService', 'BondBy',
          { idType: 'INSTRUMENT_ID_TYPE_UID', id: p.uid })).instrument;
        if (b) { maturity = b.maturityDate ? TI_DATE(b.maturityDate) : null; nominal = tiAmount(b.nominal); }
      } catch { /* без этого бумага останется без срока — так и покажем */ }

      try {
        const data = await tiCall(token, 'InstrumentsService', 'GetBondCoupons',
          { instrumentId: p.uid, from, to: yearAhead });
        for (const c of (data.events || [])) perYear += tiAmount(c.payOneBond);
      } catch { /* купоны неизвестны */ }

      const yearsLeft = maturity ? Math.max(0, (new Date(maturity) - now) / 31557600000) : null;
      // Купон облагается налогом так же, как дивиденд. Биржевой источник
      // уже отдаёт чистую сумму — здесь надо привести к тому же виду,
      // иначе один и тот же купон считался бы по-разному.
      const yearlyNet = Math.round(netOfTax(perYear * p.qty, settings));
      // Простая доходность к погашению: купон плюс разница с номиналом,
      // размазанная по оставшимся годам. Приблизительная — так и подписано.
      const price = p.price || 0;
      const ytm = price > 0 && yearsLeft > 0 && nominal > 0
        ? (perYear + (nominal - price) / yearsLeft) / price : null;

      rows.push({
        ticker: p.ticker, name: p.name, kind: 'bond', guaranteed: true,
        perYear: yearlyNet, yieldPct: value > 0 ? yearlyNet / value : 0,
        ytm: ytm != null ? Math.round(ytm * 10000) / 10000 : null,
        yearsLeft: yearsLeft != null ? Math.round(yearsLeft * 10) / 10 : null,
        maturity, repayment: nominal > 0 ? Math.round(nominal * p.qty) : null,
        detail: perYear > 0 ? `купон ${Math.round(perYear)} ₽ на бумагу в год до налога` : 'купоны неизвестны',
        approximate: true
      });
      continue;
    }

    // Акции и фонды: что заплатили за последний год и что объявлено вперёд.
    let paidBack = 0;
    try {
      const past = await tiCall(token, 'InstrumentsService', 'GetDividends',
        { instrumentId: p.uid, from: yearBack, to: from });
      for (const d of (past.dividends || [])) paidBack += tiAmount(d.dividendNet);
    } catch { /* выплат могло не быть */ }

    try {
      const next = await tiCall(token, 'InstrumentsService', 'GetDividends',
        { instrumentId: p.uid, from, to: yearAhead });
      for (const d of (next.dividends || [])) {
        const date = TI_DATE(d.lastBuyDate || d.recordDate || d.paymentDate);
        const perShare = tiAmount(d.dividendNet);
        if (!date || !(perShare > 0)) continue;
        dividends.push({
          ticker: p.ticker, name: p.name, date,
          perShare: Math.round(perShare * 100) / 100,
          net: Math.round(netOfTax(perShare * p.qty, settings))
        });
      }
    } catch { /* объявленных выплат может не быть */ }

    const yearlyNet = Math.round(netOfTax(paidBack * p.qty, settings));
    rows.push({
      ticker: p.ticker, name: p.name, kind: 'stock', guaranteed: false,
      perYear: yearlyNet, yieldPct: value > 0 ? yearlyNet / value : 0,
      detail: paidBack > 0 ? `выплачено ${dec(Math.round(paidBack * 100) / 100)} ₽ на бумагу за 12 мес` : 'выплат не было'
    });
  }

  dividends.sort((a, b) => (a.date < b.date ? -1 : 1));
  const totalNet = rows.reduce((s, r) => s + (r.perYear || 0), 0);
  const value = positions.reduce((s, p) => s + p.qty * (p.price || 0), 0);
  return {
    rows, dividends, totalNet,
    yieldOnPortfolio: value > 0 ? totalNet / value : 0,
    monthly: Math.round(totalNet / 12),
    source: 'broker'
  };
}

/** Сверка: то, что вышло из операций, против того, что показывает брокер. */
function tiReconcile(ours, theirs, opsCount = 0) {
  const mine = new Map(ours.positions.map(p => [p.ticker, p.qty]));
  const problems = [];
  const notes = [];

  for (const row of theirs.rows) {
    const have = mine.get(row.ticker);
    if (have == null) problems.push(`${row.name || row.ticker}: у брокера ${row.qty} шт, у нас нет`);
    else if (Math.abs(have - row.qty) > 0.0001) problems.push(`${row.name || row.ticker}: у брокера ${row.qty} шт, у нас ${have}`);
    mine.delete(row.ticker);
  }
  for (const [ticker, qty] of mine) if (qty > 0) problems.push(`${ticker}: у нас ${qty} шт, у брокера нет`);

  const gap = Math.round((ours.cash - theirs.cash) * 100) / 100;
  // ДОПУСК РАСТЁТ С ДЛИНОЙ ИСТОРИИ. Деньги — это остаток: в них стекается
  // округление КАЖДОЙ операции за всё время, тогда как бумаги сходятся
  // точно, штука в штуку. Жёсткий рубль на журнал из полусотни операций
  // означал вечный отказ из-за копеек: пересборка давала тот же остаток,
  // и повтор «через минуту» не мог помочь никогда.
  //
  // Пропущенная операция так не спрячется: самая мелкая из них — комиссия
  // в десяток рублей, а допуск ниже пятидесяти копеек на операцию.
  const tolerance = Math.min(60, Math.max(1, opsCount * 0.5));
  if (Math.abs(gap) > tolerance) {
    problems.push(`деньги: у брокера ${theirs.cash} ₽, у нас ${ours.cash} ₽`);
  } else if (Math.abs(gap) > 0.01) {
    // Молчать тоже нельзя: расхождение маленькое, но настоящее.
    notes.push(`Деньги разошлись на ${dec(Math.abs(gap).toFixed(2))} ₽ — это округление за ${
      opsCount} ${opsCount === 1 ? 'операцию' : 'операций'}. Бумаги сошлись все.`);
  }

  return { ok: problems.length === 0, problems, notes, gap };
}

return {tiAccounts, tiOperations, tiPortfolio, tiFacts, tiReconcile};
})());

Object.assign(SH, (function(){
/**

 *
 * Вставка списка руками не масштабируется: при сотнях позиций это мучение.

/** Синонимы заголовков: у каждого брокера свои названия колонок. */
const COLUMNS = {

  RU0007775219: { ticker: 'MTSS', name: 'МТС' },
  RU000A109B25: { ticker: 'OZPH', name: 'Озон Фармацевтика' },
  RU000A107T19: { ticker: 'YDEX', name: 'Яндекс' },
  RU000A108X38: { ticker: 'X5', name: 'X5' },
  RU000A0JS4Z0: { ticker: 'GOLD', name: 'ВИМ — Фонд Золото' },
  RU0009024277: { ticker: 'LKOH', name: 'Лукойл' },
  RU0007661625: { ticker: 'GAZP', name: 'Газпром' },
  RU0007288411: { ticker: 'NVTK', name: 'Новатэк' },

function byIsin(raw) {

    if (!match) {
      if (rawName || rawTicker) unknown.push(rawName || rawTicker);
      continue;
    }

    const avg = map.avg != null ? parseNumber(cells[map.avg]) : null;
    const value = map.value != null ? parseNumber(cells[map.value]) : null;

      ...match,
      qty,
      price: effectivePrice > 0 ? roundPrice(effectivePrice) : 0,
      avgPrice: avg > 0 ? roundPrice(avg) : (effectivePrice > 0 ? roundPrice(effectivePrice) : 0),
      avgPriceUnknown: !(avg > 0),
      priceUnknown: !(effectivePrice > 0),

    rows: out,
    unknown,
    cash: findCash(rows),

  isin:     [/код\s*цб/i, /isin/i],

  for (const r of rows.slice(0, 40)) {
    const m = r.join(' ').match(/договор[:\s]+(\d{6,})/i);
    if (m) { account = m[1]; break; }
  }

  const payouts = [], foreign = new Set();
  let map = null;

  for (const cells of rows) {
    const found = {};
    for (const key of Object.keys(INCOME_COLS)) {
      cells.forEach((c, i) => {
        if (found[key] != null || !c) return;
        if (INCOME_COLS[key].some(re => re.test(c))) found[key] = i;
      });

    if (found.date != null && found.gross != null) { map = found; continue; }
    if (!map) continue;

    const d = raw.match(/(\d{2})[.\-/](\d{2})[.\-/](\d{4})/);
    if (!d) continue;
