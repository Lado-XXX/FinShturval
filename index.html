    if (account && contract && contract !== account) { foreign.add(contract); continue; }

    const taxRaw = map.tax != null ? String(cells[map.tax] || '').replace(/\s/g, '').replace(',', '.').replace(/[^\d.\-]/g, '') : '';

      amount: Math.round((gross - tax) * 100) / 100

    if (!rows.length) return { payments: [], ttm: 0, yieldTtm: null, known: false };

    const payments = rows.filter(p => p.currency === 'RUB' || p.currency === 'SUR');

    const yearAgo = new Date(); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
    const cutoff = yearAgo.toISOString().slice(0, 10);
    const ttm = payments.filter(p => p.date >= cutoff).reduce((s, p) => s + p.value, 0);

    // сколько лет подряд платили — важнее размера разовой выплаты
    const byYear = {};
    for (const p of payments) byYear[p.date.slice(0, 4)] = true;
    const years = Object.keys(byYear).sort();
    let streak = 0;
    const thisYear = new Date().getFullYear();
    for (let y = thisYear; y >= thisYear - 12; y--) {
      if (byYear[String(y)]) streak++;
      else if (y < thisYear) break;   // текущий год может быть ещё без выплат
    }

    return {
      payments: payments.slice(-12),
      ttm: Math.round(ttm * 100) / 100,
      yieldTtm: currentPrice > 0 ? ttm / currentPrice : null,
      lastPayment: payments[payments.length - 1] || null,
      yearsPaying: years.length,
      streak,
      known: true
    };
  } catch {
    return { payments: [], ttm: 0, yieldTtm: null, known: false };
  }
}

/**
 * Параметры облигации: доходность к погашению, срок, купон.
 * Считается из реальных данных выпуска, а не берётся из справочника.
 */
async function bondFacts(secId) {
  try {
    const j = await fetchJSON(`${ISS}/securities/${encodeURIComponent(secId)}.json?iss.meta=off&iss.only=description`);
    const d = j?.description;
    if (!d?.data?.length) return { known: false };

    const facts = {};
    const nameIdx = (d.columns || []).indexOf('name');
    const valIdx = (d.columns || []).indexOf('value');
    for (const row of d.data) facts[row[nameIdx]] = row[valIdx];

    const maturity = facts.MATDATE || null;
    const faceValue = Number(facts.FACEVALUE) || 1000;
    const couponValue = Number(facts.COUPONVALUE) || 0;
    const couponPeriod = Number(facts.COUPONPERIOD) || 182;
    const couponsPerYear = couponPeriod > 0 ? Math.round(365 / couponPeriod) : 2;
    const annualCoupon = couponValue * couponsPerYear;

    return {
      known: true,
      name: facts.SECNAME || facts.NAME || secId,
      maturity,
      // До десятой доли года: печатать «4,602739726027397 лет» бессмысленно,
      // а округлять при показе — значит однажды забыть об этом в одном
      // из мест, где срок печатается.
      yearsLeft: maturity ? Math.round(Math.max(0, daysBetween(today(), maturity) / 365) * 10) / 10 : null,
      faceValue,
      couponValue,
      couponsPerYear,
      annualCoupon: Math.round(annualCoupon * 100) / 100,
      couponRate: faceValue > 0 ? annualCoupon / faceValue : null
    };
  } catch {
    return { known: false };
  }
}

/**
 * Доходность облигации к погашению — сколько получишь в год, если додержишь.
 * Учитывает и купоны, и разницу между ценой покупки и номиналом.
 */
function bondYieldToMaturity(cleanPrice, facts) {
  if (!facts?.known || !(cleanPrice > 0) || !facts.yearsLeft) return null;
  const { faceValue, annualCoupon, yearsLeft } = facts;
  if (yearsLeft < 0.05) return null;

  // приближение: купонный доход плюс равномерное подтягивание цены к номиналу
  const gain = (faceValue - cleanPrice) / yearsLeft;
  const avgPrice = (faceValue + cleanPrice) / 2;
  return avgPrice > 0 ? (annualCoupon + gain) / avgPrice : null;
}

/** Ближайшие дивидендные отсечки по всем бумагам портфеля. */
async function upcomingDividends(positions, settings = {}) {
  const out = [];
  for (const p of positions) {
    if (!(p.qty > 0)) continue;
    const hist = await dividendHistory(p.ticker, p.price);
    if (!hist.known || !hist.lastPayment) continue;

    const next = hist.payments.find(x => x.date >= today());
    if (next) {
      out.push({
        ticker: p.ticker, name: p.name, date: next.date,
        perShare: Math.round((Number(next.value) || 0) * 100) / 100,
        total: Math.round(next.value * p.qty),
        net: Math.round(netOfTax(next.value * p.qty, settings))
      });
    }
  }
  return out.sort((a, b) => (a.date < b.date ? -1 : 1));
}

/**
 * Сводка фактов по бумаге для экрана «почему она в портфеле».
 * Ничего не выдумывает: если данных нет — так и говорит.
 */
async function securityFacts(position, settings = {}) {
  const isBond = /^SU\d|ОФЗ/i.test(`${position.ticker}${position.name || ''}`);

  if (isBond) {
    const facts = await bondFacts(position.moexId || position.ticker);
    if (!facts.known) return { kind: 'bond', known: false };
    const clean = position.price;   // цена уже с купоном, для оценки этого достаточно
    return {
      kind: 'bond', known: true, ...facts,
      ytm: bondYieldToMaturity(clean * 0.96, facts),
      yearlyIncome: Math.round(facts.annualCoupon * position.qty),
      netYearly: Math.round(netOfTax(facts.annualCoupon * position.qty, settings))
    };
  }

  const div = await dividendHistory(position.ticker, position.price);
  return {
    kind: 'stock',
    known: div.known,
    ...div,
    yearlyIncome: Math.round(div.ttm * position.qty),
    netYearly: Math.round(netOfTax(div.ttm * position.qty, settings))
  };
}

return {dividendHistory, bondFacts, bondYieldToMaturity, upcomingDividends, securityFacts};

    ? state.reserve / state.settings.monthlyExpenses : null;

 *   рубль     — дорожает всё, что привязано к валюте: золото растёт;

 * @param {object} state - состояние портфеля

 */
function stressScenarios(state, yields = null) {
  const owned = (state.positions || []).filter(p => Number(p.qty) > 0);
  if (!owned.length) return [];
  const P = SH.POLICY, S = P.stress;

  const marked = owned.map(p => ({
    ...p,
    cyclical: /нефт|газ|метал|уголь|сталь|алмаз/i.test(`${p.name} ${p.sector || ''}`),
    defensiveSector: /ритейл|телеком|фарм|энерго|продукт/i.test(`${p.name} ${p.sector || ''}`)
  }));

  const marketBeta = a => {
    if (isHedge(a)) return -0.5;
    if (classify(a) === KIND.BOND) return 0.15;
    return a.cyclical ? 1.4 : (a.defensiveSector ? 0.6 : 1.0);
  };

  // Множитель цены по сценарию. Единица — цена не изменилась.
  const priceFactor = (a, id) => {
    const cls = allocationClass(a);
    if (id === 'market') return 1 + P.crashDrop * marketBeta(a);
    if (id === 'fx') {
      // Рубль подешевел — значит в рублях дорожает то, что к валюте привязано.
      // Золото привязано; рублёвая облигация нет; про акции см. выше.
      return cls === 'hedge' ? 1 / (1 - S.fxDrop) : 1;
    }
    if (id === 'rate') {
      if (cls === 'bonds') {
        const years = Number(a.yearsLeft) > 0 ? Number(a.yearsLeft) : S.bondDuration;
        return Math.max(0, 1 - years * S.rateStep);
      }
      if (cls === 'stocks') return Math.max(0, 1 - S.rateStockBeta * S.rateStep);
      return 1;
    }
    if (id === 'div') return 1;      // выплаты режут поток, а не цену
    if (id === 'all') {
      return priceFactor(a, 'market') * priceFactor(a, 'fx') * priceFactor(a, 'rate');
    }
    return 1;
  };

  const incomeFactor = (a, id) => {
    // Купон облигации назначен договором: его не «урезают» решением совета.
    if (id === 'div' || id === 'all') return allocationClass(a) === 'stocks' ? 1 - S.divCut : 1;
    return 1;
  };

  const list = [
    { id: 'market', title: `Рынок ${pct(P.crashDrop)}`, hint: 'широкое падение акций' },
    { id: 'fx', title: `Рубль −${Math.round(S.fxDrop * 100)}%`, hint: 'дорожает то, что привязано к валюте' },
    { id: 'rate', title: `Ставка +${dec1(S.rateStep * 100)} п.п.`, hint: 'дешевеют облигации, и тем сильнее, чем они длиннее' },
    { id: 'div', title: `Выплаты −${Math.round(S.divCut * 100)}%`, hint: 'капитал на месте, беднеет поток' },
    { id: 'all', title: 'Всё сразу', hint: 'рынок, курс и ставка одновременно' }
  ];

  return list.map(sc => {
    const byClass = {}, byClassAfter = {};
    let before = 0, after = 0, incomeBefore = 0, incomeAfter = 0;
    const items = [];
    for (const a of marked) {
      const v = positionValue(a);
      const f = priceFactor(a, sc.id);
      const cls = allocationClass(a);
      before += v; after += v * f;
      byClass[cls] = (byClass[cls] || 0) + v;
      byClassAfter[cls] = (byClassAfter[cls] || 0) + v * f;
      const y = yields && yields[a.ticker] > 0 ? yields[a.ticker] : 0;
      incomeBefore += v * y;
      incomeAfter += v * y * incomeFactor(a, sc.id);
      items.push({ ticker: a.ticker, name: a.name, value: v, delta: v * (f - 1) });
    }

    // Вклады классов складываются в общую просадку — это проверяется тестом:
    // разложение, которое не сходится с итогом, вводит в заблуждение.
    const contrib = Object.keys(byClass).map(cls => ({
      cls, label: classLabel ? classLabel(cls) : cls,
      from: byClass[cls], to: byClassAfter[cls],
      delta: byClassAfter[cls] - byClass[cls]
    })).sort((a, b) => a.delta - b.delta);

    const shares = {};
    for (const a of marked) {
      const v = positionValue(a) * priceFactor(a, sc.id);
      shares[a.ticker] = (shares[a.ticker] || 0) + v;
    }
    for (const k of Object.keys(shares)) shares[k] = after > 0 ? shares[k] / after : 0;

    const stressed = { ...state,
      summary: { ...state.summary, securities: after, byClass: byClassAfter, shares } };
    const riskBefore = SH.riskIndex(state);
    const riskAfter = SH.riskIndex(stressed);

    return {
      id: sc.id, title: sc.title, hint: sc.hint,
      before, after, drop: before - after,
      dropPct: before > 0 ? (after - before) / before : 0,
      contrib, items: items.sort((a, b) => a.delta - b.delta),
      income: { from: incomeBefore, to: incomeAfter, known: incomeBefore > 0 },
      risk: riskAfter ? { before: riskBefore ? riskBefore.score : null, after: riskAfter.score,
                          band: riskAfter.band,
                          why: SH.explainRiskChange(riskBefore, riskAfter) } : null,
      assumed: sc.id === 'rate' || sc.id === 'fx' || sc.id === 'all'
    };
  });
}

function notify() {
  cache = null;
  cacheSignature = '';
  for (const fn of listeners) {
    try { fn(); } catch (e) { console.error('Ошибка перерисовки:', e); }
  }
}

/** Полное состояние: операции, позиции, сводка, советы. */
async function getState() {
  // Кеш проверяется по факту, а не по флагу: если базу изменили в обход этого
  // слоя (загрузка копии, вторая вкладка), устаревшее состояние покажет
  // неверные цифры. Дешёвая сверка надёжнее доверия к флагу.
  const [ops, meta] = await Promise.all([db.allOps(), db.allMeta()]);
  const signature = ops.length + ':' + (ops[ops.length - 1]?.id || '') + ':' + Object.keys(meta).length;
  if (cache && cacheSignature === signature) return cache;
  cacheSignature = signature;

  const settings = {
    strategy: meta.strategy || 'balance',
    goal: meta.goal || { amount: 0, years: 5 },
    monthlyExpenses: meta.monthlyExpenses || 0,
    monthlyContribution: meta.monthlyContribution || 0,
    ndflRate: meta.ndflRate || 0.13,
    brokerFee: meta.brokerFee ?? 0.0004,
    // Дата открытия счёта: если не задана вручную, берём первую операцию —
    // раньше неё счёта не было.
    iisOpenDate: meta.iisOpenDate || (ops.length ? ops.map(o => o.date).sort()[0] : null),
    iisTermYears: meta.iisTermYears || 5,
    // Ключевая ставка: либо получена от ЦБ, либо вписана вручную. Хранится
    // с датой — устаревшая ставка хуже отсутствующей, о ней надо напомнить.
    keyRate: meta.keyRate && meta.keyRate.rate > 0 ? meta.keyRate : null,
    // Инфляция — допущение для пересчёта цели в сегодняшние деньги.
    inflation: inflationRate(meta),
    // Измеренная доходность своих облигаций к погашению. Прогноз подставит
    // её вместо допущения; протухшую (старше месяца) не берём.
    bondYtm: (meta.bondYtm && meta.bondYtm.value > 0
      && daysBetween(meta.bondYtm.date, today()) <= 31) ? meta.bondYtm.value : null,
    stockYield: (meta.stockYield && meta.stockYield.value > 0
      && daysBetween(meta.stockYield.date, today()) <= 31) ? meta.stockYield.value : null,
    prices: meta.prices || {},          // последние известные цены
    lots: meta.lots || {},              // размеры лотов: покупают лотами, не штуками
    lastPriceUpdate: meta.lastPriceUpdate || null,
    lastSync: meta.lastSync || null,
    tiConnected: !!meta.tiToken && !!meta.tiAccount,
    tiSyncedAt: meta.tiSyncedAt || null,
    tiProblem: meta.tiProblem || null,   // расхождение с брокером: молчать нельзя
    // Мелкое расхождение журнал не блокирует, но и не исчезает: записать
    // его и никому не показать — то же самое, что скрыть.
    tiNote: meta.tiNote || null
  };

  // Если рыночной цены нет — подставляем цену покупки, но ЧЕСТНО помечаем это.
  // Иначе приложение показывает «+0,0%» и выдаёт стоимость покупки за текущую.
  const moexIds = {};
  for (const o of ops) if (o.ticker && o.moexId) moexIds[o.ticker] = o.moexId;

  const positions = rebuildPositions(ops).map(p => {
    const market = settings.prices[p.ticker];
    return {
      ...p,
      price: market ?? p.avgPrice,
      priceIsMarket: market != null,
      moexId: moexIds[p.ticker] || p.moexId,
      name: p.name || p.ticker
    };
  });
  const stalePrices = positions.filter(p => p.qty > 0 && !p.priceIsMarket).map(p => p.ticker);

  const cash = rebuildCash(ops);
  const reserve = rebuildReserve(ops);
  const summary = summarize(positions.map(p => ({ ...p, qty: p.qty })), cash);
  const targets = STRATEGIES[settings.strategy]?.targets || STRATEGIES.balance.targets;

  // формат, понятный движку советов
  const forAdvisor = {
    assets: positions,
    cash,
    reserve: { balance: reserve, monthlyExpenses: settings.monthlyExpenses, isSet: settings.monthlyExpenses > 0 },
    goal: settings.goal,
    strategy: settings.strategy,
    settings: { monthlyContribution: settings.monthlyContribution, ndflRate: settings.ndflRate },
    contributions: ops.filter(o => o.type === OP.DEPOSIT).map(o => ({ date: o.date, type: 'deposit', amount: o.amount, technical: !!o.technical }))
  };

  cache = {
    ops, positions, cash, reserve, summary, settings, targets,
    contributions: forAdvisor.contributions,
    drift: drift(summary, targets),
    action: primaryAction(forAdvisor, summary),
    steps: allSteps(forAdvisor, summary, targets),
    tax: taxDeduction(forAdvisor),
    returnRate: xirr(cashFlows(ops, summary.total)),
    // Годовая доходность на коротком сроке обманывает: убыток 11% за два
    // месяца превращается в «−59% годовых». Считаем её всё равно, но
    // помечаем как непригодную к показу, пока истории меньше полугода.
    historyDays: ops.length ? Math.round(daysBetween(ops.map(o => o.date).sort()[0], today())) : 0,
    returnRateReliable: ops.length
      ? Math.round(daysBetween(ops.map(o => o.date).sort()[0], today())) >= 180 : false,
    yearDeposits: yearContributions(ops),
    isEmpty: positions.filter(p => p.qty > 0).length === 0,
    stalePrices,
    pricesLoaded: stalePrices.length === 0,
    // Если позиции созданы сверкой, цена покупки неизвестна — «прибыль»
    // посчитана от текущей цены и настоящей прибылью не является.
    // Прибыль скрыта, пока ХОТЬ У ОДНОЙ бумаги цена покупки неизвестна:
    // частично верный расчёт вводит в заблуждение не меньше полностью неверного.
    costIsApproximate: ops.some(o => o.priceIsCurrent === true),
    goal: analyzeGoal({
      current: summary.total,
      monthly: settings.monthlyContribution,
      goal: settings.goal.amount,
      years: settings.goal.years,
      byClass: summary.byClass,
      securities: summary.securities,
      positions,                       // состав важен: риск зависит и от него
      rates: ratesFor(settings.bondYtm || 0, settings.stockYield || 0).rates,
      taxRefund: Math.round(Math.min(yearContributions(ops), 400000) * settings.ndflRate)
    })
  };

  return cache;
}

/** Запись операции с проверкой. Возвращает описание проблемы или null. */
async function addOperation(type, fields) {
  const op = makeOp(type, fields);
  if (!op) return 'Не понял операцию — проверь числа';

  const st = await getState();
  const problem = validate(op, st.positions, st.cash);
  if (problem) return problem;

  await db.addOp(op);
  notify();
  return null;
}

async function removeOperation(id) {
  await db.deleteOp(id);
  notify();
}

/**
 * Указание средней цены покупки вручную.
 *
 * Нужно после сверки с брокером: там показана текущая цена, а не та, по которой
 * покупал. Переписываем цену в операциях этой бумаги — история остаётся,
 * но становится правдивой.
 */
async function setAveragePrice(ticker, avgPrice) {
  const price = Number(avgPrice);
  if (!(price > 0)) return 'Цена должна быть больше нуля';

  const all = await db.allOps();
  const mine = all.filter(o => o.ticker === ticker && (o.type === OP.BUY || o.type === OP.SELL));
  if (!mine.length) return 'По этой бумаге нет операций';

  const updated = mine.map(o => ({
    ...o,
    price: roundPrice(price),
    amount: Math.round(o.qty * price * 100) / 100,
    priceIsCurrent: false,                       // цена теперь известна точно
    note: o.priceIsCurrent ? 'средняя указана вручную' : o.note
  }));

  await db.addOps(updated);
  notify();
  return null;
}

async function setSetting(key, value) {
  await db.setMeta(key, value);
  notify();
}

/** Применение результатов сверки с брокером: приводим портфель к списку. */
async function applySync(changes, brokerCash) {
  const ops = [];
  const date = today();

  for (const c of changes) {
    if (c.kind === 'add') {
      // Цена из списка брокера — текущая, а не покупки. Записываем её как цену
      // сделки: другой информации нет, но помечаем операцию, чтобы приложение
      // не выдавало вычисленную «прибыль» за настоящую.
      const op = makeOp(OP.BUY, {
        ticker: c.ticker, name: c.name, qty: c.qty,
        price: c.avgPrice || c.price || 1, date,
        note: 'по сверке с брокером — цена покупки неизвестна'
      });
      // биржевой код нужен для запроса купонов: без него облигация выглядит
      // бумагой без выплат
      // Если среднюю удалось вывести из строки результата — цена покупки известна
      // точно, и прибыль можно считать честно.
      if (op) {
        if (c.avgPriceUnknown) op.priceIsCurrent = true;
        if (c.moexId) op.moexId = c.moexId;
        ops.push(op);
      }
    } else if (c.kind === 'qty') {
      const delta = c.to - c.from;
      ops.push(makeOp(delta > 0 ? OP.BUY : OP.SELL, {
        ticker: c.ticker, name: c.name, qty: Math.abs(delta),
        price: c.avgPrice || 1, date, note: 'корректировка по сверке'
      }));
    } else if (c.kind === 'gone') {
      ops.push(makeOp(OP.SELL, {
        ticker: c.ticker, name: c.name, qty: c.from,
        price: 1, date, note: 'нет у брокера — списано по сверке'
      }));
    }
  }

  const valid = ops.filter(Boolean);

  // Деньги на покупки должны откуда-то взяться: при сверке мы восстанавливаем
  // портфель, но история пополнений неизвестна. Вносим ровно столько, сколько
  // нужно, чтобы после всех покупок остаток совпал с данными брокера —
  // иначе кэш уходит в минус, а сумма расходится.
  const spent = valid.reduce((sum, o) =>
    sum + (o.type === OP.BUY ? o.amount : (o.type === OP.SELL ? -o.amount : 0)), 0);

  if (spent > 0 || Number.isFinite(brokerCash)) {
    cache = null;
    const before = (await getState()).cash;
    const targetCash = Number.isFinite(brokerCash) ? brokerCash : before;
    const need = Math.round((spent + targetCash - before) * 100) / 100;
    if (need > 0) {
      const op = makeOp(OP.DEPOSIT, { amount: need, date, note: 'внесено по сверке' });
      // Технический признак: это НЕ взнос текущего года, а восстановление истории.
      // Без него приложение засчитает сумму в базу вычета и пообещает деньги,
      // которых налоговая не вернёт.
      if (op) { op.technical = true; valid.unshift(op); }
    }
  }

  if (valid.length) await db.addOps(valid);

  // Проверяем результат и выравниваем, только если расхождение осталось.
  // Расчёт выше уже учёл нужный остаток — повторное внесение задвоило бы деньги.
  if (Number.isFinite(brokerCash)) {
    cache = null;                                  // читаем свежее состояние, а не кеш
    const st = await getState();
    const gap = Math.round((brokerCash - st.cash) * 100) / 100;
    if (Math.abs(gap) >= 1) {
      const op = makeOp(gap > 0 ? OP.DEPOSIT : OP.WITHDRAW, {
        amount: Math.abs(gap), date, note: 'выравнивание по сверке'
      });
      if (op) { op.technical = true; await db.addOp(op); }
    }
  }

  // Цена из списка брокера — рыночная. Сохраняем её как котировку: иначе после
  // указания средней цены покупки приложению нечем считать текущую стоимость.
  const quotes = {};
  for (const c of changes) {
    const px = Number(c.price ?? c.avgPrice);
    if (c.ticker && px > 0) quotes[c.ticker] = px;
  }
  if (Object.keys(quotes).length) {
    const prev = (await db.getMeta('prices')) || {};
    await db.setMeta('prices', { ...prev, ...quotes });
    await db.setMeta('lastPriceUpdate', Date.now());
  }

  await db.setMeta('lastSync', today());
  notify();
  return valid.length;
}

/** Сохранение цен, полученных с биржи. */
async function updatePrices(updates) {
  const st = await getState();
  const prices = { ...st.settings.prices };
  const lots = { ...(st.settings.lots || {}) };
  for (const u of updates) {
    prices[u.ticker] = u.price;
    if (Number(u.lot) > 0) lots[u.ticker] = Number(u.lot);
  }

  await db.setMeta('prices', prices);
  await db.setMeta('lots', lots);
  await db.setMeta('lastPriceUpdate', Date.now());

  // снимок стоимости на сегодня — для графика
  const records = updates.map(u => {
    const pos = st.positions.find(p => p.ticker === u.ticker);
    return { ticker: u.ticker, date: today(), price: u.price, value: (pos?.qty || 0) * u.price };
  });
  if (records.length) await db.savePrices(records);

  notify();
}

/** Полное стирание данных. Нужно, чтобы уйти от демо-примера к своему портфелю. */
/**
 * Денежный поток портфеля: сколько приносят бумаги и когда ждать выплат.
 * Считается из фактических данных биржи, а не из обещанных процентов.
 */


/**
 * Что будет с портфелем при обвале рынка.
 * Не предсказание, а проверка устойчивости: как поведут себя разные бумаги,
 * если рынок упадёт на заданную величину.
 */



/**
 * Загрузка истории сделок из брокерского отчёта.
 *
 * Самый точный способ: из сделок восстанавливаются настоящие средние цены,
 * доходность с учётом дат и полный журнал. Повторные загрузки не создают
 * дублей — сделка узнаётся по дате, бумаге, количеству и цене.
 */
async function importTrades(trades, cashOps = []) {
  if (!Array.isArray(trades)) trades = [];
  if (!trades.length && !cashOps.length) return { added: 0, skipped: 0 };

  // Одинаковые сделки внутри одного отчёта — обычное дело: крупная заявка
  // исполняется частями по одной цене. Поэтому считаем не «была ли такая»,
  // а сколько таких уже записано: повторная загрузка отчёта дублей не создаст,
  // но и настоящие парные сделки не потеряются.
  const sign = o => `${o.date}|${o.ticker || ''}|${o.qty != null ? o.qty : o.amount}|${o.price || ''}|${o.type}`;
  const existing = await db.allOps();
  const already = new Map();
  for (const o of existing) already.set(sign(o), (already.get(sign(o)) || 0) + 1);

  const fresh = [];
  const seen = new Map();
  let skipped = 0;

  for (const t of [...cashOps, ...trades]) {
    const key = sign(t);
    const nth = (seen.get(key) || 0) + 1;
    seen.set(key, nth);
    if (nth <= (already.get(key) || 0)) { skipped++; continue; }

    const op = (t.type === 'buy' || t.type === 'sell')
      ? makeOp(t.type === 'buy' ? OP.BUY : OP.SELL, {
          ticker: t.ticker, name: t.name, qty: t.qty, price: t.price,
          fee: t.fee, date: t.date, note: 'из брокерского отчёта' })
      : makeOp(t.type === 'deposit' ? OP.DEPOSIT : t.type === 'dividend' ? OP.DIVIDEND : OP.WITHDRAW, {
          amount: t.amount, date: t.date, ticker: t.ticker,
          note: t.type === 'dividend'
            ? `выплата ${t.gross ? t.gross + ' ₽, налог ' + t.tax + ' ₽' : ''}`.trim()
            : 'из брокерского отчёта' });

    if (!op) { skipped++; continue; }
    if (t.moexId) op.moexId = t.moexId;
    fresh.push(op);
  }

  if (fresh.length) await db.addOps(fresh);
  notify();
  return { added: fresh.length, skipped };
}

async function resetAll() {
  await db.importAll({ format: 'shturval-backup', ops: [], prices: [], meta: {} });
  notify();
}

async function exportBackup() {
  const backup = await db.exportAll();
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `shturval-${today()}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function importBackup(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch { return 'Файл повреждён'; }
  const r = await db.importAll(parsed);
  if (!r.ok) return r.error;
  notify();
  return null;
}

/** Первый запуск: перенос данных прошлой версии, если они есть. */
async function init() {
  try {
    const legacy = localStorage.getItem('shturval:state') || localStorage.getItem('fw_state2');
    if (legacy) {
      const parsed = JSON.parse(legacy);
      const assets = parsed.assets || parsed.holdings;
      if (Array.isArray(assets) && assets.length) {
        await db.migrateFromLocalStorage({
          assets: assets.map(a => ({
            ticker: a.ticker || a.t,
            name: a.name || a.n,
            qty: a.qty ?? a.q,
            avgPrice: a.avgPrice ?? a.a
          })),
          contributions: parsed.contributions || [],
          meta: parsed.meta
        });
      }
    }
  } catch { /* переносить нечего */ }

  await db.requestPersistence();

  // Прошлое обновление могло оборваться между удалением журнала и записью
  // нового. Тогда в хранилище осталась копия — состояние журнала после
  // обрыва неизвестно, поэтому возвращаем копию целиком: лучше устаревшее,
  // чем неполное.
  try {
    const bak = await db.getMeta('journalBackup');
    if (bak && Array.isArray(bak.ops)) {
      const cur = await db.allOps();
      for (const o of cur) await db.deleteOp(o.id);
      await db.addOps(bak.ops);
      await db.setMeta('journalBackup', null);
      await db.setMeta('tiProblem',
        ['Прошлое обновление оборвалось на середине — журнал восстановлен из копии. Обнови из Т-Инвестиций ещё раз.']);
    }
  } catch { /* копии нет — возвращать нечего */ }

  notify();
}

// ВАЖНО. `reports` — это тот же объект SH, а обёртки ниже экспортируются под
// теми же именами и перекрывают в нём оригиналы. Поэтому обращение к отчёту
// через `reports.x` изнутри обёртки `x` — это вызов самого себя: бесконечная
// рекурсия, которая не роняет стек (каждый await — новая микрозадача), а молча
// съедает память, и экран навсегда застревает на «Считаю…». Снимаем оригиналы
// ДО перекрытия и зовём только их.
// Чистые функции скринера store не перекрывает, но берём их так же явно:
// правило «зови оригинал, а не себя» должно быть одинаковым по всему модулю.
const R2 = { trailingYield: reports.trailingYield, payoutStreak: reports.payoutStreak,
             trailingYieldDetailed: reports.trailingYieldDetailed };
const R = {
  explainSecurity: reports.explainSecurity,
  upcomingPayments: reports.upcomingPayments,
  cashflowSummary: reports.cashflowSummary,
  analyzeBuy: reports.analyzeBuy,
  portfolioGaps: reports.portfolioGaps,
  crashTest: reports.crashTest,
  valueChart: reports.valueChart,
  marketContext: reports.marketContext,
  rateMeaning: reports.rateMeaning
};

// Разборы вынесены в reports.js. Здесь — тонкие обёртки, которые передают
// туда актуальное состояние: вызывающему коду не нужно знать про два модуля.
const explainSecurity = async t => R.explainSecurity(await getState(), t);
const upcomingPayments = async () => R.upcomingPayments(await getState());
const cashflowSummary = async () => R.cashflowSummary(await getState());
const analyzeBuy = async (t, a) => R.analyzeBuy(await getState(), t, a);
const portfolioGaps = async () => R.portfolioGaps(await getState());

/**
 * Параллельная загрузка с ограничением. Двадцать запросов по очереди на
 * мобильной сети — это полминуты и почти гарантированный отказ по времени;
 * пять одновременно укладываются в секунды. Ошибка одной бумаги не рушит
 * остальные: у неё просто не будет выплат.
 */
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      // Ошибка одной бумаги не рушит экран, но и не исчезает бесследно:
      // ровно так пряталась поломка разбора, выглядевшая как молчание биржи.
      try { out[i] = await fn(items[i], i); }
      catch (err) { out[i] = null; noteSwallowed('запрос по одной бумаге', err); }
    }
  });
  await Promise.all(workers);
  return out;
}

/**
 * Поиск идей: тянет список бумаг с биржи, обогащает фактическими выплатами
 * и отдаёт отбор. Дивиденды запрашиваются только по коротком списку —
 * двести запросов ради одного экрана недопустимы.
 */
// На каком шаге сейчас поиск. Нужно, чтобы при отказе по времени сказать
// не просто «биржа не ответила», а что именно не дождались.
//
// Отметка у каждого поиска своя. Раньше переменная была одна на двоих, а
// идеи и замены идут одновременно: успевший первым сбрасывал отметку в
// null, и второй по своему отказу называл чужой шаг — либо не называл
// никакого. Сообщение о причине не имеет смысла, если причина чужая.
const marketStages = { ideas: null, swaps: null };
const lastMarketStage = which => which
  ? (marketStages[which] || null)
  : (marketStages.ideas || marketStages.swaps || null);

/**
 * Ключевая ставка: пробуем получить у ЦБ, иначе оставляем вписанную вручную.
 * Проверяем не чаще раза в сутки — ставка меняется несколько раз в год.
 */
async function refreshKeyRate() {
  const stored = await db.getMeta('keyRate');
  const today10 = today();
  if (stored && stored.checked === today10) return stored;
  try {
    const fresh = await moex.fetchKeyRate();
    if (fresh && fresh.rate > 0) {
      const rec = { rate: fresh.rate, date: fresh.date, source: 'ЦБ', checked: today10 };
      await db.setMeta('keyRate', rec);
      return rec;
    }
  } catch { /* ЦБ недоступен со страницы — останется ручное значение */ }
  if (stored) { await db.setMeta('keyRate', { ...stored, checked: today10 }); }
  return stored || null;
}

async function findIdeas(kind, filters = {}, opts = {}) {
  marketStages.ideas = 'связь с биржей';
  if (!(await moex.pingExchange())) { marketStages.ideas = 'нет доступа к бирже'; return null; }
  marketStages.ideas = 'ставка денежного рынка';
  const st = await getState();
  const market = await marketContext();
  const ctx = {
    ownedTickers: st.positions.filter(p => p.qty > 0).map(p => p.ticker),
    targets: st.targets,
    currentShares: st.summary?.securities > 0
      ? { stocks: (st.summary.byClass.stocks || 0) / st.summary.securities,
          bonds: (st.summary.byClass.bonds || 0) / st.summary.securities,
          hedge: (st.summary.byClass.hedge || 0) / st.summary.securities }
      : {},
    goalYears: Number(st.settings?.goal?.years) || 0,
    // Доли отраслей в портфеле — чтобы отбор не советовал доливать туда,
    // где и без того перекос. Считаются от всей стоимости бумаг, как и в
    // карточке «Акции по секторам»: одно правило — одно место.
    sectorShares: (() => {
      const total = Number(st.summary?.securities) || 0;
      if (!(total > 0)) return {};
      const out = {};
      for (const p of st.positions.filter(x => x.qty > 0)) {
        if (allocationClass(p) !== 'stocks') continue;
        const sec = p.sector || sectorOf(p);
        if (!sec) continue;
        out[sec] = (out[sec] || 0) + (p.qty * p.price) / total;
      }
      return out;
    })(),
    sectorMax: (SH.LIMITS && SH.LIMITS.sectorMax) || 0.35,
    singleMax: (SH.LIMITS && SH.LIMITS.singlePosition) || 0.25,
    // Доли отдельных бумаг: штраф за докупку своей зависит от того,
    // сколько её уже есть, а не от самого факта владения.
    positionShares: (() => {
      const total = Number(st.summary?.securities) || 0;
      if (!(total > 0)) return {};
      const out = {};
      for (const p of st.positions.filter(x => x.qty > 0)) {
        out[p.ticker] = (p.qty * p.price) / total;
      }
      return out;
    })(),
    moneyRate: moneyRate(market && market.moneyRate / 100),
    marketYield: ASSUMED.marketYield
  };

  if (kind === 'hedge') {
    // Защита. Фонды на золото — единственный доступный на бирже способ
    // добрать этот класс: отдельных «защитных акций» не бывает.
    marketStages.ideas = 'список фондов';
    const funds = await moex.fetchAllFunds();
    const gold = funds.filter(f => f.fundKind === 'gold')
      .sort((a, b) => (b.turnover || 0) - (a.turnover || 0));
    const owned = new Set(ctx.ownedTickers);
    marketStages.ideas = null;
    return {
      rows: gold.map(f => ({ ...f, kind: 'hedge',
        score: owned.has(f.ticker) ? 60 : 70,
        why: [owned.has(f.ticker) ? 'уже есть в портфеле — докупка не добавит новых рисков'
                                  : 'новый фонд: сравнивать нужно комиссию управляющего',
              f.turnover > 0 ? 'торгуется активно — продать можно быстро' : 'оборот сегодня мал'] })),
      total: funds.length, ctx,
      market: { onBoard: funds.length, checked: gold.length, paying: 0, best: null, nearMiss: [],
                note: 'Фонды не платят дивидендов: доход только в цене пая. Комиссию управляющего '
                    + 'биржа не публикует — её надо смотреть в правилах фонда, она уменьшает результат каждый год.' }
    };
  }

  if (kind === 'bonds') {
    marketStages.ideas = 'список облигаций';
    const rows = await moex.fetchAllBonds(filters.type ? [filters.type] : ['gov', 'corp']);
    return { rows: reports.screenBonds(rows, filters, ctx).slice(0, 40), total: rows.length, ctx };
  }

  marketStages.ideas = 'список акций';
  const all = await moex.fetchAllStocks();
  // Короткий список: сперва грубые фильтры без выплат, потом — по капитализации,
  // и только двенадцати лидерам считаем дивиденды. Двадцать запросов не
  // укладывались в отведённое время на мобильной сети.
  const rough = reports.screenStocks(all, { ...filters, minYield: 0, minStreak: 0 }, ctx)
    .sort((a, b) => (b.cap || 0) - (a.cap || 0))
    .slice(0, 30);          // биржа отвечает за доли секунды — можно смотреть шире
  marketStages.ideas = 'истории выплат';
  const histories = await mapLimit(rough, 6, r => moex.fetchDividendHistory(r.ticker));

  // Три разных исхода, которые нельзя путать: биржа не ответила, ответила
  // пустотой (компания не платит) и ответила выплатами. Раньше все три
  // давали ноль, и «платят хоть что-то 0» выглядело как факт о рынке,
  // хотя могло означать поломку связи.
  let noAnswer = 0, noPayouts = 0, oldPayouts = 0, suspect = 0;
  rough.forEach((r, i) => {
    const hist = histories[i];
    if (!hist) { r.streak = 0; r.yieldPct = 0; r.histFailed = true; noAnswer += 1; return; }
    if (!hist.length) { r.streak = 0; r.yieldPct = 0; noPayouts += 1; return; }
    r.streak = reports.payoutStreak(hist);
    const detail = reports.trailingYieldDetailed(hist, r.price);
    r.yieldPct = detail ? detail.yieldPct : 0;
    r.payoutAgeDays = detail ? detail.ageDays : null;
    r.payoutLastDate = detail ? detail.lastDate : null;
    r.payoutStale = detail ? detail.stale : false;
    // Данные, которым нельзя верить, помечаются и дальше не считаются
    // доходностью. Четвёртый исход рядом с «не ответила», «не платит» и
    // «платили давно»: биржа ответила, но ответ неправдоподобен.
    r.yieldSuspect = detail ? detail.suspect : null;
    r.rawYieldPct = detail ? detail.rawYieldPct : null;
    if (r.yieldSuspect === 'implausible') suspect += 1;
    r.lastPayout = hist[hist.length - 1];
    // Выплаты были, но так давно, что считать их текущими нельзя.
    if (!(r.yieldPct > 0) && r.yieldSuspect !== 'implausible') oldPayouts += 1;
  });
  // Разбор рынка. «Ничего не подошло» — отказ без вывода: человек не
  // понимает, планка ли высока или рынок такой. Считаем картину: сколько
  // проверено, сколько вообще платит и кто ближе всех к порогу.
  const paying = rough.filter(r => (r.yieldPct || 0) > 0);
  const nearMiss = [...paying]
    .sort((a, b) => (b.yieldPct || 0) - (a.yieldPct || 0))
    .slice(0, 3)
    .map(r => ({ ticker: r.ticker, name: r.name, yieldPct: r.yieldPct, streak: r.streak || 0 }));

  // Если биржа не отдала историю, но выплаты по этой бумаге знает брокер
  // (она есть в портфеле) — берём его данные. Это тот же факт, просто из
  // другого источника, и он честнее пустоты.
  if (noAnswer > 0 && Array.isArray(opts.knownYields)) {
    for (const r of rough) {
      if (!r.histFailed) continue;
      const known = opts.knownYields.find(k => k.ticker === r.ticker);
      if (known && known.yieldPct > 0) {
        r.yieldPct = known.yieldPct;
        r.streak = known.streak || 0;
        r.fromBroker = true;
        noAnswer -= 1;
      }
    }
  }

  marketStages.ideas = null;
  return {
    rows: reports.screenStocks(rough, filters, ctx), total: all.length, ctx,
    market: { onBoard: all.length, checked: rough.length, paying: paying.length,
              noAnswer, noPayouts, oldPayouts, suspect,
              best: nearMiss[0] || null, nearMiss }
  };
}

/**
 * Что поменять: тянет рынок и фактические данные по СВОИМ бумагам,
 * затем сравнивает. Свои облигации ищутся в общем списке биржи — оттуда
 * же берётся их сегодняшняя доходность к погашению; свои акции —
 * по истории выплат.
 */
async function findReplacements(opts = {}) {
  marketStages.swaps = 'связь с биржей';
  if (!(await moex.pingExchange())) { marketStages.swaps = 'нет доступа к бирже'; return null; }
  // ОБЩИЙ СРОК. Потолок ожидания снаружи режет весь обход разом: не успел —
  // нет ничего. При этом сумма внутренних потолков (доска ОФЗ, доска акций,
  // истории выплат) заведомо больше внешнего срока, то есть обход мог не
  // уложиться, даже когда каждый ответ приходил быстро. Теперь поиск сам
  // смотрит на часы: если на следующий класс времени не осталось, он его
  // не начинает и честно помечает непроверенным — вместо того чтобы быть
  // убитым снаружи вместе с уже собранным.
  const deadline = Number(opts.deadline) || 0;
  const msLeft = () => (deadline ? deadline - Date.now() : Infinity);
  marketStages.swaps = 'портфель';
  const st = await getState();
  const owned = st.positions.filter(p => p.qty > 0);
  const facts = [];
  const candidates = [];

  const myBonds = owned.filter(p => allocationClass(p) === 'bonds');
  const myStocks = owned.filter(p => allocationClass(p) === 'stocks');
  // Что не удалось проверить. Раньше отказ на одном классе отменял оба:
  // облигации уже собраны, падение на доске акций — и раздел пуст целиком.
  // Половина сравнения полезнее пустоты, но молчать о второй половине нельзя.
  const missed = [];

  if (myBonds.length) {
    // Кандидаты этого класса копятся отдельно и попадают в общий список
    // только целиком. Иначе вышло бы худшее: фонды денежного рынка уже в
    // кандидатах, а доходности своих облигаций не пришли — и приложение
    // предложило бы обменять бумагу, о которой ничего не знает.
    const bondCands = [];
    // На доску ОФЗ с запасом нужно секунд двадцать. Меньше — не начинаем:
    // лучше сразу сказать, что класс не проверен, чем потратить остаток
    // времени впустую и не показать ничего.
    if (msLeft() < 20000) {
      missed.push({ what: 'облигации', why: 'не осталось времени' });
    } else try {
      // Денежный рынок как альтернатива облигациям: его доходность — это
      // сегодняшняя ставка, величина известная и проверяемая.
      marketStages.swaps = 'список фондов';
      try {
        const market = await marketContext();
        const rate = market && market.moneyRate > 0 ? market.moneyRate / 100 : 0;
        if (rate > 0) {
          const funds = await moex.fetchAllFunds();
          for (const f of funds.filter(x => x.fundKind === 'money')
                               .sort((a, b) => (b.turnover || 0) - (a.turnover || 0)).slice(0, 3)) {
            bondCands.push({ ...f, kind: 'bond', ytm: rate, yearsLeft: 0 });
          }
        }
      } catch (err) { noteSwallowed('список фондов', err); }

      marketStages.swaps = 'список облигаций';
      const all = await moex.fetchAllBonds(['gov']);
      const mine = new Set(myBonds.map(p => p.ticker));
      for (const r of all) {
        if (mine.has(r.ticker)) facts.push({ ticker: r.ticker, ytm: r.ytm, yearsLeft: r.yearsLeft,
                                             couponType: r.couponType });
        else bondCands.push({ ...r, kind: 'bond' });
      }
      candidates.push(...bondCands);
    } catch (err) {
      missed.push({ what: 'облигации', why: (err && err.message) || String(err) });
    }
  }

  if (myStocks.length) {
    // Акциям нужно больше: доска плюс истории выплат по своим и по дюжине
    // кандидатов. Не хватает — класс честно остаётся непроверенным.
    if (msLeft() < 25000) {
      missed.push({ what: 'акции', why: 'не осталось времени' });
    } else try {
      // Свои акции — обязательно; кандидаты — двенадцать крупнейших с рынка,
      // иначе это двести запросов истории выплат ради одного экрана.
      marketStages.swaps = 'список акций';
      const all = await moex.fetchAllStocks();
      const mine = new Set(myStocks.map(p => p.ticker));
      const shortlist = all.filter(r => !mine.has(r.ticker))
        .sort((a, b) => (b.cap || 0) - (a.cap || 0)).slice(0, 12);
      marketStages.swaps = 'истории выплат';
      const mineHist = await mapLimit(myStocks, 6, p => moex.fetchDividendHistory(p.ticker));
      myStocks.forEach((p, i) => {
        const row = all.find(r => r.ticker === p.ticker);
        const hist = mineHist[i];
        // Биржа промолчала — это НЕ «выплат ноль». Ноль здесь означал бы, что
        // своя бумага не платит ничего, и любая чужая выглядела бы выгоднее
        // на всю свою доходность. Неизвестность так и передаётся дальше:
        // про такую бумагу обмен не предлагается вовсе.
        facts.push(hist
          ? { ticker: p.ticker, yieldPct: R2.trailingYield(hist, (row && row.price) || p.price),
              streak: R2.payoutStreak(hist) }
          : { ticker: p.ticker, yieldPct: null, streak: 0 });
      });

      const candHist = await mapLimit(shortlist, 6, r => moex.fetchDividendHistory(r.ticker));
      shortlist.forEach((r, i) => {
        const hist = candHist[i];
        if (!hist) return;      // без истории выплат бумага в кандидаты не годится
        const detail = R2.trailingYieldDetailed(hist, r.price);
        candidates.push({ ...r, kind: 'stock',
                          yieldPct: detail ? detail.yieldPct : null,
                          yieldSuspect: detail ? detail.suspect : null,
                          payouts: detail ? detail.payouts : 0,
                          // Свежесть выплат едет вместе с их размером: «платит N лет
                          // подряд» без даты последней выплаты — половина правды.
                          payoutAgeDays: detail ? detail.ageDays : null,
                          payoutLastDate: detail ? detail.lastDate : null,
                          streak: R2.payoutStreak(hist) });
      });
    } catch (err) {
      missed.push({ what: 'акции', why: (err && err.message) || String(err) });
    }
  }

  // Собрать не удалось ничего — это отказ, а не половина ответа. Пусть
  // раздел назовёт причину обычным путём, вместе с шагом.
  if (missed.length && !candidates.length) return null;

  marketStages.swaps = null;
  return { ideas: SH.replacementIdeas(st, candidates, { facts }), checked: candidates.length, missed };
}

/** Данные по любой бумаге, не только из портфеля. */
async function getSecurityDetails(ticker) {
  const st = await getState();
  const pos = st.positions.find(p => p.ticker === ticker);
  const facts = await R.explainSecurity(st, ticker).catch(() => null);
  let dividends = [];
  try { dividends = await moex.fetchDividendHistory(ticker); } catch { /* нет данных — покажем без них */ }
  return {
    ticker, owned: !!pos, position: pos || null, facts,
    dividends: dividends.slice(-8).reverse(),
    streak: reports.payoutStreak(dividends)
  };
}
const crashTest = async d => R.crashTest(await getState(), d);
const valueChart = R.valueChart;
const marketContext = R.marketContext;
const rateMeaning = R.rateMeaning;



/**
 * Обновление из Т-Инвестиций.
 *
 * Записывает только то, что сошлось. Автоматическая загрузка опасна тем,
 * что молча портит журнал, если разбор ответа окажется неверным, — поэтому
 * сначала пересчитываем портфель из истории и сравниваем с тем, что брокер
 * показывает отдельно. Не сошлось — не пишем и говорим почему.
 */
async function syncTinvest({ silent = false, force = false } = {}) {
  const token = await db.getMeta('tiToken');
  const accountId = await db.getMeta('tiAccount');
  if (!token || !accountId) return { skipped: 'нет токена' };

  // Разбор прошлой попытки живёт до следующей — и ни минутой дольше.
  // Иначе одноразовое «обновление оборвалось, обнови ещё раз» висит на
  // экране вечно: совет, которому человек уже последовал, но выполнить
  // его не удалось, и карточка осталась пугать. Всё, что найдётся в этот
  // раз, будет записано заново к концу разбора.
  await db.setMeta('tiProblem', null);

  const before = await db.allOps();          // на случай, если ничего не сойдётся
  // Пересборка сначала удаляет журнал, потом пишет новый. Если между этими
  // шагами всё оборвётся — вкладку закрыли, база упала — копия в памяти
  // погибнет вместе со страницей. Поэтому она кладётся в само хранилище
  // и забирается оттуда при следующем запуске, если пересборка не дожила.
  //
  // Кладётся ПОСЛЕ разговора с брокером, а не до. Раньше копия появлялась
  // первой строкой, и обычный обрыв связи выглядел при следующем запуске
  // как «обновление оборвалось на середине, журнал восстановлен из копии» —
  // хотя журнала никто не касался. Ложная тревога о порче данных стоит
  // дороже, чем кажется: ей перестают верить и тогда, когда она настоящая.
  let ops, book;
  try {
    // Сначала портфель: он пополняет запас имён, которым потом пользуются
    // операции. В обратном порядке журнал успевал набрать технические коды.
    book = await tiPortfolio(token, accountId, (await db.getMeta('uidTickers')) || {});
    if (book && book.resolved && Object.keys(book.resolved).length) {
      await db.setMeta('uidTickers', { ...((await db.getMeta('uidTickers')) || {}), ...book.resolved });
    }
    ops = await tiOperations(token, accountId, '2000-01-01', (await db.getMeta('uidTickers')) || {});
  } catch (err) {
    await db.setMeta('tiLastError', { at: Date.now(), message: err.message || String(err) });
    // Журнала не касались — сообщать не о чем, кроме самой связи.
    await db.setMeta('journalBackup', null);
    throw err;
  }
  await db.setMeta('tiLastError', null);
  // Имена, выясненные по операциям, тоже идут в память. Раньше туда попадали
  // только бумаги из текущего портфеля, и проданные оставались безымянными
  // навсегда — а значит журнал переставал пересобираться в принципе.
  if (ops && ops.resolved && Object.keys(ops.resolved).length) {
    await db.setMeta('uidTickers', { ...((await db.getMeta('uidTickers')) || {}), ...ops.resolved });
  }
  // Дальше начинается запись. Вот теперь копия нужна.
  await db.setMeta('journalBackup', { at: Date.now(), ops: before });

  // Брокер не назвал имена части бумаг — в ответе остались технические коды.
  // Записать такой журнал значит испортить данные: половина сделок ляжет
  // под кодом, половина под тикером, и сверка будет ругаться вечно.
  // Лучше не трогать журнал совсем и попросить повторить.
  if ((ops && ops.unresolved > 0) || (book && book.unresolved > 0)) {
    const missing = Math.max(ops?.unresolved || 0, book?.unresolved || 0);
    await db.setMeta('journalBackup', null);
    // Называем сами коды. «Не назвал имена 19 бумаг» — тупик: непонятно ни
    // каких, ни что с этим делать. По коду видно бумагу, и сразу ясно,
    // временный это отказ или брокер вообще не знает такой записи.
    const codes = (ops && ops.unnamed || []).slice(0, 5);
    const msg = `Брокер не назвал имена ${missing} ${missing === 1 ? 'бумаги' : 'бумаг'} — журнал не тронут, `
      + `чтобы в нём не смешались имена и технические коды. `
      + (codes.length ? `Не опознаны: ${codes.join(', ')}${(ops.unnamed || []).length > codes.length ? ' и другие' : ''}. ` : '')
      + `Обнови ещё раз через минуту: чаще всего это временный отказ на стороне брокера.`;
    await db.setMeta('tiProblem', [msg]);
    if (!silent) notify();
    return { ok: false, problems: [msg], unresolved: missing };
  }

  const draft = [];
  for (const t of [...ops.cash, ...ops.trades]) {
    const op = (t.type === 'buy' || t.type === 'sell')
      ? makeOp(t.type === 'buy' ? OP.BUY : OP.SELL, t)
      : makeOp(t.type === 'deposit' ? OP.DEPOSIT : t.type === 'dividend' ? OP.DIVIDEND
             : t.type === 'fee' ? OP.FEE : OP.WITHDRAW, t);
    if (op) draft.push(op);
  }

  // Сверять надо ЖУРНАЛ с портфелем брокера, а не свежескачанное само с собой.
  // Пока сравнивались только новые операции, двойники от прежних загрузок
  // оставались невидимыми: сверка проходила, а суммы были вдвое больше.
  const checkJournal = async () => {
    const all = await db.allOps();
    return tiReconcile(
      { positions: rebuildPositions(all).filter(p => p.qty > 0), cash: rebuildCash(all) },
      book, all.length);
  };

  // РЕЗЕРВ ПЕРЕЖИВАЕТ ЛЮБУЮ ПЕРЕСБОРКУ. Подушка лежит вне брокерского
  // счёта, в истории брокера её нет и быть не может, а значит пересборка
  // «начисто» стирает её вместе с суммой, которую человек вносил руками.
  //
  // Раньше её берёг фильтр при удалении — в каждой из трёх веток свой.
  // Три копии одного правила: достаточно забыть фильтр в одной ветке, и
  // подушка исчезает молча. Теперь удаление везде безусловное, а правило
  // одно и стоит после пересборки: записи резерва откладываются заранее
  // и возвращаются, сколько бы их ни было.
  const reserveOps = before.filter(o => o.type === OP.RESERVE);
  const restoreReserve = async () => {
    if (!reserveOps.length) return;
    const now = await db.allOps();
    const have = new Set(now.filter(o => o.type === OP.RESERVE).map(o => o.id));
    const lost = reserveOps.filter(o => !have.has(o.id));
    if (lost.length) await db.addOps(lost);
  };

  // force — журнал заведомо сомнителен: не дополняем его, а собираем заново.
  if (force) {
    const all = await db.allOps();
    for (const o of all) await db.deleteOp(o.id);
    await db.addOps(draft);
    await restoreReserve();
  } else {
    await importTrades(ops.trades, ops.cash);
  }
  let check = await checkJournal();

  // Не сошлось — значит в журнале есть лишнее. Собираем его заново
  // из истории брокера: она полная, других источников не требуется.
  if (!check.ok) {
    const all = await db.allOps();
    for (const o of all) await db.deleteOp(o.id);
    await db.addOps(draft);
    await restoreReserve();
    check = await checkJournal();
  }

  // Не сошлось даже после пересборки — значит я неверно разобрал ответ API.
  // Возвращаем журнал как был: лучше устаревшее, чем неверное.
  if (!check.ok) {
    const all = await db.allOps();
    for (const o of all) await db.deleteOp(o.id);
    await db.addOps(before);
    await restoreReserve();
    await db.setMeta('journalBackup', null);
    await db.setMeta('tiProblem', check.problems.slice(0, 6));
    if (!silent) notify();
    return { ok: false, problems: check.problems, ops, book };
  }

  if (book.prices.length) await updatePrices(book.prices);
  await db.setMeta('journalBackup', null);
  // Мелкое расхождение по деньгам журнал не блокирует, но и не исчезает
  // бесследно: оно видно в диагностике. Скрыть его было бы враньём, а
  // блокировать журнал из-за копеек — тем, чем оно и было: тупиком.
  await db.setMeta('tiNote', (check.notes && check.notes.length) ? check.notes : null);
  await db.setMeta('tiProblem', null);
  await db.setMeta('tiSyncedAt', Date.now());
  await db.setMeta('syncedBuild', BUILD_ID);
  if (!silent) notify();
  return { ok: true, added: draft.length, ops, book };
}

function renderWelcome() {
  $('view').innerHTML = `

      <p class="muted" style="text-align:center;line-height:1.7;margin-bottom:26px">

        <b>Открыт файл с устройства</b><br>
        <span class="muted">У каждого браузера для такого файла своя отдельная база. Если ты вводил
        токен в другом браузере — здесь его нет, и портфель не пропал: он остался там. Обновления
