 */
function decisionHistory(state, opts = {}) {
  const ops = (state.ops || []).filter(o => o.type === 'buy' || o.type === 'sell');
  if (!ops.length) return [];
  const limit = Number(opts.limit) > 0 ? Number(opts.limit) : 10;

  const byDate = (state.ops || []).slice()
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
  const prices = {};
  for (const p of (state.positions || [])) prices[p.ticker] = p.price;

  // Снимок портфеля по сделкам ДО указанной (включительно или нет).
  const snapshot = upTo => {
    const acc = new Map();
    for (const o of byDate) {
      if (o.seq > upTo) break;
      if (o.type !== 'buy' && o.type !== 'sell') continue;
      const cur = acc.get(o.ticker) || { ticker: o.ticker, name: o.name, qty: 0,
                                         price: prices[o.ticker] || o.price, kind: o.kind };
      cur.qty += (o.type === 'buy' ? 1 : -1) * Number(o.qty || 0);
      acc.set(o.ticker, cur);
    }
    const positions = [...acc.values()].filter(p => p.qty > 0);
    const securities = positions.reduce((a, p) => a + positionValue(p), 0);
    if (!(securities > 0)) return null;
    const byClass = {}, bySector = {}, shares = {};
    for (const p of positions) {
      const cls = allocationClass(p), v = positionValue(p);
      byClass[cls] = (byClass[cls] || 0) + v;
      const sec = cls === 'stocks' ? sectorOf(p) : null;
      if (sec) bySector[sec] = (bySector[sec] || 0) + v;
      shares[p.ticker] = v / securities;
    }
    return { ...state, positions,
             summary: { ...state.summary, securities, byClass, bySector, shares } };
  };

  byDate.forEach((o, i) => { o.seq = i; });
  const trades = byDate.filter(o => o.type === 'buy' || o.type === 'sell');
  const out = [];
  for (const o of trades.slice(-limit)) {
    const before = snapshot(o.seq - 1);
    const after = snapshot(o.seq);
    const rb = before ? riskIndex(before) : null;
    const ra = after ? riskIndex(after) : null;
    out.push({
      date: o.date, type: o.type, ticker: o.ticker, name: o.name || o.ticker,
      qty: o.qty, amount: o.amount,
      riskBefore: rb ? rb.score : null,
      riskAfter: ra ? ra.score : null,
      // Первая сделка не с чем сравнивать: до неё портфеля не было.
      why: rb && ra ? explainRiskChange(rb, ra) : 'первая сделка — сравнивать не с чем'
    });
  }
  return out.reverse();
}

/**
 * КАРТОЧКА ПОЗИЦИИ — ответ на вопрос «что делать с этой бумагой сейчас».
 *
 * Вклад в риск и в разнообразие считается ПРЕДЕЛЬНО: насколько изменились бы
 * обе меры, если бы этой бумаги в портфеле не было. Так вклад получается из
 * той же модели, по которой живёт всё остальное, а не из отдельной формулы,
 * которая однажды с ней разойдётся. И он честен: бумага, чья доля в норме,
 * даёт нулевой вклад в риск — потому что и правда ничего не портит.
 *
 * Чувствительности разные по природе. У облигации к ставке она измеряется:
 * срок до погашения умножается на изменение ставки. У акции — допущение из
 * политики, и так и подписано. К курсу привязано только то, что к нему
 * действительно привязано; про остальное сказано «не считается», а не
 * поставлен ноль: ноль означал бы знание, что связи нет.
 *
 * @param {object} state
 * @param {string} ticker
 * @param {{yields?:object}} ctx - измеренные доходности бумаг
 * @returns {object|null}
 */
function positionCard(state, ticker, ctx = {}) {
  const s = state.summary;
  if (!s || !(s.securities > 0)) return null;
  const pos = (state.positions || []).find(p => p.ticker === ticker && p.qty > 0);
  if (!pos) return null;

  const P = LIMITS;
  const value = positionValue(pos);
  const cost = positionCost(pos);
  const share = value / s.securities;
  const cls = allocationClass(pos);
  const sector = cls === 'stocks' ? sectorOf(pos) : null;

  // ВКЛАД В РИСК — сколько из общего штрафа приходится на эту бумагу.
  //
  // Первым делом я посчитал его иначе: насколько изменится индекс, если
  // бумагу убрать. Так вклад вышел ОТРИЦАТЕЛЬНЫМ у всех бумаг сразу, и
  // это не ошибка счёта, а негодное определение: изъятие любой позиции
  // уменьшает портфель, доли остальных механически растут, и портфель
  // «ухудшается». Получалось, что даже бумага, вылезшая за предел доли,
  // числится снижающей риск. Считаем прямо: штраф тех мер, в которых
  // виновата именно она.
  const riskNow = riskIndex(state);
  let riskAdd = null;
  if (riskNow) {
    const maxScore = riskNow.checks.filter(c => !c.skip).reduce((a, c) => a + c.weight, 0);
    const over = (v, limit) => (v > limit ? Math.min(1, (v - limit) / limit) : 0);
    let own = 0;
    const posCheck = riskNow.checks.find(c => c.id === 'position');
    if (posCheck) own += posCheck.weight * over(share, P.singlePosition);
    const secCheck = riskNow.checks.find(c => c.id === 'sector');
    if (secCheck && sector && s.bySector) {
      const secShare = (s.bySector[sector] || 0) / s.securities;
      // Доля этой бумаги в перекосе своего сектора — по её весу внутри него.
      const inSector = secShare > 0 ? share / secShare : 0;
      own += secCheck.weight * over(secShare, P.sectorMax) * inSector;
    }
    riskAdd = maxScore > 0 ? Math.round((own / maxScore) * 100) / 10 : 0;
  }

  // Разнообразие: доля своего сектора и сколько её съедает эта бумага.
  const sectorShare = sector && s.bySector ? (s.bySector[sector] || 0) / s.securities : null;

  // ЧУВСТВИТЕЛЬНОСТИ
  const S = LIMITS.stress;
  const rate = cls === 'bonds'
    ? { known: true, measured: Number(pos.yearsLeft) > 0,
        pct: -(Number(pos.yearsLeft) > 0 ? Number(pos.yearsLeft) : S.bondDuration) * P.sensitivityStep,
        note: Number(pos.yearsLeft) > 0
          ? `срок до погашения ${dec1(pos.yearsLeft)} лет`
          : `срок неизвестен, взят типичный ${S.bondDuration} года` }
    : cls === 'stocks'
      ? { known: true, measured: false, pct: -S.rateStockBeta * P.sensitivityStep, note: 'допущение: точной связи не измерить' }
      : { known: false, pct: null, note: 'к ставке напрямую не привязано' };

  const fx = cls === 'hedge'
    ? { known: true, measured: true, pct: 1 / (1 - P.sensitivityStep) - 1, note: 'цена золота назначается в валюте' }
    // Ноль здесь означал бы знание, что связи нет. Мы её просто не измеряли.
    : { known: false, pct: null, note: 'связь с курсом не измерена — у каждой компании своя' };

  const y = Number(ctx.yields?.[ticker]) || 0;
  const income = y > 0 ? netOfTax(value * y, state.settings) : null;

  // РОЛЬ. Из класса и измеренной доходности, а не из названия бумаги.
  const role = cls === 'hedge' ? 'защита'
    : cls === 'bonds' ? 'доход'
    : y >= (Number(state.settings?.marketYield) || LIMITS.marketYield) ? 'доход' : 'рост';

  // ВЕРДИКТ. Порядок важен: сначала то, что нарушает правило, потом то, что
  // его недобирает. Иначе бумага за пределом доли получала бы «докупить».
  const targets = state.targets || {};
  const classShare = (s.byClass?.[cls] || 0) / s.securities;
  const classGap = (targets[cls] || 0) - classShare;
  let verdict, why;
  const overBy = value - P.singlePosition * s.securities;
  if (share > P.singlePosition) {
    verdict = 'сократить';
    why = `Доля ${pct(share)} при пределе ${pct(P.singlePosition)} — это ${money(overBy)} сверх него.`
      + ` Продавать не обязательно: перекос уходит сам, если следующие взносы идти будут мимо этой бумаги.`;
  } else if (Number(pos.payoutAgeDays) > P.payout.stopped) {
    verdict = 'заменить';
    why = `Выплат нет ${Math.round(pos.payoutAgeDays / 30)} месяцев — дольше года.`
      + ` Доводы, по которым бумага покупалась ради выплат, исчезли.`;
  } else if (classGap > P.classGapWorth && share < P.singlePosition * P.headroomShare) {
    const room = P.singlePosition * s.securities - value;
    verdict = 'докупить';
    why = `${classLabel(cls)} недобирают ${pct(classGap)} до цели, а до предела на бумагу`
      + ` здесь ещё ${money(room)}.`;
  } else {
    verdict = 'держать';
    why = `Доля ${pct(share)} в пределах нормы, класс отклоняется от цели на ${pct(Math.abs(classGap))}.`
      + ` Действий не требуется — это тоже решение.`;
  }

  return {
    ticker, name: pos.name || ticker, cls, role,
    qty: pos.qty, price: pos.price, avgPrice: pos.avgPrice,
    value, cost, profit: value - cost, profitPct: cost > 0 ? (value - cost) / cost : 0,
    share, income, riskAdd, riskNow: riskNow ? riskNow.score : null,
    sector, sectorShare, rate, fx,
    verdict, why
  };
}

/**
 * ПРИ ЧЁМ СОВЕТ ОКАЗАЛСЯ БЫ ОШИБКОЙ.
 *
 * Совет, который нельзя опровергнуть, — не совет, а мнение: что бы ни
 * случилось, задним числом он окажется прав. Поэтому у каждого действия
 * называется условие ошибки, и притом ЧИСЛОМ, которое человек может
 * проверить сам через месяц, а не оговоркой «при неблагоприятном развитии
 * событий». Оговорка защищает автора совета; число защищает читателя.
 *
 * Возвращается текст без разметки: экранирует тот, кто рисует.
 *
 * @param {object} state
 * @param {object|null} option - выбранный вариант из rankActions
 * @param {{yields?:object}} ctx - фактические доходности бумаг, если измерены
 * @returns {Array<{id:string, text:string}>} не больше трёх условий
 */
function whenWrong(state, option, ctx = {}) {
  if (!option || !option.plan || !state?.summary) return [];
  const out = [];
  const P = LIMITS;
  const s = state.summary;
  const steps = (option.plan.steps || []).filter(t => t.ticker);
  // Считаем по ФАКТИЧЕСКИ потраченному: бумага покупается лотами, и остаток
  // на счёт. Считать по выделенной сумме значило бы завысить и запас, и поток.
  const spentOn = t => (t.lots > 0 ? t.lots * (t.price || 0) : 0);
  const spent = steps.reduce((a, t) => a + spentOn(t), 0);
  const totalAfter = s.securities + spent;

  // 1. ЗАПАС ДО ПРЕДЕЛА — в рублях и от доли ПОСЛЕ покупки. Доля до покупки
  //    здесь бесполезна: решение принимается о будущем состоянии.
  const main = steps.slice().sort((a, b) => spentOn(b) - spentOn(a))[0];
  if (main) {
    const held = (state.positions || [])
      .filter(p => p.ticker === main.ticker && p.qty > 0)
      .reduce((a, p) => a + positionValue(p), 0);
    const after = held + spentOn(main);
    const room = P.singlePosition * totalAfter - after;
    out.push({ id: 'headroom', text: room >= 0
      ? `${main.name || main.ticker}: до предела ${Math.round(P.singlePosition * 100)}% на бумагу`
        + ` останется ещё ${Math.round(room).toLocaleString('ru-RU')} ₽. Если вкладывать в неё больше,`
        + ` совет становится неверным.`
      : `${main.name || main.ticker}: предел ${Math.round(P.singlePosition * 100)}% на бумагу будет`
        + ` превышен на ${Math.round(-room).toLocaleString('ru-RU')} ₽. Если такой перекос неприемлем,`
        + ` этот вариант неверен — дробить покупку или добавить новую бумагу.` });
  }

  // 2. ПОТОК — после налога, а не брутто: до счёта доходит именно эта сумма.
  const yields = ctx.yields || {};
  let gain = 0;
  for (const t of steps) {
    const y = Number(yields[t.ticker]);
    if (y > 0) gain += spentOn(t) * y;
  }
  if (gain > 0) {
    const net = netOfTax(gain, state.settings);
    out.push({ id: 'payout', text: `Прибавка к выплатам — ${Math.round(net).toLocaleString('ru-RU')} ₽`
      + ` в год после налога. Если выплаты урежут вдвое, останется`
      + ` ${Math.round(net / 2).toLocaleString('ru-RU')} ₽ — и довод в пользу этой покупки слабеет вдвое.` });
  }

  // 3. СРОК ИЛИ РЕЗЕРВ — что из двух опаснее сейчас. Больше трёх условий
  //    человек не читает, а нечитанное условие не защищает никого.
  const expenses = Number(state.settings?.monthlyExpenses) || 0;
  const months = expenses > 0 ? (Number(state.reserve) || 0) / expenses : null;
  if (months != null && months < P.reserveMonths) {
    out.push({ id: 'reserve', text: `Подушка ${dec1(months)} мес расходов при цели`
      + ` ${P.reserveMonths} мес. Если деньги понадобятся раньше, взнос правильнее`
      + ` направить в резерв, а не в бумаги.` });
  } else {
    const years = Number(state.settings?.goal?.years) || 0;
    out.push({ id: 'horizon', text: years > 0
      ? `Расчёт исходит из ${years} лет до цели. Если деньги понадобятся раньше — покупать бумаги неверно.`
      : `Расчёт исходит из срока в 1 год и дольше. Если деньги понадобятся раньше — покупать бумаги неверно.` });
  }

  return out.slice(0, 3);
}

/**
 * КРАСНЫЕ ФЛАГИ — то, что требует внимания сегодня.
 *
 * Флаг ставится только по измеренному. Если величины нет, флага нет — но и
 * молчания нет: неизвестное так и называется неизвестным. Придумать число
 * ради красивого списка значило бы соврать в самом опасном месте.
 *
 * @param {object} state
 * @param {{yield?:number}} ctx - фактическая доходность портфеля, если измерена
 * @returns {Array<{id:string,title:string,detail:string,severity:string}>}
 */
function redFlags(state, ctx = {}) {
  const out = [];
  const s = state.summary;
  if (!s || !(s.securities > 0)) return out;
  const P = LIMITS;
  const risk = riskIndex(state);
  const expenses = Number(state.settings?.monthlyExpenses) || 0;

  if (risk) {
    for (const c of risk.checks) {
      if (c.skip || !(c.hurt > 0)) continue;
      out.push({ id: c.id, title: c.title, detail: `${c.value} при норме ${c.norm}`,
                 severity: c.hurt >= 0.5 ? 'высокая' : 'средняя' });
    }
  }

  // Подушка. Резерв лежит вне брокерского счёта, поэтому это отдельная мера,
  // а не та же, что свободные деньги.
  if (expenses > 0) {
    const months = (Number(state.reserve) || 0) / expenses;
    if (months < 1) {
      out.push({ id: 'reserve', title: 'Подушка на чёрный день',
        detail: `${dec1(months)} мес расходов при цели ${P.reserveMonths} мес`,
        severity: months < 0.5 ? 'высокая' : 'средняя' });
    }
  }

  // Реальная доходность: номинальная минус инфляция, по формуле, а не
  // вычитанием. Без измеренной доходности флаг не ставится вовсе.
  const nominal = Number(ctx.yield);
  const infl = Number(state.settings?.inflation) || 0;
  if (nominal > 0 && infl > 0) {
    const real = (1 + nominal) / (1 + infl) - 1;
    if (real < 0) {
      out.push({ id: 'real', title: 'Доход не обгоняет инфляцию',
        detail: `${pct(nominal)} годовых при инфляции ${pct(infl)} — это ${pct(real)} настоящего роста`,
        severity: 'высокая' });
    }
  }

  const order = { 'высокая': 0, 'средняя': 1 };
  return out.sort((a, b) => (order[a.severity] ?? 9) - (order[b.severity] ?? 9));
}

/**
 * ИНВЕСТИЦИОННЫЙ КОМИТЕТ — сводка на сегодня.
 *
 * Про «рынок позитивный или негативный» здесь сознательно ничего нет.
 * Данных, чтобы судить о направлении рынка, у приложения не появится: это
 * было бы предсказание, а приложение считает только проверяемое. Вместо
 * этого — УСЛОВИЯ: во что сейчас обходятся деньги и что приносят бумаги.
 * Это арифметика, а не прогноз, и решение из неё следует честно.
 *
 * Уверенность — тоже измеримая величина: доля входных данных, которые
 * известны, а не угаданы. Низкая уверенность не повод молчать, но повод
 * сказать, чего не хватает.
 *
 * @param {object} state
 * @param {{yield?:number, best?:object, flags?:Array}} ctx
 */
function investmentCommittee(state, ctx = {}) {
  const s = state.summary;
  if (!s || !(s.securities > 0)) return null;
  const set = state.settings || {};
  const risk = riskIndex(state);
  const flags = ctx.flags || redFlags(state, ctx);

  // УСЛОВИЯ — из двух измеренных чисел, без предсказаний.
  const rate = set.keyRate && set.keyRate.rate > 0 ? set.keyRate.rate / 100 : null;
  const income = Number(ctx.yield) > 0 ? Number(ctx.yield) : null;
  let conditions = 'Условия не назвать: ключевая ставка неизвестна.';
  if (rate != null && income != null) {
    conditions = income >= rate
      ? `Бумаги приносят ${pct(income)} годовых, деньги стоят ${pct(rate)} — портфель обгоняет ставку.`
      : `Деньги стоят ${pct(rate)} годовых, бумаги приносят ${pct(income)} — вклад и денежный рынок`
        + ` сейчас конкурируют с портфелем. Это не повод продавать: ставка меняется, а состав портфеля`
        + ` рассчитан на годы.`;
  } else if (rate != null) {
    conditions = `Деньги стоят ${pct(rate)} годовых. Доходность портфеля ещё не измерена —`
      + ` сравнить не с чем.`;
  }

  // УВЕРЕННОСТЬ — доля известного среди того, что нужно для выводов.
  const known = [
    { id: 'prices', ok: !!set.lastPriceUpdate, what: 'свежие цены' },
    { id: 'broker', ok: !!set.tiSyncedAt, what: 'журнал от брокера' },
    { id: 'expenses', ok: Number(set.monthlyExpenses) > 0, what: 'месячные расходы' },
    { id: 'rate', ok: rate != null, what: 'ключевая ставка' },
    { id: 'income', ok: income != null, what: 'доходность бумаг' }
  ];
  const share = known.filter(k => k.ok).length / known.length;
  const missing = known.filter(k => !k.ok).map(k => k.what);

  return {
    conditions,
    risk: risk ? { score: risk.score, band: risk.band, top: risk.top[0] || null } : null,
    // Возможность — та мера, которую выбранное действие улучшает сильнее
    // всех. Если действия нет, выдумывать возможность не из чего.
    opportunity: ctx.best && ctx.best.reasons
      ? (ctx.best.reasons.find(r => r.better) || null) : null,
    action: ctx.best || null,
    flags,
    confidence: {
      level: share >= 0.8 ? 'высокая' : share >= 0.5 ? 'средняя' : 'низкая',
      missing,
      // Чего не хватает — важнее самой оценки: это единственное, что можно
      // исправить, чтобы выводы стали крепче.
      note: missing.length ? `Не хватает: ${missing.join(', ')}.` : 'Все нужные данные на месте.'
    }
  };
}

/**
 * ПОЧЕМУ РИСК ИЗМЕНИЛСЯ — СЛОВАМИ.
 *
 * Число «было 2,0, стало 1,7» говорит что, но не почему. Человек не обязан
 * держать в голове пять мер и вычитать их одну из другой: назвать причину —
 * работа приложения, а не читателя.
 *
 * @param {object|null} before - риск-индекс до
 * @param {object|null} after - риск-индекс после
 * @returns {string|null}
 */
function explainRiskChange(before, after) {
  if (!before || !after) return null;
  const was = new Map(before.checks.map(c => [c.id, c.weight * c.hurt]));
  const moved = after.checks
    .map(c => ({ title: c.title.toLowerCase(), diff: c.weight * c.hurt - (was.get(c.id) || 0) }))
    .filter(x => Math.abs(x.diff) > 1e-4)
    .sort((a, b) => Math.abs(b.diff) - Math.abs(a.diff));

  if (!moved.length) return 'риск не изменился: ни одна из мер не сдвинулась';
  const total = after.score - before.score;
  const dir = total < 0 ? 'снизился' : total > 0 ? 'вырос' : 'не изменился';
  // Причину ищем среди мер, сдвинувшихся В ТУ ЖЕ сторону, что и итог.
  // Самая крупная подвижка бывает противоположной, и тогда выходило
  // «снизился, потому что ухудшилась мера» — фраза, спорящая сама с собой.
  const sameWay = moved.filter(x => (x.diff < 0) === (total < 0));
  const main = sameWay[0] || moved[0];
  const cause = main.diff < 0 ? `улучшилась мера «${main.title}»` : `ухудшилась мера «${main.title}»`;
  // Если что-то двигалось и в другую сторону, об этом надо сказать: иначе
  // объяснение выглядит полнее, чем оно есть.
  const against = moved.length - sameWay.length;
  const rest = against > 0
    ? `, хотя ${against === 1 ? 'одна мера сдвинулась' : `мер сдвинулось против: ${against}`} в обратную сторону`
    : (moved.length > 1 ? `, всего сдвинулось мер: ${moved.length}` : '');
  return `${dir}, потому что ${cause}${rest}`;
}

/**
 * ЭФФЕКТ ПЛАНА: «было → станет».
 *
 * Совет без последствия — это мнение. Человеку нужно видеть, что именно
 * изменится, иначе сравнить два решения он не может и вынужден верить на
 * слово. Поэтому план применяется к копии портфеля и обе картины считаются
 * одним и тем же кодом: доли, риск-индекс, свободные деньги.
 *
 * Считается только то, что известно наверняка: доли, риск, деньги на счёте.
 * Ни вероятность цели, ни будущий доход сюда не идут — один взнос двигает
 * их на доли процента, и показывать такое движение значило бы выдавать шум
 * за результат.
 *
 * @param {object} state - состояние портфеля
 * @param {{amount:number, steps:Array<object>}} plan - раскладка взноса
 * @returns {{before:object, after:object, changes:Array<object>}|null}
 */
/**
 * Применить план к копии портфеля. Вынесено отдельно, потому что сравнивать
 * варианты между собой можно только одним и тем же кодом: два похожих
 * расчёта «после» разъедутся при первой же правке, и сравнение станет
 * сравнением ошибок, а не решений.
 *
 * @param {object} state - состояние портфеля
 * @param {{amount:number, steps:Array<object>}} plan
 * @returns {{state:object, spent:number}|null}
 */
function applyPlan(state, plan) {
  const s = state && state.summary;
  if (!s || !plan || !Array.isArray(plan.steps) || !(s.securities > 0)) return null;

  const byClass = { ...(s.byClass || {}) };
  const bySector = { ...(s.bySector || {}) };
  const values = {};
  for (const p of (state.positions || [])) {
    if (p.qty > 0) values[p.ticker] = (values[p.ticker] || 0) + positionValue(p);
  }
  let spent = 0;
  for (const t of plan.steps) {
    // Тратится не весь взнос: бумага покупается лотами, остаток на счёт.
    const sum = t.lots != null && t.lots > 0 ? t.lots * (t.price || 0) : 0;
    if (!(sum > 0)) continue;
    spent += sum;
    byClass[t.cls] = (byClass[t.cls] || 0) + sum;
    if (t.ticker) values[t.ticker] = (values[t.ticker] || 0) + sum;
    const sec = t.cls === 'stocks' ? sectorOf({ ticker: t.ticker, name: t.name, kind: 'stock' }) : null;
    if (sec) bySector[sec] = (bySector[sec] || 0) + sum;
  }
  if (!(spent > 0)) return null;

  const securities = s.securities + spent;
  const shares = {};
  for (const [ticker, v] of Object.entries(values)) shares[ticker] = v / securities;
  return {
    spent,
    state: { ...state,
      summary: { ...s, securities, byClass, bySector, shares,
                 cash: (s.cash || 0) + (plan.amount - spent) } }
  };
}

function planEffect(state, plan) {
  const s = state && state.summary;
  if (!s || !plan || !Array.isArray(plan.steps) || !(s.securities > 0)) return null;

  // Картина «после» считается общим кодом — тем же, каким сравниваются
  // варианты между собой. Своя копия расчёта здесь однажды разъехалась бы
  // с той, и «до/после» показывало бы разницу двух ошибок.
  const applied = applyPlan(state, plan);
  if (!applied) return null;
  const after = applied.state, spent = applied.spent;
  const { byClass, securities } = { byClass: after.summary.byClass, securities: after.summary.securities };

  const riskBefore = riskIndex(state);
  const riskAfter = riskIndex(after);
  const part = (sum, total) => (total > 0 ? (sum || 0) / total : 0);

  const changes = [
    { id: 'risk', title: 'Риск-индекс',
      from: riskBefore ? riskBefore.score : null, to: riskAfter ? riskAfter.score : null,
      fmt: v => (v == null ? '—' : dec1(v)) },
    { id: 'stocks', title: 'Акции',
      from: part(s.byClass?.stocks, s.securities), to: part(byClass.stocks, securities), fmt: pct },
    { id: 'bonds', title: 'Облигации',
      from: part(s.byClass?.bonds, s.securities), to: part(byClass.bonds, securities), fmt: pct },
    { id: 'hedge', title: 'Защитные активы',
      from: part(s.byClass?.hedge, s.securities), to: part(byClass.hedge, securities), fmt: pct },
    { id: 'cash', title: 'Свободные деньги',
      from: s.cash || 0, to: after.summary.cash, fmt: money }
  ];

  return { before: riskBefore, after: riskAfter, spent, changes };
}

/**
 * МЕРЫ ВАРИАНТА. Шесть величин, у каждой известно направление «лучше».
 * Считаются одним кодом для всех вариантов — иначе сравнение превращается
 * в сравнение расчётных ошибок.
 *
 * @param {object} st - состояние (до или после действия)
 * @param {object} ctx - цель и доходности бумаг для денежного потока
 */
function actionMetrics(st, ctx) {
  const s = st.summary, total = s.securities || 0;
  const risk = riskIndex(st);
  const shares = s.shares || {};
  let top = 0;
  for (const v of Object.values(shares)) if (v > top) top = v;

  // Отклонение от целевой структуры: сумма расхождений по трём классам.
  const targets = st.targets || {};
  let drift = 0;
  for (const cls of ['stocks', 'bonds', 'hedge']) {
    const have = total > 0 ? (s.byClass?.[cls] || 0) / total : 0;
    drift += Math.abs(have - (targets[cls] || 0));
  }

  // Денежный поток после налога: по фактическим доходностям бумаг.
  let income = 0;
  for (const [ticker, share] of Object.entries(shares)) {
    const y = ctx.yields ? ctx.yields[ticker] : null;
    if (y > 0) income += share * total * y;
  }

  return {
    risk: risk ? risk.score : 0,
    top,
    drift,
    hedge: total > 0 ? (s.byClass?.hedge || 0) / total : 0,
    income: netOfTax(income, st.settings),
    // Дефицит до цели: чем больше денег работает, тем он меньше.
    gap: Math.max(0, (ctx.goal || 0) - (total + (s.cash || 0)))
  };
}

// Направление «лучше» у каждой меры. Ниже — значит меньше лучше.
const METRIC_DIRS = { risk: -1, top: -1, drift: -1, hedge: 1, income: 1, gap: -1 };
const METRIC_TITLES = { risk: 'риск', top: 'крупнейшая позиция', drift: 'отклонение от структуры',
                        hedge: 'защитные активы', income: 'доход после налогов', gap: 'дефицит до цели' };

/**
 * РАНЖИРОВАНИЕ ДЕЙСТВИЙ БЕЗ ВЕСОВ.
 *
 * Веса вида «0,4 за риск и 0,3 за структуру» выглядят наукой, но берутся с
 * потолка: обосновать, почему именно 0,4, невозможно, а результат от них
 * зависит целиком. Поэтому здесь другой порядок.
 *
 * 1. Запреты. Вариант отбрасывается, если поднимает риск, усиливает
 *    нарушение предела доли или оставляет меньше денег, чем на месяц
 *    расходов. Это не «минус баллы», а отказ: такие действия не должны
 *    попадать в советы вовсе.
 * 2. Доминирование. Вариант А лучше Б, если не хуже ни по одной мере и
 *    лучше хотя бы по одной. Здесь веса не нужны в принципе.
 * 3. Когда никто никого не превосходит — берётся тот, кто улучшает БОЛЬШЕ
 *    мер одновременно. Ничьи разрешаются объявленным порядком, а не
 *    случайностью: при равных вариантах ответ обязан быть одинаковым.
 *
 * @param {Array<{id:string,title:string,plan:object,note?:string}>} options
 * @returns {{best:object|null, ranked:Array<object>, rejected:Array<object>}}
 */
function rankActions(state, options, ctx = {}) {
  const before = actionMetrics(state, ctx);
  const P = LIMITS;
  const expenses = Number(state.settings?.monthlyExpenses) || 0;
  const scored = [];
  const rejected = [];

  for (const opt of options) {
    const applied = applyPlan(state, opt.plan);
    if (!applied) { rejected.push({ ...opt, why: 'покупать нечего' }); continue; }
    const after = actionMetrics(applied.state, ctx);

    // ЗАПРЕТЫ
    let veto = null;
    if (after.risk > before.risk + P.riskNoise) veto = `риск вырос с ${dec1(before.risk)} до ${dec1(after.risk)}`;
    else if (after.top > before.top && after.top > P.singlePosition) {
      veto = `доля крупнейшей бумаги растёт за предел ${pct(P.singlePosition)}: ${pct(after.top)}`;
    } else if (expenses > 0 && applied.state.summary.cash < expenses * P.cashMinMonths
               && applied.state.summary.cash < state.summary.cash) {
      veto = 'на счёте останется меньше, чем было, и меньше месяца расходов';
    }
    if (veto) { rejected.push({ ...opt, why: veto, before, after }); continue; }

    const improved = [], worsened = [];
    for (const [key, dir] of Object.entries(METRIC_DIRS)) {
      const diff = (after[key] - before[key]) * dir;
      // Порог значимости: движение меньше сотой доли процента — шум, и
      // называть его улучшением значило бы выдавать шум за результат.
      if (diff > 1e-4) improved.push(key);
      else if (diff < -1e-4) worsened.push(key);
    }
    scored.push({ ...opt, before, after, improved, worsened, spent: applied.spent });
  }

  const dominates = (a, b) => {
    let better = false;
    for (const [key, dir] of Object.entries(METRIC_DIRS)) {
      const d = (a.after[key] - b.after[key]) * dir;
      if (d < -1e-4) return false;
      if (d > 1e-4) better = true;
    }
    return better;
  };

  const ranked = scored.slice().sort((a, b) => {
    if (dominates(a, b)) return -1;
    if (dominates(b, a)) return 1;
    if (b.improved.length !== a.improved.length) return b.improved.length - a.improved.length;
    if (a.worsened.length !== b.worsened.length) return a.worsened.length - b.worsened.length;
    // Объявленная развязка ничьих: сначала меньший риск, потом меньшая
    // концентрация, и в самом конце — имя. Случайности здесь быть не должно.
    if (Math.abs(a.after.risk - b.after.risk) > 1e-4) return a.after.risk - b.after.risk;
    if (Math.abs(a.after.top - b.after.top) > 1e-4) return a.after.top - b.after.top;
    return String(a.id).localeCompare(String(b.id));
  });

  const best = ranked[0] || null;
  if (best) {
    best.reasons = [
      ...best.improved.map(k => ({ key: k, title: METRIC_TITLES[k],
        from: before[k], to: best.after[k], better: true })),
      ...best.worsened.map(k => ({ key: k, title: METRIC_TITLES[k],
        from: before[k], to: best.after[k], better: false }))
    ];
  }
  return { best, ranked, rejected };
}

/**
 * Главный совет — ответ на вопрос «что делать сегодня».
 * Возвращает один приоритетный шаг, а не список из двадцати.
 */
function primaryAction(state, summary) {
  const targets = STRATEGIES[state.strategy]?.targets || STRATEGIES.balance.targets;

  // Пустой портфель — не повод хвалить. Говорим, с чего начать.
  if (!summary.positions) {
    return {
      id: 'start',
      urgency: 'info',
      title: 'Начни со сверки с брокером',
      detail: 'Открой портфель в приложении брокера, скопируй список бумаг и вставь сюда — приложение само разберёт состав, количества и цены. Вводить руками почти ничего не придётся.',
      action: { type: 'sync' }
    };
  }

  // Данных о тебе нет — советы будут пустыми, скажем об этом прямо.
  if (!state.reserve?.monthlyExpenses && !state.goal?.amount) {
    return {
      id: 'setup',
      urgency: 'info',
      title: 'Расскажи о себе — тогда советы станут полезными',
      detail: `Портфель на ${Math.round(summary.total).toLocaleString('ru-RU')} ₽ загружен. Осталось три вопроса: сколько тратит семья в месяц, сколько откладываешь и на что копишь. Без этого приложение не может сказать, хватает ли резерва и успеваешь ли к цели.`,
      action: { type: 'setup' }
    };
  }

  const steps = allSteps(state, summary, targets);
  return steps[0] || {
    id: 'steady',
    urgency: 'ok',
    title: 'Всё идёт по плану',
    detail: 'Портфель собран, доли в норме, резерв на месте. Лучшее действие сейчас — не делать ничего лишнего и продолжать регулярные пополнения.',
    action: null
  };
}

/** Все актуальные шаги, отсортированные по важности. */
function allSteps(state, summary, targets) {
  const steps = [];
  const t = targets || STRATEGIES[state.strategy]?.targets || STRATEGIES.balance.targets;

  // ── 1. Резерв: фундамент, но не ультиматум
  const reserve = state.reserve || {};
  const monthly = Number(reserve.monthlyExpenses) || 0;
  if (monthly > 0) {
    const goal = monthly * LIMITS.reserveMonths;
    const have = Number(reserve.balance) || 0;
    if (have < goal) {
      const hasMonth = have >= monthly;
      const contribution = Number(state.settings?.monthlyContribution) || 0;
      const half = Math.round(contribution / 2);
      const monthsLeft = half > 0 ? Math.ceil((goal - have) / half) : null;

      steps.push({
        id: 'reserve',
        urgency: hasMonth ? 'attention' : 'critical',
        title: hasMonth
          ? `Резерв ${pct(have / goal)} — дели взнос пополам`
          : 'Сначала резерв: он важнее доходности',
        detail: hasMonth
          ? `Отложено ${money(have)} из ${money(goal)} (три месяца расходов). У тебя закрыт ${dec1(have / monthly)} месяц — от бытовых неожиданностей защищён, но не от потери дохода. ${half > 0 ? `План: ${money(half)}/мес в резерв и столько же в рынок — закроешь за ${monthsLeft} мес, не останавливая инвестиции.` : ''}`
          : `Отложено ${money(have)} при расходах ${money(monthly)}/мес. Без резерва любая неожиданность заставит продавать бумаги в неподходящий момент — а это худший способ терять деньги.`,
        action: { type: 'reserve' },
        numbers: { have, goal, monthly }
      });
    }
  }

  // ── 2. Свободные деньги не работают
  const cash = Number(state.cash) || 0;
  if (cash >= 3000 && summary.securities > 0) {
    const plan = allocate(cash, summary, t);
    if (plan.length) {
      const top = plan[0];
      steps.push({
        id: 'idle-cash',
        urgency: 'attention',
        title: `${money(cash)} лежат без дела`,
        detail: `Сильнее всего не хватает: ${classLabel(top.cls)} — ${pct(top.currentShare)} при цели ${pct(top.targetShare)}. Разложить стоит так: ${plan.map(p => `${classLabel(p.cls)} ${money(p.sum)}`).join(', ')}.`,
        action: { type: 'allocate', amount: cash, plan },
        numbers: { cash, plan }
      });
    }
  }

  // ── 3. Перекос по классам (правило 5/25).
  // Класс hedge исключён: о нём говорит отдельный, более содержательный совет ниже —
  // иначе пользователь видит одно и то же дважды разными словами.
  const needRebalance = checkRebalance(summary, t).filter(r => r.cls !== 'hedge');
  if (needRebalance.length) {
    const worst = needRebalance[0];
    steps.push({
      id: 'rebalance',
      urgency: 'attention',
      title: `${classLabel(worst.cls)}: ${pct(worst.actual)} вместо ${pct(worst.target)}`,
      detail: worst.actual > worst.target
        ? `Перевес на ${Math.round((worst.actual - worst.target) * 100)} п.п. Продавать не нужно — просто направляй новые взносы в другие классы, доля выровняется сама.`
        : `Недобор на ${Math.round((worst.target - worst.actual) * 100)} п.п. Это ${worst.actual < worst.target * 0.5 ? 'существенно' : 'заметно'} ниже плана — направь туда ближайшие покупки.`,
      action: { type: 'rebalance' },
      numbers: needRebalance
    });
  }

  // ── 4. Концентрация в одной бумаге
  for (const a of state.assets.filter(x => Number(x.qty) > 0)) {
    const share = positionValue(a) / (summary.securities || 1);
    if (share > LIMITS.singlePosition) {
      const isGov = classify(a) === KIND.BOND && /^SU\d|ОФЗ/i.test(`${a.ticker}${a.name}`);
      steps.push({
        id: 'concentration:' + a.ticker,
        urgency: isGov ? 'info' : 'attention',
        title: `${a.name || a.ticker} — ${pct(share)} портфеля`,
        detail: isGov
          ? `${money(positionValue(a))} из ${money(summary.securities)} — это госдолг, риск не в банкротстве, а в чувствительности к ставке ЦБ. Ставка вверх — тело дешевеет, вниз — дорожает. Продавать не нужно: выравнивай взносами в другие классы.`
          : `${money(positionValue(a))} из ${money(summary.securities)} — больше ${pct(LIMITS.singlePosition)} в одной компании. Портфель зависит от её новостей: одна плохая отчётность ударит по всему капиталу.`,
        action: { type: 'position', ticker: a.ticker },
        numbers: { share, limit: LIMITS.singlePosition }
      });
    }
  }

  // ── 5. Отсутствие защиты
  const hedgeShare = summary.hedgeValue / (summary.securities || 1);
  if (t.hedge > 0 && hedgeShare < t.hedge * 0.5 && summary.securities > 30000) {
    steps.push({
      id: 'no-hedge',
      urgency: 'attention',
      title: `Защита ${pct(hedgeShare)} при цели ${pct(t.hedge)}`,
      detail: `Защитные активы (золото, валютные инструменты) растут, когда падает рынок или слабеет рубль. При обвале на 30% портфель без защиты теряет заметно больше. Сейчас у тебя ${summary.hedgeValue > 0 ? money(summary.hedgeValue) : 'их нет'}.`,
      action: { type: 'allocate', cls: 'hedge' },
      numbers: { current: hedgeShare, target: t.hedge }
    });
  }

  // ── 6. Расхождение с брокером: свободных денег подозрительно много
  const cashShare = summary.total > 0 ? cash / summary.total : 0;
  if (cash > 20000 && cashShare > 0.25) {
    steps.push({
      id: 'cash-mismatch',
      urgency: 'attention',
      title: `Свободных денег ${pct(cashShare)} — похоже на пропущенную покупку`,
      detail: `На счёте числится ${money(cash)} при портфеле ${money(summary.securities)}. Столько денег редко держат без дела — скорее всего, часть сделок не записана. Нажми «Сверить» и вставь список из приложения брокера: приложение само найдёт расхождение и подгонит остаток.`,
      action: { type: 'sync' },
      numbers: { cash, share: cashShare }
    });
  }

  const order = { critical: 0, attention: 1, info: 2, ok: 3 };
  return steps.sort((a, b) => order[a.urgency] - order[b.urgency]);
}

function checkRebalance(summary, targets) {
  const out = [];
  if (!summary.securities) return out;
  for (const [cls, target] of Object.entries(targets)) {
    const actual = (summary.byClass[cls] || 0) / summary.securities;
    const abs = Math.abs(actual - target);
    const rel = target > 0 ? abs / target : 0;
    if (abs > LIMITS.rebalanceAbs || rel > LIMITS.rebalanceRel) {
      out.push({ cls, actual, target, abs, rel });
    }
  }
  return out.sort((a, b) => b.rel - a.rel);
}

function classLabel(cls) {
  return { stocks: 'Акции', bonds: 'Облигации', hedge: 'Защита' }[cls] || cls;
}

/** Налоговый вычет по ИИС с учётом прогрессивной шкалы НДФЛ. */
function taxDeduction(state) {
  const CAP = 400000;
  const year = new Date().getFullYear();
  const paid = (state.contributions || [])
    .filter(c => c.type === 'deposit' && !c.technical && String(c.date).startsWith(String(year)))
    .reduce((s, c) => s + (Number(c.amount) || 0), 0);

  const rate = Number(state.settings?.ndflRate) || 0.13;
  const base = Math.min(paid, CAP);
  return {
    year, paid, rate,
    refund: Math.round(base * rate),
    maxRefund: Math.round(CAP * rate),
    room: Math.max(0, CAP - paid),
    extraIfFilled: Math.round(Math.max(0, CAP - paid) * rate)
  };
}

/**
 * ЛИЧНЫЙ ИНВЕСТИЦИОННЫЙ УСТАВ (Investment Policy Statement).
 * Приём Vanguard и Bogleheads: правила записываются заранее и перечитываются
 * в момент паники — когда решать уже поздно, а следовать ещё можно.
 * Устав собирается из твоих настроек; пустые места называются пустыми.
 */
function policyStatement(state) {
  const strat = STRATEGIES[state.settings?.strategy] || STRATEGIES.balance;
  const t = strat.targets;
  const goal = state.settings?.goal || {};
  const monthly = Number(state.settings?.monthlyContribution) || 0;
  const expenses = Number(state.settings?.monthlyExpenses) || 0;
  const opened = state.settings?.iisOpenDate;
  let termDate = null;
  if (opened && /^\d{4}-\d{2}-\d{2}/.test(String(opened))) {
    const years = Number(state.settings?.iisTermYears) || 5;
    termDate = `${Number(opened.slice(0, 4)) + years}${opened.slice(4, 10)}`;
  }

  const out = [];
  out.push({ title: 'Цель', text: goal.amount > 0
    ? `${money(goal.amount)}${goal.years ? ` через ${goal.years} лет` : ''}. Всё остальное в этом уставе служит ей.`
    : 'Не задана. Задай её в настройках — без цели половина правил повисает в воздухе.' });
  out.push({ title: 'Доли', text: `Стратегия «${strat.name}»: акции ${Math.round(t.stocks * 100)}%, `
    + `облигации ${Math.round(t.bonds * 100)}%, защита ${Math.round(t.hedge * 100)}%.` });
  out.push({ title: 'Ребалансировка', text: `По правилу 5/25: класс возвращается к цели, когда ушёл на `
    + `${Math.round(LIMITS.rebalanceAbs * 100)} п.п. или на четверть от целевой доли. `
    + `В первую очередь — новыми взносами; продажа — крайний случай.` });
  out.push({ title: 'Лимиты риска', text: `Не больше ${Math.round(LIMITS.singlePosition * 100)}% в одной бумаге `
    + `и ${Math.round(LIMITS.sectorMax * 100)}% в одном секторе. Облигации — со сроком не длиннее цели.` });
  out.push({ title: 'Взнос', text: monthly > 0
    ? `${money(monthly)} в месяц, по расписанию, независимо от новостей и настроения рынка.`
    : 'Размер не задан. Регулярность важнее размера — задай посильный.' });
  out.push({ title: 'Резерв', text: expenses > 0
    ? `${money(expenses * LIMITS.reserveMonths)} — ${LIMITS.reserveMonths} месяца расходов, отдельно от портфеля. Пока не собран, он важнее инвестиций.`
    : 'Расходы не заданы — размер резерва не посчитать.' });
  out.push({ title: 'При обвале', text: 'План не меняется. Взнос по расписанию — упавшие цены это скидка. '
    + 'Резерв не трогается. Ничего не продаётся в день новости: любое решение о продаже — только по правилам выше и на холодную голову.' });
  if (termDate) out.push({ title: 'Срок ИИС', text: `Счёт держится минимум до ${termDate.split('-').reverse().join('.')}. `
    + `Досрочное закрытие — возврат вычетов и потеря льготы.` });
  out.push({ title: 'Пересмотр', text: 'Раз в год или при перемене жизни: доход, семья, сама цель. '
    + 'Движение рынка — не повод менять устав.' });
  return out;
}

/**
 * Что купить: пересечение отбора с тем, чего портфелю не хватает.
 * Никаких предсказаний роста — только недобор класса и измеримые данные
 * бумаги. Если класс уже с перевесом, честно говорится, что покупать
 * его сейчас незачем, вместо услужливой пятёрки «идей».
 */
function buyRecommendations(state, screenerResults, limit = 5) {
  const rows = (screenerResults || []).filter(r => r && r.ticker);
  if (!rows.length) return { need: null, items: [], note: 'Отбор ничего не вернул — смягчи условия.' };

  const s = state.summary, targets = state.targets || {};
  const need = [];
  if (s && s.securities > 0) {
    for (const cls of ['stocks', 'bonds', 'hedge']) {
      const now = (s.byClass?.[cls] || 0) / s.securities;
      const gap = (targets[cls] || 0) - now;
      if (gap > 0.02) need.push({ cls, gap, sum: Math.round(gap * s.securities) });
    }
    need.sort((a, b) => b.gap - a.gap);
  }
  const wantClass = need.length ? need[0].cls : null;
  const kindOf = r => (r.kind === 'bond' ? 'bonds' : 'stocks');

  let items = rows;
  let note;
  if (wantClass === 'hedge') {
    note = 'Сильнее всего не хватает защитных активов — а их отбор по выплатам не ищет: у золота выплат нет. '
      + 'Смотри фонды на золото отдельно; ниже — лучшее из того, что нашлось по твоим условиям.';
  } else if (wantClass) {
    const matching = rows.filter(r => kindOf(r) === wantClass);
    if (matching.length) {
      items = matching;
      // ДВА РАЗНЫХ ЧИСЛА ОДНИМИ СЛОВАМИ. Здесь — недобор при нынешнем
      // размере портфеля. В совете «докупить» — сумма, после которой доля
      // СТАНЕТ целевой; она больше примерно втрое, потому что покупка
      // увеличивает и сам портфель. Обе величины верные, но на соседних
      // экранах оба назывались «до плана», и разница читалась как ошибка.
      // Доля класса после покупки: (было + x) / (портфель + x) = цель.
      // Отсюда x = недобор / (1 − цель).
      const wantTarget = targets[wantClass] || 0;
      const toBuy = need[0].sum > 0 && wantTarget < 1
        ? Math.round(need[0].sum / (1 - wantTarget)) : 0;
      note = `Сильнее всего не хватает: ${classLabel(wantClass)} — ${need[0].sum.toLocaleString('ru-RU')} \u20bd `
        + `до целевой доли при нынешнем размере портфеля`
        + (toBuy > need[0].sum ? `; чтобы доля стала целевой после покупки, нужно ${toBuy.toLocaleString('ru-RU')} \u20bd` : '')
        + '. Показаны бумаги этого класса.';
    } else {
      note = `До плана не хватает ${classLabel(wantClass)}, но по твоим условиям таких бумаг не нашлось — `
        + 'ниже остальное, что подошло.';
    }
  } else {
    note = 'Доли уже близки к плану — срочной нужды покупать что-то определённое нет. '
      + 'Ниже просто то, что лучше подходит портфелю по измеримым признакам.';
  }

  // РАЗНООБРАЗИЕ САМОГО СПИСКА. Оценка считается для каждой бумаги отдельно,
  // и когда сектору хорошо, хорошо сразу всем его бумагам: на экране Ладо
  // четыре из пяти «подходящих» оказались нефтегазом с одинаковыми 75
  // баллами. Такой список — не подбор, а ставка на одну отрасль, и она
  // противоречит соседней карточке, где приложение предупреждает о пределе
  // в 35% на сектор. Больше двух бумаг одной отрасли в пятёрку не пускаем;
  // отброшенные остаются ниже, в полном списке.
  const PER_SECTOR = 2;
  const ranked = [...items].sort((a, b) => (b.score || 0) - (a.score || 0));
  const seen = {};
  const picked = [];
  let crowded = null;
  for (const r of ranked) {
    if (picked.length >= limit) break;
    const sec = r.kind === 'bond' ? null : (r.sector || null);
    if (sec) {
      if ((seen[sec] || 0) >= PER_SECTOR) { crowded = sec; continue; }
      seen[sec] = (seen[sec] || 0) + 1;
    }
    picked.push(r);
  }

  return {
    need: need[0] || null,
    items: picked,
    note: note + (crowded
      ? ` Бумаг отрасли «${crowded}» в этом списке не больше двух: у сектора общая судьба, `
        + `и пять лидеров из одной отрасли — это одна ставка, а не пять. Остальные — ниже, в полном списке.`
      : ''),
    disclaimer: 'Это не прогноз роста. Это данные о прошлых выплатах, доходности к погашению и сроках. '
      + 'Будущие доходы и цены неизвестны.'
  };
}

/**
 * ЧТО ПОМЕНЯТЬ: сравнение своих бумаг с рынком по измеримому.
 *
 * Твёрдое правило: замена предлагается ТОЛЬКО там, где выгода известна
 * заранее, а не предполагается. Для облигаций это доходность к погашению —
 * величина договорная. Для акций — фактические выплаты за 12 месяцев;
 * это прошлое, поэтому такая идея подаётся как наблюдение с оговорками,
 * а не как указание. Роста цены здесь нет вообще: его никто не знает.
 *
 * Из выгоды всегда вычитается цена вопроса — комиссии за продажу и покупку.
 */
function replacementIdeas(state, candidates = [], opts = {}) {
  const owned = (state.positions || []).filter(p => p.qty > 0);
  const fee = Number(state.settings?.brokerFee) || 0.0004;
  const goalYears = Number(state.settings?.goal?.years) || 0;
  const ndfl = Number(state.settings?.ndflRate) || 0.13;
  const ownedTickers = new Set(owned.map(p => p.ticker));
  // Пороги смысла. Замена — это сделка, комиссии, налоговые последствия и
  // новый, менее знакомый эмитент. Ради двухсот рублей в год этого не делают,
  // поэтому мелкие разницы не показываются вовсе: совет, который не стоит
  // исполнения, хуже молчания.
  const MIN_GAIN_RUB = 500;          // меньше — не окупает хлопот
  const MIN_YTM_GAP = 0.015;         // 1,5 п.п. по облигациям
  const MIN_YIELD_GAP = 0.04;        // 4 п.п. по выплатам акций

  // Доли секторов ПОСЛЕ гипотетической замены: выгодная бумага бесполезна,
  // если она загоняет портфель в один сектор. Считаем текущие веса заранее.
  const totalValue = owned.reduce((a, p) => a + positionValue(p), 0);
  const sectorValue = {};
  for (const p of owned) {
    if (allocationClass(p) !== 'stocks') continue;
    const sec = p.sector || sectorOf(p);
    if (sec) sectorValue[sec] = (sectorValue[sec] || 0) + positionValue(p);
  }
  const byTicker = new Map((opts.facts || []).map(f => [f.ticker, f]));
  const out = [];

  for (const p of owned) {
    const cls = allocationClass(p);
    if (cls === 'hedge') continue;              // защита нужна не ради дохода
    const value = positionValue(p);
    if (!(value > 1000)) continue;              // мелочь менять дороже, чем держать
    const mine = byTicker.get(p.ticker) || {};
    const cost = value * fee * 2;               // продать и купить

    let best = null;
    for (const c of candidates) {
      if (ownedTickers.has(c.ticker)) continue;
      if ((c.kind === 'bond' ? 'bonds' : 'stocks') !== cls) continue;
      // Менять ликвидную бумагу на неликвидную — менять шило на мыло:
      // расчётная выгода останется на бумаге, а выход обойдётся дороже.
      if (c.turnover !== undefined && c.turnover < value * 10) continue;

      if (cls === 'bonds') {
        if (!(c.ytm > 0) || !(mine.ytm > 0)) continue;

        // Фонд денежного рынка — особый случай: у него нет срока и купона,
        // зато нет и риска цены. Если облигация платит меньше ставки, это
        // измеримая неполноценность: те же деньги дают больше без ожидания
        // погашения. Проверки срока и оферты к фонду неприменимы.
        if (c.fundKind === 'money') {
          const gain = value * (c.ytm - mine.ytm);
          if (c.ytm - mine.ytm < MIN_YTM_GAP || gain < MIN_GAIN_RUB || gain <= cost * 3) continue;
          if (!best || gain > best.gain) best = { c, gain, kind: 'money' };
          continue;
        }
        if (c.ytm - mine.ytm < MIN_YTM_GAP) continue;
        // ПЛАВАЮЩИЙ КУПОН. «Доходность к погашению» флоатера — не обещание,
        // а пересчёт сегодняшнего купона на весь срок: снизит ЦБ ставку —
        // снизится и купон. Сравнивать её с доходностью бумаги с постоянным
        // купоном и называть разницу выгодой нельзя, это разные величины.
        // Тот же довод, что и с офертой: совет обязан опираться на известное.
        if (c.couponType !== mine.couponType && c.couponType !== 'fixed') continue;
        // С офертой раньше цели «доходность к погашению» — обещание, которое
        // может не дожить до срока. Такую замену не предлагаем вовсе:
        // выгода в ней недостоверна, а совет обязан опираться на известное.
        if (c.yearsToOffer > 0 && c.yearsLeft > c.yearsToOffer + 0.1) continue;
        const gain = value * (c.ytm - mine.ytm);
        // Срок не длиннее цели — иначе к нужному дню придётся продавать по рынку
        const fitsGoal = !goalYears || !(c.yearsLeft > goalYears + 0.5);
        if (!fitsGoal || gain < MIN_GAIN_RUB || gain <= cost * 3) continue;
        if (!best || gain > best.gain) best = { c, gain, kind: 'bonds' };
      } else {
        if (!(c.yieldPct > 0) || mine.yieldPct == null) continue;
        // ЗАМОЛЧАВШИЙ ПЛАТЕЛЬЩИК. Серия «платит 3 года подряд» считается по
        // годам, в которые выплаты были, и живёт ещё долго после того, как
        // компания платить перестала. Полюс отказался от дивидендов до 2030
        // года — а серия у него всё ещё три года, и по ней приложение звало
        // продавать свои бумаги. Больше года без выплат — это уже не «платит»,
        // и звать на такую бумагу нельзя, какой бы ни была прошлая доходность.
        //
        // Для ОБМЕНА порог строже, чем для просмотра, и вот почему. Доходность
        // считается за год до последней выплаты у каждой бумаги своей. Пока
        // обе платят регулярно, окна почти совпадают и сравнение честное. Но
        // если кандидат замолчал год назад, сравниваются РАЗНЫЕ годы: свежие
        // выплаты своей бумаги против позапрошлогодних чужой. Обмен при этом
        // стоит комиссии и налога с прибыли — платить за доход, которого уже
        // год никто не видел, приложение звать не должно. В списке идей такая
        // бумага остаётся: смотреть на неё можно, менять на неё — нет.
        if (c.payoutAgeDays != null && c.payoutAgeDays > PAYOUT_AGE.fresh) continue;
        // Бумага, про выплаты которой известно, что данные негодны, не
        // может быть поводом продать свою. Совет обязан опираться на
        // проверенное — а здесь проверка как раз не прошла.
        if (c.yieldSuspect === 'implausible') continue;
        if ((c.streak || 0) < 3) continue;      // разовая щедрость не повод меняться
        if (c.yieldPct - mine.yieldPct < MIN_YIELD_GAP) continue;
        // Куда переложим — туда добавится вес; откуда — оттуда уйдёт.
        const secTo = c.sector || sectorOf({ ticker: c.ticker, name: c.name, kind: 'stock' });
        const secFrom = p.sector || sectorOf(p);
        if (secTo && totalValue > 0) {
          const after = ((sectorValue[secTo] || 0) + value - (secFrom === secTo ? value : 0)) / totalValue;
          const fromShare = secFrom ? (sectorValue[secFrom] || 0) / totalValue : 0;
          // Запрещаем только УХУДШЕНИЕ: если сектор и так перегружен ровно
          // этой же бумагой, переход в другую отрасль концентрацию не
          // усиливает — а вот доливать в отрасль, где и без того перебор,
          // нельзя, какой бы выгодной ни выглядела бумага.
          if (after > LIMITS.sectorMax && after > fromShare + 1e-9) continue;
        }
        const gain = value * (c.yieldPct - mine.yieldPct) * (1 - ndfl);
        if (gain < MIN_GAIN_RUB || gain <= cost * 3) continue;
        if (!best || gain > best.gain) best = { c, gain, kind: 'stocks' };
      }
    }
    if (!best) continue;

    const rub = v => Math.round(v).toLocaleString('ru-RU') + ' \u20bd';
    const payback = best.gain > 0 ? cost / best.gain * 12 : null;

    /**
     * Как исполнить обмен, не потеряв на мелочах. Совет без инструкции —
     * половина совета: почти все потери при перекладке случаются не от
     * выбора бумаги, а от способа сделки.
     */
    const howTo = (fromName, toName, isBond) => [
      `Делай обе сделки в один день и подряд: продал — сразу купил. Разрыв в день-два — это риск, `
        + `что новая бумага подорожает, и выгода обмена испарится.`,
      `Ставь ЛИМИТНУЮ заявку, а не «по рынку». В стакане бывает разрыв между покупкой и продажей: `
        + `рыночная заявка исполнится по худшей цене, и на этом теряют больше, чем на комиссии.`,
      `Не торгуй в первые и последние 10 минут сессии: в это время разрыв цен шире всего.`,
      isBond
        ? `Накопленный купон при продаже ты получаешь, а при покупке платишь — это не потеря, а перенос: `
          + `на итог обмена он почти не влияет, но сумма сделки будет больше цены из стакана.`
        : `Проверь лот: у многих акций в лоте 10 штук, и купить можно только кратно ему.`,
      `Деньги от продажи доступны для покупки сразу, но расчёты идут следующим днём — вывести их можно позже.`,
      `На ИИС налог с прибыли сейчас не удерживается, но продажа фиксирует результат по бумаге: `
        + `если она в минусе, убыток становится настоящим и на другие счета не переносится.`
    ];

    if (best.kind === 'money') {
      out.push({
        kind: 'replace', cls, from: p.ticker, to: best.c.ticker, gain: best.gain, cost,
        how: howTo(p.name, best.c.name, false),
        toName: best.c.name, toPrice: Number(best.c.price) || 0, toLot: Number(best.c.lot) || 1,
        title: `${p.name} → ${best.c.name} (денежный рынок)`,
        detail: `Твоя бумага даёт ${pct(mine.ytm)} к погашению, денежный рынок — около `
          + `${pct(best.c.ytm)} прямо сейчас. На позиции в ${rub(value)} разница примерно `
          + `${rub(best.gain)} в год, комиссии обмена ${rub(cost)}. У фонда нет срока: деньги можно забрать в любой день, `
          + `и цена пая не падает от роста ставки.`,
        note: `Обратная сторона: ставка не зафиксирована — снизится ЦБ, снизится и доход, тогда как купон облигации `
          + `остаётся прежним. Комиссию управляющего биржа не публикует, её надо смотреть в правилах фонда — `
          + `она уменьшает результат каждый год. И продажа облигации фиксирует её текущий результат.`
      });
      continue;
    }

    // Подписей про «выплаты прекратились» здесь больше нет, и вот почему.
    // Кандидат старше порога свежести до этого места не доходит: он отсеян
    // выше, при отборе. Значит ветки «если выплаты вернутся» и «это N мес
    // назад» были недостижимы — мёртвый код, который читался как работающая
    // осторожность. Каждая бумага, попавшая сюда, платила за последний год,
    // и подпись «выплаты за 12 месяцев» для неё — правда без оговорок.

    out.push(best.kind === 'bonds' ? {
      kind: 'replace', cls, from: p.ticker, to: best.c.ticker, gain: best.gain, cost,
      how: howTo(p.name, best.c.name, true),
      toName: best.c.name, toPrice: Number(best.c.price) || 0, toLot: Number(best.c.lot) || 1,
      title: `${p.name} → ${best.c.name}`,
      detail: `${pct(mine.ytm)} против ${pct(best.c.ytm)} к погашению. `
        + `На твоей позиции в ${rub(value)} разница даёт около ${rub(best.gain)} в год; `
        + `комиссии за обмен — примерно ${rub(cost)}, они окупятся за ${payback < 1 ? 'меньше месяца' : `${Math.round(payback)} мес`}.`
        + (best.c.yearsLeft ? ` Погашение через ${dec1(best.c.yearsLeft)} лет${goalYears ? ` — до твоей цели` : ''}.` : ''),
      note: `Доходность к погашению — величина договорная, но реализуется только при удержании до конца срока. `
        + `Продажа фиксирует текущий результат по бумаге: если она в минусе, убыток станет настоящим, `
        + `а на ИИС он не уменьшит налоги по другим счетам.`
    } : {
      kind: 'replace', cls, from: p.ticker, to: best.c.ticker, gain: best.gain, cost,
      how: howTo(p.name, best.c.name, false),
      toName: best.c.name, toPrice: Number(best.c.price) || 0, toLot: Number(best.c.lot) || 1,
      title: `${p.name} → ${best.c.name}`,
      // ЗА КАКИЕ ДВЕНАДЦАТЬ МЕСЯЦЕВ. Доходность считается за год до ПОСЛЕДНЕЙ
      // выплаты, а не до сегодня. Пока бумага платит регулярно, разница
      // незаметна. Но у переставшей платить «выплаты за 12 месяцев» — это
      // выплаты позапрошлого года, и выгода обмена, посчитанная от них,
      // выдаётся за будущий доход. Число оставляем, обещание убираем.
      detail: `Выплаты за 12 месяцев по данным биржи, до налога: ${pct((mine.yieldPct || 0))} против ${pct(best.c.yieldPct)}, `
        + `и вторая платит ${best.c.streak} ${best.c.streak < 5 ? 'года' : 'лет'} подряд`
        // Дата сама по себе требует от читателя считать месяцы. «08.07.2025»
        // рядом со словами «платит 13 лет подряд» выглядит подтверждением,
        // хотя на деле означает, что за год выплат не было. Пишем возраст
        // словами — там, где он уже перестал быть свежим.
        + (best.c.payoutLastDate
          ? ` — последняя выплата ${String(best.c.payoutLastDate).split('-').reverse().join('.')}`
          : '')
        + `. На позиции в ${rub(value)} `
        + `разница — около ${rub(best.gain)} в год чистыми, комиссии обмена ${rub(cost)}.`,
      note: `Это наблюдение о прошлых выплатах, а не совет продавать: дивиденды — решение компании и могут быть урезаны. `
        + `Если бумага бралась ради роста бизнеса, низкие выплаты не изъян. Замена меняет и риск: чужой бизнес ты знаешь хуже.`
        // Двадцать процентов выплат — почти всегда особый дивиденд: продажа
        // актива, накопленная за годы прибыль. В следующем году его не будет,
        // и обмен, посчитанный от такой доходности, окупаться будет нечем.
        + ((best.c.yieldPct || 0) > 0.20
          ? ` И ещё: выплата больше 20% почти всегда разовая — особый дивиденд, который в следующем году `
            + `не повторится. Считать по ней ежегодную выгоду обмена нельзя.`
          : '')
        + (best.c.yieldSuspect === 'split'
          ? ` Часть выплат этой бумаги отброшена: до дробления акций суммы были в другом масштабе. `
            + `Значит, показанная доходность — нижняя граница, а не точное число.`
          : '')
    });
  }

  out.sort((a, b) => b.gain - a.gain);
  return out;
}

/**
 * ВЕРДИКТ: один связный ответ вместо россыпи карточек.
 *
 * Так работает хороший советник: он не вываливает наблюдения, а называет
 * порядок действий и объясняет замысел — от цели и бюджета, а не от
 * отдельной бумаги. Здесь собрано всё измеримое: резерв, взнос, доли,
 * ставка, вычет, сроки. Ни одного предсказания цен: их не знает никто,
 * и обещать «на выходе больше денег» — единственное, чего советник
 * такого уровня себе не позволяет.
 *
 * Каждый шаг обязан отвечать на три вопроса: что сделать, сколько это
 * стоит или даёт в рублях, и почему именно сейчас.
 */
function verdict(state, opts = {}) {
  const s = state.summary;
  if (!s || !(s.securities > 0)) return null;

  const settings = state.settings || {};
  const monthly = Number(settings.monthlyContribution) || 0;
  const expenses = Number(settings.monthlyExpenses) || 0;
  const reserve = Number(state.reserve) || 0;
  const reserveTarget = expenses * LIMITS.reserveMonths;
  const rate = Number(opts.moneyRate) || 0;
  const goalAmount = Number(settings.goal?.amount) || 0;
  const goalYears = Number(settings.goal?.years) || 0;
  const yearDeposits = Number(opts.yearDeposits) || 0;
  const ndfl = Number(settings.ndflRate) || 0.13;

  const steps = [];
  const money = v => Math.round(v).toLocaleString('ru-RU') + ' \u20bd';
  // Свободный остаток на счёте: он уже здесь и уже ничего не приносит.
  const idleCash = Math.max(0, Number(state.summary?.cash) || 0);

  // Сколько из взноса реально дойдёт до бумаг после деления с резервом.
  // Без этого числа шаг 1 говорил «15 000 ₽ в рынок», а шаг 2 тут же
  // раскладывал по бумагам все 30 000 ₽ — два соседних пункта одного
  // вердикта противоречили друг другу.
  let toMarket = 0;

  // 1. Резерв. Первое правило — не потерять: без подушки любая просадка
  //    заставляет продавать бумаги в худший момент.
  if (reserveTarget > 0 && reserve < reserveTarget) {
    const months = expenses > 0 ? reserve / expenses : 0;
    const half = Math.round(monthly / 2);
    toMarket = reserve <= 0 ? monthly - half : monthly - half;
    steps.push({
      what: reserve <= 0
        ? `Сначала резерв: откладывать ${money(half)} из взноса, пока не наберётся ${money(reserveTarget)}`
        : `Делить взнос пополам: ${money(half)} в резерв, ${money(monthly - half)} в рынок`,
      why: `Отложено ${money(reserve)} — это ${dec1(months)} мес жизни при расходах ${money(expenses)}. `
        + `Цель — три месяца. Пока подушки нет, любая просадка или потеря дохода заставит продавать бумаги `
        + `в худший момент, и убыток станет настоящим.`,
      weight: 1
    });
  }

  // 2. Куда идёт ближайший взнос — с точностью до бумаги.
  if (opts.contribution && opts.contribution.steps?.length) {
    const parts = opts.contribution.steps
      .filter(x => x.amount > 0)
      .map(x => `${money(x.amount)} → ${x.name || classLabel(x.cls)}`);
    // Разложена вся сумма взноса, а шаг про резерв отдал рынку только часть.
    // Молчать об этом нельзя: человек купит на все деньги и останется без подушки.
    const split = toMarket > 0 && opts.contribution.amount > toMarket + 1;
    steps.push({
      what: `Ближайший взнос ${money(opts.contribution.amount)}: ${parts.join(', ')}`,
      why: `Деление — по недобору до целевых долей, посчитанному от суммы ПОСЛЕ взноса: класс, `
        + `отстающий сильнее, получает больше. Поэтому класс, сегодня стоящий чуть выше цели, `
        + `всё равно получает часть — иначе сам взнос сдвинул бы его долю вниз. `
        + `Так доли выравниваются сами, без продаж и без комиссий.`
        // ДЕНЬГИ, КОТОРЫЕ УЖЕ ЛЕЖАТ. Приложение поминало свободный остаток
        // только когда его подозрительно много — от 20 000 ₽ и четверти
        // счёта, как признак незаписанной сделки. А полторы-две тысячи,
        // оставшиеся от прошлой покупки или пришедшие дивидендами, просто
        // лежали без работы, и план предлагал купить ровно на взнос.
        + (idleCash >= 500
          ? ` На счёте уже лежит ${money(idleCash)} свободными — эти деньги не работают. `
            + `Впиши ${money(monthly + idleCash)} в поле «Ближайший взнос», чтобы вложить их вместе с ним.`
          : '')
        + (split
          ? ` Внимание: здесь разложена вся сумма взноса. Если делишь его с резервом (шаг 1), `
            + `в бумаги идёт ${money(toMarket)} — впиши эту сумму в поле «Ближайший взнос» и пересчитай.`
          : ''),
      weight: 2
    });
  }

  // 3. Замена, если рынок даёт измеримо больше.
  if (opts.swap) {
    steps.push({
      what: `Поменять: ${opts.swap.title}`,
      why: `${opts.swap.detail} Это единственный вид совета о продаже, который приложение себе позволяет: `
        + `выгода известна заранее, а не предполагается.`,
      how: opts.swap.how || null,   // как исполнить, не потеряв на мелочах
      weight: 3
    });
  }

  // 4. Вычет — деньги, которые государство отдаёт за уже сделанное.
  const limit = 400000;
  if (yearDeposits > 0 && yearDeposits < limit) {
    const left = limit - yearDeposits;
    steps.push({
      what: `Довнести до ${money(limit)} за год — осталось ${money(left)}`,
      why: `Это вернёт ещё ${money(left * ndfl)} вычетом. Единственная доходность в портфеле, которая `
        + `известна заранее и не зависит от рынка. Взнос 1 января засчитается уже в следующий год.`,
      weight: 4
    });
  }

  // Замысел целиком: связь с целью и бюджетом.
  const inflation = Number(opts.inflation) || 0;
  const goalToday = inflation > 0 && goalAmount > 0 && goalYears > 0
    ? goalAmount / Math.pow(1 + inflation, goalYears) : 0;

  const plan = goalAmount > 0 && goalYears > 0
    ? `Цель — ${money(goalAmount)} за ${goalYears} ${goalYears < 5 ? 'года' : 'лет'} при взносе ${money(monthly)} в месяц.`
      + (goalToday > 0
          ? ` По покупательной способности это примерно ${money(goalToday)} сегодняшними деньгами: `
            + `инфляцию ${(inflation * 100).toFixed(0)}% в год приложение не прячет, потому что именно она `
            + `решает, что ты сможешь на эти деньги купить.`
          : '')
      + ` Главный двигатель здесь не выбор бумаг, а регулярность взносов и время: рынок добавляет разброс, `
      + `а взносы — уверенность.`
    : `Цель не задана — без неё советовать можно только про доли и риск, но не про срок.`;

  const rateNote = rate > 0
    ? ` Ставка денежного рынка ${opts.rateSource ? `(${opts.rateSource}) ` : ''}сейчас ${pct(rate)} — `
      + `это биржевая ставка коротких денег, близкая к ключевой, но не она сама. Деньги дороги, поэтому облигации `
      + `и денежный рынок платят необычно много, а акции проигрывают им в выплатах. Это состояние рынка, а не приговор акциям.`
    : '';

  /**
   * Чего делать НЕ надо. Половина сохранённых денег — это не сделанные
   * глупости, а не удачные покупки. Каждый запрет опирается на число из
   * твоего портфеля, а не на общую мудрость.
   */
  const avoid = [];
  const positions = (state.positions || []).filter(p => p.qty > 0);

  // 1. Не докупать то, что уже за пределом доли.
  for (const p of positions) {
    const share = s.securities > 0 ? positionValue(p) / s.securities : 0;
    if (share > LIMITS.singlePosition) {
      avoid.push({
        what: `Не докупать ${p.name}`,
        why: `Она уже ${pct(share)} портфеля при пределе ${pct(LIMITS.singlePosition)}. `
          + `Продавать не нужно: доля выровняется сама, когда взносы пойдут в другие бумаги.`
      });
      break;                        // одного примера достаточно, список не должен пугать
    }
  }

  // 2. Не продавать просевшее ради перекладки без измеримой выгоды.
  const deepLoss = positions
    .filter(p => positionCost(p) > 0)
    .map(p => ({ p, off: positionValue(p) / positionCost(p) - 1 }))
    .sort((a, b) => a.off - b.off)[0];
  if (deepLoss && deepLoss.off < -0.15) {
    avoid.push({
      what: `Не продавать ${deepLoss.p.name} только потому, что она в минусе`,
      why: `Минус ${Math.abs(deepLoss.off * 100).toFixed(0)}% — это пока бумажный результат. Продажа делает `
        + `его настоящим, а на ИИС такой убыток не уменьшит налоги по другим счетам. Менять имеет смысл `
        + `только когда другая бумага даёт измеримо больше — такие случаи приложение показывает отдельно.`
    });
  }

  // 3. Не гнаться за разовой щедростью.
  if (opts.hugeYield && opts.hugeYield.yieldPct > 0.20) {
    avoid.push({
      what: `Не покупать ${opts.hugeYield.name} ради ${(opts.hugeYield.yieldPct * 100).toFixed(0)}% дивидендов`,
      why: `Выплата больше 20% почти всегда разовая: особый дивиденд, который в следующем году не повторится. `
        + `После отсечки цена падает примерно на её размер, и «доходность» остаётся только в прошлом.`
    });
  }

  // 4. Не держать деньги без дела при высокой ставке.
  const idle = Number(s.cash) || 0;
  if (rate > 0.10 && idle > 5000) {
    avoid.push({
      what: `Не оставлять ${money(idle)} лежать на счёте`,
      why: `При ставке ${pct(rate)} это примерно ${money(idle * rate)} в год мимо. `
        + `Деньги, которые скоро понадобятся, держат в фонде денежного рынка, а не просто на счёте.`
    });
  }

  // 5. Не закрывать счёт раньше срока.
  if (settings.iisOpenDate && goalYears > 0) {
    const term = Number(settings.iisTermYears) || 5;
    const closeAt = new Date(settings.iisOpenDate);
    closeAt.setFullYear(closeAt.getFullYear() + term);
    const yearsLeft = (closeAt - new Date()) / (365.25 * 86400000);
    if (yearsLeft > 0 && goalYears < yearsLeft) {
      avoid.push({
        what: 'Не закрывать ИИС ради цели раньше срока',
        why: `До окончания минимального срока ещё ${dec1(yearsLeft)} г., а цель ты планируешь через `
          + `${goalYears}. Закрытие раньше означает вернуть государству все полученные вычеты — `
          + `это дороже, чем подождать или взять деньги из другого источника.`
      });
    }
  }

  return {
    steps: steps.sort((a, b) => a.weight - b.weight),
    avoid: avoid.slice(0, 3),
    plan: plan + rateNote,
    caution: 'Ни один советник не знает будущих цен. Всё выше посчитано из того, что можно проверить: '
      + 'твои доли, выплаты, ставки, сроки и лимиты. Обещание «станет больше денег» — первый признак, что вас обманывают.'
  };
}

/**
 * План конкретного обмена: сколько продать, за сколько, сколько купить и
 * что останется. Общая инструкция объясняет правила, а этот план подставляет
 * в них твои числа — иначе человеку приходится считать самому, а именно на
 * счёте в уме и теряются деньги.
 *
 * Все суммы — оценка по последней известной цене: в момент сделки цена будет
 * другой, поэтому в плане названы допуски, а не обещания.
 */
function swapPlan(state, idea, opts = {}) {
  if (!idea || !idea.from || !idea.to) return null;
  const pos = (state.positions || []).find(p => p.ticker === idea.from);
  if (!pos || !(pos.qty > 0)) return null;

  const fee = Number(state.settings?.brokerFee) || 0.0004;
  const sellPrice = Number(pos.price) || 0;
  const buyPrice = Number(opts.buyPrice) || 0;
  const buyLot = Number(opts.buyLot) || 1;
  const sellLot = Number(state.settings?.lots?.[idea.from]) || 1;

  const gross = pos.qty * sellPrice;
  const sellFee = gross * fee;
  const proceeds = gross - sellFee;

  // Сколько влезет в вырученное, с учётом лота и комиссии покупки
  const lotCost = buyPrice > 0 ? buyPrice * buyLot * (1 + fee) : 0;
  const lots = lotCost > 0 ? Math.floor(proceeds / lotCost) : null;
  const buyQty = lots != null ? lots * buyLot : null;
  const spent = buyQty != null ? buyQty * buyPrice * (1 + fee) : 0;
  const leftover = buyQty != null ? proceeds - spent : proceeds;

  // Допуск на цену: если рынок уйдёт дальше, обмен теряет смысл — считаем,
  // насколько он может уйти, пока годовая выгода не съедена целиком.
  const tolerance = idea.gain > 0 && gross > 0
    ? Math.max(0.002, Math.min(0.02, idea.gain / gross / 2)) : 0.005;

  return {
    from: idea.from, to: idea.to,
    fromName: pos.name || idea.from, toName: opts.toName || idea.to,
    sellQty: pos.qty, sellLot, sellPrice, gross, sellFee, proceeds,
    buyPrice, buyLot, lots, buyQty, spent, leftover,
    feeTotal: sellFee + (buyQty != null ? buyQty * buyPrice * fee : 0),
    tolerance,
    // Границы разумной цены: дальше них обмен уже не окупается
    minSell: sellPrice > 0 ? sellPrice * (1 - tolerance) : 0,
    maxBuy: buyPrice > 0 ? buyPrice * (1 + tolerance) : 0,
    gain: idea.gain || 0,
    incomplete: !(buyPrice > 0)
  };
}

return {STRATEGIES, LIMITS, riskIndex, decisionHistory, positionCard, whenWrong, redFlags, investmentCommittee, explainRiskChange, planEffect, applyPlan, actionMetrics, rankActions, primaryAction, allSteps, classLabel, taxDeduction, policyStatement, buyRecommendations, replacementIdeas, verdict, swapPlan};
})());

/* ─── core/screener.js ─── */
Object.assign(SH, (function(){
/**
 * ПОДБОР БУМАГ.
 *
 * Честная рамка: приложение не знает, какая бумага вырастет. Оно умеет другое —
 * измерить то, что уже произошло, и показать, какие бумаги подходят под ТВОЮ
 * задачу прямо сейчас.
 *
 * Что считается фактом (берётся с биржи):
 *   · сколько дивидендов реально выплачено за 12 месяцев
 *   · сколько лет подряд компания платит
 *   · доходность облигации к погашению, срок до погашения
 *   · текущая цена и доля бумаги в твоём портфеле
 *
 * Что НЕ используется: прогнозы, целевые цены, рейтинги «перспективности».
 * Их нельзя проверить, а значит нельзя на них опираться.
 */


/**
 * Задача, под которую подбираем. От неё зависит, что считать подходящим —
 * а не абстрактное «хорошая бумага».
 */
const PURPOSE = {
  INCOME:   'income',    // регулярные выплаты
  DEFENCE:  'defence',   // защита при падении рынка
  BALANCE:  'balance',   // выровнять перекос по классам
  GROWTH:   'growth'     // рост без выплат
};

/**

        cautions.push('длинный выпуск: сильно дешевеет при росте ставки ЦБ, но и дорожает при снижении');
      }
    } else if (candidate.yieldTtm > 0) {
      fits = true;
      reasons.push(`выплачено ${pct(candidate.yieldTtm)} за последние 12 месяцев`);
      if (candidate.streak >= 5) reasons.push(`платит ${candidate.streak} лет подряд`);
      else if (candidate.streak <= 2) cautions.push(`платит всего ${candidate.streak} ${candidate.streak === 1 ? 'год' : 'года'} — история короткая`);
      cautions.push('дивиденд не обязательство: совет директоров вправе его отменить');
    } else {
      cautions.push('выплат за последний год не было');
    }
  }

  if (purpose === PURPOSE.GROWTH) {
    fits = kind === KIND.STOCK;
    if (fits) reasons.push('акция: доход от роста цены, а не от выплат');
    else if (isHedge(candidate)) reasons.push('защитный актив: не для роста, но страхует портфель при обвале');
    else if (kind === KIND.BOND) cautions.push('облигация даёт предсказуемый доход, но не рост — для этой задачи не подходит');
  }

  if (context.summary && context.amount > 0) {
    const current = context.summary.byClass[cls] || 0;
    const future = context.summary.securities + context.amount;
    const shareAfter = (current + context.amount) / future;
    const target = context.targets?.[cls];

    if (target != null) {
      if (shareAfter > target * 1.15) {
        // не просто предупреждаем, а считаем сумму, которая выводит ровно на цель
        const fair = Math.max(0, Math.round((target * context.summary.securities - current) / (1 - target)));
        cautions.push(
          `${labelOf(cls)} станет ${Math.round(shareAfter * 100)}% при цели ${Math.round(target * 100)}% — перебор. ` +
          (fair >= 100 ? `Ровно на цель выведет ${fair.toLocaleString('ru-RU')} ₽.` : 'Цель уже достигнута.')

        reasons.push(`${labelOf(cls)} выйдет на ${Math.round(shareAfter * 100)}% при цели ${Math.round(target * 100)}%`);
      }
    }
  }

  // ── концентрация: уже есть в портфеле
  if (context.existing) {
    const pos = context.existing.find(p => p.ticker === candidate.ticker);
    if (pos && context.summary?.securities > 0) {
      const share = (pos.qty * pos.price) / context.summary.securities;
      const after = (pos.qty * pos.price + (context.amount || 0)) / (context.summary.securities + (context.amount || 0));

        cautions.push(`доля вырастет до ${Math.round(after * 100)}% — выше твоего лимита в 25%`);
      } else if (share > 0) {
        reasons.push(`уже есть в портфеле (${Math.round(share * 100)}%), докупка не добавит новых рисков`);
      }
    }
  }

  return { ticker: candidate.ticker, name: candidate.name, fits, reasons, cautions };
}

function labelOf(cls) {
  return { stocks: 'доля акций', bonds: 'доля облигаций', hedge: 'доля защиты' }[cls] || cls;

function yearsWord(n) {
  const i = Math.floor(n) % 10, j = Math.floor(n) % 100;
  if (j >= 11 && j <= 14) return 'лет';
  if (i === 1) return 'год';
  if (i >= 2 && i <= 4) return 'года';
  return 'лет';

/**
 * Сравнение двух вариантов вложения одной суммы.

 */
function compare(optionA, optionB, amount, settings) {

  // обработчик кнопки ничего не ловит и лист просто замирал.
  const line = (o) => {
    const perYear = o.kind === 'bond'
      ? (o.annualCoupon || 0) * Math.floor(amount / (o.price || 1))
      : (o.ttm || 0) * Math.floor(amount / (o.price || 1));
    return {
      ticker: o.ticker,
      name: o.name,
      shares: Math.floor(amount / (o.price || 1)),
      incomePerYear: Math.round(perYear),
      netPerYear: Math.round(netOfTax(perYear, settings)),
      yieldPct: o.price > 0 ? perYear / amount : 0,
      guaranteed: o.kind === 'bond'
    };
  };

  const a = line(optionA), b = line(optionB);
  return {
    a, b,
    incomeDiff: a.netPerYear - b.netPerYear,
    note: a.guaranteed !== b.guaranteed
      ? 'Купон облигации известен заранее и не может быть отменён. Дивиденд акции — решение компании, его размер меняется и может стать нулём.'
      : null
  };
}

return {PURPOSE, whatIsNeeded, evaluate, compare};

 * ПРОГНОЗ ДОСТИЖЕНИЯ ЦЕЛИ.
 *
 * Честная рамка: будущая доходность неизвестна. Поэтому приложение показывает
 * не одну красивую линию, а разброс — что будет при удачном, среднем и плохом

 * Допущения о доходности классов. Держатся в одном месте и называются
 * допущениями, потому что таковыми и являются: акции и золото предсказать

 * называется допущением.

 * ходит против акций.

  stocks: { stocks: 1, bonds: 0.2, hedge: -0.2 },
  bonds:  { stocks: 0.2, bonds: 1, hedge: 0.1 },
  hedge:  { stocks: -0.2, bonds: 0.1, hedge: 1 }

 * наборе такие беды гасят друг друга, в маленьком — нет.

    { key: 'return', title: 'Доходность: +1 процентный пункт',
