      </div>` : ''}
      <label>Токен Т-Инвестиций</label>
      <input type="password" id="wToken" placeholder="t.xxxxxxxx" autocomplete="off">
      <button class="btn wide" id="wConnect">Продолжить</button>
      <div id="wOut"></div>

      <p class="muted" style="line-height:1.7;margin-top:20px">
        Портфель, сделки, выплаты и цены подтянутся сами — вводить больше ничего не нужно.<br><br>
        Токен нужен <b style="color:var(--text)">только на чтение</b>: Т-Инвестиции →
        Настройки → Токены → создать, режим «только чтение». Таким токеном нельзя ни
        совершить сделку, ни вывести деньги. Хранится он на этом устройстве и уходит
        только на серверы Т-Банка.</p>

      <div style="text-align:center;margin-top:18px">
        <a href="#" id="wSkip" class="muted" style="text-decoration:underline">Продолжить без токена</a>
      </div>
    </div>`;

  store.getMeta('tiToken').then(async saved => {
    if (!saved || !$('wStale')) return;
    // РАЗНЫЕ БЕДЫ — РАЗНЫЕ СЛОВА. Токен, по которому данные ни разу не
    // приходили, и токен, по которому они приходили вчера, а журнал пуст
    // сегодня, — это не одно и то же. Раньше обоим говорилось «не сработал»,
    // и человек с рабочим токеном читал, что всё показанное устарело, а
    // единственным выходом ему предлагалось завести новый токен. Пустой
    // журнал бывает и от оборвавшейся пересборки — токен тут ни при чём.
    const syncedAt = await store.getMeta('tiSyncedAt');
    if (!syncedAt) {
      // НЕ ОБВИНЯТЬ, НЕ ПРОВЕРИВ. Раньше здесь стояло готовое утверждение:
      // «данные ни разу не загрузились — возможно, истёк или отозван, введи
      // новый». Приложение не спрашивало брокера ни разу и объявляло рабочий
      // токен негодным. Причина пустого журнала бывает совсем другой: чаще
      // всего теряется отметка счёта, и тогда обновление молча не начинается
      // вовсе — токен тут ни при чём и менять его бессмысленно.
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        $('wStale').innerHTML = `<div class="act attention" style="margin-bottom:18px">
          <h2 style="font-size:16px">Нет связи</h2>
          <p>Токен сохранён, но проверить его сейчас не выходит. Появится сеть —
            приложение попробует само.</p></div>`;
        return;
      }
      $('wStale').innerHTML = `<div class="act" style="margin-bottom:18px">
        <p class="muted">Проверяю сохранённый токен…</p></div>`;
      let accounts = null, why = null;
      try { accounts = await tiAccounts(saved); }
      catch (err) { why = (err && err.message) || String(err); }

      if (!accounts || !accounts.length) {
        $('wStale').innerHTML = `<div class="act attention" style="margin-bottom:18px">
          <h2 style="font-size:16px">Прошлый токен не сработал</h2>
          <p>${esc(why || 'счетов по нему не видно')}. Возможно, истёк или отозван —
            введи новый.</p></div>`;
        return;
      }

      // Токен рабочий. Значит не хватало отметки счёта — восстанавливаем её
      // сами и собираем журнал, вместо того чтобы просить человека вводить
      // ту же строку заново.
      const keep = await store.getMeta('tiAccount');
      const pick = keep || (accounts.find(a => a.isIis) || accounts[0]).id;
      await store.setMeta('tiAccount', pick);
      $('wStale').innerHTML = `<div class="act" style="margin-bottom:18px">
        <h2 style="font-size:16px">Токен работает</h2>
        <p class="muted">Счёт найден, собираю журнал из Т-Инвестиций…</p></div>`;
      try {
        const r = await guardJournal(() => store.syncTinvest({ force: true, silent: true }));
        if (r && r.ok === false) {
          $('wStale').innerHTML = `<div class="act attention" style="margin-bottom:18px">
            <h2 style="font-size:16px">Токен работает, но журнал не сошёлся</h2>
            <p>${esc((r.problems || []).slice(0, 2).join('; ') || 'причина не названа')}.
              Токен менять не нужно — попробуй ещё раз через минуту.</p></div>`;
          return;
        }
        render();
      } catch (err) {
        $('wStale').innerHTML = `<div class="act attention" style="margin-bottom:18px">
          <h2 style="font-size:16px">Токен работает, но данные не пришли</h2>
          <p>${esc((err && err.message) || 'нет связи')}. Токен менять не нужно.</p></div>`;
      }
      return;
    }
    const when = new Date(syncedAt).toLocaleString('ru-RU',
      { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    $('wStale').innerHTML = `<div class="act attention" style="margin-bottom:18px">
      <h2 style="font-size:16px">Журнал пуст, но токен рабочий</h2>
      <p>По нему уже приходили данные — последний раз ${esc(when)}. Значит дело не в
        токене: скорее всего пересборка журнала оборвалась на середине. Новый токен
        вводить не нужно.</p>
      <button class="primary" id="wResync" style="margin-top:12px">Собрать журнал заново</button>
      <div class="muted" id="wResyncOut" style="margin-top:10px"></div></div>`;
    const again = $('wResync');
    if (again) again.onclick = async () => {
      const out = $('wResyncOut');
      again.disabled = true;
      if (out) out.textContent = 'Запрашиваю у Т-Инвестиций…';
      try {
        const r = await guardJournal(() => store.syncTinvest({ force: true, silent: true }));
        if (r && r.ok === false) {
          if (out) out.textContent = 'Не сошлось: ' + (r.problems || []).slice(0, 2).join('; ');
          again.disabled = false;
          return;
        }
        render();
      } catch (err) {
        if (out) out.textContent = 'Не вышло: ' + ((err && err.message) || 'нет связи');
        again.disabled = false;
      }
    };
  });

  $('wConnect').onclick = () => connectToken($('wToken').value.trim(), 'wOut');
  $('wToken').onkeydown = e => { if (e.key === 'Enter') $('wConnect').click(); };
  $('wSkip').onclick = async e => {
    e.preventDefault();
    await store.setMeta('skipToken', true);
    render();
  };
}

/**
 * Общий путь подключения: проверить токен, выбрать счёт, забрать историю.
 * Используется и на экране входа, и в настройках — чтобы поведение
 * не расходилось в двух местах.
 */
async function connectToken(token, outId) {
  const out = $(outId);
  if (!token) { out.innerHTML = '<div class="err" style="margin-top:10px">Вставь токен</div>'; return; }
  out.innerHTML = '<div class="muted" style="margin-top:12px">Соединяюсь…</div>';

  let accounts;
  try { accounts = await tiAccounts(token); }
  catch (err) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; return; }

  if (!accounts.length) {
    out.innerHTML = '<div class="err" style="margin-top:10px">Счетов не видно — возможно, у токена нет к ним доступа</div>';
    return;
  }
  await store.setMeta('tiToken', token);

  const saved = await store.getMeta('tiAccount');
  const guess = saved || (accounts.find(a => a.isIis) || accounts[0]).id;

  out.innerHTML = `
    <div class="diff" style="margin-top:14px;color:var(--ok)">Связь есть. Счетов: ${accounts.length}</div>
    ${accounts.length > 1 ? '<label style="margin-top:10px">Какой счёт вести</label>' : ''}
    <select id="wAcc" ${accounts.length > 1 ? '' : 'style="display:none"'}>
      ${accounts.map(a => `<option value="${esc(a.id)}" ${a.id === guess ? 'selected' : ''}>
        ${esc(a.name)}${a.isIis ? ' · ИИС' : ''}</option>`).join('')}</select>
    <button class="btn wide" id="wLoad" style="margin-top:6px">Загрузить портфель</button>
    <div id="wLoadOut"></div>`;

  const had = (await store.getState()).ops.filter(o => o.type !== 'reserve').length;

  $('wLoad').onclick = async () => {
    await store.setMeta('tiAccount', $('wAcc').value);
    $('wLoadOut').innerHTML = '<div class="muted" style="margin-top:12px">Забираю историю. Полминуты…</div>';
    let r;
    // Журнал уже наполнен — переписываем его целиком, иначе появятся двойники.
    try { r = await store.syncTinvest(); }
    catch (err) { $('wLoadOut').innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; return; }

    if (r.ok === false) {
      $('wLoadOut').innerHTML = `<div class="err" style="margin-top:10px"><b>Данные не сошлись с брокером</b><br>
        ${r.problems.slice(0, 5).map(esc).join('<br>')}<br><br>
        В журнал ничего не записано, чтобы не испортить историю.</div>`;
      return;
    }
    closeSheet();
    const st = await store.getState();
    if (!st.settings.monthlyExpenses) return openSetup();
    render();
  };
}

function viewHome(st) {
  const s = st.summary, up = s.profit >= 0;
  return `
    <div class="hero">
      <div class="lbl">${st.stalePrices.length ? 'По ценам покупки' : 'Всё на счёте'}</div>
      <div class="sum">${money(s.total)}</div>
      <div class="sub">бумаги ${money(s.securities)}${s.cash > 0 ? ' · свободно ' + money(s.cash) : ''}</div>
      ${st.costIsApproximate
        ? `<div class="chip" style="background:rgba(138,151,171,.14);color:var(--dim)">прибыль пока не считается</div>`
        : `<div class="chip ${up ? 'up' : 'down'}">${up ? '+' : '−'}${money(Math.abs(s.profit))} · ${up ? '' : '−'}${pct(Math.abs(s.profitPct))}</div>
           <div class="sub" style="margin-top:6px;opacity:.75">вложено в бумаги ${money(s.invested)}</div>`}
    </div>

    ${connectionLine(st)}

    ${(() => {
      // РИСК И ЦЕЛЬ — НА ГЛАВНОМ ЭКРАНЕ.
      //
      // Считалось это давно, а показывалось на четвёртой вкладке: чтобы
      // узнать, рискован ли портфель и дойдёт ли он до цели, приходилось
      // искать. Ответ на оба вопроса должен быть виден сразу.
      //
      // Числа здесь намеренно грубые. Прогноз на пять лет с точностью до
      // рубля и вероятность с сотыми долями процента сообщают уверенность,
      // которой у случайной модели нет.
      const risk = SH.riskIndex(st);
      const g = st.goal;
      if (!risk && !(g && g.hasGoal)) return '';

      const riskBlock = risk ? `
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <span>Риск портфеля</span>
          <b style="font-size:17px;color:${
            risk.band === 'норма' ? 'var(--ok)' : risk.band === 'критично' ? 'var(--danger)' : 'var(--warn)'
          }">${dec1(risk.score)} из 10 — ${esc(risk.band)}</b>
        </div>
        ${risk.top.length
          ? risk.top.map(c => `<div class="diff">• ${esc(c.title)}: ${esc(c.value)}
              <span class="muted">(норма ${esc(c.norm)})</span></div>`).join('')
          : '<div class="diff muted">Все пять мер в пределах нормы.</div>'}` : '';

      const word = g && g.hasGoal ? SH.chanceWord(g.chance) : null;
      const gap = g && g.hasGoal ? (st.settings.goal.amount - (g.range ? g.range.median : 0)) : 0;
      const goalBlock = g && g.hasGoal && g.range ? `
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <span>Через ${st.settings.goal.years} лет</span>
            <b>${esc(SH.roughMoney(g.range.median))}</b>
          </div>
          <div class="diff">Разброс: от ${esc(SH.roughMoney(g.range.bad))}
            до ${esc(SH.roughMoney(g.range.good))}</div>
          ${word ? `<div class="diff">Дойти до ${esc(SH.roughMoney(st.settings.goal.amount))} —
            вероятность <b>${esc(word)}</b>${gap > 0
              ? `, не хватает примерно ${esc(SH.roughMoney(gap))}` : ''}</div>` : ''}
        </div>` : '';

      // КРАСНЫЕ ФЛАГИ. То, что требует внимания сегодня, — до всех прочих
      // разборов: человек, у которого пустая подушка, не должен узнавать об
      // этом четвёртой строкой после прогноза на пять лет.
      const flags = SH.redFlags(st, {});
      const flagBlock = flags.length ? `
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px;color:var(--warn)">
            Требует внимания</div>
          ${flags.slice(0, 4).map(f => `<div class="diff">• <b>${esc(f.title)}</b>:
            ${esc(f.detail)}</div>`).join('')}
        </div>` : '';

      // ГЛАВНЫЙ ВЫВОД. Числа выше отвечают на «сколько», но не на «и что
      // теперь». Вывод собирается из того же, что показано рядом, — иначе
      // фраза начнёт расходиться с числами под ней.
      const verdictLine = (() => {
        const parts = [];
        if (risk) {
          const worst = risk.top[0];
          parts.push(risk.band === 'норма'
            ? `Портфель в норме${worst ? `, слабее всего — ${worst.title.toLowerCase()} (${worst.value})` : ''}`
            : `Риск ${risk.band}${worst ? ` — главное: ${worst.title.toLowerCase()} (${worst.value})` : ''}`);
        }
        if (word) {
          parts.push(gap > 0
            ? `нынешним темпом до цели не хватит примерно ${SH.roughMoney(gap)}, вероятность дойти — ${word}`
            : `нынешним темпом цель достижима, вероятность — ${word}`);
        }
        if (!parts.length) return '';
        // Каждая часть — отдельное предложение, значит начинается с большой
        // буквы. Склейка через точку без этого давала «...(0,6 мес). нынешним».
        const text = parts.map(t => t.charAt(0).toUpperCase() + t.slice(1)).join('. ');
        return `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px">Главный вывод на сегодня</div>
          <div style="line-height:1.6">${esc(text)}.</div>
        </div>`;
      })();

      return `<div class="card" style="margin-bottom:12px">${riskBlock}${goalBlock}${flagBlock}${verdictLine}
        <div class="muted" style="margin-top:10px;line-height:1.6">Суммы округлены намеренно:
          разброс считается по трём тысячам случайных траекторий, и точность до рубля в нём
          была бы выдумкой.</div>
      </div>`;
    })()}

    ${(() => {
      // СЕГОДНЯ СТОИТ СДЕЛАТЬ.
      //
      // Порядок задаётся не весами, а доминированием: вариант лучше, если не
      // хуже ни по одной мере и лучше хотя бы по одной. Веса вида «0,4 за
      // риск» выглядят наукой, но берутся с потолка, а результат зависит от
      // них целиком. Отдельно стоят запреты: действие, поднимающее риск или
      // усиливающее нарушение предела, не занижается в списке, а не
      // показывается вовсе.
      const amount = Number(st.settings?.monthlyContribution) || 0;
      if (!amount || !st.summary || !(st.summary.securities > 0)) return '';
      const full = SH.contributionPlan(st, { rows: [] });
      if (!full || !full.steps.length) return '';
      const half = SH.contributionPlan(st, { rows: [] }, Math.round(amount / 2));
      const stretched = full.steps.some(t => t.stretched);

      const options = [{ id: 'full', title: `Купить на весь взнос ${money(amount)}`, plan: full }];
      if (half && half.steps.length) {
        options.push({ id: 'half',
          title: stretched
            ? `Разбить покупку: ${money(half.amount)} сейчас, остальное в следующем месяце`
            : `Купить на половину взноса ${money(half.amount)}`,
          plan: half });
      }
      const res = SH.rankActions(st, options, { goal: Number(st.settings?.goal?.amount) || 0 });
      if (!res.best) return '';

      const fmt = (key, v) => key === 'risk' ? dec1(v)
        : key === 'gap' || key === 'income' ? SH.roughMoney(v) : pct(v);
      const list = res.ranked.slice(0, 3).map((o, i) => {
        const what = o.plan.steps.filter(t => t.ticker)
          .map(t => `${money(t.amount)} → ${esc(t.name || t.ticker)}`).join(', ');
        return `<div class="diff"><b>${i + 1}. ${esc(o.title)}</b>${what ? `<br>${what}` : ''}</div>`;
      }).join('');

      // ИНВЕСТИЦИОННЫЙ КОМИТЕТ. Условия — не прогноз: две измеренные
      // величины, ставка и доходность бумаг, и вывод из их сравнения.
      // Уверенность — доля известных данных, а не ощущение.
      const com = SH.investmentCommittee(st, { best: res.best, yield: st.goal?.expected });
      const comBlock = com ? `
        <div style="margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line)">
          <div class="diff">${esc(com.conditions)}</div>
          <div class="diff">Уверенность вывода: <b>${esc(com.confidence.level)}</b>
            <span class="muted">${esc(com.confidence.note)}</span></div>
        </div>` : '';

      return `<div class="card" style="margin-bottom:12px">
        <h3>Инвестиционный комитет — сегодня</h3>
        ${comBlock}
        ${list}
        <div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px">Почему выбран первый вариант</div>
          ${res.best.reasons.map(r => `<div class="diff" style="color:${
            r.better ? 'var(--ok)' : 'var(--warn)'}">• ${esc(r.title)}: ${
            esc(fmt(r.key, r.from))} → ${esc(fmt(r.key, r.to))}</div>`).join('')}
        </div>
        ${(() => {
          // Совет, который нельзя опровергнуть, — мнение, а не совет: что бы
          // ни случилось, задним числом он окажется прав. Условие ошибки
          // называется числом, которое можно проверить через месяц.
          const wrong = SH.whenWrong(st, res.best, {});
          if (!wrong.length) return '';
          return `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--line)">
            <div style="font-weight:700;font-size:13px;margin-bottom:4px">Когда этот совет окажется ошибкой</div>
            ${wrong.map(w => `<div class="diff muted">• ${esc(w.text)}</div>`).join('')}
          </div>`;
        })()}
        ${res.rejected.length ? `<div class="muted" style="margin-top:10px;line-height:1.6">
          Отброшено без показа: ${res.rejected.map(r => esc(r.why)).join('; ')}.</div>` : ''}
      </div>`;
    })()}

    ${(() => {
      const s2 = store.storageState();
      if (s2.mode === 'idb') return '';
      const survives = s2.mode === 'local';
      return `<div class="act ${survives ? 'info' : 'attention'}" style="margin-bottom:12px">
        <div class="tag">Хранение данных</div>
        <h2>${survives ? 'Файл открыт с устройства' : 'Данные держатся только в памяти'}</h2>
        <p>${survives
          ? 'Данные подстрахованы хранилищем браузера: перезапуск они переживают, но сотрутся при очистке данных браузера. И в этом режиме не работают котировки Мосбиржи.'
          : esc(s2.reason || '')}</p>
        <p style="margin-top:8px">${survives
          ? 'Полное решение — открыть приложение по ссылке: заработают база, котировки и установка на экран.'
          : 'Сохраняй копию через «Ещё» → «Сохранить копию».'}</p>
        ${survives ? '<button class="btn ghost" id="bHosting" style="margin-top:10px">Как разместить — 5 минут</button>' : ''}
      </div>`;
    })()}

    ${st.settings.tiProblem ? `<div class="act attention" style="margin-bottom:12px">
      <b>Данные от брокера не сошлись</b><br>
      ${st.settings.tiProblem.map(esc).join('<br>')}<br>
      Автоматическое обновление остановлено — в журнал ничего не записано,
      чтобы не испортить историю.</div>` : ''}

    ${st.costIsApproximate ? `<div class="act info" style="margin-bottom:12px">
      <div class="tag">О доходности</div>
      <h2>Цены покупок неизвестны</h2>
      <p>Портфель собран из списка брокера, а там показана текущая цена, а не та,
        по которой ты покупал. Поэтому прибыль пока не считается — иначе цифра была бы выдуманной.
        Она появится, когда запишешь сделки в журнале или укажешь средние цены вручную.</p>
    </div>` : ''}

    ${st.stalePrices.length ? `<div class="act attention" style="margin-bottom:12px">
      <div class="tag">Цены не рыночные</div>
      <h2>Показаны цены покупки</h2>
      <p>Котировки с биржи не загрузились — скорее всего, файл открыт прямо с устройства,
        а в таком режиме браузер запрещает запросы наружу.<br><br>
        <b>Что можно сделать:</b><br>
        • нажать «Обновить цены» — вдруг получится;<br>
        • вписать цены вручную: раздел «Портфель» → нажми на бумагу;<br>
        • или вставить список из брокера целиком, со строками прибыли — тогда
        приложение возьмёт и текущие цены, и цены покупок.</p>
      <button class="btn" id="bFixPrices" style="margin-top:12px">Вставить список из брокера</button>
    </div>` : ''}

    <div class="act ${st.action.urgency}">
      <div class="tag">${st.action.urgency === 'ok' ? 'Всё в порядке' : 'Главное сейчас'}</div>
      <h2>${esc(st.action.title)}</h2>
      <p>${esc(st.action.detail)}</p>
    </div>

    ${(() => {
      const g = goalProgress(st);
      if (!g) return '';
      const pctDone = Math.round(g.pct * 100);
      return `<div class="card">
        <h3>Путь к цели</h3>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <div style="font-size:22px;font-weight:750">${money(g.total)}</div>
          <div class="muted">из ${money(g.goal)}</div>
        </div>
        <div class="track" style="height:10px"><div class="fill" style="width:${Math.max(1, pctDone)}%;background:var(--accent)"></div></div>
        <div class="muted" style="margin-top:8px">
          Пройдено ${pctDone}%. ${g.reachIn != null
            ? `При текущем темпе цель придёт примерно через ${dec(g.reachIn)} лет — к ${g.etaYear} году. Учтены взносы, налоговый вычет и ожидаемая доходность состава.`
            : `При нынешнем темпе цель дальше пятидесяти лет — загляни в «Что стоит сделать»: там посчитаны рычаги.`}
        </div>
        ${(() => {
          const infl = Number(st.settings.inflation) || 0;
          const years = Number(st.settings.goal?.years) || 0;
          const goal = Number(st.settings.goal?.amount) || 0;
          const today = inTodaysMoney(goal, years, infl);
          if (!today) return '';
          const exp = store.expectedReturn(st.summary.byClass, st.summary.securities,
            store.ratesFor(st.settings.bondYtm || 0, st.settings.stockYield || 0).rates);
          const real = realReturn(exp, infl);
          return `<div class="muted" style="margin-top:8px;line-height:1.6">
            ${money(goal)} через ${years} ${years === 1 ? 'год' : years < 5 ? 'года' : 'лет'} —
            это как <b>${money(today)}</b> сегодня при инфляции ${(infl * 100).toFixed(0)}%.
            Сверх инфляции портфель растёт примерно на ${pct(real)} в год —
            именно на столько прибавляется то, что на эти деньги можно купить.
            Инфляция здесь допущение, её можно изменить в «Ещё».</div>`;
        })()}
        <div class="muted" style="margin-top:6px;opacity:.7">Это не обещание: будущая доходность неизвестна, разброс исходов — в прогнозе.
          ${esc(store.ratesFor(st.settings.bondYtm || 0, st.settings.stockYield || 0).note)}
          ${(() => {
            const own = store.stockVolatility(st.positions, st.summary.byClass.stocks || 0);
            if (!(own > 0.31)) return '';
            return `Разброс твоих акций — ${(own * 100).toFixed(0)}% против рыночных 30%: риск собран `
              + `в немногих бумагах, и это учтено в расчёте.`;
          })()}</div>
        ${(() => {
          const years = Number(st.settings.goal?.years) || 0;
          const monthly = Number(st.settings.monthlyContribution) || 0;
          const bonus = Math.min(monthly * 12, 400000) * (Number(st.settings.ndflRate) || 0.13);
          const r = store.ratesFor(st.settings.bondYtm || 0, st.settings.stockYield || 0);
          const exp = store.expectedReturn(st.summary.byClass, st.summary.securities, r.rates);
          // Считать рычаги на пять лет, когда цель придёт через год, — вводить
          // в заблуждение: суммы выходят больше самой цели. Берём тот срок,
          // который наступит раньше.
          const horizon = g.reachIn != null && g.reachIn > 0 && g.reachIn < years
            ? Math.max(1, Math.round(g.reachIn * 10) / 10) : years;
          const n = whatMovesTheNeedle(g.total, monthly, horizon, exp, bonus);
          if (!n || !n.strongest) return '';
          const yearWord = h => (h === 1 ? 'год' : h < 5 ? 'года' : 'лет');
          return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
            <div class="muted" style="margin-bottom:6px">Что сильнее двигает цель — за ${horizon} ${yearWord(horizon)}${
              horizon !== years ? ' (столько осталось при текущем темпе)' : ''}</div>
            ${n.levers.map(l => `<div style="display:flex;justify-content:space-between;padding:4px 0">
              <span class="muted">${esc(l.title)}</span>
              <b class="${l.value >= 0 ? 'up' : 'down'}">${l.value >= 0 ? '+' : '−'}${money(Math.abs(l.value))}</b></div>`).join('')}
            <div class="muted" style="margin-top:6px;line-height:1.6">Сильнее всего — ${esc(n.strongest.title.split(':')[0].toLowerCase())}. ${esc(n.strongest.note)}</div>
          </div>`;
        })()}
      </div>`;
    })()}

    <div class="card" id="cashflowCard" style="display:none">
      <h3>Бумаги платят сами</h3>
      <div id="cashflowBox"></div>
    </div>


    ${st.settings.monthlyExpenses > 0 ? (() => {
      const goal = st.settings.monthlyExpenses * 3;
      const have = st.reserve;
      const pctDone = Math.min(100, goal > 0 ? have / goal * 100 : 0);
      const months = st.settings.monthlyExpenses > 0 ? have / st.settings.monthlyExpenses : 0;
      const col = pctDone >= 100 ? 'var(--ok)' : (months >= 1 ? 'var(--warn)' : 'var(--danger)');
      return `<div class="card">
        <h3>Резерв на чёрный день</h3>
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
          <div style="font-size:22px;font-weight:750">${money(have)}</div>
          <div class="muted">из ${money(goal)}</div>
        </div>
        <div class="track" style="height:10px"><div class="fill" style="width:${pctDone}%;background:${col}"></div></div>
        <div class="muted" style="margin-top:8px">
          ${pctDone >= 100
            ? 'Три месяца расходов закрыты — можно спокойно инвестировать весь взнос.'
            : `Хватит на ${dec1(months)} ${monthWord(months)} жизни. Цель — три месяца: столько нужно, чтобы пережить потерю дохода, не продавая бумаги.`}
        </div>
        ${pctDone < 100 ? `<button class="btn ghost wide" id="bAddRes2" style="margin-top:10px">Пополнить резерв</button>` : ''}
      </div>`;
    })() : ''}

    <div class="card" id="marketCard" style="display:none">
      <h3>Рынок сегодня</h3>
      <div id="marketBox"></div>
    </div>

    <div class="card" id="eventsCard" style="display:none">
      <h3>Ближайшие события</h3>
      <div id="eventsBox"></div>
    </div>

    <div class="card" id="chartCard" style="display:none">
      <h3>Стоимость портфеля</h3>
      <div id="chartBox"></div>
    </div>

    <div class="card">
      <h3>Распределение</h3>
      ${['stocks', 'bonds', 'hedge'].map(cls => {
        const cur = s.securities > 0 ? (s.byClass[cls] || 0) / s.securities : 0;
        const tgt = st.targets[cls] || 0;
        const col = Math.abs(cur - tgt) < 0.03 ? 'var(--ok)' : (cur > tgt ? 'var(--warn)' : 'var(--info)');
        return `<div class="bar-row">
          <div>${classLabel(cls)}</div>
          <div class="track"><div class="fill" style="width:${Math.min(100, cur * 100)}%;background:${col}"></div>
            <div class="mark" style="left:${tgt * 100}%"></div></div>
          <div class="val">${pct(cur)} <span style="opacity:.5">/${Math.round(tgt * 100)}%</span></div>
        </div>`;
      }).join('')}
      <div class="muted">Отклонение от плана — ${pct(st.drift)}. Черта показывает цель.</div>
    </div>

    ${st.steps.length > 1 ? `<div class="card"><h3>Ещё стоит учесть</h3>
      ${st.steps.slice(1, 4).map(x => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
        <div style="font-weight:650;font-size:13.5px;margin-bottom:3px">${esc(x.title)}</div>
        <div class="muted">${esc(x.detail)}</div></div>`).join('')}</div>` : ''}

    <button class="btn wide" id="bBuy" style="margin-bottom:10px">Что стоит сделать</button>

    <div class="card" style="margin-bottom:10px">
      <div class="rows" style="margin:0 -14px">
        ${st.settings.tiConnected
          ? `<button class="rowitem" id="bTiRefresh">
              <span class="rt"><b>Обновить из Т-Инвестиций</b><span id="status">${priceStatus(st)}</span></span>
              <span class="chev"></span></button>`
          : `<button class="rowitem" id="bPrices">
              <span class="rt"><b>Обновить цены</b><span id="status">${priceStatus(st)}</span></span>
              <span class="chev"></span></button>
             <button class="rowitem" id="bSync2">
              <span class="rt"><b>Сверить с брокером</b><span>Вставить список позиций и увидеть расхождения</span></span>
              <span class="chev"></span></button>`}
      </div>
    </div>

    <div class="muted" style="text-align:center;opacity:.55;padding-bottom:6px">сборка ${BUILD}</div>`;
}

/**
 * Строка состояния. Ровно два случая: данные от брокера свежие или нет.
 * Запоминать цвета не нужно — написано словами, и во втором случае строка
 * нажимается и ведёт туда, где это чинится.
 */
function connectionLine(st) {
  const at = st.settings.tiSyncedAt;
  const live = st.settings.tiConnected && at && !st.settings.tiProblem;

  if (live) {
    const when = new Date(at);
    const mins = Math.round((Date.now() - at) / 60000);
    const stamp = mins < 1440
      ? 'в ' + when.toLocaleTimeString('ru-RU').slice(0, 5)
      : when.toLocaleDateString('ru-RU').slice(0, 5);
    return `<div class="muted" style="font-size:11.5px;margin:-4px 0 14px">
      Данные из Т-Инвестиций, обновлены ${stamp}</div>`;
  }

  return `<div id="connFix" style="margin:-4px 0 14px;padding:9px 11px;border-radius:9px;
      background:rgba(227,183,101,.12);cursor:pointer">
    <span style="font-size:12.5px;color:var(--warn);font-weight:650">
      Данные не от брокера — нажми, чтобы ввести токен</span></div>`;
}

function priceStatus(st) {
  if (!st.settings.lastPriceUpdate) return 'Цены ещё не загружались с биржи';
  const min = Math.round((Date.now() - st.settings.lastPriceUpdate) / 60000);
  if (min < 15) return 'Цены свежие (' + new Date(st.settings.lastPriceUpdate).toLocaleTimeString('ru-RU').slice(0, 5) + ')';
  if (min < 1440) return 'Цены обновлялись ' + (min > 60 ? Math.round(min / 60) + ' ч' : min + ' мин') + ' назад';
  return 'Цены устарели — обнови';
}

function viewPortfolio(st) {
  const s = st.summary;
  const owned = st.positions.filter(p => p.qty > 0);

  // Группировка по классам — не украшение: именно в этих долях приложение
  // считает перекос, и видеть портфель надо в той же разбивке.
  const groups = [
    { key: 'stocks', title: 'Акции' },
    { key: 'bonds', title: 'Облигации' },
    { key: 'hedge', title: 'Защитные активы' }
  ];

  const block = g => {
    const list = owned.filter(p => allocationClass(p) === g.key)
      .sort((a, b) => positionValue(b) - positionValue(a));
    if (!list.length) return '';
    const sum = list.reduce((acc, p) => acc + positionValue(p), 0);
    const share = s.securities > 0 ? sum / s.securities : 0;
    const target = (st.targets || {})[g.key];

    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
        <h3 style="margin:0">${g.title}</h3>
        <span class="muted">${pct(share)}${target != null ? ' из ' + Math.round(target * 100) + '%' : ''}</span>
      </div>
      <div class="muted" style="margin-bottom:8px">${money(sum)}</div>
      ${list.map(p => {
        const v = positionValue(p), c = p.qty * p.avgPrice, diff = v - c, r = c > 0 ? diff / c : 0;
        const known = p.priceIsMarket;
        return `<div class="pos" data-sec="${esc(p.ticker)}" style="cursor:pointer">
          <div>
            <div class="t">${esc(p.name)}</div>
            <div class="n">${p.qty} шт · ${dec(p.price)} ₽${known ? '' : ' <span style="color:var(--warn)">цена покупки</span>'}</div>
          </div>
          <div class="v">
            <div>${money(v)}</div>
            <div class="p ${known ? (diff >= 0 ? 'up' : 'down') : 'muted'}">${known
              ? (diff >= 0 ? '+' : '−') + money(Math.abs(diff)) + ' · ' + pct(r)
              : '—'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  };

  return `<div class="hero"><div class="lbl">Портфель</div>
      <div class="sum" style="font-size:30px">${money(s.securities)}</div>
      <div class="sub">${owned.length} ${owned.length === 1 ? 'бумага' : owned.length < 5 ? 'бумаги' : 'бумаг'}${
        st.returnRateReliable && st.returnRate != null
          ? ' · доходность ' + pct(st.returnRate) + ' годовых'
          : st.historyDays ? ' · история ' + st.historyDays + ' дн' : ''}</div></div>

    ${groups.map(block).join('')}
    ${owned.length ? '' : '<div class="card"><div class="muted">Бумаг пока нет.</div></div>'}

    ${(() => {
      const secs = Object.entries(s.bySector || {}).sort((a, b) => b[1] - a[1]);
      if (secs.length < 2 || !(s.securities > 0)) return '';
      return `<div class="card"><h3>Акции по секторам</h3>
        ${secs.map(([sec, v]) => {
          const w = v / s.securities;
          const col = w > 0.35 ? 'var(--warn)' : 'var(--info)';
          return `<div class="bar-row">
            <div>${esc(sec)}</div>
            <div class="track"><div class="fill" style="width:${Math.min(100, w * 100)}%;background:${col}"></div></div>
            <div class="val">${pct(w)}</div>
          </div>`;
        }).join('')}
        <div class="muted">Доли от всего портфеля. Бумаги одного сектора падают вместе — ориентир: не больше 35% в одном.
          Сектор определён по названию бумаги.</div>
      </div>`;
    })()}

    <div class="card"><h3>Разобраться подробнее</h3>
      <div class="rows" style="margin-top:2px">
        <button class="rowitem" id="bFlow">
          <span class="rt"><b>Сколько приносит портфель</b><span>Купоны и дивиденды за год, с налогом</span></span>
          <span class="chev"></span></button>
        <button class="rowitem" id="bCrash">
          <span class="rt"><b>Что будет при обвале рынка</b><span>Падение на 30% в рублях по каждому классу</span></span>
          <span class="chev"></span></button>
        ${st.settings.tiConnected ? '' : `<button class="rowitem" id="bSync3">
          <span class="rt"><b>Сверить с брокером</b><span>Вставить список позиций и увидеть расхождения</span></span>
          <span class="chev"></span></button>`}
      </div>
    </div>`;
}

// Условия отбора живут между перерисовками листа: человек нажал «Акции» —
// не сбрасываем при обновлении результатов.
let ideaKind = 'bonds';
let ideaResult = null;

/** Отрисовка результатов отбора — отдельно, чтобы обновлять без перерисовки экрана. */
let lastSwaps = [];      // последние найденные замены — для плана по нажатию

function renderIdeas(res) {
  if (res && res.swaps) lastSwaps = res.swaps;
  if (res.error) return `<div class="card"><div class="muted">${esc(res.error)}</div></div>`;
  if (res.swaps) {
    if (!res.swaps.length) return `<div class="card"><h3>Менять нечего</h3>
      <div class="muted" style="line-height:1.6">Ни одна бумага с рынка не даёт выгоды, которая заметно перекрывала бы
        комиссии за обмен. Проверено бумаг: ${res.checked}. Это хорошая новость: портфель не проигрывает рынку
        в том, что можно измерить.</div></div>`;
    return `<div class="card"><h3>Что можно поменять (${res.swaps.length})</h3>
      ${res.swaps.map((x, i) => `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">${esc(x.title)}</h2>
        <p>${esc(x.detail)}</p>
        <p class="muted" style="margin-top:8px">${esc(x.note)}</p>
        <button class="btn wide" data-swap="${i}" style="margin-top:10px">Как сделать этот обмен</button>
      </div>`).join('')}
      <p class="muted" style="line-height:1.6">Приложение сделок не совершает и не может знать будущего.
        Это сравнение измеримого: доходность к погашению и прошлые выплаты. Проверено бумаг с рынка: ${res.checked}.</p>
    </div>`;
  }
  const rows = res.rows || [];
  if (!rows.length) {
    const m = res.market;
    if (!m) return `<div class="card"><div class="muted">Ничего не подошло под эти условия.</div></div>`;
    const pct = v => `${pct(v)}`;
    const bondY = res.bondYtm > 0 ? res.bondYtm : null;
    return `<div class="card">
      <h3>Ни одна акция не прошла отбор</h3>
      <div class="muted" style="line-height:1.65">
        На бирже ${m.onBoard} акций. Проверены ${m.checked} крупнейших: платят за последний год ${m.paying}${
          m.oldPayouts ? `, платили раньше ${m.oldPayouts}` : ''}${
          m.noPayouts ? `, не платят вовсе ${m.noPayouts}` : ''}${
          m.noAnswer ? `, <span style="color:var(--warn)">история не пришла у ${m.noAnswer}</span>` : ''}${
          m.suspect ? `, <span style="color:var(--warn)">данные биржи неправдоподобны у ${m.suspect}</span>` : ''}.
        Порог: выплаты за год от 6% и минимум 3 года подряд — считаются от последней известной выплаты,
        потому что данные биржи по дивидендам отстают на месяцы.
      </div>
      ${m.noAnswer >= m.checked / 2 ? `<div class="muted" style="margin-top:8px;line-height:1.65;color:var(--warn)">
        Больше половины историй не пришло — это похоже на сбой связи с биржей, а не на состояние рынка.
        Открой «Ещё» → «Диагностика» → «Проверить доступ к бирже» и попробуй ещё раз.</div>` : ''}
      ${m.nearMiss.length ? `<div style="margin-top:10px">
        <div class="muted" style="margin-bottom:6px">Ближе всех, но мимо порога:</div>
        ${m.nearMiss.map(x => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line)">
          <span>${esc(x.name)}</span>
          <span class="muted">${pct(x.yieldPct)}${x.streak ? ` · ${x.streak} ${x.streak < 5 ? 'года' : 'лет'} подряд` : ' · без серии выплат'}</span>
        </div>`).join('')}
      </div>` : ''}
      <div class="muted" style="margin-top:10px;line-height:1.65">
        ${bondY && m.best && bondY > m.best.yieldPct
          ? `Это не про «акции плохие». Сейчас облигации платят ${pct(bondY)} к погашению — больше,
             чем лучшая из проверенных акций (${pct(m.best.yieldPct)}), и без риска бизнеса. При высокой
             ставке так и бывает: деньги дороги, и акции проигрывают в выплатах.`
          : `Акции берут не только ради выплат: у них есть рост цены, который отбор не считает и предсказать
             нельзя. Отсутствие подходящих по выплатам не значит, что акции невыгодны — значит, что по
             ПРОВЕРЯЕМОМУ признаку сегодня никто не проходит.`}
        Смягчать порог ради красивого списка приложение не станет: когда дело касается денег, мягкость дороже жёсткости.
      </div>
    </div>`;
  }
  const rec = res.rec;
  const line = r => r.kind === 'bond'
    ? `${pct(r.ytm)} к погашению · ${dec1(r.yearsLeft)} лет · ${r.type === 'gov' ? 'ОФЗ' : 'корп.'}${
        r.couponType === 'float' ? ' · плавающий купон' : ''}${
        r.yearsToOffer > 0 && r.yearsLeft > r.yearsToOffer + 0.1
          ? ` · <span style="color:var(--warn)">оферта через ${r.yearsToOffer} г.</span>` : ''}`
    // ЗА КАКОЙ ГОД. Окно доходности отсчитывается назад от ПОСЛЕДНЕЙ
    // выплаты, а не от сегодня, — иначе годовой плательщик, заплативший
    // одиннадцать месяцев назад, показывал бы ноль. Но у бумаги, переставшей
    // платить, подпись «выплат за год» превращалась во враньё: на одной
    // карточке стояло «22,6% выплат за год» и тут же «последняя выплата 14
    // мес назад». Читалось как доход, который бумага приносит сейчас.
    : `${pct((r.yieldPct || 0))} ${
        r.payoutAgeDays > PAYOUT_AGE.fresh
          ? `за год до последней выплаты${r.payoutLastDate ? ` (${String(r.payoutLastDate).split('-').reverse().join('.')})` : ''}`
          : 'выплат за год'
      } · ${r.streak ? `${r.streak} ${r.streak < 5 ? 'года' : 'лет'} подряд` : 'без выплат'}${r.sector ? ' · ' + esc(r.sector) : ''}`;
  const card = r => `<div class="rowitem" style="cursor:default;align-items:flex-start">
      <span class="rt" style="flex:1">
        <b>${esc(r.name)} <span class="muted" style="font-weight:500">${esc(r.ticker)}</span></b>
        <span>${line(r)}</span>
        ${r.why && r.why.length ? `<span class="muted" style="display:block;margin-top:4px">${esc(r.why.join(' · '))}</span>` : ''}
      </span>
      <span style="text-align:right;min-width:64px">
        <b style="color:${r.score >= 70 ? 'var(--ok)' : r.score >= 45 ? 'var(--warn)' : 'var(--dim)'}">${r.score}</b>
        <span class="muted" style="display:block;font-size:11px">из 100</span>
        <button class="btn ghost" data-idea="${esc(r.ticker)}" style="margin-top:6px;padding:5px 9px;font-size:12px">Подробнее</button>
      </span>
    </div>`;
  return `
    ${rec && rec.items.length ? `<div class="card">
      <h3>Что подходит портфелю</h3>
      <p class="muted" style="margin-bottom:10px;line-height:1.6">${esc(rec.note)}</p>
      ${rec.items.map(card).join('')}
      <p class="muted" style="margin-top:10px;line-height:1.6;opacity:.8">${esc(rec.disclaimer)}</p>
    </div>` : ''}
    ${res.criteria ? `<p class="muted" style="margin:10px 0;line-height:1.6">${esc(res.criteria)}</p>` : ''}
    <div class="card">
      <h3>Всё, что подошло (${rows.length})</h3>
      ${rows.slice(0, 25).map(card).join('')}
      <p class="muted" style="margin-top:10px">Оценка 0–100 — насколько бумага подходит твоему портфелю:
        выплаты, стабильность, срок, недобор класса. Уже купленные получают штраф за концентрацию.
        Это не прогноз роста. Проценты выплат здесь — по данным биржи, ДО налога: на счёт приходит
        примерно на 13% меньше, и в карточках твоего портфеля стоит уже чистая сумма. Поэтому у одной
        и той же бумаги число здесь выше — это не расхождение, а разные базы.</p>
    </div>`;
}

function viewJournal(st) {
  const names = { buy: 'Покупка', sell: 'Продажа', deposit: 'Пополнение',
                  withdraw: 'Вывод', dividend: 'Выплата', fee: 'Комиссия', reserve: 'В резерв' };
  // Знак показывает направление денег: пришло на счёт или ушло с него.
  const incoming = { sell: true, deposit: true, dividend: true };
  // Два падежа, и путать их нельзя. В дате месяц отвечает на вопрос «когда»
  // и стоит в родительном: «16 июня». Заголовок группы — это название
  // месяца само по себе, именительный: «Июнь 2026». Раньше список был один,
  // и над лентой стояло «ИЮНЯ 2026» — обрывок фразы вместо заголовка.
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  const MONTH_TITLES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
                        'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];

  const recent = st.ops.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)).slice(0, 80);

  // Разбивка по месяцам: без неё лента из восьмидесяти строк нечитаема,
  // а даты у соседних операций почти всегда совпадают.
  const chunks = [];
  for (const o of recent) {
    const key = String(o.date).slice(0, 7);
    if (!chunks.length || chunks[chunks.length - 1].key !== key) {
      const [y, m] = key.split('-');
      chunks.push({ key, title: `${MONTH_TITLES[Number(m) - 1]} ${y}`, list: [] });
    }
    chunks[chunks.length - 1].list.push(o);
  }

  const row = o => {
    const plus = incoming[o.type];
    const day = String(o.date).slice(8, 10);
    return `<div class="pos" data-op="${o.id}" style="cursor:pointer">
      <div>
        <div class="t" style="${o.technical ? 'opacity:.6' : ''}">${names[o.type] || o.type}${
          o.ticker ? ' · ' + esc(o.ticker) : ''}</div>
        <div class="n">${day} ${MONTHS[Number(String(o.date).slice(5, 7)) - 1].slice(0, 3)}${
          o.qty ? ' · ' + o.qty + ' шт по ' + dec(o.price) + ' ₽' : ''}${
          o.technical ? ' · служебная' : o.note ? ' · ' + esc(o.note) : ''}</div>
      </div>
      <div class="v"><div style="color:${plus ? 'var(--ok)' : 'var(--text)'}">${
        plus ? '+' : '−'}${money(Math.abs(o.amount))}</div></div>
    </div>`;
  };

  return `<div class="hero"><div class="lbl">Журнал</div>
      <div class="sum" style="font-size:30px">${st.ops.length}</div>
      <div class="sub">${st.ops.length === 1 ? 'операция' : 'операций'} · внесено за год ${money(st.yearDeposits)}</div></div>

    ${(() => {
      // КАК РЕШЕНИЯ МЕНЯЛИ РИСК. Расчёт был, а на экране его не было —
      // мёртвый расчёт хуже отсутствующего: он создаёт видимость работы.
      const hist = SH.decisionHistory(st, { limit: 5 });
      const shown = hist.filter(d => d.riskBefore != null);
      if (!shown.length) return '';
      return `<div class="card"><h3>Как решения меняли риск</h3>
        ${shown.map(d => {
          const better = d.riskAfter < d.riskBefore;
          return `<div class="diff" style="padding:5px 0">
            <div style="display:flex;justify-content:space-between">
              <span>${String(d.date).split('-').reverse().join('.')} ·
                ${d.type === 'buy' ? 'купил' : 'продал'} ${esc(d.name)}</span>

function bind(st) {
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on('bPrices', refreshPrices);
  on('connFix', async () => {
    await store.setMeta('skipToken', false);
    await store.setMeta('tiSyncedAt', null);
    render();
  });
  on('bAddRes2', () => openForm('reserve'));
  if (tab === 'home') { drawChart(); drawMarket(); drawEvents(); drawCashflow(); }
  on('bBuy', openPlan);
  on('bFixPrices', openSync);
  on('bSync2', openSync); on('bSync3', openSync);
  on('bFlow', openCashflow);
  on('bCrash', () => openCrashTest());
  on('bAddDep', () => openForm('deposit'));
  on('bAddTrade', () => openForm('buy'));
  on('bAddDiv', () => openForm('dividend'));
  on('bAddRes', () => openForm('reserve'));
  on('bKeyRate', openKeyRate);
  on('bInstruments', openInstruments);
  on('bWhatsNew', openWhatsNew);
  on('bResults', openResults);
  on('bPolicy', openPolicy);
  on('bDiag', openDiagnostics);
  on('bTiOff', async () => {
    await store.setMeta('tiToken', '');
    await store.setMeta('tiAccount', '');
    await store.setMeta('skipToken', false);
    render();
  });
  on('bSync4', openSync);
  on('bShowSources', () => {
    const box = $('sourcesBox'), btn = $('bShowSources');
    const open = !box.classList.contains('open');
    box.classList.toggle('open', open);
    btn.setAttribute('aria-expanded', String(open));
  });
  on('bTiRefresh', async () => {
    const btn = $('bTiRefresh'), note = $('status');
    btn.disabled = true;
    if (note) note.textContent = 'Забираю историю…';   // меняем подпись, а не всю строку
    try {
      // Явное действие делает полное дело: журнал собирается заново.
      const r = await guardJournal(() => store.syncTinvest({ force: true }));
      if (r.ok === false) alert('Данные не сошлись с брокером:\n' + r.problems.join('\n'));
    } catch (err) {
      // Окно посреди экрана уместно там, где без ответа человека дальше
      // нельзя. Слишком частое нажатие — не тот случай: подождать минуту
      // он может и без подтверждения, а ошибка всё равно останется в
      // строке состояния и в карточке связи.
      const msg = String(err && err.message || err);
      if (/подожди минуту|Слишком много запросов/i.test(msg)) {
        if (note) note.textContent = msg;
      } else {
        alert(msg);
      }
    }
    render();
  });
  on('bRepBroker', () => openReport('broker'));
  on('bRepTax', () => openReport('tax'));
  on('bRepDepo', () => openReport('depo'));
  on('bHosting2', openHosting);
  on('bHosting', openHosting);
  on('bExport', () => store.exportBackup());
  on('bImport2', openImport);
  on('bSetup', () => openSetup(1));
  on('bReset', () => {
    openSheet(`<h2 style="margin:0 0 8px;font-size:19px">Стереть все данные?</h2>
      <p class="muted">История операций, настройки и цены будут удалены безвозвратно.
        Если данные ценные — сначала сохрани копию.</p>
      <div style="height:14px"></div>
      <button class="btn ghost wide" id="bResetCancel">Отмена</button>
      <div style="height:8px"></div>
      <button class="btn wide" id="bResetOk" style="background:var(--danger);color:#fff">Да, стереть</button>`);
    $('bResetCancel').onclick = closeSheet;
    $('bResetOk').onclick = async () => { await store.resetAll(); closeSheet(); tab = 'home'; render(); };
  });
  on('bSave', async () => {
    await store.setSetting('monthlyExpenses', +$('fExp').value || 0);
    await store.setSetting('monthlyContribution', +$('fCon').value || 0);
    await store.setSetting('goal', { amount: +$('fGoal').value || 0, years: +$('fYears').value || 5 });
  });
  document.querySelectorAll('input[name=strategy]').forEach(r => {
    r.onchange = () => store.setSetting('strategy', r.value);
  });
  document.querySelectorAll('[data-op]').forEach(e => {
    e.onclick = () => openOperation(e.dataset.op);
  });
  document.querySelectorAll('[data-sec]').forEach(e => {
    e.onclick = () => openSecurity(e.dataset.sec);
  });
  document.querySelectorAll('.tabs button').forEach(b => {
    b.onclick = () => {
      tab = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
      render(); window.scrollTo(0, 0);
    };
  });
}

/** Рыночный контекст: индекс и ставка, с объяснением, что это значит для портфеля. */
async function drawMarket() {
  const card = $('marketCard'), box = $('marketBox');
  if (!card || !box) return;
  try {
    const m = await withLimit(store.marketContext(), 6, null);
    if (!m || (!m.imoex && !m.moneyRate)) { card.style.display = 'none'; return; }
    const st = await store.getState();
    const meaning = m.moneyRate ? store.rateMeaning(m.moneyRate, st.summary, st.targets) : null;

    card.style.display = 'block';
    box.innerHTML = `
      <div style="display:flex;gap:18px;margin-bottom:${meaning ? '12px' : '0'}">
        ${m.stale ? `<div class="muted" style="font-size:11px;width:100%;margin-bottom:6px">${
          m.at ? `данные от ${new Date(m.at).toLocaleString('ru-RU').slice(0, 17)} — ` : ''}биржа сейчас недоступна</div>` : ''}
        ${m.imoex ? `<div><div class="muted" style="font-size:11px">Индекс Мосбиржи</div>
          <div style="font-size:20px;font-weight:750">${Math.round(m.imoex).toLocaleString('ru-RU')}</div>
          ${m.monthChange != null ? `<div style="font-size:12px;font-weight:650" class="${m.monthChange >= 0 ? 'up' : 'down'}">${m.monthChange >= 0 ? '+' : '−'}${pct(Math.abs(m.monthChange))} за месяц</div>` : ''}</div>` : ''}
        ${m.moneyRate ? `<div><div class="muted" style="font-size:11px">Ставка денежного рынка${
          m.moneyRateSource ? ` · ${esc(m.moneyRateSource)}` : ''}</div>
          <div style="font-size:20px;font-weight:750">${m.moneyRate}%</div></div>` : ''}
      </div>
      ${meaning ? `<div class="muted" style="line-height:1.6">${esc(meaning.text)}</div>` : ''}`;
  } catch { card.style.display = 'none'; }
}

/**
 * Календарь: отсечки, погашения, налоговые сроки. Данные по дивидендам
 * подгружаются с биржи, поэтому карточка появляется не сразу — и не появляется
 * вовсе, если событий нет. Пустой раздел хуже отсутствующего.
 */
/**
 * Пассивный доход портфеля: сколько бумаги платят купонами и дивидендами.
 * Это доход, не зависящий от роста цен, — главная цифра долгосрочника.
 */
async function drawCashflow() {
  const card = $('cashflowCard'), box = $('cashflowBox');
  if (!card || !box) return;
  try {
    const flow = await portfolioFacts();
    if (!flow || !(flow.totalNet > 0)) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    box.innerHTML = `
      <div style="display:flex;gap:18px;margin-bottom:10px">
        <div><div class="muted" style="font-size:11px">В год чистыми</div>
          <div style="font-size:20px;font-weight:750;color:var(--ok)">${money(flow.totalNet)}</div></div>
        <div><div class="muted" style="font-size:11px">В месяц</div>
          <div style="font-size:20px;font-weight:750">${money(flow.monthly)}</div></div>
        ${flow.yieldOnPortfolio > 0 ? `<div><div class="muted" style="font-size:11px">К стоимости бумаг</div>
          <div style="font-size:20px;font-weight:750">${pct(flow.yieldOnPortfolio)}</div></div>` : ''}
      </div>
      <div class="muted" style="line-height:1.6">Купоны и фактические выплаты за 12 месяцев — доход, который не зависит
        от роста цен. Дивиденды — решение компаний: могут измениться.</div>
      ${await (async () => {
        const st = await store.getState();
        const exp = Number(st.settings.monthlyExpenses) || 0;
        if (!(exp > 0) || !(flow.monthly > 0)) return '';
        return `<div class="muted" style="margin-top:8px">Покрывает ${(flow.monthly / exp * 100).toFixed(0)}%
          твоих месячных расходов — это и есть «пенсия с акций»: доля растёт с каждым взносом и каждой выплатой.</div>`;
      })()}`;
  } catch { card.style.display = 'none'; }
}

async function drawEvents() {
  const card = $('eventsCard'), box = $('eventsBox');
  if (!card || !box) return;
  const st = await store.getState();

  // Сначала спрашиваем брокера: к нему доступ есть всегда, к Мосбирже — нет.
  const flow = await portfolioFacts();
  const dividends = flow.dividends && flow.dividends.length
    ? flow.dividends
    : await withLimit(store.upcomingPayments(), 8, []);

  const events = store.upcomingEvents(st, dividends, flow);
  if (!events.length) { card.style.display = 'none'; return; }

  const when = n => n === 0 ? 'сегодня' : n === 1 ? 'завтра'
    : n < 31 ? `через ${n} ${n % 10 === 1 && n !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n < 12 || n > 14) ? 'дня' : 'дней'}`
    : n < 365 ? `через ${Math.round(n / 30)} мес` : `через ${dec1(n / 365)} г.`;
  const colour = n => n <= 7 ? 'var(--warn)' : n <= 30 ? 'var(--info)' : 'var(--dim)';

  card.style.display = 'block';
  box.innerHTML = events.map(e => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <div style="font-weight:650;font-size:13.5px">${esc(e.title)}</div>
        <div style="white-space:nowrap;font-size:12px;color:${colour(e.daysLeft)}">${when(e.daysLeft)}</div>
      </div>
      <div class="muted" style="margin-top:3px">${String(e.date).split('-').reverse().join('.')} · ${esc(e.detail)}</div>
    </div>`).join('');
}

/** Простой график без внешних библиотек: линия и подпись изменения. */
async function drawChart() {
  const card = $('chartCard'), box = $('chartBox');
  if (!card || !box) return;
  const c = await store.valueChart(90);
  if (!c.enough) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const W = 320, H = 70, pad = 4;
  const span = Math.max(1, c.max - c.min);
  const step = c.points.length > 1 ? (W - pad * 2) / (c.points.length - 1) : 0;
  const path = c.points.map((p, i) => {
    const x = pad + i * step;
    const y = pad + (H - pad * 2) * (1 - (p.value - c.min) / span);
    return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const up = c.change >= 0;
  const col = up ? 'var(--ok)' : 'var(--danger)';
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
      <path d="${path}" fill="none" stroke="${col}" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px">
      <span class="muted">${c.days} ${c.days === 1 ? 'день' : c.days < 5 ? 'дня' : 'дней'} наблюдений</span>
      <span style="color:${col};font-weight:700">${up ? '+' : ''}${pct(c.change)}</span>
    </div>`;
}

async function refreshPrices() {
  const btn = $('bPrices'); if (!btn) return;
  btn.disabled = true; btn.textContent = 'Загружаю…';
  const st = await store.getState();
  try {
    const { updated, failed, reason } = await fetchPrices(st.positions.filter(p => p.qty > 0));
    if (updated.length) await store.updatePrices(updated);

    if (!updated.length && reason) return explainPriceFailure(reason);
    if (failed.length && $('status')) {
      $('status').textContent = 'Не нашлось: ' + failed.join(', ') + ' — цену можно вписать вручную в Портфеле';
    }
  } catch (e) {
    explainPriceFailure(e.reason || 'offline');
  } finally {
    if ($('bPrices')) { $('bPrices').disabled = false; $('bPrices').textContent = 'Обновить цены'; }
  }
}

/**
 * Ожидание с потолком. Запросы к бирже с локального файла не отвечают вовсе:
 * браузер их не пускает, а обещание так и не разрешается. Без ограничения
 * экран навсегда застревает на «Считаю…».
 */
function withLimit(promise, seconds, fallback, outcome) {
  // Четвёртым доводом можно передать пустой объект — в него запишется
  // ПРИЧИНА подмены. Без этого отказ по времени и ошибка биржи выглядели
  // одинаково: оба давали fallback, и раздел писал «биржа не ответила за
  // 60 секунд» даже когда биржа ответила за долю секунды — отказом. Человек
  // шёл проверять связь, связь была, и разбор упирался в тупик.
  let noted = false;
  let timer = null;
  const note = (reason, extra) => {
    if (!outcome || noted) return;
    noted = true;
    Object.assign(outcome, { reason, seconds }, extra || {});
  };
  return Promise.race([
    Promise.resolve(promise).then(
      value => { note(null); return value; },
      error => { note('error', { error }); noteSwallowed('ожидание с потолком', error); return fallback; }),
    new Promise(resolve => {
      timer = setTimeout(() => { note('timeout'); resolve(fallback); }, seconds * 1000);
    })
  // Таймер снимается в любом случае: раньше он доживал до конца отсчёта
  // даже после успеха и держал замыкание живым.
  ]).finally(() => clearTimeout(timer));
}

/**
 * Почему поиск по рынку не дал результата. Три случая, и путать их нельзя:
 * биржи не видно вовсе, биржа ответила отказом, поиск не уложился в срок.
 * Раньше все три писались одинаково — «биржа не ответила за 60 секунд», —
 * и человек шёл проверять связь, которая была в порядке.
 *
 * Отдельно про срок: потолок стоит на ВЕСЬ обход, а не на один запрос.
 * Обход — это доска акций, доска ОФЗ, список фондов и по одной истории
 * выплат на каждую бумагу. Каждый ответ приходит за доли секунды, а сумма
 * упирается в минуту. Поэтому «не уложился» — правда, а «не ответила» —
 * нет, и текст обязан это различать.
 */
function marketFailureNote(why, stage, tail, noAccess) {
  const box = body => `<div class="muted" style="line-height:1.6">${body}</div>`;
  if (stage === 'нет доступа к бирже') return box(noAccess);
  const where = stage ? ` Остановилось на шаге «${esc(stage)}».` : '';
  if (why && why.reason === 'error') {
    const msg = why.error && (why.error.message || String(why.error));
    return box(`Биржа ответила отказом, а не молчанием${msg ? `: ${esc(msg)}` : ''}.${where}
      Связь при этом может быть в порядке — проверить можно в «Ещё → Диагностика». ${tail}`);
  }
  const limit = why && why.seconds ? why.seconds : null;
  return box(`Поиск не уложился в${limit ? ` ${limit} с` : ' отведённое время'}.${where}
    Это потолок на весь обход рынка, а не на один запрос: биржа успевает отвечать быстро,
    но досок и историй выплат много. ${tail}`);
}


/**
 * Диагностика. Одно место, где видно всё состояние: сборка, хранилище,
 * подключение, что насчитал журнал и что говорит брокер. Нужна не для
 * красоты — когда что-то не сходится, гадать по описанию бесполезно,
 * а по этому экрану видно причину.
 */
async function openDiagnostics() {
  openSheet('<div class="muted">Собираю…</div>');
  const st = await store.getState();
  const storage = store.storageState();
  const token = await store.getMeta('tiToken');
  const account = await store.getMeta('tiAccount');
  const syncedBuild = await store.getMeta('syncedBuild');
  const lastError = await store.getMeta('tiLastError');
  const problem = st.settings.tiProblem;

  const mine = st.positions.filter(p => p.qty > 0);
  let broker = null, brokerError = null;
  if (token && account) {
    try {
      const known = (await store.getMeta('uidTickers')) || {};
      broker = await withLimit(tiPortfolio(token, account, known), 12, null);
      if (broker && broker.resolved && Object.keys(broker.resolved).length) {
        await store.setMeta('uidTickers',
          { ...((await store.getMeta('uidTickers')) || {}), ...broker.resolved });
      }
    }
    catch (err) { brokerError = err.message; }
  }

  const line = (name, value) => `<div style="display:flex;justify-content:space-between;gap:12px;
    padding:7px 0;border-bottom:1px solid var(--line)">
    <span class="muted">${esc(name)}</span><span style="font-size:12.5px;text-align:right">${value}</span></div>`;

  const when = t => t ? new Date(t).toLocaleString('ru-RU').slice(0, 17) : '—';
  const storageName = { idb: 'база браузера', local: 'память + localStorage', memory: 'только память' };

  let compare = '<div class="muted" style="margin-top:8px">Брокер не отвечает — сравнить не с чем.</div>';
  if (broker) {
    const theirs = new Map(broker.rows.map(r => [r.ticker, r.qty]));
    const all = new Set([...mine.map(p => p.ticker), ...theirs.keys()]);
    // Бумага, чьё имя брокер не назвал, попадает в список под техническим
    // кодом. Это не расхождение данных, а неотвеченный запрос — и говорить
    // о нём надо словами, а не пугать красным «≠».
    const unnamed = broker.rows.filter(r => r.unresolved).length;
    compare = [...all].sort().map(t => {
      const a = mine.find(p => p.ticker === t)?.qty ?? 0;
      const b = theirs.get(t) ?? 0;
      const same = Math.abs(a - b) < 0.0001;
      return `<div style="display:flex;justify-content:space-between;padding:5px 0;
        color:${same ? 'var(--dim)' : 'var(--danger)'};font-size:12.5px">
        <span>${esc(t)}</span><span>${a} ${same ? '=' : '≠'} ${b}</span></div>`;
    }).join('') + (() => {
      // ТОТ ЖЕ ДОПУСК, ЧТО У СВЕРКИ. Раньше здесь стоял жёсткий рубль, и
      // получалась картина, в которой приложение спорит само с собой:
      // журнал собран и принят, а диагностика красит те же деньги красным
      // как поломку. Округление за десятки операций — не поломка.
      const gap = Math.abs(st.summary.cash - broker.cash);
      const ok = gap <= Math.min(60, Math.max(1, st.ops.length * 0.5));
      return `<div style="display:flex;justify-content:space-between;padding:7px 0;
      border-top:1px solid var(--line);font-size:12.5px;
      color:${ok ? 'var(--dim)' : 'var(--danger)'}">
      <span>свободные деньги</span><span>${money(st.summary.cash)} / ${money(broker.cash)}${
        ok && gap > 0.01 ? ` <span class="muted">· ${dec(gap.toFixed(2))} ₽ округления</span>` : ''}</span></div>`;
    })()
      + (unnamed ? `<div class="muted" style="margin-top:10px;line-height:1.6">
          Названия ${unnamed} ${unnamed === 1 ? 'бумаги' : 'бумаг'} брокер сейчас не отдал — они показаны
          техническим кодом, и строки выглядят как расхождение. Данные целы: обнови из Т-Инвестиций
          ещё раз, имена подставятся из запаса.</div>` : '')
      // Заметка со сверки. Записать расхождение в хранилище и никому его
      // не показать — то же самое, что скрыть: человек видит два разных
      // числа и не знает, поломка это или округление.
      + ((st.settings.tiNote || []).length
        ? `<div class="muted" style="margin-top:10px;line-height:1.6">${
            st.settings.tiNote.map(esc).join('<br>')}</div>` : '');
  }

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Диагностика</h2>
    <p class="muted" style="margin:0 0 14px">Слева — что насчитало приложение, справа — что говорит брокер.</p>

    ${line('сборка приложения', esc(BUILD))}
    ${line('журнал собран сборкой', esc(syncedBuild || '—'))}
    ${line('хранение данных', esc(storageName[storage.mode] || storage.mode))}
    ${line('открыто как', esc(openedLocally()
      ? `локальный файл (${String(location.protocol || '').replace(':', '')})`
      : 'страница по ссылке'))}
    ${line('токен', token ? 'сохранён' : 'нет')}
    ${line('счёт', esc(account || '—'))}
    ${line('последняя загрузка', esc(when(st.settings.tiSyncedAt)))}
    ${line('операций в журнале', st.ops.length)}
    ${line('из них резерв', (() => {
      // Подушка не приходит от брокера и живёт только здесь. Если её
      // записи исчезли, это видно сразу, а не через неделю на главной.
      const r = (st.ops || []).filter(o => o.type === 'reserve');
      return r.length
        ? `${r.length} на ${Math.round(r.reduce((a, o) => a + (Number(o.amount) || 0), 0)).toLocaleString('ru-RU')} \u20bd`
        : '<span style="color:var(--warn)">записей нет</span>';
    })())}
    ${line('бумаг в портфеле', mine.length)}

    ${problem ? `<div class="act attention" style="margin-top:14px">
      <h2 style="font-size:15px">Расхождение с брокером</h2>
      <p>${problem.map(esc).join('<br>')}</p></div>` : ''}
    ${lastError ? `<div class="act critical" style="margin-top:14px">
      <h2 style="font-size:15px">Ошибка связи</h2>
