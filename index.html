    ${brokerError ? `<div class="act critical" style="margin-top:14px">
      <h2 style="font-size:15px">Брокер не ответил</h2><p>${esc(brokerError)}</p></div>` : ''}

    <h3 style="margin:20px 0 6px;font-size:14px">Бумаги: приложение / брокер</h3>
    ${compare}

    <div style="height:16px"></div>
    <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
      <span class="muted">сборка на сервере</span>
      <span id="serverBuild">проверяю…</span>
    </div>
    <button class="btn ghost wide" id="bForceUpdate" style="margin:10px 0">Обновить приложение сейчас</button>
    <button class="btn ghost wide" id="bProbe" style="margin-bottom:10px">Проверить доступ к бирже</button>
    <div id="probeOut"></div>
    <button class="btn ghost wide" id="bProbeTi" style="margin-bottom:10px">Проверить доступ к Т-Банку</button>
    <div id="probeTiOut"></div>
    <button class="btn wide" id="bDiagSync">Собрать журнал заново</button>
    <div id="bDiagOut"></div>

    ${(() => {
      // Ошибки, пойманные и не показанные человеку. Пока их не было видно,
      // приложение объясняло происходящее неправильно: разбор падал, а на
      // экране стояло «биржа не ответила». Пусто здесь — хороший знак.
      const log = swallowedErrors();
      if (!log.length) return `<div id="diagSwallowed"><div style="height:16px"></div>
        <div class="muted" style="line-height:1.6">Пойманных и скрытых ошибок нет.
          Здесь появляется всё, что приложение проглотило само, — чтобы причина
          сбоя не подменялась догадкой.</div></div>`;
      return `<div id="diagSwallowed"><div style="height:16px"></div>
        <div class="muted" style="margin-bottom:6px">СКРЫТЫЕ ОШИБКИ (${log.length})</div>
        <div class="muted" style="line-height:1.6;margin-bottom:8px">Приложение поймало их само и
          продолжило работать. Если экран ведёт себя странно — причина, скорее всего, здесь.</div>
        ${log.map(e => `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
          <span class="muted">${esc(e.where)}${e.count > 1 ? ` · ${e.count} раза` : ''}</span>
          <span style="color:var(--warn);text-align:right">${esc(e.message)}</span>
        </div>`).join('')}</div>`;
    })()}`);

  // Что лежит на сервере — сразу, без ожидания действий человека.
  async function showServerBuild() {
    const cell = $('serverBuild');
    if (!cell) return;
    const seen = await checkForUpdate(false);   // только посмотреть, не перезагружаться
    cell.innerHTML = seen.server
      ? (seen.server === BUILD
          ? `${esc(seen.server)} — совпадает`
          : `<span style="color:var(--warn)">${esc(seen.server)} — новее, нажми «Обновить»</span>`)
      : `<span style="color:var(--danger)">${esc(seen.error || 'не удалось узнать')}</span>`;
  }
  showServerBuild();

  const force = $('bForceUpdate');
  if (force) force.onclick = () => forceUpdate();

  const probe = $('bProbe');
  if (probe) probe.onclick = async () => {
    const out = $('probeOut');
    if (!out) return;
    probe.disabled = true;

    // Каждый шаг со своим секундомером и своей защитой: если один запрос
    // повиснет, остальные всё равно отработают, а человек увидит частичный
    // итог сразу, а не будет смотреть в «проверяю…» две минуты.
    const cases = [
      ['крошечный запрос (индекс)',
       'https://iss.moex.com/iss/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID', 8000],
      ['страница акций (100 строк)',
       'https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities.json?iss.meta=off&iss.only=securities&securities.columns=SECID&start=0', 15000],
      ['история выплат одной бумаги',
       'https://iss.moex.com/iss/securities/SBER/dividends.json?iss.meta=off', 10000]
    ];

    const rows = [];
    const draw = (note) => {
      out.innerHTML = `<div style="margin:8px 0">${rows.map(r => `
        <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
          <span class="muted" style="flex:1">${esc(r.name)}</span>
          <span style="text-align:right;white-space:nowrap;color:${r.ok ? 'var(--ok)' : 'var(--danger)'}">${
            r.ok ? `ответ за ${dec1(r.ms / 1000)} с` : `сбой за ${dec1(r.ms / 1000)} с`}</span>
        </div>${r.ok ? '' : `<div class="muted" style="font-size:11px;padding:2px 0 6px">${esc(r.error)}</div>`}`).join('')}
        ${note ? `<div class="muted" style="margin-top:8px;line-height:1.6">${esc(note)}</div>` : ''}</div>`;
    };

    for (const [name, url, ms] of cases) {
      rows.push({ name, ok: false, ms: 0, error: 'идёт запрос…' });
      draw('Проверяю…');
      const started = Date.now();
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), ms);
        const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
        clearTimeout(timer);
        if (!res.ok) throw new Error(`биржа ответила кодом ${res.status}`);
        await res.json();
        rows[rows.length - 1] = { name, ok: true, ms: Date.now() - started };
      } catch (err) {
        const msg = err && err.name === 'AbortError'
          ? `не ответила за ${(ms / 1000).toFixed(0)} с`
          : (err && err.message ? err.message : String(err));
        rows[rows.length - 1] = { name, ok: false, ms: Date.now() - started, error: msg };
      }
      draw('Проверяю…');
    }

    const allOk = rows.every(r => r.ok);
    draw(allOk
      ? 'Биржа доступна полностью. Если разделы рынка всё равно пусты — покажи этот экран разработчику.'
      : rows[0].ok
        ? 'Мелкий запрос проходит, крупный — нет: ограничение по объёму или времени в сети.'
        : 'Не проходит даже крошечный запрос: доступ к бирже закрыт целиком — сеть оператора, VPN или сбой самой биржи. '
          + 'Проверь тем же адресом в браузере: iss.moex.com/iss/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json');
    probe.disabled = false;
  };

  /**
   * ПРОВЕРКА ДОСТУПА К Т-БАНКУ. Отдельная от биржевой: адреса разные, и
   * работающая биржа не говорит о брокере ничего. Ходим по каждому хосту
   * по очереди и различаем три исхода, которые в одном слове «нет связи»
   * сливались в один: запрос не дошёл вовсе, брокер ответил отказом,
   * брокер ответил делом. Первый — сеть или блокировка, второй — токен
   * или лимит, и лечатся они по-разному.
   */
  const probeTi = $('bProbeTi');
  if (probeTi) probeTi.onclick = async () => {
    const out = $('probeTiOut');
    if (!out) return;
    probeTi.disabled = true;
    const token = await store.getMeta('tiToken');
    const hosts = ['https://invest-public-api.tinkoff.ru/rest',
                   'https://invest-public-api.tbank.ru/rest'];
    const rows = [];
    const draw = note => {
      out.innerHTML = `<div style="margin:8px 0">${rows.map(r => `
        <div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)">
          <span class="muted" style="flex:1">${esc(r.name)}</span>
          <span style="text-align:right;white-space:nowrap;color:${r.ok ? 'var(--ok)' : 'var(--danger)'}">${
            r.ok ? `ответ за ${dec1(r.ms / 1000)} с` : `сбой за ${dec1(r.ms / 1000)} с`}</span>
        </div>${r.ok ? '' : `<div class="muted" style="font-size:11px;padding:2px 0 6px">${esc(r.error)}</div>`}`).join('')}
        ${note ? `<div class="muted" style="margin-top:8px;line-height:1.6">${esc(note)}</div>` : ''}</div>`;
    };

    // Токен нужен, только чтобы проверить сам токен. Дошёл ли запрос до
    // брокера — вопрос сети, и отвечать на него без секрета обязательно:
    // именно в чистом окне браузера, где токена ещё нет, и приходится
    // выяснять, почему связи нет. Раньше проверка тут просто отказывалась
    // работать — ровно там, где была нужнее всего.

    let reached = false, refused = false, blocked = false;
    for (const host of hosts) {
      const name = host.replace('https://', '').replace('/rest', '');

      // ШАГ 1: доходит ли вообще до адреса. Запрос «без чтения ответа»
      // (no-cors) не требует разрешения на чужую страницу: он проходит,
      // если сеть дошла до сервера, и падает, если не дошла. Прочитать
      // ответ нельзя, но нам и не надо — нужен сам факт.
      //
      // Это отличает две беды, которые браузер сообщает одним словом
      // «Failed to fetch»: сети нет и сеть есть, но сайт не пускает чужую
      // страницу. Лечатся они по-разному, а выглядели одинаково.
      let alive = false;
      const t0 = Date.now();
      try {
        const c0 = new AbortController();
        const tm0 = setTimeout(() => c0.abort(), 8000);
        await fetch(host, { method: 'GET', mode: 'no-cors', cache: 'no-store', signal: c0.signal });
        clearTimeout(tm0);
        alive = true;
      } catch { alive = false; }
      rows.push({ name: `${name} — адрес отвечает`, ok: alive, ms: Date.now() - t0,
                  error: alive ? '' : 'до адреса не достучаться: сеть, DNS или блокировка' });
      draw('Проверяю…');

      const label = `${name} — запрос ${token ? 'с токеном' : 'без токена'}`;
      rows.push({ name: label, ok: false, ms: 0, error: 'идёт запрос…' });
      draw('Проверяю…');
      const started = Date.now();
      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 10000);
        const res = await fetch(`${host}/tinkoff.public.invest.api.contract.v1.UsersService/GetAccounts`, {
          method: 'POST', signal: controller.signal,
          headers: token
            ? { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }
            : { 'Content-Type': 'application/json' },
          body: '{}'
        });
        clearTimeout(timer);
        reached = true;
        // Без токена отказ 401 — это УСПЕХ проверки: запрос дошёл, брокер
        // на связи и ответил по существу. Проверять было нечего только
        // про сам токен.
        if (!token && (res.status === 401 || res.status === 403)) {
          rows[rows.length - 1] = { name: label, ok: true, ms: Date.now() - started };
        } else if (!res.ok) {
          refused = true;
          throw new Error(res.status === 401 || res.status === 403
            ? `отказ ${res.status}: токен не принят — отозван, истёк или скопирован не целиком`
            : res.status === 429 ? 'отказ 429: слишком много запросов, подожди минуту'
            : `брокер ответил кодом ${res.status}`);
        } else {
          await res.json();
          rows[rows.length - 1] = { name: label, ok: true, ms: Date.now() - started };
        }
      } catch (err) {
        // Адрес отвечает, а запрос падает — значит брокер не пускает
        // страницу. Ни токен, ни сеть тут ни при чём.
        if (alive && !reached) blocked = true;
        const msg = err && err.name === 'AbortError' ? 'не ответил за 10 с'
          : alive && !reached ? 'адрес отвечает, но запрос со страницы не пропущен'
          : (err && err.message ? err.message : String(err));
        rows[rows.length - 1] = { name: label, ok: false, ms: Date.now() - started, error: msg };
      }
      draw('Проверяю…');
    }

    const anyOk = rows.some(r => r.ok && / запрос (с|без) токеном?$/.test(r.name));
    draw(anyOk
      ? (token
          ? 'Брокер доступен и токен принят. Если журнал всё равно не обновляется — покажи этот экран разработчику.'
          : 'Брокер доступен: запрос дошёл и получил ответ. Токен не проверялся — его здесь нет.')
      : refused
        ? 'Запрос доходит, но брокер отказывает — дело в токене или в лимите, а не в сети. '
          + 'Токен выпускается заново в приложении Т-Инвестиций.'
        : blocked
          ? 'Адрес брокера отвечает, но запросы с этой страницы он не пропускает. Это не сеть и не токен: '
            + 'так выглядит запрет на обращения с чужого сайта, и снять его может только сам брокер. '
            + 'Обычно это временно. Пока не починится, портфель можно обновлять отчётами: '
            + '«Ещё» → «Другие источники».'
          : 'Запрос не дошёл ни до одного адреса брокера, а биржа при этом отвечает. '
            + 'Самая частая причина сейчас — не сеть, а сертификат безопасности: российские банки '
            + 'перешли на сертификаты Минцифры, и Chrome, Safari и Edge их не принимают. Отказ тогда '
            + 'приходит мгновенно, за доли секунды, и выглядит как обрыв связи. Лечится двумя способами: '
            + 'открыть приложение в Яндекс.Браузере — там этот сертификат уже встроен, — либо установить '
            + 'сертификаты Минцифры с Госуслуг (на Android: Настройки → Безопасность → Шифрование и '
            + 'учётные данные → Установить сертификат → Сертификат CA). Если отказ идёт долго, а не '
            + 'мгновенно, — тогда это сеть: оператор, VPN или DNS.');
    probeTi.disabled = false;
  };

  $('bDiagSync').onclick = async () => {
    $('bDiagOut').innerHTML = '<div class="muted" style="margin-top:12px">Забираю историю…</div>';
    try {
      const r = await guardJournal(() => store.syncTinvest({ force: true }));
      if (r.ok === false) {
        $('bDiagOut').innerHTML = `<div class="err" style="margin-top:10px">${r.problems.map(esc).join('<br>')}</div>`;
        return;
      }
      closeSheet(); render();
    } catch (err) { $('bDiagOut').innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; }
  };
}

/**
 * Выплаты по бумагам: сначала спрашиваем брокера, потом биржу.
 * Один вход для всех экранов, чтобы советы и денежный поток считались
 * из одного источника и не расходились между собой.
 */
/**
 * Запоминаем измеренную доходность облигаций: она нужна прогнозу на главной,
 * где сети может не быть. Хранится вместе с датой — устаревшую не берём.
 */
async function rememberBondYtm(flow) {
  try {
    if (!flow || !flow.rows) return;

    // Дивидендная доходность своих акций — вторая измеримая величина
    // прогноза. Считаем её здесь же, по тем же строкам.
    let sv = 0, sw = 0;
    for (const r of flow.rows) {
      if (r.kind !== 'stock') continue;
      const st = await store.getState();
      const pos = st.positions.find(p => p.ticker === r.ticker);
      const v = pos ? pos.qty * pos.price : 0;
      if (v > 0) { sv += v; sw += v * (r.yieldPct || 0); }
    }
    if (sv > 0) {
      await store.setMeta('stockYield', { date: new Date().toISOString().slice(0, 10), value: sw / sv });
    }

    let value = Number(flow.bondYtm) || 0;
    if (!(value > 0)) {
      // Данные приходят двумя путями — от брокера и с биржи, — и во втором
      // случае средневзвешенной доходности в ответе нет. Считаем сами.
      const st = await store.getState();
      let sum = 0, weighted = 0;
      for (const r of flow.rows) {
        if (!(r.ytm > 0)) continue;
        const pos = st.positions.find(p => p.ticker === r.ticker);
        const v = pos ? pos.qty * pos.price : 0;
        if (v > 0) { sum += v; weighted += v * r.ytm; }
      }
      value = sum > 0 ? weighted / sum : 0;
    }
    if (!(value > 0)) return;
    const today = new Date().toISOString().slice(0, 10);
    const prev = await store.getMeta('bondYtm');
    if (prev && prev.date === today && Math.abs((prev.value || 0) - value) < 0.0005) return;
    await store.setMeta('bondYtm', { date: today, value });
  } catch { /* не смогли измерить — прогноз останется на допущении */ }
}

async function portfolioFacts() {
  const token = await store.getMeta('tiToken');
  const account = await store.getMeta('tiAccount');
  if (token && account) {
    // Состояние берётся здесь. Раньше строка ниже читала `st` из воздуха:
    // такой переменной в этой функции нет и не было, и при подключённом
    // брокере вызов падал с «st is not defined» ВСЕГДА. Ошибку глотал
    // потолок ожидания, план получал пустые выплаты и писал, что биржа не
    // ответила, — при полностью доступной бирже.
    const st = await store.getState();
    const known = (await store.getMeta('uidTickers')) || {};
    const book = await withLimit(store.tiPortfolio(token, account, known), 12, null);
    if (book) {
      const facts = await withLimit(store.tiFacts(token, book.rows, st.settings), 25, null);
      if (facts && facts.rows.length) { await rememberBondYtm(facts); return facts; }
    }
  }
  const flow = await withLimit(store.cashflowSummary(), 10,
    { rows: [], dividends: [], totalNet: 0, yieldOnPortfolio: 0, monthly: 0 });
  await rememberBondYtm(flow);
  return flow;
}

/** Разбор портфеля с названиями бумаг: что докупить, что переложить и почему. */
async function openPlan() {
  ideaResult = null;   // прошлая выборка устарела: рынок с тех пор изменился
  openSheet('<div class="muted">Считаю. Спрашиваю у биржи купоны и дивиденды — не дольше десяти секунд…</div>');
  const st = await store.getState();
  // Потолок жёсткий: лучше план без биржевых довесков через десять секунд,
  // чем полный через минуту — «Считаю…» дольше этого читается как «зависло».
  const flowWhy = {};
  const flow = await withLimit(portfolioFacts(), 10,
    { rows: [], dividends: [], totalNet: 0, yieldOnPortfolio: 0, monthly: 0 }, flowWhy);
  const market = await withLimit(store.marketContext(), 4, {}) || {};

  const plan = store.rebalancePlan(st, flow, market);

  openSheet(`<h2 style="margin:0 0 6px;font-size:19px">Что стоит сделать</h2>
    <p class="muted" style="margin:0 0 14px;line-height:1.6">
      ${plan.length
        ? 'Всё ниже посчитано из твоих долей, выплат и ставки. Приложение не знает, что вырастет, — поэтому советует только то, что можно проверить.'
        : 'Доли по классам в норме, перекосов нет. Продолжай регулярные пополнения — это и есть план.'}
      ${!flow.rows.length ? `<br><br><b style="color:var(--warn)">${
          flowWhy.reason === 'error' ? 'Биржа ответила отказом' : 'Купоны и дивиденды не успели прийти'
        }</b> — советы посчитаны только по долям, без купонов и дивидендов. `
        + (flowWhy.reason === 'error'
          // Отказ — это ответ, и его текст надо показать: гадать не о чем.
          ? `Биржа ответила за доли секунды, но отказом: ${
              esc((flowWhy.error && (flowWhy.error.message || String(flowWhy.error))) || 'причина не названа')}. `
            + 'Обнови ещё раз; если повторится — покажи это разработчику.'
          : openedLocally()
          // Файл с устройства — тогда причина почти всегда в этом.
          ? 'Обычно так бывает, когда файл открыт прямо с устройства.'
          // Открыто по ссылке — прежняя подсказка была прямой неправдой:
          // человек читал «файл открыт с устройства», глядя на адресную
          // строку с сайтом. Виновата задержка биржи, а не способ запуска.
          // И «не ответила» тоже неправда: потолок в десять секунд стоит на
          // обход ВСЕХ бумаг сразу, каждая из которых отвечает быстро.
          : 'Страница открыта по ссылке, так что дело не в способе запуска. Десять секунд — '
            + 'потолок на опрос всех бумаг сразу, а не на один запрос. Обнови ещё раз или загляни '
            + 'в «Ещё» → «Диагностика» → «Проверить доступ к бирже».') : ''}
      ${(() => {
        const at = st.settings.tiSyncedAt || st.settings.lastPriceUpdate;
        if (!at) return '';
        const hours = (Date.now() - at) / 3600000;
        const when = new Date(at).toLocaleString('ru-RU').slice(0, 17);
        return hours > 24
          ? `<br><br><b style="color:var(--warn)">Цены от ${when} — старше суток.</b> Советы посчитаны по ним; открой приложение при интернете, и всё обновится само.`
          : `<br><br>Посчитано по ценам на ${when}.`;
      })()}</p>

    <div id="verdictBox">${(() => {
      const v = verdict(st, {
        contribution: contributionPlan(st, flow),
        moneyRate: market.moneyRate > 0 ? market.moneyRate / 100 : 0,
        rateSource: market.moneyRateSource || null,
        inflation: Number(st.settings.inflation) || 0,
        yearDeposits: st.yearDeposits || 0
      });
      if (!v) return '';
      return `<div class="act attention" style="margin-bottom:12px">
        <div class="tag">Вердикт</div>
        <h2 style="font-size:17px;margin-bottom:8px">Что делать по порядку</h2>
        ${v.steps.map((x, i) => `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="font-weight:650;line-height:1.5">${i + 1}. ${esc(x.what)}</div>
          <div class="muted" style="margin-top:4px;line-height:1.6">${esc(x.why)}</div>
        ${x.how ? `<div style="margin-top:6px">${x.how.map((h, k) => `<div class="muted" style="line-height:1.55;padding:2px 0;opacity:.9">— ${esc(h)}</div>`).join('')}</div>` : ''}
        </div>`).join('')}
        <div id="verdictSwap"><div class="muted" style="padding:8px 0;border-top:1px solid var(--line);line-height:1.6">
          Сравниваю твои бумаги с рынком — если найдётся выгодная замена, она появится здесь.</div></div>
        ${v.avoid && v.avoid.length ? `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
          <div style="font-weight:700;font-size:14px;margin-bottom:6px">Чего сейчас делать не надо</div>
          ${v.avoid.map(a => `<div style="padding:7px 0">
            <div style="font-weight:600;line-height:1.5">${esc(a.what)}</div>
            <div class="muted" style="margin-top:3px;line-height:1.6">${esc(a.why)}</div>
          </div>`).join('')}
        </div>` : ''}
        <p style="margin-top:10px;line-height:1.65">${esc(v.plan)}</p>
        <p class="muted" style="margin-top:8px;line-height:1.65">${esc(v.caution)}</p>
      </div>`;
    })()}</div>

    ${(() => {
      const yo = yearOutlook(st.summary.byClass, st.summary.securities, 0,
        store.ratesFor(st.settings.bondYtm || 0, st.settings.stockYield || 0).rates, st.positions);
      if (!yo) return '';
      return `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">Ближайший год — честно о шансах</h2>
        <p>С текущими долями портфель заканчивает год в плюсе примерно в ${Math.round(yo.chance * 100)} случаях из 100.
        Разброс через год: плохой исход ${money(yo.bad)}, середина ${money(yo.median)}, удачный ${money(yo.good)}.</p>
        <p class="muted" style="margin-top:8px">Гарантированного роста на рынке не существует — кто обещает, тот врёт.
        Почти гарантированный годовой результат дают только облигации, погашаемые в пределах года, и деньги под ставку —
        ценой доходности около неё. Любая доля акций меняет гарантию на ожидание.</p>
      </div>`;
    })()}
    ${(() => {
      const cp = contributionPlan(st, flow);
      if (!cp) return '';
      const clsName = { stocks: 'акции', bonds: 'облигации', hedge: 'защита' };
      const pc = plannedContribution(st);
      return `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">Ближайший взнос ${money(cp.amount)} — куда именно</h2>
        <div class="row" style="margin:8px 0">
          <input type="number" id="fPlanAmount" inputmode="numeric" value="${cp.amount}" style="flex:2;margin:0">
          <button class="btn" id="bPlanRecalc" style="flex:1">Пересчитать</button>
        </div>
        <p class="muted" style="margin:0 0 8px">${pc.overridden
          ? `В этом месяце — ${money(pc.amount)} вместо обычных ${money(pc.base)}. Со сменой месяца вернётся база; база меняется в настройках.`
          : `База — ${money(pc.base)} в месяц из настроек. Впиши другую сумму, если в этом месяце вносишь иначе, — правка живёт один месяц.`}</p>
        ${cp.steps.map(t => `<p style="margin:6px 0">${money(t.amount)} → <b>${
          t.name ? esc(t.name) : `${clsName[t.cls]}: нужна новая бумага`}</b>${
          t.lots != null ? (t.lots > 0
            ? ` — ${t.lots} шт по ${dec(t.price)} ₽${t.lotSize > 1 ? ` (${t.wholeLots} ${t.wholeLots === 1 ? 'лот' : t.wholeLots < 5 ? 'лота' : 'лотов'} по ${t.lotSize})` : ''}${
                t.leftover > 50 ? `, останется ${money(t.leftover)}` : ''}`
            : ` <span style="color:var(--warn)">— ${t.lotSize > 1 ? `лот из ${t.lotSize} шт` : 'одна штука'} дороже этой части взноса, копи или измени деление</span>`) : ''}${
          t.blockReason ? `<br><span class="muted">${esc(t.blockReason)}</span>` : ''}${
          // Покупка за пределом доли — не мелочь: приложение обязано сказать,
          // что советует то, против чего само же предостерегает.
          t.stretchNote ? `<br><span style="color:var(--warn)">${esc(t.stretchNote)}</span>` : ''}</p>`).join('')}
        ${(() => {
          // «БЫЛО → СТАНЕТ». Совет без последствия — это мнение. Пока
          // изменение не показано числом, сравнить два решения нельзя.
          const eff = SH.planEffect(st, cp);
          if (!eff) return '';
          const row = c => {
            const same = c.fmt(c.from) === c.fmt(c.to);
            return `<div class="diff" style="display:flex;justify-content:space-between;padding:4px 0">
              <span>${esc(c.title)}</span>
              <span>${esc(c.fmt(c.from))} → <b>${esc(c.fmt(c.to))}</b>${
                same ? ' <span class="muted">без изменений</span>' : ''}</span></div>`;
          };
          return `<div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)">
            <div style="font-weight:700;font-size:14px;margin-bottom:6px">Что изменится после покупки</div>
            ${eff.changes.map(row).join('')}
            <p class="muted" style="margin:8px 0 0;line-height:1.6">Показано только то, что меняется
              наверняка: доли, риск и деньги на счёте. Вероятность дойти до цели один взнос двигает
              на доли процента — показывать такое движение значило бы выдавать шум за результат.</p>
          </div>`;
        })()}
        <p class="muted" style="margin-top:8px">Деление — по недобору до целевых долей, посчитанному от суммы ПОСЛЕ взноса: класс, отстающий сильнее, получает больше. Поэтому класс, сегодня стоящий чуть выше цели, всё равно получает часть — иначе сам взнос сдвинул бы его долю вниз. Внутри класса названа бумага с наибольшей фактической доходностью из уже имеющихся.</p>
      </div>`;
    })()}

    ${(() => {
      const card = a => `<div class="act ${a.urgency}" style="margin-bottom:10px">
        <h2 style="font-size:16px">${esc(a.title)}</h2>
        <p>${esc(a.detail)}</p>
        ${a.cost ? `<p class="muted" style="margin-top:6px;line-height:1.6">Чего это стоит числом: из-за перекоса
          разброс портфеля ${pct(a.cost.volNow)} вместо ${pct(a.cost.volTrim)},
          и в плохой год разница примерно <b>${money(a.cost.costInBadYear)}</b>. Это не потеря, а плата за то,
          что судьба портфеля сильнее зависит от одной компании.</p>` : ''}
        ${a.note ? `<p class="muted" style="margin-top:8px">${esc(a.note)}</p>` : ''}
      </div>`;
      // Три карточки — читаются; десять подряд — пролистываются. Хвост
      // прячется за кнопкой, но не исчезает: одна лишняя карточка кнопки
      // не заслуживает и показывается сразу.
      const VISIBLE = 3;
      const collapse = plan.length > VISIBLE + 1;
      const shown = collapse ? plan.slice(0, VISIBLE) : plan;
      const hidden = collapse ? plan.slice(VISIBLE) : [];
      const word = n => n === 1 ? 'подсказку' : n < 5 ? 'подсказки' : 'подсказок';
      return shown.map(card).join('')
        + (hidden.length ? `<div id="planMore" style="display:none">${hidden.map(card).join('')}</div>
          <button class="btn ghost wide" id="bPlanMore" style="margin-bottom:10px">Показать ещё ${hidden.length} ${word(hidden.length)}</button>` : '');
    })()}

    <h3 style="margin:20px 0 6px;font-size:15px">Что можно купить на рынке</h3>
    <div id="ideasOut"><div class="muted" style="line-height:1.6">Ищу по всей Мосбирже под твою стратегию…</div></div>

    <h3 style="margin:20px 0 6px;font-size:15px">Что можно поменять</h3>
    <div id="swapsOut"><div class="muted" style="line-height:1.6">Сравниваю каждую твою бумагу с рынком…</div></div>

    ${plan.length ? `<div style="height:6px"></div>
      <button class="btn ghost wide" id="bBuyManual">Разобрать конкретную покупку</button>` : ''}`);

  const manual = $('bBuyManual');
  if (manual) manual.onclick = openBuyAdvisor;

  // ── «Идеи» ──
  const setKind = k => { ideaKind = k; ideaResult = null; render(); };
  const kb = $('bKindBonds'), ks = $('bKindStocks'), kw = $('bKindSwap');
  if (kb) kb.onclick = () => setKind('bonds');
  if (ks) ks.onclick = () => setKind('stocks');
  if (kw) kw.onclick = () => setKind('swap');

  // Поиск по рынку запускается САМ и не задерживает лист: человек видит план
  // сразу, а разделы дозаполняются по мере ответа биржи. Кнопки убраны —
  // если возможностью не пользуются, виноват интерфейс, а не человек.
  const marketRate = async () => {
    const m = await withLimit(store.marketContext(), 4, {}) || {};
    return moneyRate(m.moneyRate / 100);
  };

  // Какой класс искать: тот, которого не хватает сильнее. Защиту скринер
  // не ищет — у золота нет ни выплат, ни срока, сравнивать нечем.
  // Доля защиты считается наравне с остальными. Раньше её тут не было, и
  // `shares.hedge` выходило undefined: gapHedge становился NaN, любое
  // сравнение с ним — ложью, и ветка защиты ниже не выбиралась никогда.
  // Поиск молча уходил в акции даже тогда, когда сильнее всего не хватало
  // золота, — а текст «искал защиту» лежал мёртвым кодом.
  const shares = st.summary.securities > 0
    ? { stocks: (st.summary.byClass.stocks || 0) / st.summary.securities,
        bonds: (st.summary.byClass.bonds || 0) / st.summary.securities,
        hedge: (st.summary.byClass.hedge || 0) / st.summary.securities }
    : { stocks: 0, bonds: 0, hedge: 0 };
  const gapStocks = (st.targets.stocks || 0) - shares.stocks;
  const gapBonds = (st.targets.bonds || 0) - shares.bonds;
  const gapHedge = (st.targets.hedge || 0) - shares.hedge;
  // Раньше защита пропускалась: «у золота нет ни выплат, ни срока». Но
  // именно её чаще всего и не хватает, а купить её можно — фондами.
  const kind = gapHedge >= gapBonds && gapHedge >= gapStocks ? 'hedge'
             : gapBonds >= gapStocks ? 'bonds' : 'stocks';

  async function fillMarketIdeas() {
    const box = $('ideasOut');
    if (!box) return;
    try {
      const goalYears = Number(st.settings.goal?.years) || 0;
      const rate = await marketRate();
      const filters = kind === 'hedge' ? {}
        : kind === 'bonds'
        ? { minYTM: Math.max(0.10, rate - 0.01), maxYears: goalYears || 5 }
        : { minYield: 0.06, minStreak: 3 };
      // Выплаты по своим бумагам уже посчитаны — отдаём их поиску как
      // запасной источник на случай, если биржа промолчит.
      const knownYields = (flow.rows || [])
        .filter(x => x.yieldPct > 0)
        .map(x => ({ ticker: x.ticker, yieldPct: x.yieldPct, streak: x.streak || 0 }));
      const why = {};
      const res = await withLimit(store.findIdeas(kind, filters, { knownYields }), 45, null, why);
      if (!box.isConnected && !box.innerHTML) return;      // лист закрыли — молча уходим
      if (!res) {
        box.innerHTML = marketFailureNote(why, store.lastMarketStage('ideas'),
          'Поиск по рынку сейчас недоступен; всё остальное в плане посчитано и работает.',
          'Мосбиржа недоступна с этого устройства. Чаще всего её режет VPN — выключи его и обнови '
          + 'страницу. Данные брокера идут другим путём, поэтому портфель и советы работают, '
          + 'а поиск по рынку — нет.');
        return;
      }
      const st2 = await store.getState();
      ideaResult = { rows: res.rows, market: res.market,
        bondYtm: Number(st2.settings.bondYtm) || 0,
        rec: SH.buyRecommendations(st2, res.rows),
        criteria: kind === 'hedge'
          ? `Искал защиту: фонды на золото — их не хватает сильнее всего (${pct(shares.hedge)} при цели ${((st.targets.hedge || 0) * 100).toFixed(0)}%). Золото дорожает, когда дешевеют акции; выплат оно не приносит.`
          : kind === 'bonds'
          ? `Искал облигации: доходность к погашению от ${pct(filters.minYTM)} (ориентир — денежный рынок) и погашение не позже ${filters.maxYears} лет, до твоей цели. Их не хватает сильнее всего.`
          : `Искал акции: выплаты за 12 месяцев от 6% и минимум 3 года подряд. Их не хватает сильнее всего.` };
      box.innerHTML = renderIdeas(ideaResult);
      bindIdeaButtons();
    } catch (err) {
      box.innerHTML = `<div class="muted">Поиск по рынку не удался: ${esc(err.message || String(err))}</div>`;
    }
  }
  fillMarketIdeas();

  async function fillReplacements() {
    const box = $('swapsOut');
    if (!box) return;
    try {
      const why = {};
      // Одна величина на оба ограничения. Срок внутри поиска чуть короче
      // потолка снаружи: поиск должен успеть вернуть собранное сам, а не
      // быть срезанным гонкой вместе с ним.
      const budget = 60;
      const r = await withLimit(
        store.findReplacements({ deadline: Date.now() + (budget - 8) * 1000 }),
        budget, null, why);
      if (!r) {
        box.innerHTML = marketFailureNote(why, store.lastMarketStage('swaps'),
          'Сравнение с рынком сейчас недоступно.',
          'Мосбиржа недоступна с этого устройства — скорее всего, из-за VPN. Сравнение с рынком '
          + 'появится, как только биржа станет доступна.');
        return;
      }
      box.innerHTML = renderIdeas({ swaps: r.ideas, checked: r.checked })
        // Половина сравнения — не полное сравнение, и об этом надо сказать
        // прямо здесь, а не оставлять человека думать, что рынок проверен
        // целиком и замен просто нет.
        + ((r.missed && r.missed.length)
          ? `<div class="muted" style="margin-top:10px;line-height:1.6">Проверено не всё: ${
              r.missed.map(m => `${esc(m.what)} сравнить не удалось${m.why ? ` (${esc(m.why)})` : ''}`).join(', ')
            }. Остальное сравнено с рынком как обычно; обнови ещё раз, чтобы дособрать.</div>`
          : '');
      bindIdeaButtons();

      // Вердикт составлен до ответа биржи. Появилась выгодная замена —
      // дополняем ТОЛЬКО отведённое ей место. Раньше пересобирался весь
      // вердикт, и текст под пальцем менялся прямо во время чтения:
      // человек листал, а карточки прыгали.
      const slot = $('verdictSwap');
      if (slot && r.ideas && r.ideas.length) {
        const x = r.ideas[0];
        slot.innerHTML = `<div style="padding:8px 0;border-top:1px solid var(--line)">
          <div style="font-weight:650;line-height:1.5">Ещё: поменять ${esc(x.title)}</div>
          <div class="muted" style="margin-top:4px;line-height:1.6">${esc(x.detail)}</div>
          <button class="btn ghost wide" data-swap="0" style="margin-top:8px">Как сделать этот обмен</button>
        </div>`;
        bindIdeaButtons();
      } else if (slot) {
        slot.innerHTML = `<div class="muted" style="padding:8px 0;border-top:1px solid var(--line);line-height:1.6">
          Замен, которые окупали бы комиссии, на рынке сейчас нет — это тоже ответ.</div>`;
      }

    } catch (err) {
      box.innerHTML = `<div class="muted">Сравнение с рынком не удалось: ${esc(err.message || String(err))}</div>`;
    }
  }
  fillReplacements();

  const more = $('bPlanMore');
  if (more) more.onclick = () => { $('planMore').style.display = 'block'; more.style.display = 'none'; };

  const recalc = $('bPlanRecalc');
  if (recalc) recalc.onclick = async () => {
    const amount = Number($('fPlanAmount').value);
    if (!(amount > 0)) { $('fPlanAmount').focus(); return alert('Сумма должна быть больше нуля'); }
    const stNow = await store.getState();
    const month = plannedContribution(stNow).month;
    await store.setSetting('plannedThisMonth', { month, amount });
    openPlan();   // пересчитать и показать заново с новой суммой
  };
}

/**
 * Ключевая ставка: пробуем взять у ЦБ, иначе принимаем от человека.
 * Подсовывать вместо неё ставку денежного рынка приложение не станет —
 * это разные числа, и решения на них строятся разные.
 */
async function openKeyRate() {
  const st = await store.getState();
  const k = st.settings.keyRate;
  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Ключевая ставка ЦБ</h2>
    <p class="muted" style="margin:0 0 12px;line-height:1.6">Биржа её не публикует: RUSFAR и RUONIA —
      ставки денежного рынка, близкие, но другие. Приложение пробует получить ставку у Банка России;
      если браузер не пустит запрос на чужой сайт, впиши её сюда — это займёт десять секунд,
      а меняется она несколько раз в год.</p>

    ${k ? `<div class="diff">Сейчас: <b>${dec((k.rate * 100).toFixed(2))}%</b> от ${k.date.split('-').reverse().join('.')}
      · ${k.source === 'ЦБ' ? 'получена от ЦБ' : 'вписана вручную'}</div>` : ''}

    <label>Ключевая ставка, %</label>
    <input type="number" id="fKeyRate" inputmode="decimal" step="0.25" value="${k ? (k.rate * 100).toFixed(2) : ''}" placeholder="например, 16.5">
    <label>С какой даты действует</label>
    <input type="date" id="fKeyRateDate" value="${k ? k.date : new Date().toISOString().slice(0, 10)}">

    <label>Инфляция, % в год (допущение)</label>
    <input type="number" id="fInflation" inputmode="decimal" step="0.5" value="${(inflationRate(st.settings) * 100).toFixed(1)}">
    <p class="muted" style="margin:6px 0 0;line-height:1.6">Нужна, чтобы пересчитать цель в сегодняшние деньги.
      Будущую инфляцию не знает никто — это допущение, и приложение всегда называет его допущением.</p>

    <button class="btn wide" id="bKeyRateSave" style="margin-top:12px">Сохранить</button>
    <button class="btn ghost wide" id="bKeyRateFetch" style="margin-top:8px">Попробовать взять у ЦБ</button>
    <div id="keyRateOut"></div>

    <p class="muted" style="margin-top:12px;line-height:1.6">Посмотреть текущее значение можно на сайте
      Банка России — раздел «Ключевая ставка». Приложение не станет подставлять вместо неё похожее число:
      на ключевой строятся решения о вкладах и облигациях, и ошибка здесь дороже пустого поля.</p>`);

  const save = $('bKeyRateSave');
  if (save) save.onclick = async () => {
    const value = Number($('fKeyRate').value);
    const date = $('fKeyRateDate').value || new Date().toISOString().slice(0, 10);
    if (!(value > 0 && value < 100)) { $('fKeyRate').focus(); return alert('Ставка должна быть от 0 до 100%'); }
    const infl = Number($('fInflation').value);
    if (infl >= 0 && infl < 100) await store.setMeta('inflation', infl / 100);
    await store.setMeta('keyRate', { rate: value / 100, date, source: 'вручную', checked: null });
    closeSheet(); render();
  };

  const fetchBtn = $('bKeyRateFetch');
  if (fetchBtn) fetchBtn.onclick = async () => {
    const out = $('keyRateOut');
    out.innerHTML = '<div class="muted" style="margin-top:10px">Спрашиваю Банк России…</div>';
    const r = await withLimit(store.refreshKeyRate(), 12, null);
    out.innerHTML = r && r.source === 'ЦБ'
      ? `<div class="muted" style="margin-top:10px">Получено от ЦБ: <b>${dec((r.rate * 100).toFixed(2))}%</b> от ${r.date}.</div>`
      : `<div class="muted" style="margin-top:10px">Банк России не ответил странице — это ограничение браузера,
         а не сбой ставки. Впиши значение вручную: оно сохранится и будет использоваться в расчётах.</div>`;
  };
}
openKeyRate = guardSheet(openKeyRate);

/**
