/**
 * Загрузка истории сделок из брокерского отчёта.
 *
 * Самый точный способ: из сделок восстанавливаются настоящие средние цены,
 * доходность с учётом дат и полный журнал. Повторные загрузки не создают
 * дублей — сделка узнаётся по дате, бумаге, количеству и цене.
 */
async function importTrades(trades, cashOps = []) {
  if (!Array.isArray(trades)) trades = [];
  if (!trades.length && !cashOps.length) return { added: 0, skipped: 0 };

  // Одинаковые сделки внутри одного отчёта — обычное дело: крупная заявка
  // исполняется частями по одной цене. Поэтому считаем не «была ли такая»,
  // а сколько таких уже записано: повторная загрузка отчёта дублей не создаст,
  // но и настоящие парные сделки не потеряются.
  const sign = o => `${o.date}|${o.ticker || ''}|${o.qty != null ? o.qty : o.amount}|${o.price || ''}|${o.type}`;
  const existing = await db.allOps();
  const already = new Map();
  for (const o of existing) already.set(sign(o), (already.get(sign(o)) || 0) + 1);

  const fresh = [];
  const seen = new Map();
  let skipped = 0;

  for (const t of [...cashOps, ...trades]) {
    const key = sign(t);
    const nth = (seen.get(key) || 0) + 1;
    seen.set(key, nth);
    if (nth <= (already.get(key) || 0)) { skipped++; continue; }

    const op = (t.type === 'buy' || t.type === 'sell')
      ? makeOp(t.type === 'buy' ? OP.BUY : OP.SELL, {
          ticker: t.ticker, name: t.name, qty: t.qty, price: t.price,
          fee: t.fee, date: t.date, note: 'из брокерского отчёта' })
      : makeOp(t.type === 'deposit' ? OP.DEPOSIT : t.type === 'dividend' ? OP.DIVIDEND : OP.WITHDRAW, {
          amount: t.amount, date: t.date, ticker: t.ticker,
          note: t.type === 'dividend'
            ? `выплата ${t.gross ? t.gross + ' ₽, налог ' + t.tax + ' ₽' : ''}`.trim()
            : 'из брокерского отчёта' });

    if (!op) { skipped++; continue; }
    if (t.moexId) op.moexId = t.moexId;
    fresh.push(op);
  }

  if (fresh.length) await db.addOps(fresh);
  notify();
  return { added: fresh.length, skipped };
}

    if (legacy) {
      const parsed = JSON.parse(legacy);
      const assets = parsed.assets || parsed.holdings;
      if (Array.isArray(assets) && assets.length) {
        await db.migrateFromLocalStorage({
          assets: assets.map(a => ({

    }
  } catch { /* переносить нечего */ }

  await db.requestPersistence();

  // Прошлое обновление могло оборваться между удалением журнала и записью
  // нового. Тогда в хранилище осталась копия — состояние журнала после
  // обрыва неизвестно, поэтому возвращаем копию целиком: лучше устаревшее,
  // чем неполное.
  try {
    const bak = await db.getMeta('journalBackup');
    if (bak && Array.isArray(bak.ops)) {
      const cur = await db.allOps();
      for (const o of cur) await db.deleteOp(o.id);
      await db.addOps(bak.ops);
      await db.setMeta('journalBackup', null);
      await db.setMeta('tiProblem',
        ['Прошлое обновление оборвалось на середине — журнал восстановлен из копии. Обнови из Т-Инвестиций ещё раз.']);
    }
  } catch { /* копии нет — возвращать нечего */ }

  notify();
}

/**
 * Параллельная загрузка с ограничением. Двадцать запросов по очереди на
 * мобильной сети — это полминуты и почти гарантированный отказ по времени;
 * пять одновременно укладываются в секунды. Ошибка одной бумаги не рушит
 * остальные: у неё просто не будет выплат.
 */
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  const workers = Array.from({ length: Math.min(limit, items.length) }, async () => {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      try { out[i] = await fn(items[i], i); } catch { out[i] = null; }
    }
  });
  await Promise.all(workers);
  return out;
}

/**
 * Поиск идей: тянет список бумаг с биржи, обогащает фактическими выплатами
 * и отдаёт отбор. Дивиденды запрашиваются только по коротком списку —
 * двести запросов ради одного экрана недопустимы.
 */
// На каком шаге сейчас поиск. Нужно, чтобы при отказе по времени сказать
// не просто «биржа не ответила», а что именно не дождались.
let marketStage = null;
const lastMarketStage = () => marketStage;

async function findIdeas(kind, filters = {}) {
  marketStage = 'связь с биржей';
  if (!(await moex.pingExchange())) { marketStage = 'нет доступа к бирже'; return null; }
  marketStage = 'ставка денежного рынка';
  const st = await getState();
  const market = await marketContext();
  const ctx = {
    ownedTickers: st.positions.filter(p => p.qty > 0).map(p => p.ticker),
    targets: st.targets,
    currentShares: st.summary?.securities > 0
      ? { stocks: (st.summary.byClass.stocks || 0) / st.summary.securities,
          bonds: (st.summary.byClass.bonds || 0) / st.summary.securities,
          hedge: (st.summary.byClass.hedge || 0) / st.summary.securities }
      : {},
    goalYears: Number(st.settings?.goal?.years) || 0,
    moneyRate: market && market.moneyRate > 0 ? market.moneyRate / 100 : 0.16,
    marketYield: 0.08
  };

  if (kind === 'bonds') {
    marketStage = 'список облигаций';
    const rows = await moex.fetchAllBonds(filters.type ? [filters.type] : ['gov', 'corp']);
    return { rows: reports.screenBonds(rows, filters, ctx).slice(0, 40), total: rows.length, ctx };
  }

  marketStage = 'список акций';
  const all = await moex.fetchAllStocks();
  // Короткий список: сперва грубые фильтры без выплат, потом — по капитализации,
  // и только двенадцати лидерам считаем дивиденды. Двадцать запросов не
  // укладывались в отведённое время на мобильной сети.
  const rough = reports.screenStocks(all, { ...filters, minYield: 0, minStreak: 0 }, ctx)
    .sort((a, b) => (b.cap || 0) - (a.cap || 0))
    .slice(0, 12);
  marketStage = 'истории выплат';
  const histories = await mapLimit(rough, 6, r => moex.fetchDividendHistory(r.ticker));
  rough.forEach((r, i) => {
    const hist = histories[i];
    if (!hist) { r.streak = 0; r.yieldPct = 0; return; }
    r.streak = reports.payoutStreak(hist);
    r.yieldPct = reports.trailingYield(hist, r.price);
    r.lastPayout = hist.length ? hist[hist.length - 1] : null;
  });
  marketStage = null;
  return { rows: reports.screenStocks(rough, filters, ctx), total: all.length, ctx };
}

/**
 * Что поменять: тянет рынок и фактические данные по СВОИМ бумагам,
 * затем сравнивает. Свои облигации ищутся в общем списке биржи — оттуда
 * же берётся их сегодняшняя доходность к погашению; свои акции —
 * по истории выплат.
 */
async function findReplacements() {
  marketStage = 'связь с биржей';
  if (!(await moex.pingExchange())) { marketStage = 'нет доступа к бирже'; return null; }
  marketStage = 'портфель';
  const st = await getState();
  const owned = st.positions.filter(p => p.qty > 0);
  const facts = [];
  const candidates = [];

  const myBonds = owned.filter(p => allocationClass(p) === 'bonds');
  const myStocks = owned.filter(p => allocationClass(p) === 'stocks');

  if (myBonds.length) {
    marketStage = 'список облигаций';
    const all = await moex.fetchAllBonds(['gov']);
    const mine = new Set(myBonds.map(p => p.ticker));
    for (const r of all) {
      if (mine.has(r.ticker)) facts.push({ ticker: r.ticker, ytm: r.ytm, yearsLeft: r.yearsLeft });
      else candidates.push({ ...r, kind: 'bond' });
    }
  }

  if (myStocks.length) {
    // Свои акции — обязательно; кандидаты — двадцать крупнейших с рынка,
    // иначе это двести запросов истории выплат ради одного экрана.
    marketStage = 'список акций';
    const all = await moex.fetchAllStocks();
    const mine = new Set(myStocks.map(p => p.ticker));
    const shortlist = all.filter(r => !mine.has(r.ticker))
      .sort((a, b) => (b.cap || 0) - (a.cap || 0)).slice(0, 12);
    marketStage = 'истории выплат';
    const mineHist = await mapLimit(myStocks, 6, p => moex.fetchDividendHistory(p.ticker));
    myStocks.forEach((p, i) => {
      const row = all.find(r => r.ticker === p.ticker);
      const hist = mineHist[i];
      facts.push(hist
        ? { ticker: p.ticker, yieldPct: R2.trailingYield(hist, (row && row.price) || p.price),
            streak: R2.payoutStreak(hist) }
        : { ticker: p.ticker, yieldPct: 0, streak: 0 });
    });

    const candHist = await mapLimit(shortlist, 6, r => moex.fetchDividendHistory(r.ticker));
    shortlist.forEach((r, i) => {
      const hist = candHist[i];
      if (!hist) return;      // без истории выплат бумага в кандидаты не годится
      candidates.push({ ...r, kind: 'stock', yieldPct: R2.trailingYield(hist, r.price),
                        streak: R2.payoutStreak(hist) });
    });
  }

  marketStage = null;
  return { ideas: SH.replacementIdeas(st, candidates, { facts }), checked: candidates.length };
}

/**
 * Обновление из Т-Инвестиций.
 *
 * Записывает только то, что сошлось. Автоматическая загрузка опасна тем,
 * что молча портит журнал, если разбор ответа окажется неверным, — поэтому
 * сначала пересчитываем портфель из истории и сравниваем с тем, что брокер
 * показывает отдельно. Не сошлось — не пишем и говорим почему.
 */
async function syncTinvest({ silent = false, force = false } = {}) {
  const token = await db.getMeta('tiToken');
  const accountId = await db.getMeta('tiAccount');
  if (!token || !accountId) return { skipped: 'нет токена' };

  const before = await db.allOps();          // на случай, если ничего не сойдётся
  // Пересборка сначала удаляет журнал, потом пишет новый. Если между этими
  // шагами всё оборвётся — вкладку закрыли, база упала — копия в памяти
  // погибнет вместе со страницей. Поэтому она кладётся в само хранилище
  // и забирается оттуда при следующем запуске, если пересборка не дожила.
  await db.setMeta('journalBackup', { at: Date.now(), ops: before });
  let ops, book;
  try {
    ops = await tiOperations(token, accountId);
    book = await tiPortfolio(token, accountId, (await db.getMeta('uidTickers')) || {});
    if (book && book.resolved && Object.keys(book.resolved).length) {
      await db.setMeta('uidTickers', { ...((await db.getMeta('uidTickers')) || {}), ...book.resolved });
    }
  } catch (err) {
    await db.setMeta('tiLastError', { at: Date.now(), message: err.message || String(err) });
    throw err;
  }
  await db.setMeta('tiLastError', null);

  const draft = [];
  for (const t of [...ops.cash, ...ops.trades]) {
    const op = (t.type === 'buy' || t.type === 'sell')
      ? makeOp(t.type === 'buy' ? OP.BUY : OP.SELL, t)
      : makeOp(t.type === 'deposit' ? OP.DEPOSIT : t.type === 'dividend' ? OP.DIVIDEND
             : t.type === 'fee' ? OP.FEE : OP.WITHDRAW, t);
    if (op) draft.push(op);
  }

  // Сверять надо ЖУРНАЛ с портфелем брокера, а не свежескачанное само с собой.
  // Пока сравнивались только новые операции, двойники от прежних загрузок
  // оставались невидимыми: сверка проходила, а суммы были вдвое больше.
  const checkJournal = async () => {
    const all = await db.allOps();
    return tiReconcile(
      { positions: rebuildPositions(all).filter(p => p.qty > 0), cash: rebuildCash(all) }, book);
  };

  // force — журнал заведомо сомнителен: не дополняем его, а собираем заново.
  if (force) {
    const all = await db.allOps();
    for (const o of all) if (o.type !== OP.RESERVE) await db.deleteOp(o.id);
    await db.addOps(draft);
  } else {
    await importTrades(ops.trades, ops.cash);
  }
  let check = await checkJournal();

  // Не сошлось — значит в журнале есть лишнее. Собираем его заново
  // из истории брокера: она полная, других источников не требуется.
  if (!check.ok) {
    const all = await db.allOps();
    for (const o of all) if (o.type !== OP.RESERVE) await db.deleteOp(o.id);
    await db.addOps(draft);
    check = await checkJournal();
  }

  // Не сошлось даже после пересборки — значит я неверно разобрал ответ API.
  // Возвращаем журнал как был: лучше устаревшее, чем неверное.
  if (!check.ok) {
    const all = await db.allOps();
    for (const o of all) await db.deleteOp(o.id);
    await db.addOps(before);
    await db.setMeta('journalBackup', null);
    await db.setMeta('tiProblem', check.problems.slice(0, 6));
    if (!silent) notify();
    return { ok: false, problems: check.problems, ops, book };
  }

  if (book.prices.length) await updatePrices(book.prices);
  await db.setMeta('journalBackup', null);
  await db.setMeta('tiProblem', null);
  await db.setMeta('tiSyncedAt', Date.now());
  await db.setMeta('syncedBuild', BUILD_ID);
  if (!silent) notify();
  return { ok: true, added: draft.length, ops, book };
}

/**
 * Общий путь подключения: проверить токен, выбрать счёт, забрать историю.
 * Используется и на экране входа, и в настройках — чтобы поведение
 * не расходилось в двух местах.
 */
async function connectToken(token, outId) {
  const out = $(outId);
  if (!token) { out.innerHTML = '<div class="err" style="margin-top:10px">Вставь токен</div>'; return; }
  out.innerHTML = '<div class="muted" style="margin-top:12px">Соединяюсь…</div>';

  let accounts;
  try { accounts = await tiAccounts(token); }
  catch (err) { out.innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; return; }

  if (!accounts.length) {
    out.innerHTML = '<div class="err" style="margin-top:10px">Счетов не видно — возможно, у токена нет к ним доступа</div>';
    return;
  }
  await store.setMeta('tiToken', token);

  const saved = await store.getMeta('tiAccount');
  const guess = saved || (accounts.find(a => a.isIis) || accounts[0]).id;

  out.innerHTML = `
    <div class="diff" style="margin-top:14px;color:var(--ok)">Связь есть. Счетов: ${accounts.length}</div>
    ${accounts.length > 1 ? '<label style="margin-top:10px">Какой счёт вести</label>' : ''}
    <select id="wAcc" ${accounts.length > 1 ? '' : 'style="display:none"'}>
      ${accounts.map(a => `<option value="${esc(a.id)}" ${a.id === guess ? 'selected' : ''}>
        ${esc(a.name)}${a.isIis ? ' · ИИС' : ''}</option>`).join('')}</select>
    <button class="btn wide" id="wLoad" style="margin-top:6px">Загрузить портфель</button>
    <div id="wLoadOut"></div>`;

  const had = (await store.getState()).ops.filter(o => o.type !== 'reserve').length;

  $('wLoad').onclick = async () => {
    await store.setMeta('tiAccount', $('wAcc').value);
    $('wLoadOut').innerHTML = '<div class="muted" style="margin-top:12px">Забираю историю. Полминуты…</div>';
    let r;
    // Журнал уже наполнен — переписываем его целиком, иначе появятся двойники.
    try { r = await store.syncTinvest(); }
    catch (err) { $('wLoadOut').innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; return; }

    if (r.ok === false) {
      $('wLoadOut').innerHTML = `<div class="err" style="margin-top:10px"><b>Данные не сошлись с брокером</b><br>
        ${r.problems.slice(0, 5).map(esc).join('<br>')}<br><br>
        В журнал ничего не записано, чтобы не испортить историю.</div>`;
      return;
    }
    closeSheet();
    const st = await store.getState();
    if (!st.settings.monthlyExpenses) return openSetup();
    render();
  };
}

/**
 * Строка состояния. Ровно два случая: данные от брокера свежие или нет.
 * Запоминать цвета не нужно — написано словами, и во втором случае строка
 * нажимается и ведёт туда, где это чинится.
 */
function connectionLine(st) {
  const at = st.settings.tiSyncedAt;
  const live = st.settings.tiConnected && at && !st.settings.tiProblem;

  if (live) {
    const when = new Date(at);
    const mins = Math.round((Date.now() - at) / 60000);
    const stamp = mins < 1440
      ? 'в ' + when.toLocaleTimeString('ru-RU').slice(0, 5)
      : when.toLocaleDateString('ru-RU').slice(0, 5);
    return `<div class="muted" style="font-size:11.5px;margin:-4px 0 14px">
      Данные из Т-Инвестиций, обновлены ${stamp}</div>`;
  }

  return `<div id="connFix" style="margin:-4px 0 14px;padding:9px 11px;border-radius:9px;
      background:rgba(227,183,101,.12);cursor:pointer">
    <span style="font-size:12.5px;color:var(--warn);font-weight:650">
      Данные не от брокера — нажми, чтобы ввести токен</span></div>`;
}

function priceStatus(st) {
  if (!st.settings.lastPriceUpdate) return 'Цены ещё не загружались с биржи';
  const min = Math.round((Date.now() - st.settings.lastPriceUpdate) / 60000);
  if (min < 15) return 'Цены свежие (' + new Date(st.settings.lastPriceUpdate).toLocaleTimeString('ru-RU').slice(0, 5) + ')';
  if (min < 1440) return 'Цены обновлялись ' + (min > 60 ? Math.round(min / 60) + ' ч' : min + ' мин') + ' назад';
  return 'Цены устарели — обнови';
}

  const s = st.summary;
  const owned = st.positions.filter(p => p.qty > 0);

  // Группировка по классам — не украшение: именно в этих долях приложение
  // считает перекос, и видеть портфель надо в той же разбивке.
  const groups = [
    { key: 'stocks', title: 'Акции' },
    { key: 'bonds', title: 'Облигации' },
    { key: 'hedge', title: 'Защитные активы' }
  ];

  const block = g => {
    const list = owned.filter(p => allocationClass(p) === g.key)
      .sort((a, b) => positionValue(b) - positionValue(a));
    if (!list.length) return '';
    const sum = list.reduce((acc, p) => acc + positionValue(p), 0);
    const share = s.securities > 0 ? sum / s.securities : 0;
    const target = (st.targets || {})[g.key];

    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px">
        <h3 style="margin:0">${g.title}</h3>
        <span class="muted">${pct(share)}${target != null ? ' из ' + Math.round(target * 100) + '%' : ''}</span>
      </div>
      <div class="muted" style="margin-bottom:8px">${money(sum)}</div>
      ${list.map(p => {
        const v = positionValue(p), c = p.qty * p.avgPrice, diff = v - c, r = c > 0 ? diff / c : 0;
        const known = p.priceIsMarket;
        return `<div class="pos" data-sec="${esc(p.ticker)}" style="cursor:pointer">
          <div>
            <div class="t">${esc(p.name)}</div>
            <div class="n">${p.qty} шт · ${p.price} ₽${known ? '' : ' <span style="color:var(--warn)">цена покупки</span>'}</div>
          </div>
          <div class="v">
            <div>${money(v)}</div>
            <div class="p ${known ? (diff >= 0 ? 'up' : 'down') : 'muted'}">${known
              ? (diff >= 0 ? '+' : '−') + money(Math.abs(diff)) + ' · ' + (r * 100).toFixed(1) + '%'
              : '—'}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  };

  return `<div class="hero"><div class="lbl">Портфель</div>
      <div class="sum" style="font-size:30px">${money(s.securities)}</div>
      <div class="sub">${owned.length} ${owned.length === 1 ? 'бумага' : owned.length < 5 ? 'бумаги' : 'бумаг'}${
        st.returnRateReliable && st.returnRate != null
          ? ' · доходность ' + (st.returnRate * 100).toFixed(1) + '% годовых'
          : st.historyDays ? ' · история ' + st.historyDays + ' дн' : ''}</div></div>

    ${groups.map(block).join('')}
    ${owned.length ? '' : '<div class="card"><div class="muted">Бумаг пока нет.</div></div>'}

    ${(() => {
      const secs = Object.entries(s.bySector || {}).sort((a, b) => b[1] - a[1]);
      if (secs.length < 2 || !(s.securities > 0)) return '';
      return `<div class="card"><h3>Акции по секторам</h3>
        ${secs.map(([sec, v]) => {
          const w = v / s.securities;
          const col = w > 0.35 ? 'var(--warn)' : 'var(--info)';
          return `<div class="bar-row">
            <div>${esc(sec)}</div>
            <div class="track"><div class="fill" style="width:${Math.min(100, w * 100)}%;background:${col}"></div></div>
            <div class="val">${pct(w)}</div>
          </div>`;
        }).join('')}
        <div class="muted">Доли от всего портфеля. Бумаги одного сектора падают вместе — ориентир: не больше 35% в одном.
          Сектор определён по названию бумаги.</div>
      </div>`;
    })()}

    <div class="card"><h3>Разобраться подробнее</h3>
      <div class="rows" style="margin-top:2px">
        <button class="rowitem" id="bFlow">
          <span class="rt"><b>Сколько приносит портфель</b><span>Купоны и дивиденды за год, с налогом</span></span>
          <span class="chev"></span></button>
        <button class="rowitem" id="bCrash">
          <span class="rt"><b>Что будет при обвале рынка</b><span>Падение на 30% в рублях по каждому классу</span></span>
          <span class="chev"></span></button>
        ${st.settings.tiConnected ? '' : `<button class="rowitem" id="bSync3">
          <span class="rt"><b>Сверить с брокером</b><span>Вставить список позиций и увидеть расхождения</span></span>
          <span class="chev"></span></button>`}
      </div>
    </div>`;
}

// Условия отбора живут между перерисовками листа: человек нажал «Акции» —
// не сбрасываем при обновлении результатов.
let ideaKind = 'bonds';
let ideaResult = null;

/** Отрисовка результатов отбора — отдельно, чтобы обновлять без перерисовки экрана. */
function renderIdeas(res) {
  if (res.error) return `<div class="card"><div class="muted">${esc(res.error)}</div></div>`;
  if (res.swaps) {
    if (!res.swaps.length) return `<div class="card"><h3>Менять нечего</h3>
      <div class="muted" style="line-height:1.6">Ни одна бумага с рынка не даёт выгоды, которая заметно перекрывала бы
        комиссии за обмен. Проверено бумаг: ${res.checked}. Это хорошая новость: портфель не проигрывает рынку
        в том, что можно измерить.</div></div>`;
    return `<div class="card"><h3>Что можно поменять (${res.swaps.length})</h3>
      ${res.swaps.map(x => `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">${esc(x.title)}</h2>
        <p>${esc(x.detail)}</p>
        <p class="muted" style="margin-top:8px">${esc(x.note)}</p>
      </div>`).join('')}
      <p class="muted" style="line-height:1.6">Приложение сделок не совершает и не может знать будущего.
        Это сравнение измеримого: доходность к погашению и прошлые выплаты. Проверено бумаг с рынка: ${res.checked}.</p>
    </div>`;
  }
  const rows = res.rows || [];
  if (!rows.length) return `<div class="card"><div class="muted">Ничего не подошло под эти условия — смягчи их.</div></div>`;
  const rec = res.rec;
  const line = r => r.kind === 'bond'
    ? `${(r.ytm * 100).toFixed(1)}% к погашению · ${r.yearsLeft} лет · ${r.type === 'gov' ? 'ОФЗ' : 'корп.'}${
        r.couponType === 'float' ? ' · плавающий купон' : ''}${
        r.yearsToOffer > 0 && r.yearsLeft > r.yearsToOffer + 0.1
          ? ` · <span style="color:var(--warn)">оферта через ${r.yearsToOffer} г.</span>` : ''}`
    : `${((r.yieldPct || 0) * 100).toFixed(1)}% выплат за год · ${r.streak ? `${r.streak} ${r.streak < 5 ? 'года' : 'лет'} подряд` : 'без выплат'}${r.sector ? ' · ' + esc(r.sector) : ''}`;
  const card = r => `<div class="rowitem" style="cursor:default;align-items:flex-start">
      <span class="rt" style="flex:1">
        <b>${esc(r.name)} <span class="muted" style="font-weight:500">${esc(r.ticker)}</span></b>
        <span>${line(r)}</span>
        ${r.why && r.why.length ? `<span class="muted" style="display:block;margin-top:4px">${esc(r.why.join(' · '))}</span>` : ''}
      </span>
      <span style="text-align:right;min-width:64px">
        <b style="color:${r.score >= 70 ? 'var(--ok)' : r.score >= 45 ? 'var(--warn)' : 'var(--dim)'}">${r.score}</b>
        <span class="muted" style="display:block;font-size:11px">из 100</span>
        <button class="btn ghost" data-idea="${esc(r.ticker)}" style="margin-top:6px;padding:5px 9px;font-size:12px">Подробнее</button>
      </span>
    </div>`;
  return `
    ${rec && rec.items.length ? `<div class="card">
      <h3>Что подходит портфелю</h3>
      <p class="muted" style="margin-bottom:10px;line-height:1.6">${esc(rec.note)}</p>
      ${rec.items.map(card).join('')}
      <p class="muted" style="margin-top:10px;line-height:1.6;opacity:.8">${esc(rec.disclaimer)}</p>
    </div>` : ''}
    ${res.criteria ? `<p class="muted" style="margin:10px 0;line-height:1.6">${esc(res.criteria)}</p>` : ''}
    <div class="card">
      <h3>Всё, что подошло (${rows.length})</h3>
      ${rows.slice(0, 25).map(card).join('')}
      <p class="muted" style="margin-top:10px">Оценка 0–100 — насколько бумага подходит твоему портфелю:
        выплаты, стабильность, срок, недобор класса. Уже купленные получают штраф за концентрацию.
        Это не прогноз роста.</p>
    </div>`;
}

function viewJournal(st) {
  const names = { buy: 'Покупка', sell: 'Продажа', deposit: 'Пополнение',
                  withdraw: 'Вывод', dividend: 'Выплата', fee: 'Комиссия', reserve: 'В резерв' };
  // Знак показывает направление денег: пришло на счёт или ушло с него.
  const incoming = { sell: true, deposit: true, dividend: true };
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня',
                  'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  const recent = st.ops.slice().sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0)).slice(0, 80);

  // Разбивка по месяцам: без неё лента из восьмидесяти строк нечитаема,
  // а даты у соседних операций почти всегда совпадают.
  const chunks = [];
  for (const o of recent) {
    const key = String(o.date).slice(0, 7);
    if (!chunks.length || chunks[chunks.length - 1].key !== key) {
      const [y, m] = key.split('-');
      chunks.push({ key, title: `${MONTHS[Number(m) - 1]} ${y}`, list: [] });
    }
    chunks[chunks.length - 1].list.push(o);
  }

  const row = o => {
    const plus = incoming[o.type];
    const day = String(o.date).slice(8, 10);
    return `<div class="pos" data-op="${o.id}" style="cursor:pointer">
      <div>
        <div class="t" style="${o.technical ? 'opacity:.6' : ''}">${names[o.type] || o.type}${
          o.ticker ? ' · ' + esc(o.ticker) : ''}</div>
        <div class="n">${day} ${MONTHS[Number(String(o.date).slice(5, 7)) - 1].slice(0, 3)}${
          o.qty ? ' · ' + o.qty + ' шт по ' + o.price + ' ₽' : ''}${
          o.technical ? ' · служебная' : o.note ? ' · ' + esc(o.note) : ''}</div>
      </div>
      <div class="v"><div style="color:${plus ? 'var(--ok)' : 'var(--text)'}">${
        plus ? '+' : '−'}${money(Math.abs(o.amount))}</div></div>
    </div>`;
  };

  return `<div class="hero"><div class="lbl">Журнал</div>
      <div class="sum" style="font-size:30px">${st.ops.length}</div>
      <div class="sub">${st.ops.length === 1 ? 'операция' : 'операций'} · внесено за год ${money(st.yearDeposits)}</div></div>

    <div class="card"><h3>Записать вручную</h3>
      <div class="muted" style="margin-bottom:6px">${st.settings.tiConnected
        ? 'Сделки и пополнения приходят из Т-Инвестиций сами. Здесь — то, чего брокер не знает.'
        : 'Всё, что происходит на счёте, записывается сюда.'}</div>
      <div class="rows" style="margin-top:6px">
        <button class="rowitem" id="bAddRes">
          <span class="rt"><b>Отложил в резерв</b><span>Подушка на чёрный день — она вне брокерского счёта</span></span>
          <span class="chev"></span></button>
        <button class="rowitem" id="bAddDep">
          <span class="rt"><b>Пополнил счёт</b><span>Взнос на ИИС</span></span>
          <span class="chev"></span></button>
        <button class="rowitem" id="bAddTrade">
          <span class="rt"><b>Купил или продал</b><span>Если сделка прошла не через этот счёт</span></span>
          <span class="chev"></span></button>
        <button class="rowitem" id="bAddDiv">
          <span class="rt"><b>Пришла выплата</b><span>Дивиденды или купон</span></span>
          <span class="chev"></span></button>
      </div>
    </div>

    ${chunks.length ? chunks.map(c => `<div class="card">
        <h3 style="margin-bottom:6px">${c.title}</h3>
        ${c.list.map(row).join('')}
      </div>`).join('')
      : '<div class="card"><div class="muted">Пока пусто. Подключи счёт или запиши первую операцию.</div></div>'}

    ${chunks.length ? '<div class="muted" style="text-align:center;padding:2px 0 8px">Нажми на операцию, чтобы удалить её, если ошибся.</div>' : ''}`;
}

/** Рыночный контекст: индекс и ставка, с объяснением, что это значит для портфеля. */
async function drawMarket() {
  const card = $('marketCard'), box = $('marketBox');

    if (!m || (!m.imoex && !m.moneyRate)) { card.style.display = 'none'; return; }

          <div style="font-size:20px;font-weight:750">${Math.round(m.imoex).toLocaleString('ru-RU')}</div>
          ${m.monthChange != null ? `<div style="font-size:12px;font-weight:650" class="${m.monthChange >= 0 ? 'up' : 'down'}">${m.monthChange >= 0 ? '+' : '−'}${Math.abs(m.monthChange * 100).toFixed(1)}% за месяц</div>` : ''}</div>` : ''}

/**
 * Календарь: отсечки, погашения, налоговые сроки. Данные по дивидендам
 * подгружаются с биржи, поэтому карточка появляется не сразу — и не появляется
 * вовсе, если событий нет. Пустой раздел хуже отсутствующего.
 */
/**
 * Пассивный доход портфеля: сколько бумаги платят купонами и дивидендами.
 * Это доход, не зависящий от роста цен, — главная цифра долгосрочника.
 */
async function drawCashflow() {
  const card = $('cashflowCard'), box = $('cashflowBox');
  if (!card || !box) return;
  try {
    const flow = await portfolioFacts();
    if (!flow || !(flow.totalNet > 0)) { card.style.display = 'none'; return; }
    card.style.display = 'block';
    box.innerHTML = `
      <div style="display:flex;gap:18px;margin-bottom:10px">
        <div><div class="muted" style="font-size:11px">В год чистыми</div>
          <div style="font-size:20px;font-weight:750;color:var(--ok)">${money(flow.totalNet)}</div></div>
        <div><div class="muted" style="font-size:11px">В месяц</div>
          <div style="font-size:20px;font-weight:750">${money(flow.monthly)}</div></div>
        ${flow.yieldOnPortfolio > 0 ? `<div><div class="muted" style="font-size:11px">К стоимости бумаг</div>
          <div style="font-size:20px;font-weight:750">${(flow.yieldOnPortfolio * 100).toFixed(1)}%</div></div>` : ''}
      </div>
      <div class="muted" style="line-height:1.6">Купоны и фактические выплаты за 12 месяцев — доход, который не зависит
        от роста цен. Дивиденды — решение компаний: могут измениться.</div>
      ${await (async () => {
        const st = await store.getState();
        const exp = Number(st.settings.monthlyExpenses) || 0;
        if (!(exp > 0) || !(flow.monthly > 0)) return '';
        return `<div class="muted" style="margin-top:8px">Покрывает ${(flow.monthly / exp * 100).toFixed(0)}%
          твоих месячных расходов — это и есть «пенсия с акций»: доля растёт с каждым взносом и каждой выплатой.</div>`;
      })()}`;
  } catch { card.style.display = 'none'; }
}

async function drawEvents() {
  const card = $('eventsCard'), box = $('eventsBox');
  if (!card || !box) return;
  const st = await store.getState();

  // Сначала спрашиваем брокера: к нему доступ есть всегда, к Мосбирже — нет.
  const flow = await portfolioFacts();
  const dividends = flow.dividends && flow.dividends.length
    ? flow.dividends
    : await withLimit(store.upcomingPayments(), 8, []);

  const events = store.upcomingEvents(st, dividends, flow);
  if (!events.length) { card.style.display = 'none'; return; }

  const when = n => n === 0 ? 'сегодня' : n === 1 ? 'завтра'
    : n < 31 ? `через ${n} ${n % 10 === 1 && n !== 11 ? 'день' : n % 10 >= 2 && n % 10 <= 4 && (n < 12 || n > 14) ? 'дня' : 'дней'}`
    : n < 365 ? `через ${Math.round(n / 30)} мес` : `через ${(n / 365).toFixed(1)} года`;
  const colour = n => n <= 7 ? 'var(--warn)' : n <= 30 ? 'var(--info)' : 'var(--dim)';

  card.style.display = 'block';
  box.innerHTML = events.map(e => `<div style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">
        <div style="font-weight:650;font-size:13.5px">${esc(e.title)}</div>
        <div style="white-space:nowrap;font-size:12px;color:${colour(e.daysLeft)}">${when(e.daysLeft)}</div>
      </div>
      <div class="muted" style="margin-top:3px">${String(e.date).split('-').reverse().join('.')} · ${esc(e.detail)}</div>
    </div>`).join('');
}

/** Простой график без внешних библиотек: линия и подпись изменения. */
async function drawChart() {
  const card = $('chartCard'), box = $('chartBox');
  if (!card || !box) return;
  const c = await store.valueChart(90);
  if (!c.enough) { card.style.display = 'none'; return; }
  card.style.display = 'block';

  const W = 320, H = 70, pad = 4;
  const span = Math.max(1, c.max - c.min);
  const step = c.points.length > 1 ? (W - pad * 2) / (c.points.length - 1) : 0;
  const path = c.points.map((p, i) => {
    const x = pad + i * step;
    const y = pad + (H - pad * 2) * (1 - (p.value - c.min) / span);
    return `${i ? 'L' : 'M'}${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');

  const up = c.change >= 0;
  const col = up ? 'var(--ok)' : 'var(--danger)';
  box.innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">
      <path d="${path}" fill="none" stroke="${col}" stroke-width="2"
            stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <div style="display:flex;justify-content:space-between;font-size:12px;margin-top:6px">
      <span class="muted">${c.days} ${c.days === 1 ? 'день' : c.days < 5 ? 'дня' : 'дней'} наблюдений</span>
      <span style="color:${col};font-weight:700">${up ? '+' : ''}${(c.change * 100).toFixed(1)}%</span>
    </div>`;
}

async function refreshPrices() {
  const btn = $('bPrices'); if (!btn) return;
  btn.disabled = true; btn.textContent = 'Загружаю…';
  const st = await store.getState();
  try {
    const { updated, failed, reason } = await fetchPrices(st.positions.filter(p => p.qty > 0));
    if (updated.length) await store.updatePrices(updated);

    if (!updated.length && reason) return explainPriceFailure(reason);
    if (failed.length && $('status')) {
      $('status').textContent = 'Не нашлось: ' + failed.join(', ') + ' — цену можно вписать вручную в Портфеле';
    }
  } catch (e) {
    explainPriceFailure(e.reason || 'offline');
  } finally {
    if ($('bPrices')) { $('bPrices').disabled = false; $('bPrices').textContent = 'Обновить цены'; }
  }
}

        <br><br><b>Что делать:</b><br>
        • вписать цены вручную — нажми на бумагу в разделе «Портфель»;<br>
        • или разместить приложение на бесплатном хостинге (GitHub Pages, Netlify Drop) —
        тогда котировки будут подтягиваться сами.`
    },
    offline: { title: 'Нет связи', body: 'Проверь интернет и попробуй ещё раз. Пока показаны последние известные цены.' },
    timeout: { title: 'Биржа не ответила', body: 'Запрос занял слишком долго. Попробуй позже — возможно, идут технические работы.' },
    server: { title: 'Биржа вернула ошибку', body: 'Скорее всего, временный сбой на стороне Мосбиржи. Попробуй позже.' }
  };
  const t = texts[reason] || texts.offline;
  openSheet(`<h2 style="margin:0 0 8px;font-size:19px">${esc(t.title)}</h2>

/**
 * Ожидание с потолком. Запросы к бирже с локального файла не отвечают вовсе:
 * браузер их не пускает, а обещание так и не разрешается. Без ограничения
 * экран навсегда застревает на «Считаю…».
 */
function withLimit(promise, seconds, fallback) {
  return Promise.race([
    Promise.resolve(promise).catch(() => fallback),
    new Promise(resolve => setTimeout(() => resolve(fallback), seconds * 1000))
  ]);
}

/**
 * Диагностика. Одно место, где видно всё состояние: сборка, хранилище,
 * подключение, что насчитал журнал и что говорит брокер. Нужна не для
 * красоты — когда что-то не сходится, гадать по описанию бесполезно,
 * а по этому экрану видно причину.
 */
async function openDiagnostics() {
  openSheet('<div class="muted">Собираю…</div>');
  const st = await store.getState();
  const storage = store.storageState();
  const token = await store.getMeta('tiToken');
  const account = await store.getMeta('tiAccount');

      broker = await withLimit(tiPortfolio(token, account, known), 12, null);
      if (broker && broker.resolved && Object.keys(broker.resolved).length) {

    const all = new Set([...mine.map(p => p.ticker), ...theirs.keys()]);
    // Бумага, чьё имя брокер не назвал, попадает в список под техническим

    // о нём надо словами, а не пугать красным «≠».
    const unnamed = broker.rows.filter(r => r.unresolved).length;
    compare = [...all].sort().map(t => {
      const a = mine.find(p => p.ticker === t)?.qty ?? 0;
      const b = theirs.get(t) ?? 0;

        color:${same ? 'var(--dim)' : 'var(--danger)'};font-size:12.5px">

    }).join('') + `<div style="display:flex;justify-content:space-between;padding:7px 0;
      border-top:1px solid var(--line);font-size:12.5px;
      color:${Math.abs(st.summary.cash - broker.cash) < 1 ? 'var(--dim)' : 'var(--danger)'}">
      <span>свободные деньги</span><span>${money(st.summary.cash)} / ${money(broker.cash)}</span></div>`
      + (unnamed ? `<div class="muted" style="margin-top:10px;line-height:1.6">
          Названия ${unnamed} ${unnamed === 1 ? 'бумаги' : 'бумаг'} брокер сейчас не отдал — они показаны
          техническим кодом, и строки выглядят как расхождение. Данные целы: обнови из Т-Инвестиций
          ещё раз, имена подставятся из запаса.</div>` : '');
  }

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Диагностика</h2>
    <p class="muted" style="margin:0 0 14px">Слева — что насчитало приложение, справа — что говорит брокер.</p>

    ${line('сборка приложения', esc(BUILD))}
    ${line('журнал собран сборкой', esc(syncedBuild || '—'))}
    ${line('хранение данных', esc(storageName[storage.mode] || storage.mode))}
    ${line('открыто как', esc(location.protocol === 'file:' ? 'файл с устройства' : 'страница по ссылке'))}
    ${line('токен', token ? 'сохранён' : 'нет')}
    ${line('счёт', esc(account || '—'))}
    ${line('последняя загрузка', esc(when(st.settings.tiSyncedAt)))}
    ${line('операций в журнале', st.ops.length)}
    ${line('бумаг в портфеле', mine.length)}

    ${problem ? `<div class="act attention" style="margin-top:14px">
      <h2 style="font-size:15px">Расхождение с брокером</h2>
      <p>${problem.map(esc).join('<br>')}</p></div>` : ''}
    ${lastError ? `<div class="act critical" style="margin-top:14px">
      <h2 style="font-size:15px">Ошибка связи</h2>
      <p>${esc(lastError.message)}<br><span class="muted">${esc(when(lastError.at))}</span></p></div>` : ''}
    ${brokerError ? `<div class="act critical" style="margin-top:14px">
      <h2 style="font-size:15px">Брокер не ответил</h2><p>${esc(brokerError)}</p></div>` : ''}

    <h3 style="margin:20px 0 6px;font-size:14px">Бумаги: приложение / брокер</h3>
    ${compare}

    <div style="height:16px"></div>
    <button class="btn wide" id="bDiagSync">Собрать журнал заново</button>
    <div id="bDiagOut"></div>`);

  $('bDiagSync').onclick = async () => {
    $('bDiagOut').innerHTML = '<div class="muted" style="margin-top:12px">Забираю историю…</div>';
    try {
      const r = await store.syncTinvest({ force: true });
      if (r.ok === false) {
        $('bDiagOut').innerHTML = `<div class="err" style="margin-top:10px">${r.problems.map(esc).join('<br>')}</div>`;
        return;
      }
      closeSheet(); render();
    } catch (err) { $('bDiagOut').innerHTML = `<div class="err" style="margin-top:10px">${esc(err.message)}</div>`; }
  };
}

/**
 * Выплаты по бумагам: сначала спрашиваем брокера, потом биржу.
 * Один вход для всех экранов, чтобы советы и денежный поток считались
 * из одного источника и не расходились между собой.
 */
/**
 * Запоминаем измеренную доходность облигаций: она нужна прогнозу на главной,
 * где сети может не быть. Хранится вместе с датой — устаревшую не берём.
 */
async function rememberBondYtm(flow) {
  try {
    if (!flow || !flow.rows) return;
    let value = Number(flow.bondYtm) || 0;
    if (!(value > 0)) {
      // Данные приходят двумя путями — от брокера и с биржи, — и во втором
      // случае средневзвешенной доходности в ответе нет. Считаем сами.
      const st = await store.getState();
      let sum = 0, weighted = 0;
      for (const r of flow.rows) {
        if (!(r.ytm > 0)) continue;
        const pos = st.positions.find(p => p.ticker === r.ticker);
        const v = pos ? pos.qty * pos.price : 0;
        if (v > 0) { sum += v; weighted += v * r.ytm; }
      }
      value = sum > 0 ? weighted / sum : 0;
    }
    if (!(value > 0)) return;
    const today = new Date().toISOString().slice(0, 10);
    const prev = await store.getMeta('bondYtm');
    if (prev && prev.date === today && Math.abs((prev.value || 0) - value) < 0.0005) return;
    await store.setMeta('bondYtm', { date: today, value });
  } catch { /* не смогли измерить — прогноз останется на допущении */ }
}

async function portfolioFacts() {
  const token = await store.getMeta('tiToken');
  const account = await store.getMeta('tiAccount');
  if (token && account) {
    const known = (await store.getMeta('uidTickers')) || {};
    const book = await withLimit(store.tiPortfolio(token, account, known), 12, null);
    if (book) {
      const facts = await withLimit(store.tiFacts(token, book.rows), 25, null);
      if (facts && facts.rows.length) { await rememberBondYtm(facts); return facts; }
    }
  }
  const flow = await withLimit(store.cashflowSummary(), 10,
    { rows: [], dividends: [], totalNet: 0, yieldOnPortfolio: 0, monthly: 0 });
  await rememberBondYtm(flow);
  return flow;
}

/** Разбор портфеля с названиями бумаг: что докупить, что переложить и почему. */
async function openPlan() {
  ideaResult = null;   // прошлая выборка устарела: рынок с тех пор изменился
  openSheet('<div class="muted">Считаю. Спрашиваю у биржи купоны и дивиденды — не дольше десяти секунд…</div>');
  const st = await store.getState();
  // Потолок жёсткий: лучше план без биржевых довесков через десять секунд,
  // чем полный через минуту — «Считаю…» дольше этого читается как «зависло».
  const flow = await withLimit(portfolioFacts(), 10,
    { rows: [], dividends: [], totalNet: 0, yieldOnPortfolio: 0, monthly: 0 });
  const market = await withLimit(store.marketContext(), 4, {}) || {};

  const plan = store.rebalancePlan(st, flow, market);

  openSheet(`<h2 style="margin:0 0 6px;font-size:19px">Что стоит сделать</h2>
    <p class="muted" style="margin:0 0 14px;line-height:1.6">
      ${plan.length
        ? 'Всё ниже посчитано из твоих долей, выплат и ставки. Приложение не знает, что вырастет, — поэтому советует только то, что можно проверить.'
        : 'Доли по классам в норме, перекосов нет. Продолжай регулярные пополнения — это и есть план.'}
      ${!flow.rows.length ? '<br><br><b style="color:var(--warn)">Биржа не ответила</b> — советы посчитаны только по долям, без купонов и дивидендов. Обычно так бывает, когда файл открыт прямо с устройства.' : ''}
      ${(() => {
        const at = st.settings.tiSyncedAt || st.settings.lastPriceUpdate;
        if (!at) return '';
        const hours = (Date.now() - at) / 3600000;
        const when = new Date(at).toLocaleString('ru-RU').slice(0, 17);
        return hours > 24
          ? `<br><br><b style="color:var(--warn)">Цены от ${when} — старше суток.</b> Советы посчитаны по ним; открой приложение при интернете, и всё обновится само.`
          : `<br><br>Посчитано по ценам на ${when}.`;
      })()}</p>

    ${(() => {
      const yo = yearOutlook(st.summary.byClass, st.summary.securities, 0,
        store.ratesFor(st.settings.bondYtm || 0).rates);
      if (!yo) return '';
      return `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">Ближайший год — честно о шансах</h2>
        <p>С текущими долями портфель заканчивает год в плюсе примерно в ${Math.round(yo.chance * 100)} случаях из 100.
        Разброс через год: плохой исход ${money(yo.bad)}, середина ${money(yo.median)}, удачный ${money(yo.good)}.</p>
        <p class="muted" style="margin-top:8px">Гарантированного роста на рынке не существует — кто обещает, тот врёт.
        Почти гарантированный годовой результат дают только облигации, погашаемые в пределах года, и деньги под ставку —
        ценой доходности около неё. Любая доля акций меняет гарантию на ожидание.</p>
      </div>`;
    })()}
    ${(() => {
      const cp = contributionPlan(st, flow);
      if (!cp) return '';
      const clsName = { stocks: 'акции', bonds: 'облигации', hedge: 'защита' };
      const pc = plannedContribution(st);
      return `<div class="act info" style="margin-bottom:10px">
        <h2 style="font-size:16px">Ближайший взнос ${money(cp.amount)} — куда именно</h2>
        <div class="row" style="margin:8px 0">
          <input type="number" id="fPlanAmount" inputmode="numeric" value="${cp.amount}" style="flex:2;margin:0">
          <button class="btn" id="bPlanRecalc" style="flex:1">Пересчитать</button>
        </div>
        <p class="muted" style="margin:0 0 8px">${pc.overridden
          ? `В этом месяце — ${money(pc.amount)} вместо обычных ${money(pc.base)}. Со сменой месяца вернётся база; база меняется в настройках.`
          : `База — ${money(pc.base)} в месяц из настроек. Впиши другую сумму, если в этом месяце вносишь иначе, — правка живёт один месяц.`}</p>
        ${cp.steps.map(t => `<p style="margin:6px 0">${money(t.amount)} → <b>${
          t.name ? esc(t.name) : `${clsName[t.cls]}: нужна новая бумага`}</b>${
          t.lots != null ? (t.lots > 0
            ? ` — ${t.lots} шт по ${t.price} ₽${t.lotSize > 1 ? ` (${t.wholeLots} ${t.wholeLots === 1 ? 'лот' : t.wholeLots < 5 ? 'лота' : 'лотов'} по ${t.lotSize})` : ''}${
                t.leftover > 50 ? `, останется ${money(t.leftover)}` : ''}`
            : ` <span style="color:var(--warn)">— ${t.lotSize > 1 ? `лот из ${t.lotSize} шт` : 'одна штука'} дороже этой части взноса, копи или измени деление</span>`) : ''}${
          t.blockReason ? `<br><span class="muted">${esc(t.blockReason)}</span>` : ''}</p>`).join('')}
        <p class="muted" style="margin-top:8px">Деление — по степени недобора до целевых долей: класс, отстающий сильнее, получает больше. Внутри класса названа бумага с наибольшей фактической доходностью из уже имеющихся.</p>
      </div>`;
    })()}

    ${(() => {
      const card = a => `<div class="act ${a.urgency}" style="margin-bottom:10px">
        <h2 style="font-size:16px">${esc(a.title)}</h2>
        <p>${esc(a.detail)}</p>
        ${a.note ? `<p class="muted" style="margin-top:8px">${esc(a.note)}</p>` : ''}
      </div>`;
      // Три карточки — читаются; десять подряд — пролистываются. Хвост
      // прячется за кнопкой, но не исчезает: одна лишняя карточка кнопки
      // не заслуживает и показывается сразу.
      const VISIBLE = 3;
      const collapse = plan.length > VISIBLE + 1;
      const shown = collapse ? plan.slice(0, VISIBLE) : plan;
      const hidden = collapse ? plan.slice(VISIBLE) : [];
      const word = n => n === 1 ? 'подсказку' : n < 5 ? 'подсказки' : 'подсказок';
      return shown.map(card).join('')
        + (hidden.length ? `<div id="planMore" style="display:none">${hidden.map(card).join('')}</div>
          <button class="btn ghost wide" id="bPlanMore" style="margin-bottom:10px">Показать ещё ${hidden.length} ${word(hidden.length)}</button>` : '');
    })()}

    <h3 style="margin:20px 0 6px;font-size:15px">Что можно купить на рынке</h3>
    <div id="ideasOut"><div class="muted" style="line-height:1.6">Ищу по всей Мосбирже под твою стратегию…</div></div>

    <h3 style="margin:20px 0 6px;font-size:15px">Что можно поменять</h3>
    <div id="swapsOut"><div class="muted" style="line-height:1.6">Сравниваю каждую твою бумагу с рынком…</div></div>

    ${plan.length ? `<div style="height:6px"></div>
      <button class="btn ghost wide" id="bBuyManual">Разобрать конкретную покупку</button>` : ''}`);

  const manual = $('bBuyManual');
  if (manual) manual.onclick = openBuyAdvisor;

  // ── «Идеи» ──
  const setKind = k => { ideaKind = k; ideaResult = null; render(); };
  const kb = $('bKindBonds'), ks = $('bKindStocks'), kw = $('bKindSwap');
  if (kb) kb.onclick = () => setKind('bonds');
  if (ks) ks.onclick = () => setKind('stocks');
  if (kw) kw.onclick = () => setKind('swap');

  // Поиск по рынку запускается САМ и не задерживает лист: человек видит план
  // сразу, а разделы дозаполняются по мере ответа биржи. Кнопки убраны —
  // если возможностью не пользуются, виноват интерфейс, а не человек.
  const marketRate = async () => {
    const m = await withLimit(store.marketContext(), 4, {}) || {};
    return m.moneyRate > 0 ? m.moneyRate / 100 : 0.16;
  };

  // Какой класс искать: тот, которого не хватает сильнее. Защиту скринер
  // не ищет — у золота нет ни выплат, ни срока, сравнивать нечем.
  const shares = st.summary.securities > 0
    ? { stocks: (st.summary.byClass.stocks || 0) / st.summary.securities,
        bonds: (st.summary.byClass.bonds || 0) / st.summary.securities }
    : { stocks: 0, bonds: 0 };
  const gapStocks = (st.targets.stocks || 0) - shares.stocks;
  const gapBonds = (st.targets.bonds || 0) - shares.bonds;
  const kind = gapBonds >= gapStocks ? 'bonds' : 'stocks';

  async function fillMarketIdeas() {
    const box = $('ideasOut');
    if (!box) return;
    try {
      const goalYears = Number(st.settings.goal?.years) || 0;
      const rate = await marketRate();
      const filters = kind === 'bonds'
        ? { minYTM: Math.max(0.10, rate - 0.01), maxYears: goalYears || 5 }
        : { minYield: 0.06, minStreak: 3 };
      const res = await withLimit(store.findIdeas(kind, filters), 45, null);
      if (!box.isConnected && !box.innerHTML) return;      // лист закрыли — молча уходим
      if (!res) {
        const stage = store.lastMarketStage();
        box.innerHTML = stage === 'нет доступа к бирже'
          ? `<div class="muted" style="line-height:1.6">Мосбиржа недоступна с этого устройства.
              Чаще всего её режет VPN — выключи его и обнови страницу. Данные брокера идут другим путём,
              поэтому портфель и советы работают, а поиск по рынку — нет.</div>`
          : `<div class="muted" style="line-height:1.6">Биржа не ответила за 45 секунд${
              stage ? ` — не дождался: ${esc(stage)}` : ''}. Поиск по рынку сейчас недоступен;
              всё остальное в плане посчитано и работает.</div>`;
        return;
      }
      const st2 = await store.getState();
      ideaResult = { rows: res.rows, rec: SH.buyRecommendations(st2, res.rows),
        criteria: kind === 'bonds'
          ? `Искал облигации: доходность к погашению от ${(filters.minYTM * 100).toFixed(1)}% (ориентир — денежный рынок) и погашение не позже ${filters.maxYears} лет, до твоей цели. Их не хватает сильнее всего.`
          : `Искал акции: выплаты за 12 месяцев от 6% и минимум 3 года подряд. Их не хватает сильнее всего.` };
      box.innerHTML = renderIdeas(ideaResult);
      bindIdeaButtons();
    } catch (err) {
      box.innerHTML = `<div class="muted">Поиск по рынку не удался: ${esc(err.message || String(err))}</div>`;
    }
  }
  fillMarketIdeas();

  async function fillReplacements() {
    const box = $('swapsOut');
    if (!box) return;
    try {
      const r = await withLimit(store.findReplacements(), 60, null);
      if (!r) {
        const stage = store.lastMarketStage();
        box.innerHTML = stage === 'нет доступа к бирже'
          ? `<div class="muted" style="line-height:1.6">Мосбиржа недоступна с этого устройства —
              скорее всего, из-за VPN. Сравнение с рынком появится, как только биржа станет доступна.</div>`
          : `<div class="muted" style="line-height:1.6">Биржа не ответила за 60 секунд${
              stage ? ` — не дождался: ${esc(stage)}` : ''}. Сравнение с рынком сейчас недоступно.</div>`;
        return;
      }
      box.innerHTML = renderIdeas({ swaps: r.ideas, checked: r.checked });
      bindIdeaButtons();
    } catch (err) {
      box.innerHTML = `<div class="muted">Сравнение с рынком не удалось: ${esc(err.message || String(err))}</div>`;
    }
  }
  fillReplacements();

  const more = $('bPlanMore');
  if (more) more.onclick = () => { $('planMore').style.display = 'block'; more.style.display = 'none'; };

  const recalc = $('bPlanRecalc');
  if (recalc) recalc.onclick = async () => {
    const amount = Number($('fPlanAmount').value);
    if (!(amount > 0)) { $('fPlanAmount').focus(); return alert('Сумма должна быть больше нуля'); }
    const stNow = await store.getState();
    const month = plannedContribution(stNow).month;
    await store.setSetting('plannedThisMonth', { month, amount });
    openPlan();   // пересчитать и показать заново с новой суммой
  };
}

/**
 * Итоги: движение денег из журнала за год и с открытия счёта.
 * Никаких оценок — каждую строку можно сверить с отчётом брокера.
 */
async function openResults() {
  const st = await store.getState();
  const ops = st.ops || [];
  // Сравнение с индексом: история тянется с Мосбиржи с потолком в 6 секунд.
  // На file:// биржа молчит — блок просто не появится, с подсказкой почему.
  const firstDep = ops.filter(o => o.type === OP.DEPOSIT && !o.technical)
    .map(o => String(o.date).slice(0, 10)).sort()[0] || null;
  const bench = firstDep
    ? benchmarkCompare(ops, await withLimit(fetchIndexHistory(firstDep), 6, []))
    : null;
  // Снимки стоимости для доходности самого портфеля: только своя база, без сети.
  const chart = await store.valueChart(400).catch(() => null);
  const chartPoints = chart && chart.points ? chart.points : [];
  const year = new Date().getFullYear();
  const y = periodReport(ops, `${year}-01-01`, null);
  const all = periodReport(ops, null, null);

  const row = (label, a, b, color) => `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)">
    <div class="muted">${label}</div>
    <div style="text-align:right"><b${color ? ` style="color:${color}"` : ''}>${money(a)}</b>
      <span class="muted" style="margin-left:10px">${money(b)}</span></div></div>`;

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Итоги</h2>
    <p class="muted" style="margin:0 0 12px;line-height:1.6">Движение денег из журнала — каждую строку можно
      сверить с отчётом брокера. Стоимость портфеля и прибыль — на главной: это другая природа чисел.</p>
    <div style="display:flex;justify-content:flex-end;gap:10px" class="muted">
      <span>за ${year}</span><span>с открытия</span></div>
    ${row('Внесено', y.deposits, all.deposits)}
    ${y.withdrawals || all.withdrawals ? row('Выведено', y.withdrawals, all.withdrawals) : ''}
    ${row(`Выплачено чистыми (${all.payouts} ${all.payouts === 1 ? 'выплата' : all.payouts < 5 ? 'выплаты' : 'выплат'})`, y.dividends, all.dividends, 'var(--ok)')}
    ${row('Комиссии брокера', y.fees, all.fees, 'var(--danger)')}
    ${row(`Куплено бумаг (${all.buys} сдел${all.buys === 1 ? 'ка' : all.buys < 5 ? 'ки' : 'ок'})`, y.bought, all.bought)}
    ${y.sells || all.sells ? row(`Продано бумаг (${all.sells})`, y.sold, all.sold) : ''}
    ${(() => {
      const bars = payoutsByMonth(ops, 12);
      const totalYear = bars.reduce((a, b) => a + b.amount, 0);
      if (!(totalYear > 0)) return '';
      const maxA = Math.max(...bars.map(b => b.amount));
      const W = 320, H = 64, gap = 3;
      const bw = (W - gap * (bars.length - 1)) / bars.length;
      const MES = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const lab = m => MES[Number(m.slice(5)) - 1];
      const rects = bars.map((b, i) => {
        const h = maxA > 0 ? Math.round((H - 14) * b.amount / maxA) : 0;
        const x = i * (bw + gap);
        return `<rect x="${x.toFixed(1)}" y="${H - h}" width="${bw.toFixed(1)}" height="${h}"
          rx="2" fill="${b.amount > 0 ? 'var(--ok)' : 'var(--line)'}" ${b.amount > 0 ? '' : `height="2" y="${H - 2}"`}/>`;
      }).join('');
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="muted" style="margin-bottom:8px">Выплаты по месяцам за год — чистыми</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${rects}</svg>
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px" class="muted">
          <span>${lab(bars[0].month)}</span><span>${lab(bars[bars.length - 1].month)}</span></div>
        <div class="muted" style="margin-top:6px">Пустые месяцы — не дыра в данных: дивиденды и купоны приходят сезонами.</div>
      </div>`;
    })()}
    ${(() => {
      if (!bench) {
        return `<div style="padding:10px 0;border-bottom:1px solid var(--line)" class="muted">
          Сравнение с индексом появится, когда доступна Мосбиржа — открой приложение по ссылке
          («Ещё» → «Разместить в интернете»), с файла биржа не отвечает.</div>`;
      }
      const port = st.summary.total;
      const diff = port - bench.value;
      const pct = v => `${v >= 0 ? '+' : '−'}${Math.abs(v * 100).toFixed(1)}%`;
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="muted" style="margin-bottom:8px">Против индекса — те же взносы, те же даты</div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Твой портфель</span><b>${money(port)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Если бы взносы шли в индекс</span><b>${money(bench.value)} <span class="${bench.changePct >= 0 ? 'up' : 'down'}">${pct(bench.changePct)}</span></b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Разница</span><b class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : '−'}${money(Math.abs(diff))}</b></div>
        <div class="muted" style="margin-top:8px;line-height:1.6">Индекс — MCFTR, полной доходности: дивиденды в нём
          учтены, как и в твоём портфеле, — сравнение честное. Оговорки: индекс нельзя купить напрямую без
          комиссий фонда, а на истории короче полугода разница — шум, не вывод.</div>
      </div>`;
    })()}
    ${(() => {
      const twr = timeWeightedReturn(chartPoints, ops);
      const xirrLine = st.returnRateReliable && st.returnRate != null
        ? `<div style="display:flex;justify-content:space-between;padding:5px 0">
             <span class="muted">Сколько заработали твои деньги</span>
             <b>${(st.returnRate * 100).toFixed(1)}% годовых</b></div>`
        : `<div class="muted" style="padding:5px 0">Годовые проценты по твоим деньгам (XIRR) появятся, когда истории станет полгода — раньше любое число случайно.</div>`;
      const twrLine = twr
        ? `<div style="display:flex;justify-content:space-between;padding:5px 0">
             <span class="muted">Как сработал сам портфель</span>
             <b>${twr.twr >= 0 ? '+' : '−'}${Math.abs(twr.twr * 100).toFixed(1)}% за ${twr.days} дн.${
               twr.annual != null ? ` · ${(twr.annual * 100).toFixed(1)}% годовых` : ''}</b></div>`
        : `<div class="muted" style="padding:5px 0">Доходность самого портфеля посчитается, когда накопится неделя ежедневных снимков стоимости — они собираются при обновлении цен.</div>`;
      return `<div style="padding:12px 0">
        <div class="muted" style="margin-bottom:6px">Две доходности — они отвечают на разные вопросы</div>
        ${xirrLine}${twrLine}
        <div class="muted" style="margin-top:8px;line-height:1.6">Первая зависит от того, когда ты вносил деньги:
          удачно попал взносом — цифра выше. Вторая взносы вычищает и показывает работу самого портфеля —
          именно её честно сравнивать с индексом выше.</div>
      </div>`;
    })()}`);
}

/** Кнопки «Подробнее» в результатах отбора: вешаются после каждой отрисовки. */
function bindIdeaButtons() {
  document.querySelectorAll('[data-idea]').forEach(b => {
    b.onclick = () => openIdeaDetails(b.getAttribute('data-idea'));
  });
}

/**
 * Карточка любой бумаги с рынка — не только своей. Показывает то же,
 * что и карточка позиции, плюс историю выплат; про будущее — молчит.
 */
async function openIdeaDetails(ticker) {
  openSheet('<div class="muted">Смотрю данные по бумаге — не дольше десяти секунд…</div>');
  const d = await withLimit(store.getSecurityDetails(ticker), 10, null);
  if (!d) {
    openSheet(`<h2 style="margin:0 0 8px;font-size:19px">Биржа не ответила</h2>
      <p class="muted" style="line-height:1.7">Данные по бумаге берутся с Мосбиржи, а она молчит.
        С файла биржа недоступна — открой приложение по ссылке.</p>`);
    return;
  }
  const f = d.facts || {};
  const divs = d.dividends || [];
  openSheet(`<h2 style="margin:0 0 2px;font-size:19px">${esc(f.name || ticker)}</h2>
    <p class="muted" style="margin:0 0 12px">${esc(ticker)}${d.owned ? ' · уже есть в портфеле' : ''}</p>
    ${f.known === false ? '<div class="diff" style="color:var(--warn)">Биржа не дала подробностей по этой бумаге.</div>' : ''}
    ${f.ytm ? `<div class="diff">Доходность к погашению <b>${(f.ytm * 100).toFixed(1)}%</b>${
      f.ttm ? `, купон ${money(f.ttm)} в год` : ''}</div>` : ''}
    ${d.streak ? `<div class="diff">Платит <b>${d.streak} ${d.streak < 5 ? 'года' : 'лет'} подряд</b> — это про прошлое, не про будущее.</div>` : ''}
    ${divs.length ? `<h3 style="margin:16px 0 6px;font-size:15px">Выплаты</h3>
      ${divs.map(x => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span class="muted">${esc(String(x.date).split('-').reverse().join('.'))}</span>
        <b>${money(x.value)}</b></div>`).join('')}` : ''}
    ${d.owned ? '' : `<p class="muted" style="margin-top:14px;line-height:1.7">Купить бумагу можно у брокера —
      приложение сделок не совершает. После покупки она появится здесь сама при обновлении из Т-Инвестиций.</p>`}
    <p class="muted" style="margin-top:12px;line-height:1.7;opacity:.8">Это не прогноз роста. Это данные о прошлых
      выплатах и текущих параметрах бумаги. Будущие доходы и цены неизвестны.</p>`);
}
openIdeaDetails = guardSheet(openIdeaDetails);

/**
 * Мастер размещения: пошагово, без предположений о том, что человек
 * знает git. Два пути — совсем простой (Netlify Drop) и постоянный
 * (GitHub Pages). Обе площадки бесплатны и не требуют карты.
 */
function openHosting() {
  const step = (n, title, text) => `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
    <div style="font-weight:700;font-size:13.5px;margin-bottom:4px">${n}. ${title}</div>
    <div class="muted" style="line-height:1.65">${text}</div></div>`;
  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Разместить в интернете</h2>
    <p class="muted" style="margin:0 0 12px;line-height:1.6">Сейчас файл открыт прямо с устройства, и браузер
      многое запрещает. По ссылке заработают: постоянная база, котировки Мосбиржи, установка на домашний
      экран и обновление без скачивания файла. Токен останется на устройстве — он никуда не выкладывается.</p>

    <div style="font-weight:750;margin:10px 0 2px">Путь 1 — самый простой (Netlify Drop)</div>
    ${step(1, 'Открой netlify.com/drop', 'С телефона или компьютера. Регистрация — почта, карты не нужно.')}
    ${step(2, 'Перетащи или выбери этот HTML-файл', 'Тот самый, который скачал. Один файл — этого достаточно.')}
    ${step(3, 'Открой выданную ссылку', 'Netlify сразу даст адрес вида имя.netlify.app. Открой его в браузере — это и есть приложение.')}

    <div style="font-weight:750;margin:14px 0 2px">Путь 2 — постоянный (GitHub Pages)</div>
    ${step(1, 'Заведи аккаунт на github.com', 'Бесплатно. Затем github.com/new — создай репозиторий, имя любое, галка «Public».')}
    ${step(2, 'Загрузи файл как index.html', '«Add file» → «Upload files». Перед загрузкой переименуй скачанный файл в index.html.')}
    ${step(3, 'Включи Pages', 'Settings → Pages → Source: «Deploy from a branch», ветка main, папка «/ (root)» → Save.')}

function classOf(p) {
  return isHedge(p) ? 'hedge' : (/^SU\d|ОФЗ|облигац/i.test(p.ticker + (p.name || '')) ? 'bonds' : 'stocks');
}

async function openCrashTest(drop = -0.30) {
  const r = await store.crashTest(drop);
  const worst = r.items[0], best = r.items[r.items.length - 1];

  openSheet(`<h2 style="margin:0 0 6px;font-size:19px">Если рынок упадёт на ${Math.abs(drop * 100)}%</h2>
    <p class="muted" style="margin:0 0 14px">Это не прогноз, а проверка устойчивости: разные бумаги
      падают по-разному, и важно знать заранее, что выдержишь.</p>

    <div style="font-size:28px;font-weight:800;color:var(--danger);margin-bottom:2px">
      ${(r.totalChange * 100).toFixed(1)}%</div>
    <div class="muted" style="margin-bottom:16px">
      ${money(r.before)} → ${money(r.after)} · потеря ${money(r.lossRub)} на бумаге<br>
      Портфель падает ${r.softening > 0.1 ? `<b style="color:var(--ok)">мягче рынка на ${Math.round(r.softening * 100)}%</b>` : 'почти как рынок'}
      — за счёт облигаций и защитных активов.
    </div>

    <div class="diff"><b>Сильнее всех просядет:</b> ${esc(worst.ticker)}
      <span style="color:var(--danger)">${(worst.change * 100).toFixed(0)}%</span>
      <span class="muted">(${money(Math.abs(worst.delta))})</span></div>
    <div class="diff"><b>Лучше всех себя поведёт:</b> ${esc(best.ticker)}
      <span style="color:${best.change >= 0 ? 'var(--ok)' : 'var(--warn)'}">${best.change >= 0 ? '+' : ''}${(best.change * 100).toFixed(0)}%</span></div>

    ${r.reserveMonths != null ? `<div class="diff" style="margin-top:10px">
      <b>Сможешь ли переждать:</b> ${r.canWait
        ? `<span style="color:var(--ok)">да</span> — резерва хватит на ${r.reserveMonths.toFixed(1)} мес,
           продавать в убыток не придётся`
        : `<span style="color:var(--warn)">рискованно</span> — резерва на ${r.reserveMonths.toFixed(1)} мес.
           Если в такой момент понадобятся деньги, придётся продавать по низким ценам и фиксировать убыток`}</div>` : ''}

    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="bC20" style="flex:1">−20%</button>
      <button class="btn ghost" id="bC30" style="flex:1">−30%</button>
      <button class="btn ghost" id="bC50" style="flex:1">−50%</button>
    </div>

    <div class="muted" style="margin-top:14px;line-height:1.7">
      Падение на 30% случалось на российском рынке не раз и занимало месяцы, а восстановление — годы.
      Главное в такой момент — не продавать: убыток становится настоящим только при продаже.
    </div>`);

  $('bC20').onclick = () => openCrashTest(-0.20);
  $('bC30').onclick = () => openCrashTest(-0.30);
  $('bC50').onclick = () => openCrashTest(-0.50);
}

async function openSecurity(ticker) {
  openSheet('<div class="muted">Загружаю данные с биржи — не дольше десяти секунд…</div>');
  const st0 = await store.getState();
  // Факты с биржи — под потолком: карточка без выплат полезнее вечной загрузки.
  let f = await withLimit(store.explainSecurity(ticker), 10, null);
  if (!f) {
    const pos = st0.positions.find(x => x.ticker === ticker);
    if (!pos) { closeSheet(); return; }
    f = { known: false, position: pos };
  }
  const p = f.position;
  const v = positionValue(p), c = p.qty * p.avgPrice, r = c > 0 ? (v - c) / c : 0;
  const others = st0.positions.filter(x => x.qty > 0 && x.ticker !== ticker);
  const cmpDefault = Number(st0.settings?.monthlyContribution) || 30000;
