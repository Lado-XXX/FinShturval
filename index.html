}

async function openSecurity(ticker) {
  openSheet('<div class="muted">Загружаю данные с биржи — не дольше десяти секунд…</div>');
  const st0 = await store.getState();
  // Факты с биржи — под потолком: карточка без выплат полезнее вечной загрузки.
  let f = await withLimit(store.explainSecurity(ticker), 10, null);
  if (!f) {
    const pos = st0.positions.find(x => x.ticker === ticker);
    if (!pos) { closeSheet(); return; }
    f = { known: false, position: pos };
  }
  const p = f.position;
  const v = positionValue(p), c = p.qty * p.avgPrice, r = c > 0 ? (v - c) / c : 0;
  const others = st0.positions.filter(x => x.qty > 0 && x.ticker !== ticker);
  const cmpDefault = Number(st0.settings?.monthlyContribution) || 30000;

  let facts = '';
  if (f.kind === 'bond' && f.known) {
    facts = `
      <div class="diff">Купон <b>${f.couponValue} ₽</b> ${f.couponsPerYear} раза в год — это <b>${money(f.annualCoupon)}</b> с бумаги в год</div>
      <div class="diff">С твоих ${p.qty} шт: <b style="color:var(--ok)">${money(f.netYearly)}</b> в год чистыми после налога</div>
      ${f.maturity ? `<div class="diff">Погашение <b>${f.maturity.split('-').reverse().join('.')}</b> — через ${dec1(f.yearsLeft)} лет государство вернёт номинал ${f.faceValue} ₽ за штуку</div>` : ''}
      ${f.ytm ? `<div class="diff">Доходность к погашению <b style="color:var(--ok)">${pct(f.ytm)}</b> годовых — выше купонной ставки ${dec((f.couponRate * 100).toFixed(2))}%, потому что купил ниже номинала</div>` : ''}
      <div class="muted" style="margin-top:12px">Купон — обязательство государства: размер и даты известны заранее, отменить нельзя. Это самый предсказуемый доход в портфеле.</div>`;
  } else if (f.kind === 'stock' && f.known && f.payments.length) {
    facts = `
      <div class="diff">Выплачено за 12 месяцев: <b>${f.ttm} ₽</b> на акцию${f.yieldTtm ? ` — это <b>${pct(f.yieldTtm)}</b> к текущей цене` : ''}</div>
      <div class="diff">С твоих ${p.qty} шт: <b style="color:var(--ok)">${money(f.netYearly)}</b> в год чистыми, если выплаты повторятся</div>
      <div class="diff">Платит дивиденды <b>${f.streak}</b> ${f.streak === 1 ? 'год' : f.streak < 5 ? 'года подряд' : 'лет подряд'}</div>
      ${f.lastPayment ? `<div class="diff">Последняя выплата: ${f.lastPayment.value} ₽ (${f.lastPayment.date.split('-').reverse().join('.')})</div>` : ''}
      <div class="muted" style="margin-top:12px">Дивиденд — решение совета директоров, а не обязательство. Компания вправе урезать или отменить выплату в любой год. История платежей показывает намерения, но ничего не гарантирует.</div>`;
  } else if (f.kind === 'stock') {
    facts = '<div class="diff">Дивидендов по этой бумаге биржа не показывает — компания их не платит или данных нет.</div>';
  } else {
    facts = '<div class="muted">Не удалось загрузить данные — проверь интернет.</div>';
  }

  // Разбор позиции: что она делает в портфеле и что с ней делать сейчас.
  const card = SH.positionCard(st0, ticker,
    { yields: f.known && f.yieldPct > 0 ? { [ticker]: f.yieldPct } : {} });

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">${esc(p.name)}</h2>
    <p class="muted" style="margin:0 0 14px">${p.qty} шт · средняя ${dec(p.avgPrice)} ₽ · сейчас ${dec(p.price)} ₽${p.priceIsMarket ? '' : ' (цена покупки)'}</p>
    ${card ? `<div class="act" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <b style="font-size:16px">Вердикт: ${esc(card.verdict)}</b>
        <span class="muted">роль — ${esc(card.role)}</span>
      </div>
      <div class="diff">${esc(card.why)}</div>
      <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line)">
        <div class="diff">Доля в портфеле ${pct(card.share)} · ${money(card.value)}</div>
        ${card.income != null
          ? `<div class="diff">Приносит ${money(card.income)} в год после налога</div>` : ''}
        <div class="diff">Вклад в общий риск: ${card.riskAdd > 0
          ? `<b style="color:var(--warn)">${dec1(card.riskAdd)}</b> из ${dec1(card.riskNow)}`
          : 'ничего не портит'}</div>
        ${card.sectorShare != null
          ? `<div class="diff">Отрасль «${esc(card.sector)}» занимает ${pct(card.sectorShare)} портфеля</div>` : ''}
        <div class="diff">Ставка +1 п.п.: ${card.rate.pct != null
          ? `${pct(card.rate.pct)} цены` : 'не считается'}
          <span class="muted">(${esc(card.rate.note)})</span></div>
        <div class="diff">Рубль −1%: ${card.fx.pct != null
          ? `${pct(card.fx.pct)} цены` : 'не считается'}
          <span class="muted">(${esc(card.fx.note)})</span></div>
      </div>
    </div>` : ''}
    ${st0.costIsApproximate ? `<div class="diff" style="color:var(--warn)">
      Цена покупки неизвестна — прибыль по этой бумаге не считается.
      Посмотри среднюю в приложении брокера и впиши.</div>
      <div class="row" style="margin:10px 0">
        <input type="number" id="fAvgPrice" inputmode="decimal" placeholder="средняя цена, ₽" style="flex:2;margin:0">
        <button class="btn" id="bSetAvg" style="flex:1">Сохранить</button>
      </div>` : ''}
    ${!p.priceIsMarket ? `<div class="diff" style="color:var(--warn)">
      Рыночная цена не загружена. Впиши её вручную — посмотри в приложении брокера.</div>
      <div class="row" style="margin:10px 0">
        <input type="number" id="fManualPrice" inputmode="decimal" placeholder="цена, ₽" style="flex:2;margin:0">
        <button class="btn" id="bSetPrice" style="flex:1">Сохранить</button>
      </div>` : ''}
    <div class="diff">Стоимость <b>${money(v)}</b>, вложено ${money(c)} —
      <b class="${r >= 0 ? 'up' : 'down'}">${r >= 0 ? '+' : ''}${pct(r)}</b> по цене</div>
    ${(() => {
      const res = positionResult(st0.ops || [], p);
      if (!res || !(res.paid > 0)) return '';
      return `<div class="diff">С учётом полученных выплат — <b class="${res.total >= 0 ? 'up' : 'down'}">${
        res.total >= 0 ? '+' : ''}${pct(res.totalPct)}</b>:
        дивиденды и купоны по этой бумаге принесли <b style="color:var(--ok)">${money(res.paid)}</b>, они уже на счёте.
        ${res.rescued
          ? 'Цена в минусе, но вместе с выплатами позиция в плюсе — так и бывает у щедрых плательщиков.'
          : 'В день выплаты цена падает примерно на её размер: часть этого «минуса» ты уже получил деньгами.'}</div>`;
    })()}
    ${(() => {
      const role = positionRole(st0, p, { ytm: f.ytm, yieldPct: f.yieldTtm });
      return `<div class="diff"><b>Роль в портфеле: ${esc(role.role)}.</b> ${esc(role.text)}
        Доля — ${pct(role.share)}.${role.caution ? ` <span style="color:var(--warn)">${esc(role.caution)}</span>` : ''}</div>`;
    })()}
    ${facts}
    ${others.length ? `
    <h3 style="margin:18px 0 6px;font-size:15px">Сравнить с другой бумагой</h3>
    <p class="muted" style="margin:0 0 8px">Одна сумма — два варианта: что каждый заплатит за год.
      Считается по фактическим выплатам, не по прогнозам.</p>
    <div class="row" style="margin:0 0 8px">
      <select id="fCmpOther" style="flex:2;margin:0">${others.map(o =>
        `<option value="${esc(o.ticker)}">${esc(o.name)}</option>`).join('')}</select>
    </div>
    <div class="row" style="margin:0 0 8px">
      <input type="number" id="fCmpAmount" inputmode="numeric" value="${cmpDefault}" style="flex:2;margin:0">
      <button class="btn" id="bCompare" style="flex:1">Сравнить</button>
    </div>
    <div id="cmpResult"></div>` : ''}`);

  // Поля выше появляются не всегда, поэтому и обработчики вешаем по наличию.
  const bAvg = $('bSetAvg');
  if (bAvg) bAvg.onclick = async () => {
    const value = Number($('fAvgPrice').value);
    const err = await store.setAveragePrice(p.ticker, value);
    if (err) { $('fAvgPrice').focus(); return alert(err); }
    closeSheet(); render();
  };

  const bPrice = $('bSetPrice');
  if (bPrice) bPrice.onclick = async () => {
    const value = Number($('fManualPrice').value);
    if (!(value > 0)) { $('fManualPrice').focus(); return alert('Цена должна быть больше нуля'); }
    await store.updatePrices([{ ticker: p.ticker, price: value }]);
    closeSheet(); render();
  };

  // Сравнение двух бумаг: считает ядро (compare), интерфейс только показывает.
  // Честность важнее красоты: нет данных с биржи или цены — говорим прямо,
  // а не рисуем нули, похожие на ответ.
  const bCmp = $('bCompare');
  if (bCmp) bCmp.onclick = async () => {
    const out = $('cmpResult');
    const amount = Number($('fCmpAmount').value);
    if (!(amount > 0)) { $('fCmpAmount').focus(); return alert('Сумма должна быть больше нуля'); }
    out.innerHTML = '<div class="muted">Загружаю данные по второй бумаге — не дольше десяти секунд…</div>';
    const f2 = await withLimit(store.explainSecurity($('fCmpOther').value), 10, null);
    if (!f2) {
      out.innerHTML = `<div class="diff" style="color:var(--warn)">Биржа не ответила за десять секунд —
        с файла она недоступна. Сравнение заработает по ссылке: «Ещё» → «Разместить в интернете».</div>`;
      return;
    }
    const p2 = f2 && f2.position;
    if (!f2 || !p2) { out.innerHTML = '<div class="diff" style="color:var(--warn)">Вторая бумага не нашлась в портфеле.</div>'; return; }

    const noFacts = [f.known ? null : p.name, f2.known ? null : p2.name].filter(Boolean);
    if (noFacts.length) {
      out.innerHTML = `<div class="diff" style="color:var(--warn)">По ${noFacts.map(esc).join(' и ')}
        биржа данных не отдала — сравнение выплат было бы выдумкой. Проверь интернет и открой карточку заново.</div>`;
      return;
    }
    const noPrice = [p.price > 0 ? null : p.name, p2.price > 0 ? null : p2.name].filter(Boolean);
    if (noPrice.length) {
      out.innerHTML = `<div class="diff" style="color:var(--warn)">Не знаю цену: ${noPrice.map(esc).join(', ')}.
        Впиши её на карточке бумаги — без цены не посчитать, сколько штук купится.</div>`;
      return;
    }

    const opt = (ff, pp) => ({ ticker: pp.ticker, name: pp.name, kind: ff.kind,
      price: pp.price, annualCoupon: ff.annualCoupon, ttm: ff.ttm });
    const cs = await store.getState();
    const cr = compare(opt(f, p), opt(f2, p2), amount, cs.settings);

    if (cr.a.incomePerYear === 0 && cr.b.incomePerYear === 0) {
      out.innerHTML = `<div class="diff">Ни одна из двух не платит ни купонов, ни дивидендов —
        доход только от изменения цены, а его сравнить заранее нельзя.</div>`;
      return;
    }

    const row = (x) => `<div class="diff"><b>${esc(x.name)}</b>: ${x.shares} шт на ${money(amount)}
      → <b style="color:var(--ok)">${money(x.netPerYear)}</b> в год чистыми${x.guaranteed ? ' — купон, известен заранее' : ''}${
      x.shares === 0 ? ' <span style="color:var(--warn)">(одна штука дороже всей суммы)</span>' : ''}</div>`;
    const d = cr.incomeDiff;
    const winner = d > 0 ? cr.a : d < 0 ? cr.b : null;
    out.innerHTML = row(cr.a) + row(cr.b)
      + (winner
        ? `<div class="diff">На этой сумме <b>${esc(winner.name)}</b> платит на <b>${money(Math.abs(d))}</b> в год больше.</div>`
        : '<div class="diff">Годовые выплаты одинаковы.</div>')
      + (cr.note ? `<div class="muted" style="margin-top:8px">${cr.note}</div>` : '');
  };
}

/**
 * Короткая настройка: три вопроса, без которых советы будут пустыми.
 * Каждый объясняет, зачем нужен — чтобы не выглядело сбором данных ради данных.
 */
function openSetup(step = 1) {
  const steps = {
    1: {
      title: 'Сколько тратит семья в месяц?',
      why: 'От этого зависит размер резерва на чёрный день. Пока резерв не собран, инвестиции — риск: любая неожиданность заставит продавать бумаги в неподходящий момент.',
      id: 'sExp', placeholder: 'например 100000', label: 'Расходы в месяц, ₽'
    },
    2: {
      title: 'Сколько откладываешь в месяц?',
      why: 'Приложение посчитает, за сколько ты дойдёшь до цели и что изменится, если менять сумму.',
      id: 'sCon', placeholder: 'например 30000', label: 'Пополнение в месяц, ₽'
    },
    3: {
      title: 'На что копишь?',
      why: 'Цель нужна, чтобы приложение говорило не «портфель вырос», а «до цели осталось столько-то и вот на сколько ты опережаешь план».',
      id: 'sGoal', placeholder: 'например 6000000', label: 'Сумма цели, ₽'
    }
  };
  const s = steps[step];

  openSheet(`<div class="muted" style="margin-bottom:8px">Шаг ${step} из 3</div>
    <h2 style="margin:0 0 8px;font-size:19px">${esc(s.title)}</h2>
    <p class="muted" style="margin:0 0 16px;line-height:1.6">${s.why}</p>
    <label>${s.label}</label>
    <input type="number" id="${s.id}" inputmode="numeric" placeholder="${s.placeholder}">
    ${step === 3 ? '<label>За сколько лет</label><input type="number" id="sYears" value="5" min="1" max="40">' : ''}
    <button class="btn wide" id="bNext">${step < 3 ? 'Дальше' : 'Готово'}</button>
    <div style="height:8px"></div>
    <button class="btn ghost wide" id="bSkip">Пропустить</button>`);

  const finish = async () => { closeSheet(); render(); };

  $('bNext').onclick = async () => {
    const v = +$(s.id).value || 0;
    if (step === 1) await store.setSetting('monthlyExpenses', v);
    if (step === 2) await store.setSetting('monthlyContribution', v);
    if (step === 3) await store.setSetting('goal', { amount: v, years: +$('sYears').value || 5 });
    step < 3 ? openSetup(step + 1) : finish();
  };
  $('bSkip').onclick = () => (step < 3 ? openSetup(step + 1) : finish());
}

/**
 * Три отчёта брокера — три разных источника, и путать их вредно:
 * из сделок берётся история, из налогового — выплаты, из депозитарного —
 * только количества на дату. Поэтому выбор явный, а файл всё равно
 * проверяется: если человек ошибся вкладкой, приложение скажет, что видит.
 */
const REPORT_KINDS = {
  broker: {
    title: 'Брокерский отчёт',
    accept: '.pdf,.xlsx,.csv,.txt,.tsv',
    hint: `Главный источник: из сделок восстанавливаются точные средние цены
      и честная доходность.<br><br>
      <b>Где взять:</b> ТБанк → Инвестиции → Ещё → Отчёты → «Брокерский отчёт»
      → период. Читаю и PDF, и Excel. PDF должен быть с текстом; если он
      сохранён картинкой, я об этом скажу.<br><br>
      Бери <b>с самого открытия счёта</b>. Отчёт дают помесячно — загружай
      файлы один за другим, повторы отбрасываются.<br><br>
      <b>В журнал попадут:</b> покупки, продажи, комиссия брокера, пополнения
      и выводы. Цена облигации приводится к рублям вместе с накопленным купоном.
      Комиссии биржи и клирингового центра в отчёте показаны, но брокер их
      отдельно не списывает — считается только брокерская.`
  },
  tax: {
    title: 'Налоговый отчёт',
    accept: '.pdf,.xlsx,.csv,.txt,.tsv',
    hint: `Отсюда берутся <b>дивиденды и купоны</b> — их нет в отчёте о сделках.<br><br>
      <b>Где взять:</b> ТБанк → Инвестиции → Ещё → Отчёты → «Налоговый отчёт»
      → период с начала года.<br><br>
      Записывается то, что реально дошло до счёта: начислено минус удержанный
      налог. Выплаты по другим договорам, если они попали в файл, пропускаются —
      счёт берётся из шапки отчёта.`
  },
  depo: {
    title: 'Депозитарный отчёт',
    accept: '.pdf,.xlsx,.csv,.txt,.tsv',
    hint: `Это <b>сверка</b>, а не история. Депозитарий подтверждает, сколько
      бумаг числится за тобой на конкретную дату — без цен и без сделок.<br><br>
      <b>Где взять:</b> ТБанк → Инвестиции → Ещё → Отчёты → «Депозитарный отчёт»
      → дата.<br><br>
      Годится, чтобы проверить себя после загрузки сделок. Расхождение значит
      либо пропущенный отчёт, либо ошибку в журнале.<br><br>
      <b>Важно:</b> отчёт на дату. Если после неё были покупки, он о них не знает —
      смотри список изменений перед тем, как применять.`
  }
};

async function openReport(kind = 'broker') {
  const cfg = REPORT_KINDS[kind] || REPORT_KINDS.broker;
  openSheet(`<h2 style="margin:0 0 6px;font-size:19px">${cfg.title}</h2>
    <p class="muted" style="margin:0 0 14px;line-height:1.6">${cfg.hint}</p>
    <input type="file" id="fReport" accept="${cfg.accept}">
    <div id="reportOut"></div>`);

  $('fReport').onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    $('reportOut').innerHTML = '<div class="muted">Читаю…</div>';

    let text;
    try {
      const buffer = await file.arrayBuffer();
      if (looksLikePdf(buffer)) {
        text = rowsToText(await readPdf(buffer));
      } else if (looksLikeXlsx(buffer)) {
        text = rowsToText(await readXlsx(buffer));
      } else {
        text = new TextDecoder('utf-8').decode(buffer);
      }
    } catch (err) {
      $('reportOut').innerHTML = `<div class="err">${esc(err.message || 'Не удалось прочитать файл')}</div>`;
      return;
    }

    const asTrades = parseTrades(text);
    const income = parseIncome(text);
    const found = asTrades.trades.length ? 'broker' : income.payouts.length ? 'tax' : 'depo';
    const mismatch = found === kind ? '' : `<div class="diff" style="color:var(--warn)">
      Похоже, это <b>${esc(REPORT_KINDS[found].title.toLowerCase())}</b>, а не тот, что выбран.
      Разберу как есть.</div>`;

    // 1. Брокерский отчёт: сделки, деньги, попутные выплаты.
    if (found === 'broker') {
      const cash = [...parseCashOps(text), ...income.payouts];
      const period = asTrades.period;
      $('reportOut').innerHTML = `
        <div style="height:14px"></div>
        ${mismatch}
        <div class="diff">Найдено ${asTrades.trades.length} ${asTrades.trades.length === 1 ? 'сделка' : 'сделок'}
          за период ${period.from.split('-').reverse().join('.')} — ${period.to.split('-').reverse().join('.')}
          ${cash.length ? ' · и ' + cash.length + ' операц. с деньгами' : ''}</div>
        ${asTrades.trades.slice(0, 6).map(t => `<div class="diff">
          <span class="muted">${t.date.split('-').reverse().join('.')}</span>
          ${t.type === 'buy' ? 'куплено' : 'продано'} <b>${esc(t.ticker)}</b> ${t.qty} шт по ${dec(t.price)} ₽</div>`).join('')}
        ${asTrades.trades.length > 6 ? `<div class="muted">…и ещё ${asTrades.trades.length - 6}</div>` : ''}
        <div class="muted" style="margin-top:10px">Из сделок восстановятся точные средние цены и честная доходность.
          Повторная загрузка того же отчёта дублей не создаст.</div>
        <div style="height:12px"></div>
        <button class="btn wide" id="bApplyTrades">Загрузить сделки</button>`;

      $('bApplyTrades').onclick = async () => {
        await store.importTrades(asTrades.trades, cash);
        const st2 = await store.getState();
        closeSheet();
        if (!st2.settings.monthlyExpenses) return openSetup();
        render();
      };
      return;
    }

    // 2. Налоговый отчёт: выплаты по бумагам.
    if (found === 'tax') {
      $('reportOut').innerHTML = `
        <div style="height:14px"></div>
        ${mismatch}
        <div class="diff"><b>Выплат найдено: ${income.payouts.length}</b>${income.account ? ' · счёт ' + esc(income.account) : ''}</div>
        ${income.payouts.map(p => `<div class="diff">
          <span class="muted">${p.date.split('-').reverse().join('.')}</span>
          <b>${esc(p.name || p.ticker || 'выплата')}</b> — ${money(p.amount)}
          <span class="muted">(начислено ${money(p.gross)}, налог ${money(p.tax)})</span></div>`).join('')}
        ${income.foreign.length ? `<div class="diff" style="color:var(--info)">
          Пропущены выплаты по другим договорам: ${income.foreign.map(esc).join(', ')}.</div>` : ''}
        <div class="muted" style="margin-top:10px">Записываю то, что дошло до счёта, — за вычетом налога.
          Повторная загрузка дублей не создаст.</div>
        <div style="height:12px"></div>
        <button class="btn wide" id="bApplyIncome">Загрузить выплаты</button>`;
      $('bApplyIncome').onclick = async () => {
        await store.importTrades([], income.payouts);
        closeSheet(); render();
      };
      return;
    }

    // 3. Депозитарный отчёт и любой список позиций: сверка количеств.
    const parsed = parseReport(text);
    if (parsed.error) {
      $('reportOut').innerHTML = `<div class="err">${esc(parsed.error)}</div>
        <div class="muted" style="margin-top:8px">Если формат непривычный — попробуй вставить список текстом.</div>`;
      return;
    }

    const onDate = /(?:за|на)\s+(\d{2}\.\d{2}\.\d{4})/.exec(text);
    const st = await store.getState();
    const changes = diff(parsed, st.positions);
    const label = { add: 'добавить', qty: 'изменить количество', gone: 'списать' };

    $('reportOut').innerHTML = `
      <div style="height:14px"></div>
      ${mismatch}
      <div class="diff"><b>Прочитано ${parsed.rows.length} ${parsed.rows.length === 1 ? 'бумага' : 'бумаг'}</b>
        ${onDate ? ' на ' + esc(onDate[1]) : ''}${parsed.cash != null ? ' · свободно ' + money(parsed.cash) : ''}</div>
      ${parsed.unknown.length ? `<div class="diff" style="color:var(--warn)">
        Не понял: ${parsed.unknown.slice(0, 5).map(esc).join(', ')}${parsed.unknown.length > 5 ? ' и ещё ' + (parsed.unknown.length - 5) : ''}</div>` : ''}
      ${parsed.rows.some(r => r.priceUnknown) ? `<div class="diff" style="color:var(--info)">
        Цен в отчёте нет — депозитарий подтверждает права на бумаги, но не их оценку.
        Количества возьму отсюда, цены подтяну с биржи или впишешь вручную.</div>` : ''}
      ${changes.length
        ? `<div class="diff">Изменений: ${changes.length}</div>
           ${changes.slice(0, 8).map(c => `<div class="diff"><b>${esc(c.name || c.ticker)}</b> — ${label[c.kind] || c.kind}
             ${c.kind === 'qty' ? `<span class="muted">(${c.from} → ${c.to} шт)</span>` : ''}
             ${c.kind === 'add' ? `<span class="muted">(${c.qty} шт)</span>` : ''}</div>`).join('')}
           ${changes.length > 8 ? `<div class="muted">…и ещё ${changes.length - 8}</div>` : ''}
           ${changes.some(c => c.kind === 'gone') ? `<div class="muted" style="margin-top:8px;color:var(--warn)">
             Списание значит, что на ${onDate ? esc(onDate[1]) : 'дату отчёта'} бумаги не было.
             Если ты купил её позже — не применяй, отчёт просто старше покупки.</div>` : ''}`
        : '<div class="diff">Всё сходится с тем, что уже записано.</div>'}
      <div style="height:12px"></div>
      <button class="btn wide" id="bApplyReport">${changes.length ? 'Применить' : 'Закрыть'}</button>`;

    $('bApplyReport').onclick = async () => {
      if (changes.length) await store.applySync(changes, parsed.cash);
      const st2 = await store.getState();
      if (!st2.settings.monthlyExpenses) return openSetup();
      closeSheet(); render();
    };
  };
}

// Пустой или вечно «считающий» лист — та же худшая ошибка, что и пустой
// экран: человек не знает, что случилось. Любая поломка листа обязана
// показаться словами. Скриншот этого текста — лучший баг-репорт.
function guardSheet(fn) {
  return async function guarded(...args) {
    try { return await fn.apply(this, args); }
    catch (err) {
      console.error(err);
      openSheet(`<h2 style="margin:0 0 8px;font-size:19px">Не получилось посчитать</h2>
        <p class="muted" style="line-height:1.7">${esc(err && err.message ? err.message : String(err))}</p>
        <p class="muted" style="line-height:1.7">Это ошибка приложения, а не твоих данных — данные целы.
          Скриншот этого текста — лучший способ сообщить об ошибке.</p>`);
    }
  };
}

// история операций весит немало, а меняется редко.
async function refreshFromBroker() {
  if (!navigator.onLine) return;
  const token = await store.getMeta('tiToken');
  if (!token || !(await store.getMeta('tiAccount'))) return;
  // После обновления приложения журнал пересобирается начисто: правила
  // разбора могли измениться, и старые записи уже не обязаны им отвечать.
  const builtWith = await store.getMeta('syncedBuild');
  const fresh = builtWith === store.BUILD_ID;
  const last = await store.getMeta('tiSyncedAt');
  if (fresh && last && Date.now() - last < 15 * 60000) return;
  try {
    const r = await guardJournal(() => store.syncTinvest({ force: !fresh }));
    if (r && r.ok === false) console.warn('Т-Инвестиции: не сошлось', r.problems);
    render();

}

async function refreshQuotes() {

  if (st.isEmpty || !navigator.onLine) return;
  if (await store.getMeta('tiToken')) return;   // цены уже пришли от брокера
  const stale = st.settings.lastPriceUpdate == null
    || Date.now() - st.settings.lastPriceUpdate > 15 * 60000
    || st.stalePrices.length > 0;
  if (!stale) return;
  try {
    const { updated } = await fetchPrices(st.positions.filter(p => p.qty > 0));
    if (updated.length) await store.updatePrices(updated);

}

/**
 * ОБНОВЛЕНИЕ.
 *
 * Корень прежней беды: страница, которой управляет служебный обработчик, не
 * может обойти его своим запросом. Ни `cache: 'reload'`, ни `Cache-Control`,
 * ни `?v=…` не помогают — они про кэш браузера, а обработчик стоит перед ним
 * и отвечает первым. Прежняя проверка качала index.html и читала отметку
 * сборки из ОТВЕТА ОБРАБОТЧИКА, то есть из старой копии, и делала вывод «на
 * сервере то же самое». Круг замыкался: приложение не обновлялось и честно
 * докладывало, что обновляться не нужно.
 *
 * Выход один: спрашивать про версию тот файл, за которым браузер ходит мимо
 * всех обработчиков, — сам sw.js. Заодно это в тысячи раз дешевле: раньше на
 * каждое возвращение к вкладке качался весь index.html, а это больше
 * полумегабайта.
 *
 * Второй корень: смена управляющего не перерисовывает страницу. Обработчик
 * может встать новый, а в памяти вкладки останется прежняя разметка. Поэтому
 * ниже есть подписка на смену управляющего и на сообщение об активации —
 * перезагрузка делается один раз и по факту, а не по надежде.
 */
const SW_URL = './sw.js';
let swReg = null;

// Что показала последняя проверка обновления — видно в диагностике.
// Раньше проверка молчала при любом исходе, и понять, почему приложение
// не обновилось, было невозможно.
let updateState = { at: null, server: null, error: null };

/** Перезагрузка ровно один раз за попытку — иначе легко уйти в круг. */
let reloading = false;
// Сколько сейчас идёт записей в журнал. Перезагрузка посреди пересборки
// оставляет журнал пустым: старые записи уже удалены, новые ещё не легли.
// Копия в хранилище это чинит при следующем запуске, но человек успевает
// увидеть пустое приложение и решить, что данные пропали. Проще подождать.
let journalBusy = 0;
let reloadWaits = 0;
async function guardJournal(fn) {
  journalBusy += 1;
  try { return await fn(); } finally { journalBusy -= 1; }
}

function reloadOnce(hard = false) {
  if (reloading) return;
  if (journalBusy > 0 && reloadWaits < 20) {      // ждём не дольше полуминуты
    reloadWaits += 1;
    setTimeout(() => reloadOnce(hard), 1500);
    return;
  }
  reloading = true;
  // Отметка живёт минуту, а не всю сессию. Прежняя запоминала НОМЕР сборки
  // навсегда: одна неудачная попытка — и до перезапуска приложения повторов
  // не было вовсе, даже когда обновление уже стало возможным.
  try {
    const key = 'shturval:reloadAt';
    const last = Number(sessionStorage.getItem(key) || 0);
    if (Date.now() - last < 60000) { reloading = false; return; }
    sessionStorage.setItem(key, String(Date.now()));
  } catch { /* хранилище недоступно — обойдёмся без защиты от круга */ }
  if (hard) location.replace(location.pathname + '?upd=' + Date.now());
  else location.reload();
}

/** Спросить обработчик и дождаться ответа, но не дольше отведённого. */
function askWorker(worker, message, ms = 2000) {
  return new Promise(resolve => {
    if (!worker) { resolve(null); return; }
    let done = false;
    const finish = v => { if (!done) { done = true; resolve(v); } };
    setTimeout(() => finish(null), ms);
    try {
      const ch = new MessageChannel();
      ch.port1.onmessage = e => finish(e.data || null);
      worker.postMessage(message, [ch.port2]);
    } catch { finish(null); }
  });
}

// Был ли обработчик на момент загрузки страницы. Нужно вот зачем: при самой
// первой установке обработчик встаёт и берёт вкладку под управление —
// «управляющий сменился». Перезагружать тут нечего: разметка уже свежая, и
// человек на ровном месте видел бы лишнее моргание при первом же заходе.
const hadController = !!(navigator.serviceWorker && navigator.serviceWorker.controller);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Подписки ставятся СРАЗУ, до регистрации. Обработчик может активироваться
  // и отправить сообщение раньше, чем разрешится обещание регистрации, а
  // сообщение без слушателя просто пропадает — в отличие от очереди порта.
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) reloadOnce();
  });
  navigator.serviceWorker.addEventListener('message', e => {
    const d = e.data || {};
    if (d.type === 'shturval:activated' && d.build && d.build !== BUILD) reloadOnce();
  });
  // updateViaCache: 'none' — чтобы сам sw.js не приезжал из кэша браузера.
  // GitHub Pages отдаёт файлы с запасом в десять минут, и без этой настройки
  // новый обработчик всё это время просто не находится.
  navigator.serviceWorker.register(SW_URL, { updateViaCache: 'none' })
    .then(reg => { swReg = reg; })
    .catch(err => { updateState = { at: Date.now(), server: null, error: 'обработчик не встал: ' + (err && err.message) }; });
}

async function checkForUpdate(auto = true) {
  if (!location.protocol.startsWith('http')) {
    updateState = { at: Date.now(), server: null, error: 'открыто не по ссылке' };
    return updateState;
  }
  try {
    // Просим браузер перепроверить обработчик ДО опроса версии и независимо
    // от его исхода. Запрос за сценарием обработчика браузер делает мимо
    // обработчиков — он не врёт никогда. Опрос ниже врать может: пока у руля
    // стоит СТАРЫЙ обработчик, он вправе ответить на запрос за sw.js своей
    // копией. Тогда версия совпадёт, а обновление всё равно поедет — через
    // эту перепроверку.
    if (swReg) { try { await swReg.update(); } catch { /* сеть подведёт — не беда */ } }

    // Единственный запрос, который гарантированно доходит до сервера: за
    // самим обработчиком браузер ходит мимо обработчиков. Он же и маленький.
    const res = await fetch(SW_URL + '?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) {
      updateState = { at: Date.now(), server: null, error: `сервер ответил кодом ${res.status}` };
      return updateState;
    }
    const text = await res.text();
    const m = text.match(/BUILD\s*=\s*'([^']+)'/);
    updateState = { at: Date.now(), server: m ? m[1] : null,
                    error: m ? null : 'в ответе нет отметки сборки' };
    if (!m || m[1] === BUILD) return updateState;
    if (!auto) return updateState;
    await applyUpdate();
    return updateState;
  } catch (err) {
    updateState = { at: Date.now(), server: null,
                    error: (err && err.message) ? err.message : String(err) };
    return updateState;
  }
}

/**
 * Поставить новую сборку. Порядок важен: сначала просим браузер перепроверить
 * обработчик (этот запрос идёт в сеть), потом — если новый уже ждёт — велим
 * ему встать немедленно. Перезагрузку сделает подписка на смену управляющего,
 * а не мы: так страница перечитывается ровно тогда, когда новый уже главный.
 */
async function applyUpdate() {
  try { if (swReg) await swReg.update(); } catch { /* проверим в следующий раз */ }
  const pending = swReg && (swReg.waiting || swReg.installing);
  if (pending) { pending.postMessage({ type: 'shturval:skip-waiting' }); return; }
  // Обработчика нет вовсе — тогда мешать нечему, просто перечитываем страницу.
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) { reloadOnce(); return; }
  // Управляющий есть, но нового рядом не появилось: значит сборка разошлась
  // не из-за обработчика. Уходим по свежему адресу мимо кэша браузера.
  reloadOnce(true);
}

/**
 * Обновиться немедленно, по нажатию: без ожидания и без догадок.
 *
 * Прежняя версия снимала регистрацию обработчика и тут же перезагружалась.
 * Это не работает: снятие регистрации завершается лишь после того, как
 * закроются все управляемые вкладки, а действующий обработчик до тех пор
 * продолжает отвечать — в том числе на эту самую перезагрузку. Кнопка
 * приводила ровно туда же, откуда нажималась.
 */
async function forceUpdate() {
  // Нажатие — это прямое распоряжение человека, и защита от круга к нему не
  // относится. Без сброса второе нажатие в течение минуты не делало БЫ
  // ничего, и кнопка выглядела бы сломанной ровно в тот момент, когда её
  // жмут второй раз именно потому, что первое не помогло.
  try { sessionStorage.removeItem('shturval:reloadAt'); } catch { /* и ладно */ }
  reloading = false;
  try {
    if (swReg) { try { await swReg.update(); } catch { /* сеть подведёт — идём дальше */ } }
    const pending = swReg && (swReg.waiting || swReg.installing);
    if (pending) pending.postMessage({ type: 'shturval:skip-waiting' });

    // Копии выбрасывает тот, кто их создаёт: очистка из страницы бесполезна,
    // обработчик положит их обратно при первом же запросе.
    const ctrl = navigator.serviceWorker && navigator.serviceWorker.controller;
    const answered = ctrl ? await askWorker(ctrl, { type: 'shturval:force' }, 2500) : null;

    if (!answered) {
      // Обработчик старый и такого разговора не понимает — здесь и только
      // здесь уместно снять регистрацию и уйти по другому адресу: старому
      // обработчику нечего будет ответить на новый переход.
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.map(n => caches.delete(n)));
      }
      if ('serviceWorker' in navigator) {
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      }
      reloadOnce(true);
      return;
    }
  } catch { /* что вышло — то вышло, перезагрузка ниже в любом случае */ }
  reloadOnce();
}
checkForUpdate();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') checkForUpdate();
});

})();
</script>
</body>
</html>
