    ${item('Поиск по рынку перестал обходить защиту стороной', 'Раздел «что подходит портфелю» ищет тот класс, которого не хватает сильнее всего. Защита в этом сравнении не участвовала вовсе: её доля не попадала в расчёт, разность выходила нечислом, а любое сравнение с нечислом ложно. Выбор поэтому всегда падал на акции или облигации — даже когда золота 5% при цели 10% и не хватало именно его. Заготовленный текст «искал защиту: фонды на золото» лежал в коде мёртвым и не показывался ни разу.')}
    ${item('Числа с десятой пишутся по-русски', 'Правило было заведено для процентов, но мимо него остались сроки, месяцы и секунды: на одном экране стояло «резерва на 1.0 мес» рядом с «10,8%», а в диагностике — «ответ за 0.4 с». Теперь запись одна на все величины: целое без хвоста, десятая через запятую. Проверка следит, чтобы новых точек не завелось.')}
    ${item('Взнос больше не спорит с карточкой долей', 'На «Портфеле» акции стояли выше цели — 65,9% из 65%, — а план тут же отдавал им бо́льшую часть взноса. Арифметика была верной: недобор считается от суммы ПОСЛЕ пополнения, и класс, стоящий у цели сегодня, всё равно должен получить часть, иначе сам взнос сдвинет его долю вниз. Не было сказано главного — от какой суммы идёт счёт. Теперь сказано.')}
    ${item('Скрытые ошибки перестали быть скрытыми', 'Три последние найденные поломки — вызов функции из чужого модуля, чтение переменной, которой нет, и нажатие вместо числа — жили за пойманным и никому не показанным исключением. Приложение выглядело работающим и объясняло происходящее неправильно. Глотать ошибки местами приходится: одна не пришедшая история выплат не повод рушить экран. Глотать молча — нет. Теперь всё пойманное и не показанное попадает в список: место, текст, число повторов. Смотреть его в «Ещё» → «Диагностика», в самом низу. Пусто там — хороший знак; если экран ведёт себя странно, причина, скорее всего, лежит именно в этом списке.')}\n    ${item('Совет об обмене перестал обещать прошлогодний доход', 'Та же беда, что и в подписи, но дороже: карточка обмена писала «выплаты за 12 месяцев» и считала от них выгоду в рублях за год. У бумаги, переставшей платить, это выплаты позапрошлого года, а разница подавалась как будущий доход — по ней и принимается решение продать одну бумагу и купить другую. Оговорка «и то лишь если выплаты вернутся» оказалась полумерой: приложение всё равно звало платить комиссию и налог за доход, которого год никто не видел. Теперь такая бумага в советы об обмене не попадает вовсе. В списке идей она остаётся — смотреть на неё можно, менять на неё нельзя.')}\n    ${item('Инвестиционный комитет — и то, чего он про рынок не скажет', 'Сводка на сегодня собрана наверху: условия, главный риск, возможность, действие и уверенность вывода. Про «рынок позитивный или негативный» здесь сознательно ничего нет и не будет: данных, чтобы судить о направлении рынка, у приложения не появится, а выдать догадку за вывод — худшее, что может сделать советник. Вместо направления — УСЛОВИЯ из двух измеренных величин: во что обходятся деньги и что приносят бумаги. «Деньги стоят 16% годовых, бумаги приносят 10,7%» — это арифметика, а не предсказание, и решение из неё следует честно. Уверенность вывода тоже измеряется: это доля известных данных, а не ощущение. Когда ставка неизвестна, приложение так и пишет — условия не назвать, — и перечисляет, чего не хватает.')}\n    ${item('Красные флаги — до всех прочих разборов', 'То, что требует внимания сегодня, стоит наверху главного экрана, а не четвёртой строкой после прогноза на пять лет: человек с пустой подушкой должен узнать об этом первым. Флаг ставится только по измеренному. Отрицательная реальная доходность считается по формуле, а не вычитанием инфляции из доходности, и если доходность бумаг ещё не измерена — флага нет вовсе, потому что ставить его было бы не на чем.')}\n    ${item('История решений видна в журнале', 'Расчёт был готов, а на экране его не было — мёртвый расчёт хуже отсутствующего: он создаёт видимость работы. Теперь под лентой операций видно, как каждая сделка двигала риск: покупка защиты с 6,8 до 4,5, покупка ОФЗ с 7,0 до 6,8. Рядом сказано, почему, и оговорено, что риск на каждую дату пересчитан сегодняшней моделью, а не взят из сохранённой записи.')}\n    ${item('История решений считается из журнала, а не хранится', 'Видно, как менялся риск от собственных сделок: покупка защиты 5 августа увела его с 6,8 до 4,5, а первые покупки в мае — с десятки до восьми. Ничего для этого не хранится, и это принципиально. Портфель на любую дату восстанавливается из журнала, значит риск до и после каждой сделки считается ТОЙ ЖЕ моделью, что работает сегодня. Заведи мы запись «на тот момент риск был такой-то» — она разошлась бы с моделью при первой её правке, и история стала бы врать тем убедительнее, чем старше. Цены берутся нынешние: сделка оценивается по тому, как она изменила состав портфеля, а не по тому, угадана ли цена.')}\n    ${item('Объяснение риска перестало спорить само с собой', 'Фраза «снизился, потому что ухудшилась мера» выходила, когда причиной бралась самая крупная подвижка — даже направленная против итога. Теперь причина ищется среди мер, сдвинувшихся в ту же сторону, что и общий счёт, а если что-то двигалось против, об этом сказано отдельно: объяснение не должно выглядеть полнее, чем оно есть.')}\n    ${item('Карточка бумаги отвечает, что с ней делать', 'В карточке каждой позиции появился вердикт — держать, докупить, сократить или заменить — с числами, по которым он получен. Рядом: доля в портфеле, поток после налога, вклад в общий риск, доля своей отрасли и две чувствительности. У облигации отклик на ставку ИЗМЕРЯЕТСЯ по её сроку: 4,6 года — значит пункт ставки стоит 4,6% цены. У акции это допущение, и так и подписано. К курсу привязано только то, что к нему действительно привязано; про рублёвую бумагу написано «не считается», а не поставлен ноль — ноль означал бы знание, что связи нет, а её просто не измеряли.')}\n    ${item('Вклад бумаги в риск считался задом наперёд', 'Сначала я определил его как «насколько изменится индекс, если бумагу убрать». Проверил на портфеле — вклад вышел ОТРИЦАТЕЛЬНЫМ у всех бумаг сразу. Это не ошибка счёта, а негодное определение: изъятие любой позиции уменьшает портфель, доли остальных механически растут, и портфель «ухудшается». Получалось, что даже бумага, вылезшая за предел доли, числится снижающей риск. Теперь считается прямо: штраф тех мер, в которых виновата именно она. На нынешнем портфеле весь вклад даёт ОФЗ 26235 с её тридцатью процентами, у остальных — ноль, и это правда.')}\n    ${item('У каждого совета названо условие, при котором он ошибка', 'Совет, который нельзя опровергнуть, — не совет, а мнение: что бы ни случилось, задним числом он окажется прав. Теперь под выбранным действием стоят условия его ошибочности, и притом числами, которые можно проверить самому. Не «при неблагоприятном развитии событий», а «до предела в 25% на бумагу останется ещё столько-то рублей», «прибавка к выплатам — столько-то в год после налога, при урезании вдвое останется половина», «подушка ноль месяцев при цели три». Запас до предела считается от доли ПОСЛЕ покупки, а не от нынешней: от нынешней вышел бы противоположный вывод из тех же данных. Оговорка защищает автора совета, число защищает читателя.')}\n    ${item('Инвестиционный комитет — и чего он не делает', 'Наверху появилась сводка: условия, уверенность вывода, что сделать и почему. Про направление рынка в ней сознательно ничего нет — данных, чтобы судить, вырастет он или упадёт, у приложения не появится, и такой вывод был бы предсказанием, а не расчётом. Вместо него УСЛОВИЯ из двух измеренных величин: во что обходятся деньги и что приносят бумаги. Когда ключевая ставка 16%, а портфель даёт 10,7%, так и написано — вклад сейчас конкурирует с портфелем; и тут же сказано, что это не повод продавать, потому что ставка меняется, а состав портфеля рассчитан на годы. Уверенность вывода тоже измеряется, а не ощущается: это доля известных данных, и рядом перечислено, чего именно не хватает. Нет ставки — приложение так и говорит «условия не назвать», вместо того чтобы придумать бодрую фразу.')}\n    ${item('Красные флаги встали выше прогнозов', 'То, что требует внимания сегодня, показывается до всех разборов: человек с пустой подушкой не должен узнавать об этом четвёртой строкой после разброса на пять лет. Флаг ставится только по измеренному — перекос в одной бумаге, нехватка денег на счёте, пустая подушка, доход ниже инфляции. Последнее считается по формуле, а не вычитанием: при 5% годовых и инфляции 8% настоящий рост не −3%, а −2,8%. Если величина не измерена, флага нет вовсе: придумать его ради полноты списка значило бы соврать в самом опасном месте.')}\n    ${item('Рынок падает не единственным способом', 'Обвал акций приложение считало давно, но это лишь одна из бед. Ставка бьёт по облигациям, и тем сильнее, чем длиннее бумага. Слабый рубль поднимает всё, что привязано к валюте, — на этом портфеле золото, и портфель в таком сценарии не падает, а прибавляет. Урезанные вдвое выплаты не трогают цену бумаг вовсе: беднеет поток, а капитал остаётся. Показывать там просадку капитала было бы неправдой. Купоны при этом не режутся: они назначены договором, а не решением совета директоров. Для каждого сценария видно, сколько останется, какой класс дал главный вклад, каким станет риск-индекс и почему он изменился — словами. Про акции сказано честно: их отклик на ставку и курс у каждой компании свой, данных для этого нет, и там, где взято допущение, оно так и подписано.')}\n    ${item('Появился главный вывод на сегодня', 'Числа отвечают на «сколько», но не на «и что теперь». Одна фраза наверху собирает то же, что показано под ней: в норме ли портфель, какая мера слабее всех и хватит ли нынешнего темпа до цели. Собирается из тех же величин намеренно — фраза, посчитанная отдельно, рано или поздно начнёт спорить с числами под собой.')}\n    ${item('Советы выстраиваются по доминированию, а не по весам', 'Обычный способ ранжировать советы — сложить меры с коэффициентами вида «0,4 за риск, 0,3 за структуру». Это выглядит наукой, но числа берутся с потолка: обосновать, почему именно 0,4, нельзя, а результат зависит от них целиком. Здесь другой порядок. Сначала запреты: действие, поднимающее риск, усиливающее нарушение предела доли или оставляющее меньше денег, чем на месяц расходов, не занижается в списке — оно не показывается вовсе, а причина отказа названа. Затем доминирование: вариант лучше, если не хуже ни по одной из шести мер и лучше хотя бы по одной; здесь веса не нужны в принципе. Если никто никого не превосходит — берётся улучшающий больше мер сразу, а ничьи разрешаются объявленным порядком, а не случайностью: на одних и тех же данных ответ обязан быть одним и тем же. На главном экране появился блок «Сегодня стоит сделать» — не больше трёх пунктов, с разбором, почему выбран первый, и с честно названными мерами, которые при этом ухудшились.')}\n    ${item('Риск и прогноз цели вышли на главный экран', 'Считалось это давно, а показывалось на четвёртой вкладке: чтобы узнать, рискован ли портфель и дойдёт ли он до цели, надо было искать. Теперь на главном сразу: риск-индекс с полосой и тремя главными причинами по вкладу в штраф, разброс результата через пять лет, вероятность дойти до цели и сколько до неё не хватает. Числа намеренно грубые — «2,8 млн ₽», а не «2 148 273 ₽», и «вероятность низкая», а не «18,4%». Разброс считается по трём тысячам случайных траекторий: точность до рубля в нём была бы выдумкой, а сотая доля процента сообщала бы уверенность, которой у случайной модели нет.')}\n    ${item('План нарушал предел, ради которого сам же существует', 'Приложение не даёт докупать бумагу, чья доля перевалила за четверть портфеля. Но когда взнос велик и в предел не помещается НИКТО, выбор шёл по доходности выплат — и ею оказывалась самая крупная позиция. На портфеле в 191 тысячу взнос в 30 тысяч уводил долю одной бумаги с 23,5% сразу за 33%: совет прямо противоречил правилу, соблюдать которое требует. Теперь в таком случае выбирается бумага, нарушающая предел МЕНЬШЕ всех, и об этом сказано прямо — с будущей долей и с двумя способами обойтись без нарушения. На нынешнем портфеле это меняет и выбор бумаги, и итог: риск-индекс после взноса идёт вниз, а не вверх.')}\n    ${item('Каждый план показывает «было → станет»', 'Совет без последствия — это мнение. Теперь под раскладкой взноса стоит таблица: риск-индекс, доли трёх классов и свободные деньги до и после покупки, а неизменившееся так и помечено. План применяется к копии портфеля, и обе картины считаются одним и тем же кодом — иначе «до» и «после» рано или поздно разъедутся. Вероятность дойти до цели в таблицу не идёт намеренно: один взнос двигает её на доли процента, и показывать такое движение значило бы выдавать шум за результат.')}\n    ${item('Все пороги приложения сведены в один объект', 'Числа, по которым приложение судит о портфеле, лежали в четырёх наборах: пределы концентрации в советнике, допущения о рынке в ядре, свежесть выплат рядом, ставка налога отдельно. Пока они не пересекались, это сходило с рук — но стоит одному порогу появиться в двух местах, и карточки начинают спорить друг с другом, а найти, где правится число, становится негде. Теперь объект один, а прежние имена — не копии, а ссылки на него.')}\n    ${item('Появился риск-индекс портфеля от нуля до десяти', 'Карточки говорят про каждую беду отдельно: тут концентрация, там нет защиты, здесь пустой резерв. Понять по ним, стало ли в целом хуже после покупки, невозможно — а именно это и нужно, чтобы сравнить два решения. Индекс складывает пять мер: доля одной бумаги, доля одной отрасли, защитные активы, коридор облигаций и свободные деньги в месяцах расходов. Штраф растёт плавно, а не рывком: бумага на 26% и бумага на 60% — разные портфели. Если расходы не заданы, мера про деньги не считается вовсе, а не даёт нулевой штраф: иначе портфель выглядел бы безопаснее просто потому, что про него меньше известно.')}\n    ${item('Машинных дат больше нет ни на одном экране', 'Проверку на дату вида «2026-08-04» вместо «04.08.2026» я поставил там, где такую дату нашёл, — на листе разбора операции. Правильно ставить её везде: одна величина в двух видах это одна и та же беда, где бы она ни вылезла. Теперь на машинную дату смотрят все четыре экрана и все листы. Отметку сборки проверка отличает от даты и не путает их. Заодно сама отметка догнала календарь: сборки шли под шестым августа до буквы «z», хотя на дворе девятое.')}\n    ${item('Половина обмена не знала про лоты', 'В плане обмена покупка считалась лотами, а продажа делала вид, что лотов нет: размер лота вычислялся, клался в результат и не использовался нигде. Между тем позиция не всегда делится на лот нацело — 124 штуки при лоте из десяти это 12 лотов и ещё 4 штуки, которые уходят отдельной заявкой. Теперь состав назван у обеих половин операции, и остаток тоже. Лист подтверждения обмена вообще не проверялся до сих пор: он берёт идею по номеру из прошлого поиска, и чтобы его открыть, набор сначала наполняет список замен отрисовкой — как это делает само приложение.')}\n    ${item('Дата в разборе операции была машинной', 'Нажимаешь операцию в журнале — и в карточке стоит «2026-08-04», тогда как строкой выше в самой ленте написано «04 авг». Одна и та же величина в двух видах на соседних экранах. Нашлось расширением обхода на листы, которым нужен довод: карточка бумаги, разбор операции, загрузка отчёта. Теперь проверка не пропустит машинную дату ни на одном листе.')}\n    ${item('Проверка набора разделена на быструю и полную', 'Полный прогон гоняет весь набор по разу на каждую из двух сотен подсаженных поломок и занимает четыре минуты. Ждать их после каждой мелкой правки — верный способ перестать запускать проверку вовсе. Теперь есть быстрый режим: только тесты, две секунды. Полный остаётся обязательным перед выкладкой, и быстрый прямо говорит, что мутационную часть не запускал: «зелено» после быстрого прогона и после полного — разные утверждения.')}\n    ${item('Заметка о копейках дошла до экрана, а не осталась в хранилище', 'Расхождение по деньгам записывалось со сверки — и не показывалось нигде. Записать и никому не показать это то же самое, что скрыть: человек видит в диагностике два разных числа и не знает, поломка это или округление. Теперь заметка выводится там же, под строкой денег.')}\n    ${item('Срок до погашения печатался бы с хвостом в двенадцать знаков', 'Разбор собственной вчерашней правки: годы обернули в ту же запись, что и цены, а она намеренно не округляет — у фондов последний знак цены не украшение. Но срок до погашения нигде не округлялся, и на карточке облигации встало бы «4,602739726027397 лет». Теперь годы идут через запись с одной десятой, а сам срок и размер ближайшей выплаты округляются там, где считаются: округлять при показе — значит однажды забыть об этом в одном из мест.')}\n    ${item('«Выплат за год» больше не обещает доход, которого нет', 'На карточке бумаги стояло «22,6% выплат за год», а строкой ниже — «последняя выплата 14 мес назад». Оба утверждения были правдой по отдельности: окно доходности отсчитывается назад от ПОСЛЕДНЕЙ выплаты, иначе годовой плательщик, заплативший одиннадцать месяцев назад, показывал бы ноль. Но у бумаги, переставшей платить, подпись превращалась в обещание текущего дохода. Теперь у таких бумаг написано прямо: «22,6% за год до последней выплаты (03.06.2025)». Число то же, смысл — честный.')}\n    ${item('Ещё шесть чисел с точкой и сеть пошире', 'Правило про запятую держалось на поиске toFixed, а дробь бывает и без него: срок до цели, выплата на бумагу за год, срок до погашения облигации и размер ближайшей выплаты в календаре печатались с точкой. Проверка теперь смотрит на отрисованные экраны — на число с точкой перед любой единицей, а не только перед рублём, — и отдельно на исходник: дробь перед единицей обязана идти через русскую запись. Целые величины перечислены поимённо, а не пропущены по маске.')}\n    ${item('Диагностика перестала спорить со сверкой', 'Сверка принимала копеечное расхождение по деньгам, а диагностика тут же красила те же деньги красным как поломку. Теперь у обеих один допуск, а рядом с числами написано, сколько из этого — округление.')}\n    ${item('Копейки перестали блокировать журнал', 'Сверка отвергала журнал при расхождении в деньгах больше рубля. Но деньги — это остаток: в них стекается округление КАЖДОЙ операции за всё время, тогда как бумаги сходятся точно, штука в штуку. На истории из полусотни операций жёсткий рубль означал вечный отказ, а совет «попробуй ещё раз через минуту» не мог помочь никогда: пересборка даёт ровно тот же остаток. Теперь допуск растёт с длиной истории — полтинник на операцию, не больше шестидесяти рублей всего. Пропущенная операция так не спрячется: самая мелкая из них крупнее допуска. Само расхождение не исчезает бесследно — оно записано и видно в диагностике.')}\n    ${item('Проданные бумаги перестали быть безымянными навсегда', 'Журнал не пересобирался с сообщением «брокер не назвал имена N бумаг». Причина: имя бумаги спрашивалось только по внутреннему коду, а у части операций брокер отдаёт лишь FIGI. Бумагу, которой уже нет в портфеле, взять больше неоткуда — и она оставалась безымянной навсегда, сколько ни повторяй. Теперь справочник спрашивается обоими способами. Найденные по операциям имена запоминаются под обоими кодами: раньше запоминались только бумаги ИЗ ТЕКУЩЕГО портфеля, поэтому после первой же полной пересборки проданные терялись. И сообщение теперь называет сами коды: «не назвал имена 19 бумаг» без перечисления не оставляло ни одной зацепки.')}\n    ${item('Приложение перестало обвинять токен, не проверив его', 'Надпись «прошлый токен не сработал, возможно истёк или отозван» появлялась без единого обращения к брокеру — просто по факту пустого журнала. Между тем самая частая причина другая: теряется отметка счёта, и тогда обновление молча не начинается вовсе, сколько бы раз ни вводить один и тот же рабочий токен. Теперь приложение сначала спрашивает брокера. Токен принят — отметка счёта восстанавливается сама, журнал собирается, и человек ничего не вводит. Токен отвергнут — так и сказано, вместе с ответом брокера. Нет связи — сказано про связь. Заодно все четыре места, где журнал пересобирается принудительно, защищены от перезагрузки посреди записи: проверка требует этого от каждого.')}\n    ${item('Рабочий токен больше не объявляется сломанным', 'Пустой журнал приложение объясняло единственным способом: «прошлый токен не сработал, всё показанное устарело, введи новый». Но пустым журнал бывает и когда токен в полном порядке — например, если пересборка оборвалась на середине. Теперь случаи различаются: если данные по токену уже когда-то приходили, приложение так и говорит — дело не в токене — и предлагает собрать журнал заново одной кнопкой, называя дату последней удачной загрузки. Заодно закрыта причина: перезагрузка ради обновления больше не может случиться посреди записи журнала, а ждёт её окончания.')}\n    ${item('Разбор собственной правки: семь мест, где обновление ещё могло не доехать', 'Проверка выложенного накануне механизма нашла: оболочка клалась под одним адресом из двух, и офлайн зависел от того, какой из запросов при установке удался; отказ сервера при выкладке показывал пустой экран вместо сохранённой копии; тихое обновление копии не доживало до конца — обработчик усыпляли раньше; подписки на сообщения ставились после регистрации, и сообщение могло пропасть; самая первая установка вызывала лишнюю перезагрузку у нового человека; второе нажатие кнопки в течение минуты не делало ничего; а перепроверка обработчика зависела от опроса версии, который при переходе со старого обработчика вправе соврать. Исправлено всё семь.')}\n    ${item('Обновление перестало зависеть от везения', 'Приложение спрашивало сервер о новой сборке, скачивая самого себя. Но страницу, которой управляет служебный обработчик, нельзя обойти своим запросом: ни принудительное чтение, ни довесок в адресе не помогают — обработчик стоит перед кэшем браузера и отвечает первым. Проверка читала не сервер, а его копию, и делала вывод «всё свежее». Круг замыкался: приложение не обновлялось и честно докладывало, что не нужно. Теперь версия спрашивается у файла обработчика — за ним браузер ходит мимо всех копий, и он в тысячу раз меньше приложения. Кнопка обновления больше не снимает обработчик перед перезагрузкой (снятие завершается лишь после закрытия всех вкладок, а до тех пор отвечает он же), а просит его выбросить копии и уступить место. Перезагрузка делается по факту смены обработчика, а не по надежде.')}\n    ${item('Экраны и листы проверяются на четырнадцати краевых счетах', 'К пяти краевым случаям добавились ещё девять: обнулившиеся цены, достигнутая цель, нулевой срок цели, счёт из одной защиты, незаданная цель, нулевой взнос, продано больше купленного. На каждом открываются и листы, и все четыре экрана — причём состояние берётся так же, как его берёт сама отрисовка, а не собирается руками: иначе проверялась бы выдумка. Кроме пустых значений и нечисел теперь ловится и бесконечность — её даёт деление на ноль, и в вёрстку она попадает молча.')}\n    ${item('Пустой счёт больше не роняет проверку на обвал', 'Лист брал самую просевшую и самую устойчивую бумагу первой и последней строкой списка — а если бумаг нет вовсе, списка тоже нет, и лист падал целиком: вместо ответа человек видел ошибку запуска. Такое бывает у каждого дважды: когда счёт только открыт и когда всё продано. Теперь в этом случае сказано прямо — падать нечему, деньги на счёте рынок не двигает. Заодно листы стали проверяться на пяти краевых портфелях: пустой счёт, одни деньги, бумага без известной цены, позиция, проданная в ноль, и незаданные расходы.')}\n    ${item('Заголовки месяцев в журнале встали в правильный падеж', 'Над лентой стояло «ИЮНЯ 2026» — обрывок фразы «16 июня», а не заголовок. Список названий был один на два разных случая: в дате месяц отвечает на вопрос «когда» и стоит в родительном, а заголовок группы — это название месяца само по себе, именительный. Теперь списка два, и проверка отрисованного журнала не пропустит возврат.')}\n    ${item('Опечатка в имени метода больше не доживёт до экрана', 'Соседний класс к «имени, которого нет»: вызов несуществующего метода падает с «это не функция», а потолок ожидания такую ошибку глотает — и снова получается «биржа не ответила» при исправной бирже. Теперь проверка собирает все списки экспорта модулей и сверяет с ними каждый вызов через store, moex и остальные псевдонимы. Заодно расширена проверка областей видимости: она смотрит и на стрелочные помощники, а не только на объявления функций.')}\n    ${item('Сравнение двух бумаг падало при каждом нажатии', 'Расчёт сравнения читал настройки из переменной, которой в нём нет, — ровно та же ошибка, что и в разборе выплат, только в другом месте. Обработчик кнопки исключений не ловит, поэтому лист просто замирал без единого слова. Теперь настройки приходят доводом. И появилась проверка, считающая область видимости КАЖДОЙ функции отдельно: прежняя смотрела, объявлено ли имя где-то в файле, а такие ошибки и живут там, где имя объявлено во множестве соседних функций, но не в этой.')}\n    ${item('Ставки перестали спорить с остальными числами', 'Правило про запятую стерегло десятые, но не сотые: ключевая ставка и купонная ставка печатались с точкой рядом с долями, где стоит запятая. Переведены и они, а правило расширено — теперь оно смотрит и на сотые, а не только на десятые.')}\n    ${item('Скрытые ошибки стали сетью, а не просто списком', 'Приложение давно записывает ошибки, которые проглотил потолок ожидания, и показывает их в диагностике. Теперь на этот список смотрит и стенд: он открывает все листы подряд и валит сборку, если среди проглоченного оказалась ошибка кода — обращение к тому, чего нет. От сети такие ошибки не зависят, значит списывать их на биржу нельзя. Обе поломки этой недели ловятся этой сетью автоматически.')}\n    ${item('Купоны и дивиденды не приходили из-за опечатки', 'Разбор выплат по портфелю читал состояние приложения из переменной, которой в этой функции нет и не было. При подключённом брокере вызов падал сразу же — всегда. Ошибку глотал потолок ожидания, план получал пустые выплаты и писал, что биржа не ответила, — при полностью доступной бирже. Тот же разбор кормит и карточку «Сколько приносит портфель». Ошибку нашла новая проверка листов: в браузере она пряталась за проглоченным исключением, а на стенде видна сразу.')}\n    ${item('Запрос к бирже теперь один, а не две копии', 'Тело запроса и запасного пути к нему лежали в файле дважды — в слое биржи и в слое фактов о бумагах. Проверка стерегла их побайтовое совпадение, но чинить две одинаковые функции руками — способ однажды ошибиться: правку внесут в одну, а во вторую скопируют с опечаткой. Теперь тело одно, остальные модули получают его через связывание, а проверка требует единственности. Заодно появилась проверка самого поведения: обрыв связи со страницы и обрыв из файла, открытого с устройства, — разные причины, и человеку говорится именно та, что случилась.')}\n    ${item('Листы проверяются так же, как экраны', 'Обход четырёх экранов ловил пустые значения и нечисла в вёрстке, но до листов не доставал — оттуда и вылез обвал рынка, посчитанный от нажатия. Теперь проверка открывает подряд план, итоги, правила, обвал, справочник инструментов, «Что нового» и размещение — на одном живоподобном портфеле и при молчащей бирже, — и не пропускает ни утечки, ни цены с точкой.')}\n    ${item('Потолки ожидания перестали спорить с арифметикой', 'На весь обход рынка стояло 60 секунд, а сумма внутренних потолков — доска ОФЗ, доска акций, истории выплат — выходила больше сотни. Обход мог не уложиться в срок, даже когда каждый ответ приходил за доли секунды, и снаружи его срезало вместе со всем собранным. Теперь поиск сам смотрит на часы: не хватает времени на класс — он его не начинает и помечает непроверенным. Срок внутри и потолок снаружи считаются из одной величины, разойтись им больше негде. Отдельно починен запасной путь запроса: при отказе он получал полный отсчёт заново, и запрос с заявленными двадцатью секундами занимал сорок; теперь ему достаётся остаток.')}\n    ${item('Половина сравнения лучше пустого раздела', 'Сравнение с рынком шло одним куском: доска ОФЗ уже собрана, доска акций упала — и раздел «Что можно поменять» оставался пустым целиком, будто биржа не отвечала вовсе. Теперь классы собираются порознь: что удалось — показывается, а под списком прямо написано, какую половину проверить не вышло и почему. Кандидаты класса попадают в список только целиком: иначе вышло бы худшее — фонды денежного рынка в кандидатах, а доходности своих облигаций не пришли, и приложение предложило бы обменять бумагу, о которой ничего не знает.')}\n    ${item('Цены пишутся по-русски, как и проценты', 'Правило про запятую было заведено для процентов и сроков, а цены остались сырым числом: на одном экране доля бумаги стояла с запятой, а цена рядом — с точкой. Разделитель теперь один во всём приложении — в портфеле, журнале, разборе бумаги, плане взноса и сверке с брокером. Знаки не округляются: у фондов цена вида 2,8045 ₽, и последний знак там не украшение. Проверка обходит все четыре экрана и не пропускает рубль с точкой.')}
    ${item('Разбор облигаций падал на каждой бумаге', 'Тип купона ОФЗ читается из номера серии — но функция чтения живёт в ядре, а зовут её из модуля биржи, и модули друг друга не видят. Разбор ЛЮБОЙ облигации падал с «ofzKind is not defined», доска ОФЗ не собиралась, а наружу это выходило как «биржа не ответила за 60 секунд»: доска нужна и покупкам, и заменам. Проверка теперь читает файл целиком и ловит такой вызов между любыми двумя модулями, а не только на границе с интерфейсом.')}
    ${item('Лист обвала считался от нажатия, а не от процента', 'Кнопка обвала была повешена на функцию с доводом напрямую. Браузер зовёт обработчик С СОБЫТИЕМ мыши — оно и занимало место глубины падения, значение по умолчанию не срабатывало, и весь лист считался от объекта события: в заголовке стояло нечисло, в потерях — «не число ₽», у худшей и лучшей бумаги вместо процентов пусто́е. Теперь довод проверяется на входе, а проверка следит, чтобы ни один обработчик кнопки не принимал доводов.')}
    ${item('«Биржа не ответила» больше не выдумывает молчание', 'Раздел писал «биржа не ответила за 60 секунд», а диагностика в ту же минуту получала ответ за 0,2 с. Оба были правы: потолок ожидания подменял результат одинаково и когда время вышло, и когда биржа ответила отказом, а надпись знала только про молчание. Теперь три случая различаются: биржи не видно вовсе, биржа ответила отказом (текст отказа показан) и поиск не уложился в срок. И сказано главное: потолок стоит на весь обход рынка — доски акций и ОФЗ, список фондов, по одной истории выплат на бумагу, — а не на один запрос. Быстрая биржа и долгий обход противоречат друг другу только на вид.')}
    ${item('«Не дождался» называет свой шаг, а не соседний', 'Идеи и замены ищутся одновременно, а отметка шага была одна на двоих. Успевший первым сбрасывал её в ноль, и второй по своему отказу называл чужой шаг — или не называл никакого. Теперь отметка у каждого поиска своя.')}
    ${item('Биржу больше не спрашивают об одном дважды', 'Список акций нужен и разделу «что подходит портфелю», и «что можно поменять» — каждый качал его сам. На медленной сети выходило нелепое: идеи загрузились, а замены рядом написали «не дождался: список акций». Теперь ответ биржи живёт две минуты и достаётся обоим. То же с историями выплат — их запрашивается по одной на каждую бумагу рынка, и половина повторялась: теперь они живут полчаса, а одновременные вопросы об одной бумаге склеиваются в один запрос. Историю выплат качали две разные функции — теперь обе ходят одним путём. Проверка доступности биржи тоже помнит ответ полминуты: раньше она уходила в сеть перед каждым разбором.')}
    ${item('«Биржа не ответила» больше не выдумывает причину', 'Раньше в этом случае писалось «обычно так бывает, когда файл открыт прямо с устройства» — даже когда приложение открыто по ссылке и это видно в адресной строке. Теперь причина зависит от того, как приложение запущено, а при открытии по ссылке предлагается проверка доступа к бирже.')}
    ${item('Проценты пишутся по-русски', 'Рядом стояли «32,7% из 25%» и «14.9% выплат за год»: доли печатались через запятую, а доходности через точку. Переведены все 57 мест — теперь число одной величины выглядит одинаково на любом экране.')}
    ${item('Деньги, лежащие на счёте, больше не забыты', 'Свободный остаток поминался, только когда его подозрительно много — от 20 000 ₽ и четверти счёта, как признак незаписанной сделки. А полторы тысячи, оставшиеся от прошлой покупки или пришедшие дивидендами, просто лежали без работы. Теперь план ближайшего взноса называет их и предлагает вложить вместе со взносом. Мелочь вроде двадцати рублей не поминается — это шум.')}
    ${item('Штраф за свою бумагу следует за её долей', 'Любая уже купленная бумага получала минус двадцать баллов со словами «докупка усилит концентрацию» — независимо от того, восемь у неё процентов портфеля или тридцать. При этом вердикт на соседнем экране прямо советовал направить взнос в МТС с долей 8%. Теперь штраф растёт вместе с долей, а про малую долю честно сказано: знакомая бумага, нового риска не добавляет.')}
    ${item('Про замолчавшую бумагу оба экрана говорят одно', 'Порогов свежести выплат было три, и они жили порознь: из замен бумага исчезала после 400 дней без выплат, а пометка «устарело» ставилась только после 540. Не плати́вшая полтора года бумага пропадала из замен — и висела в списке «что подходит портфелю» с полной доходностью и без оговорок. Теперь шкала одна, и в списке прямо написано, сколько месяцев выплат не было.')}
    ${item('Допущения читаются одной проверкой', 'Инфляция, ставка по деньгам и средняя доходность рынка — это предположения, и приложение так их и называет. Но значения по умолчанию лежали россыпью по коду с разными условиями: в одном месте отрицательная инфляция из настроек была бы принята, в другом отброшена. Теперь допущение одно, проверка одна.')}
    ${item('Ставка налога одна на все расчёты', 'Она была зашита числом в шести местах и одновременно читалась из настроек в четырёх других. Пока значения совпадали, это было незаметно; поменяешь ставку в «Ещё» — и половина экранов считала бы по-старому. Теперь ставка одна, и её меняешь ты.')}
    ${item('Отрасль узнаётся по тикеру, а не только по имени', 'Биржа зовёт бумаги «Татнфт 3ао» и «Сургнфгз-п» — образцы под такие сокращения не подходили, отрасли у них не находилось, и правило «не больше двух бумаг одной отрасли» их не считало. В пятёрке лидеров выходило четыре нефтегаза при работающем на вид ограничении.')}
    ${item('Тип купона ОФЗ читается из номера серии', 'Признак «биржа не назвала ближайший купон» ненадёжен: у ОФЗ 29008 он объявлен, и флоатер проходил как обычная бумага. Теперь тип берётся из номера: 29 и 24 — переменный купон, 52 — индексируемый номинал, 26 и 25 — постоянный. Менять постоянный купон на любой из первых двух приложение не предлагает.')}
    ${item('Доли считаются одной мерой', 'Соседние карточки показывали для одной бумаги «32,7%» и «33%». Теперь доля печатается одинаково везде. И рядом с датой последней выплаты стоит её возраст: «08.07.2025, это 13 мес назад» вместо голой даты, которую читателю приходилось переводить в месяцы самому.')}
    ${item('Молчание брокера теперь можно разобрать', 'В диагностике появилась «Проверить доступ к Т-Банку»: она ходит по обоим адресам брокера и различает четыре случая — запрос не дошёл, брокер отказал по токену, лимит запросов, всё в порядке. Работает и без токена. Если отказ приходит мгновенно, а биржа при этом отвечает, приложение прямо называет самую частую причину 2026 года: сертификаты Минцифры, которые Chrome, Safari и Edge не принимают, а Яндекс.Браузер принимает.')}
    ${item('Резерв переживает пересборку журнала', 'Подушка лежит вне брокерского счёта, в истории брокера её нет, и пересборка «начисто» её стирала — дважды. Правило было размножено по трём веткам, теперь оно одно. В диагностике видно строку «из них резерв»: цела запись или нет.')}
    ${item('Ложная тревога о порче журнала убрана', 'Копия журнала писалась до первого запроса к брокеру, поэтому обычный обрыв связи при следующем запуске выглядел как «обновление оборвалось на середине». Теперь копия появляется только перед записью, а разбор прошлой попытки живёт до следующей и не висит вечно.')}
    ${item('Три поломки при запуске', 'Приложение падало, если интерфейс звал функцию из слоя данных без объявления. Так же молча падали загрузка PDF-отчёта и разбор налогового отчёта. Добавлена проверка, которая читает файл и ловит это до того, как увидит человек.')}
    ${item('Дробление акций больше не раздувает доходность', 'Биржа хранит старые дивиденды в прежнем масштабе: у Полюса до сплита 1:10 выплата была 1301,75 ₽ на акцию, после — 73 ₽. Сложенные вместе и делённые на нынешнюю цену, они давали «105,5% выплат за год», и приложение предлагало обменять на Полюс четыре бумаги из пяти. Теперь такой обрыв ряда виден, старые выплаты отбрасываются, а доходность выше 40% считается испорченными данными и в советы не идёт.')}
    ${item('Ноль и «неизвестно» разведены', 'Если биржа промолчала о выплатах твоей бумаги, это больше не «выплат ноль»: обмен по такой бумаге не предлагается вовсе. Раньше молчание раздувало выгоду обмена на всю доходность чужой бумаги.')}
    ${item('Плавающий купон не выдаётся за прибавку', 'Доходность к погашению флоатера держится ровно до следующего решения ЦБ по ставке. Сравнивать её с бумагой постоянного купона и называть разницу выгодой нельзя — такие замены больше не предлагаются.')}
    ${item('Проверка доступа к Т-Банку', 'Раньше любое молчание брокера выглядело одинаково — «нет связи». Теперь в диагностике есть отдельная проверка: она ходит по обоим адресам брокера и различает три разных случая — запрос не дошёл (сеть, VPN, DNS), брокер ответил отказом (токен или лимит) или всё в порядке. Доступность биржи о брокере не говорит ничего: это разные адреса.')}
    ${item('Серия выплат больше не переживает саму компанию', '«Платит 3 года подряд» считается по годам, в которые выплаты были, и держится ещё долго после того, как компания платить перестала — у Полюса, отказавшегося от дивидендов до 2030 года, серия всё ещё три года. Бумага без выплат больше года на обмен не зовёт, а рядом с серией теперь стоит дата последней выплаты.')}
    ${item('У каждого процента выплат названа база', 'На одном экране стояли 18,8% и 16,5% по МТС, и оба верны: биржа отдаёт дивиденд до налога, а карточки твоего портфеля считают то, что дошло до счёта. Теперь это написано там, где числа показываются, — чтобы не выглядело расхождением.')}
    ${item('Пятёрка лидеров — не ставка на одну отрасль', 'Когда сектору хорошо, хорошо сразу всем его бумагам: в «что подходит портфелю» выходило четыре нефтегаза из пяти с одинаковой оценкой. Теперь бумаг одной отрасли в этом списке не больше двух, а бумага из отрасли, которая в портфеле уже у предела 35%, получает штраф к оценке.')}
    ${item('Вердикт не спорит сам с собой', 'Шаг «делить взнос пополам» и план размещения взноса теперь согласованы: если половина идёт в резерв, план прямо говорит, сколько остаётся бумагам.')}
    ${item('Ближайший взнос — куда именно', 'План деления по бумагам с точностью до рубля; сумму месяца можно править — правка живёт один месяц.')}
    ${item('Роль каждой бумаги', 'На карточке позиции: защита, предсказуемый доход, доход и рост или ставка на рост — и почему она заслуживает место.')}
    ${item('Сравнение двух бумаг', 'На карточке позиции: одна сумма, два варианта — что каждая заплатит за год чистыми.')}
    ${item('Мой устав', 'Личные правила, записанные заранее: доли, полосы 5/25, лимиты, поведение при обвале. Перечитывать в панику.')}
    ${item('Итоги', 'Движение денег за год и с открытия, столбики выплат по месяцам и сравнение «те же взносы — в индекс полной доходности».')}
    ${item('Стратегии', 'Четвёртая — «Сохранить» для горизонта до года; предупреждение о смене горизонта заранее; срок облигаций против срока цели.')}
    ${item('Честность о годе', '«Что стоит сделать» открывается шансами года в плюсе — и прямым текстом: гарантированного роста не существует.')}
    ${item('Быстрее и надёжнее', 'План строится не дольше десяти секунд; любой сбой листа показывается словами; данные на file:// переживают перезапуск.')}
    ${item('Оферты у облигаций', 'Самая частая ловушка в корпоративных бумагах: доходность к погашению считается до срока, которого может не быть. Такие облигации помечаются в «Идеях» и не предлагаются в «Заменах».')}
    ${item('Замены помнят про отрасли', 'Выгодная бумага не предлагается, если она доливает в сектор, который и так за пределом 35%. Экран замен показывает, какие именно твои бумаги сравниваются и когда они загружены.')}
    ${item('Замены: что поменять на что', '«Идеи» → «Замены»: каждая твоя бумага сравнивается с рынком. Показываются только замены с заранее известной выгодой — доходность к погашению у облигаций, фактические выплаты у акций, минус комиссии обмена.')}
    ${item('Что сильнее двигает цель', 'В карточке «Путь к цели» — сравнение трёх рычагов в рублях: взнос, срок и доходность. Сильнейший назван, ненадёжность доходности — тоже.')}
    ${item('Починено вечное «Считаю…»', 'Девять функций внутри приложения вызывали сами себя без конца: экран висел, память росла. Причина устранена, класс ошибки закрыт проверкой.')}
    ${item('Две доходности в «Итогах»', 'Сколько заработали твои деньги (XIRR) и как сработал сам портфель без влияния дат взносов (TWR) — вторую честно сравнивать с индексом.')}
    ${item('Порог качества интерфейса', 'Цифры одной ширины — колонки не прыгают при обновлении цен; фокус виден с клавиатуры на всём; системная настройка «уменьшить движение» уважается целиком.')}
    ${item('Лоты приходят от брокера', 'Размер лота теперь берётся вместе с ценой из Т-Инвестиций — план перестанет советовать «111 шт» там, где лот равен десяти.')}
    ${item('Проверка ликвидности', 'Бумагу без оборота можно купить, но продать — только со скидкой, которая съест всю расчётную выгоду. Теперь оборот учитывается в оценке, а замены на неликвид не предлагаются вовсе.')}

    ${item('Цель — в сегодняшних деньгах', 'Шесть миллионов через пять лет — это не шесть миллионов сегодня. Приложение показывает, сколько цель стоит по покупательной способности, и какая доходность остаётся сверх инфляции. Саму инфляцию можно поправить в «Ещё».')}
    ${item('Прогноз по акциям — из твоих выплат', 'Ожидаемая доходность акций больше не плоские 13%: берутся фактические выплаты твоих бумаг плюс допущение о росте цены, а итог ограничен 16% годовых — выше это уже обещание, а не расчёт.')}

    ${item('Чего сейчас делать не надо', 'В вердикте появился раздел запретов, и каждый опирается на число из твоего портфеля: не докупать бумагу за пределом доли, не продавать просевшую просто из-за минуса, не держать деньги без дела при высокой ставке, не закрывать ИИС раньше срока.')}
    ${item('Дивиденды считаются от последней выплаты', 'Данные биржи по дивидендам отстают на месяцы, и «за последние 12 календарных месяцев» давало ноль у компаний, которые исправно платят. Теперь окно считается от последней известной выплаты, а её дата и возраст показываются.')}
    ${item('«Никто не платит» — теперь с разбором', 'Приложение различает три исхода: биржа не ответила, компания не платит, платила раньше. Если больше половины историй не пришло, оно прямо говорит, что это похоже на сбой связи, а не на состояние рынка.')}
    ${item('Выплаты из запасного источника', 'Если биржа молчит о выплатах по бумаге, которую ты уже держишь, берутся данные брокера — тот же факт, просто из другого источника.')}
    ${item('Советы больше не прыгают', 'Когда подгружаются замены, вердикт дополняется только отведённым им местом, а не пересобирается целиком — текст под пальцем перестал меняться во время чтения.')}
    ${item('Ошибки при обновлении от брокера', 'Имена бумаг в истории операций теперь берутся из общего запаса. Если брокер молчит, журнал не трогается вовсе и приложение объясняет причину вместо списка расхождений.')}
    ${item('План обмена знает цену новой бумаги', 'Цена, лот и название приходят вместе с самой заменой — количество к покупке считается сразу, без второго похода на биржу.')}
    ${item('Обновление стало видимым', 'В «Диагностике» теперь показано, какая сборка лежит на сервере, и есть кнопка «Обновить приложение сейчас» — она пробивает все копии. Служебный файл офлайн-режима больше не кэширует саму страницу.')}
    ${item('План конкретного обмена', 'Нажми «Как сделать этот обмен» — и получишь план с твоими числами: сколько штук продать и по какой цене не ниже, сколько купить, что останется, во что обойдутся комиссии.')}
    ${item('Ключевая ставка — отдельно и честно', '«Ещё» → «Ключевая ставка ЦБ»: приложение пробует взять её у Банка России, а если браузер не пустит — принимает от тебя, с датой и напоминанием, когда пора проверить. Подменять её ставкой денежного рынка оно не станет.')}
    ${item('Инструкция к каждой замене', 'Совет поменять бумагу теперь идёт с порядком исполнения: обе сделки в один день, лимитная заявка, не в первые и последние 10 минут торгов, что с накопленным купоном и что продажа фиксирует результат.')}
    ${item('Ставка названа точно', 'Приложение показывает ставку денежного рынка (RUSFAR) и прямо говорит, что она близка к ключевой, но не равна ей.')}
    ${item('Вердикт — первым делом', 'В «Что стоит сделать» сверху появился связный ответ: что делать по порядку, сколько это даёт в рублях и почему именно так — от цели и бюджета, а не от отдельной бумаги. Когда подгружаются замены, вердикт пересобирается с ними.')}
    ${item('Справочник инструментов', '«Ещё» → «Что есть на бирже»: все классы — акции, три вида облигаций, фонды, денежный рынок, золото, валюта — что для чего, что приложение оценивает и от чего отказывается сознательно (плечо, структурные продукты).')}
    ${item('Три разных «облигации»', 'Постоянный купон, флоатер и линкер — разные инструменты. У линкера доходность означает доход СВЕРХ инфляции, и приложение теперь это говорит, а не сравнивает их вслепую.')}
    ${item('Фонды — третий класс инструментов', 'Приложение видит биржевые фонды: золото для защиты и денежный рынок как альтернативу облигациям. Защита больше не пропускается в поиске — именно её у тебя не хватает сильнее всего.')}
    ${item('Облигация против денежного рынка', 'Если твоя облигация платит меньше сегодняшней ставки, это видно: денежный рынок даёт больше, без срока и без падения цены при росте ставки — с честной оговоркой, что ставка не зафиксирована.')}
    ${item('Разбор рынка вместо отказа', 'Если ни одна акция не прошла отбор, приложение объясняет почему: сколько акций на бирже, сколько проверено, сколько вообще платит, кто был ближе всех и не выигрывают ли сейчас облигации.')}
    ${item('Журнал защищён от полуимён', 'Если брокер не назвал имена части бумаг, журнал не переписывается вовсе: иначе половина сделок легла бы под техническим кодом и сверка ругалась бы вечно.')}
    ${item('Обновление доходит и до установленного приложения', 'Старый обработчик офлайн-режима снимается перед перезагрузкой — раньше он продолжал отдавать прежнюю копию, и приходилось заходить через браузер.')}

    ${item('Видно, где застрял поиск', 'Если биржа не отвечает, раздел говорит, чего именно не дождался: списка акций, списка облигаций или историй выплат.')}
    ${item('Поиск по рынку успевает ответить', 'Список кандидатов сокращён до двенадцати крупнейших, запросы идут в шесть потоков, а ожидание поднято до 45 и 60 секунд: на мобильной сети прежних сроков не хватало.')}
    ${item('Ложные расхождения в сверке исчезли', 'Если брокер не отвечает на запрос названия бумаги, приложение берёт имя из запаса, а не подставляет технический код. Диагностика больше не пугает красным «≠» там, где данные целы.')}
    ${item('Сравнения выплат стали честнее', 'Приложение больше не предлагает равняться на бумагу, которую само велит не докупать: сравнение идёт только с бумагами в пределах лимита доли. А выплата выше 20% помечается как почти наверняка разовая.')}
    ${item('План считает лотами', 'На бирже покупают лотами: у Сбера и МТС в лоте 10 акций. План больше не советует «111 шт» — он называет целые лоты и остаток, который не потратится.')}
    ${item('Рынок — сам, без кнопок', 'В «Что стоит сделать» появились разделы «Что можно купить на рынке» и «Что можно поменять»: приложение ищет по всей Мосбирже само, пока ты читаешь план. Нажимать ничего не нужно.')}

    <p class="muted" style="margin-top:12px;opacity:.75">Проверено: 176 автоматических проверок и 110 мутационных, все зелёные.</p>`);

/**
 * Итоги: движение денег из журнала за год и с открытия счёта.
 * Никаких оценок — каждую строку можно сверить с отчётом брокера.
 */
async function openResults() {
  const st = await store.getState();
  const ops = st.ops || [];
  // Сравнение с индексом: история тянется с Мосбиржи с потолком в 6 секунд.
  // На file:// биржа молчит — блок просто не появится, с подсказкой почему.
  const firstDep = ops.filter(o => o.type === OP.DEPOSIT && !o.technical)
    .map(o => String(o.date).slice(0, 10)).sort()[0] || null;
  const bench = firstDep
    ? benchmarkCompare(ops, await withLimit(fetchIndexHistory(firstDep), 6, []))
    : null;
  // Снимки стоимости для доходности самого портфеля: только своя база, без сети.
  const chart = await store.valueChart(400).catch(() => null);
  const chartPoints = chart && chart.points ? chart.points : [];
  const year = new Date().getFullYear();
  const y = periodReport(ops, `${year}-01-01`, null);
  const all = periodReport(ops, null, null);

  const row = (label, a, b, color) => `<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line)">
    <div class="muted">${label}</div>
    <div style="text-align:right"><b${color ? ` style="color:${color}"` : ''}>${money(a)}</b>
      <span class="muted" style="margin-left:10px">${money(b)}</span></div></div>`;

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">Итоги</h2>
    <p class="muted" style="margin:0 0 12px;line-height:1.6">Движение денег из журнала — каждую строку можно
      сверить с отчётом брокера. Стоимость портфеля и прибыль — на главной: это другая природа чисел.</p>
    <div style="display:flex;justify-content:flex-end;gap:10px" class="muted">
      <span>за ${year}</span><span>с открытия</span></div>
    ${row('Внесено', y.deposits, all.deposits)}
    ${y.withdrawals || all.withdrawals ? row('Выведено', y.withdrawals, all.withdrawals) : ''}
    ${row(`Выплачено чистыми (${all.payouts} ${all.payouts === 1 ? 'выплата' : all.payouts < 5 ? 'выплаты' : 'выплат'})`, y.dividends, all.dividends, 'var(--ok)')}
    ${row('Комиссии брокера', y.fees, all.fees, 'var(--danger)')}
    ${row(`Куплено бумаг (${all.buys} сдел${all.buys === 1 ? 'ка' : all.buys < 5 ? 'ки' : 'ок'})`, y.bought, all.bought)}
    ${y.sells || all.sells ? row(`Продано бумаг (${all.sells})`, y.sold, all.sold) : ''}
    ${(() => {
      const bars = payoutsByMonth(ops, 12);
      const totalYear = bars.reduce((a, b) => a + b.amount, 0);
      if (!(totalYear > 0)) return '';
      const maxA = Math.max(...bars.map(b => b.amount));
      const W = 320, H = 64, gap = 3;
      const bw = (W - gap * (bars.length - 1)) / bars.length;
      const MES = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
      const lab = m => MES[Number(m.slice(5)) - 1];
      const rects = bars.map((b, i) => {
        const h = maxA > 0 ? Math.round((H - 14) * b.amount / maxA) : 0;
        const x = i * (bw + gap);
        return `<rect x="${x.toFixed(1)}" y="${H - h}" width="${bw.toFixed(1)}" height="${h}"
          rx="2" fill="${b.amount > 0 ? 'var(--ok)' : 'var(--line)'}" ${b.amount > 0 ? '' : `height="2" y="${H - 2}"`}/>`;
      }).join('');
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="muted" style="margin-bottom:8px">Выплаты по месяцам за год — чистыми</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block">${rects}</svg>
        <div style="display:flex;justify-content:space-between;font-size:11px;margin-top:4px" class="muted">
          <span>${lab(bars[0].month)}</span><span>${lab(bars[bars.length - 1].month)}</span></div>
        <div class="muted" style="margin-top:6px">Пустые месяцы — не дыра в данных: дивиденды и купоны приходят сезонами.</div>
      </div>`;
    })()}
    ${(() => {
      if (!bench) {
        return `<div style="padding:10px 0;border-bottom:1px solid var(--line)" class="muted">
          Сравнение с индексом появится, когда доступна Мосбиржа — открой приложение по ссылке
          («Ещё» → «Разместить в интернете»), с файла биржа не отвечает.</div>`;
      }
      const port = st.summary.total;
      const diff = port - bench.value;
      const signed = v => `${v >= 0 ? '+' : '−'}${pct(Math.abs(v))}`;
      return `<div style="padding:12px 0;border-bottom:1px solid var(--line)">
        <div class="muted" style="margin-bottom:8px">Против индекса — те же взносы, те же даты</div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Твой портфель</span><b>${money(port)}</b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Если бы взносы шли в индекс</span><b>${money(bench.value)} <span class="${bench.changePct >= 0 ? 'up' : 'down'}">${signed(bench.changePct)}</span></b></div>
        <div style="display:flex;justify-content:space-between;padding:5px 0">
          <span class="muted">Разница</span><b class="${diff >= 0 ? 'up' : 'down'}">${diff >= 0 ? '+' : '−'}${money(Math.abs(diff))}</b></div>
        <div class="muted" style="margin-top:8px;line-height:1.6">Индекс — MCFTR, полной доходности: дивиденды в нём
          учтены, как и в твоём портфеле, — сравнение честное. Оговорки: индекс нельзя купить напрямую без
          комиссий фонда, а на истории короче полугода разница — шум, не вывод.</div>
      </div>`;
    })()}
    ${(() => {
      const twr = timeWeightedReturn(chartPoints, ops);
      const xirrLine = st.returnRateReliable && st.returnRate != null
        ? `<div style="display:flex;justify-content:space-between;padding:5px 0">
             <span class="muted">Сколько заработали твои деньги</span>
             <b>${signed(st.returnRate)} годовых</b></div>`
        : `<div class="muted" style="padding:5px 0">Годовые проценты по твоим деньгам (XIRR) появятся, когда истории станет полгода — раньше любое число случайно.</div>`;
      const twrLine = twr
        ? `<div style="display:flex;justify-content:space-between;padding:5px 0">
             <span class="muted">Как сработал сам портфель</span>
             <b>${signed(twr.twr)} за ${twr.days} дн.${
               twr.annual != null ? ` · ${signed(twr.annual)} годовых` : ''}</b></div>`
        : `<div class="muted" style="padding:5px 0">Доходность самого портфеля посчитается, когда накопится неделя ежедневных снимков стоимости — они собираются при обновлении цен.</div>`;
      return `<div style="padding:12px 0">
        <div class="muted" style="margin-bottom:6px">Две доходности — они отвечают на разные вопросы</div>
        ${xirrLine}${twrLine}
        <div class="muted" style="margin-top:8px;line-height:1.6">Первая зависит от того, когда ты вносил деньги:
          удачно попал взносом — цифра выше. Вторая взносы вычищает и показывает работу самого портфеля —
          именно её честно сравнивать с индексом выше.</div>
      </div>`;
    })()}`);
}

/** Кнопки «Подробнее» в результатах отбора: вешаются после каждой отрисовки. */
function bindIdeaButtons() {
  document.querySelectorAll('[data-idea]').forEach(b => {
    b.onclick = () => openIdeaDetails(b.getAttribute('data-idea'));
  });
  document.querySelectorAll('[data-swap]').forEach(b => {
    b.onclick = () => openSwapPlan(Number(b.getAttribute('data-swap')));
  });
}

/**
 * Пошаговый план конкретного обмена: с твоими количествами, ценами и
 * границами, за которыми обмен перестаёт окупаться.
 */
async function openSwapPlan(index) {
  const idea = lastSwaps[index];
  if (!idea) return;
  openSheet('<div class="muted">Считаю план обмена…</div>');

  const st = await store.getState();
  // Цена, лот и название новой бумаги уже известны: их принёс поиск замен.
  // Ходить за ними второй раз — терять время и рисковать пустым ответом,
  // из-за чего план раньше выходил без количества.
  let buyPrice = Number(idea.toPrice) || 0;
  let buyLot = Number(idea.toLot) || 1;
  let toName = idea.toName || idea.to;
  if (!(buyPrice > 0)) {
    const d = await withLimit(store.getSecurityDetails(idea.to), 10, null);
    if (d && d.facts) {
      buyPrice = Number(d.facts.price) || 0;
      toName = d.facts.name || toName;
    }
  }
  const plan = SH.swapPlan(st, idea, { buyPrice, buyLot, toName });
  if (!plan) { openSheet('<div class="muted">Не получилось собрать план: бумага не найдена в портфеле.</div>'); return; }

  const step = (n, title, body) => `<div style="padding:11px 0;border-bottom:1px solid var(--line)">
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">${n}. ${title}</div>
    <div class="muted" style="line-height:1.65">${body}</div></div>`;

  openSheet(`<h2 style="margin:0 0 4px;font-size:19px">${esc(plan.fromName)} → ${esc(plan.toName)}</h2>
    <p class="muted" style="margin:0 0 12px;line-height:1.6">Числа — оценка по последней известной цене.
      В момент сделки цена будет другой, поэтому ниже названы границы, за которыми обмен перестаёт окупаться.</p>

    ${step(1, `Продать ${plan.sellQty} шт ${esc(plan.fromName)}${
      // Состав в лотах — как в шаге покупки ниже. Размер лота считался, клался
      // в результат и не использовался нигде: половина одной операции знала
      // про лоты, вторая нет. А если позиция не делится на лот нацело, остаток
      // продаётся отдельной заявкой, и узнать об этом лучше заранее.
      plan.sellLot > 1
        ? ` (${Math.floor(plan.sellQty / plan.sellLot)} по ${plan.sellLot}${
            plan.sellQty % plan.sellLot ? ` и ещё ${plan.sellQty % plan.sellLot} шт неполным лотом` : ''})`
        : ''}`,
      `Лимитная заявка, цена <b>не ниже ${dec(plan.minSell.toFixed(2))} ₽</b> (сейчас ${dec(plan.sellPrice.toFixed(2))} ₽).
       Ниже этой границы теряется больше, чем даёт обмен за год.
       Выручка после комиссии — примерно <b>${money(plan.proceeds)}</b>.`)}

    ${plan.incomplete
      ? step(2, `Купить ${esc(plan.toName)}`,
          `Цену новой бумаги биржа сейчас не отдала, поэтому количество не посчитано.
           Возьми в приложении брокера цену ${esc(plan.to)} и купи на <b>${money(plan.proceeds)}</b> —
           лимитной заявкой, не выше цены в стакане.`)
      : step(2, `Купить ${plan.buyQty} шт ${esc(plan.toName)}`,
          `Лимитная заявка, цена <b>не выше ${dec(plan.maxBuy.toFixed(2))} ₽</b> (сейчас ${dec(plan.buyPrice.toFixed(2))} ₽).
           На это уйдёт около <b>${money(plan.spent)}</b>${plan.buyLot > 1 ? ` (${plan.lots} лот. по ${plan.buyLot})` : ''},
           останется <b>${money(plan.leftover)}</b> — их можно добавить к следующему взносу.`)}

    ${step(3, 'Сделать обе сделки подряд, в один день',
      `Разрыв в день-два — риск, что новая бумага подорожает и выгода обмена исчезнет.
       Не в первые и не в последние 10 минут торгов: там разброс цен шире всего.`)}

    ${step(4, 'Проверить итог',
      `Комиссии за обе сделки — около <b>${money(plan.feeTotal)}</b>, ожидаемая выгода —
       <b>${money(plan.gain)}</b> в год. Если после сделок в портфеле осталось меньше бумаг, чем задумано,
       или деньги зависли — загляни в «Ещё» → «Диагностика»: там видно, что говорит брокер.`)}

    <p class="muted" style="margin-top:12px;line-height:1.65">${esc(idea.note)}</p>
    <p class="muted" style="margin-top:8px;line-height:1.65;opacity:.8">Приложение сделок не совершает —
      всё делается в приложении брокера. И оно не знает будущих цен: выгода посчитана из доходности к
      погашению и прошлых выплат, а не из прогноза.</p>`);
}
openSwapPlan = guardSheet(openSwapPlan);

/**
 * Карточка любой бумаги с рынка — не только своей. Показывает то же,
 * что и карточка позиции, плюс историю выплат; про будущее — молчит.
 */
async function openIdeaDetails(ticker) {
  openSheet('<div class="muted">Смотрю данные по бумаге — не дольше десяти секунд…</div>');
  const d = await withLimit(store.getSecurityDetails(ticker), 10, null);
  if (!d) {
    openSheet(`<h2 style="margin:0 0 8px;font-size:19px">Биржа не ответила</h2>
      <p class="muted" style="line-height:1.7">Данные по бумаге берутся с Мосбиржи, а она молчит.
        С файла биржа недоступна — открой приложение по ссылке.</p>`);
    return;
  }
  const f = d.facts || {};
  const divs = d.dividends || [];
  openSheet(`<h2 style="margin:0 0 2px;font-size:19px">${esc(f.name || ticker)}</h2>
    <p class="muted" style="margin:0 0 12px">${esc(ticker)}${d.owned ? ' · уже есть в портфеле' : ''}</p>
    ${f.known === false ? '<div class="diff" style="color:var(--warn)">Биржа не дала подробностей по этой бумаге.</div>' : ''}
    ${f.ytm ? `<div class="diff">Доходность к погашению <b>${pct(f.ytm)}</b>${
      f.ttm ? `, купон ${money(f.ttm)} в год` : ''}</div>` : ''}
    ${d.streak ? `<div class="diff">Платит <b>${d.streak} ${d.streak < 5 ? 'года' : 'лет'} подряд</b> — это про прошлое, не про будущее.</div>` : ''}
    ${divs.length ? `<h3 style="margin:16px 0 6px;font-size:15px">Выплаты</h3>
      ${divs.map(x => `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)">
        <span class="muted">${esc(String(x.date).split('-').reverse().join('.'))}</span>
        <b>${money(x.value)}</b></div>`).join('')}` : ''}
    ${d.owned ? '' : `<p class="muted" style="margin-top:14px;line-height:1.7">Купить бумагу можно у брокера —

function classOf(p) {
  return isHedge(p) ? 'hedge' : (/^SU\d|ОФЗ|облигац/i.test(p.ticker + (p.name || '')) ? 'bonds' : 'stocks');
}

async function openCrashTest(drop = -0.30) {
  // Значение по умолчанию НЕ спасает, если функцию повесить обработчиком
  // напрямую: браузер зовёт её с событием мыши, довод оказывается занят
  // объектом, и весь лист считался от него — «упадёт на NaN%», «потеря не
  // число ₽». Довод, пришедший снаружи, обязан быть проверен здесь.
  if (typeof drop !== 'number' || !Number.isFinite(drop) || drop >= 0) drop = -0.30;
  const r = await store.crashTest(drop);
  const st0 = await store.getState();   // нужен сценариям ниже
  const worst = r.items[0], best = r.items[r.items.length - 1];
  // Бумаг может не быть вовсе — счёт только открыли или всё продано. Тогда
  // «сильнее всех просядет» не о чем: раньше строка ниже читала свойство у
  // пустоты, лист падал целиком, и вместо ответа человек видел ошибку
  // запуска. Проверка устойчивости пустого портфеля — это «падать нечему».
  if (!worst || !best) {
    openSheet(`<h2 style="margin:0 0 6px;font-size:19px">Если рынок упадёт на ${Math.abs(drop * 100)}%</h2>
      <p class="muted" style="line-height:1.6">Бумаг на счёте пока нет, поэтому падать нечему:
        деньги на счёте рынок не двигает. Проверка станет осмысленной, как только появится
        первая покупка.</p>`);
    return;
  }

  openSheet(`<h2 style="margin:0 0 6px;font-size:19px">Если рынок упадёт на ${Math.abs(drop * 100)}%</h2>
    <p class="muted" style="margin:0 0 14px">Это не прогноз, а проверка устойчивости: разные бумаги
      падают по-разному, и важно знать заранее, что выдержишь.</p>

    <div style="font-size:28px;font-weight:800;color:var(--danger);margin-bottom:2px">
      ${pct(r.totalChange)}</div>
    <div class="muted" style="margin-bottom:16px">
      ${money(r.before)} → ${money(r.after)} · потеря ${money(r.lossRub)} на бумаге<br>
      Портфель падает ${r.softening > 0.1 ? `<b style="color:var(--ok)">мягче рынка на ${Math.round(r.softening * 100)}%</b>` : 'почти как рынок'}
      — за счёт облигаций и защитных активов.
    </div>

    <div class="diff"><b>Сильнее всех просядет:</b> ${esc(worst.ticker)}
      <span style="color:var(--danger)">${(worst.change * 100).toFixed(0)}%</span>
      <span class="muted">(${money(Math.abs(worst.delta))})</span></div>
    <div class="diff"><b>Лучше всех себя поведёт:</b> ${esc(best.ticker)}
      <span style="color:${best.change >= 0 ? 'var(--ok)' : 'var(--warn)'}">${best.change >= 0 ? '+' : ''}${(best.change * 100).toFixed(0)}%</span></div>

    ${r.reserveMonths != null ? `<div class="diff" style="margin-top:10px">
      <b>Сможешь ли переждать:</b> ${r.canWait
        ? `<span style="color:var(--ok)">да</span> — резерва хватит на ${dec1(r.reserveMonths)} мес,
           продавать в убыток не придётся`
        : `<span style="color:var(--warn)">рискованно</span> — резерва на ${dec1(r.reserveMonths)} мес.
           Если в такой момент понадобятся деньги, придётся продавать по низким ценам и фиксировать убыток`}</div>` : ''}

    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="bC20" style="flex:1">−20%</button>
      <button class="btn ghost" id="bC30" style="flex:1">−30%</button>
      <button class="btn ghost" id="bC50" style="flex:1">−50%</button>
    </div>

    ${(() => {
      // Рынок падает не единственным способом. Портфель, стойкий к обвалу
      // акций, бывает беззащитен перед ставкой — и наоборот. Поэтому рядом
      // с обвалом стоят ещё три беды и все они сразу.
      const list = store.stressScenarios(st0, null);
      if (!list.length) return '';
      const rows = list.map(r => {
        const grew = r.drop < 0;
        return `<div style="padding:8px 0;border-top:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:baseline">
            <b>${esc(r.title)}</b>
            <span style="color:${grew ? 'var(--ok)' : 'var(--danger)'}">${
              grew ? '+' : '−'}${money(Math.abs(r.drop))} · ${pct(Math.abs(r.dropPct))}</span>
          </div>
          <div class="muted" style="line-height:1.6">${esc(r.hint)}. Останется ${money(r.after)}.</div>
          <div class="diff">${r.contrib.filter(c => Math.abs(c.delta) >= 1)
            .map(c => `${esc(c.label)} ${c.delta < 0 ? '−' : '+'}${money(Math.abs(c.delta))}`)
            .join(' · ') || 'цены бумаг не меняются'}</div>
          ${r.income.known && Math.abs(r.income.to - r.income.from) >= 1
            ? `<div class="diff">Выплаты за год: ${money(r.income.from)} → ${money(r.income.to)}</div>` : ''}
          ${r.risk ? `<div class="diff">Риск: ${dec1(r.risk.before)} → ${dec1(r.risk.after)}
            — ${esc(r.risk.band)}${r.risk.why ? `<br><span class="muted">${esc(r.risk.why)}</span>` : ''}</div>` : ''}
          ${r.assumed ? `<div class="muted">Здесь есть допущение: как акции отзовутся на ставку и курс,
            у каждой компании по-своему, и точных данных об этом у приложения нет.</div>` : ''}
        </div>`;
      }).join('');
      return `<div style="margin-top:16px">
        <div style="font-weight:700;font-size:15px;margin-bottom:4px">Другие беды, не только обвал</div>
        ${rows}</div>`;
    })()}

    <div class="muted" style="margin-top:14px;line-height:1.7">
      Падение на 30% случалось на российском рынке не раз и занимало месяцы, а восстановление — годы.
      Главное в такой момент — не продавать: убыток становится настоящим только при продаже.
    </div>`);

  $('bC20').onclick = () => openCrashTest(-0.20);
  $('bC30').onclick = () => openCrashTest(-0.30);
  $('bC50').onclick = () => openCrashTest(-0.50);
}

  // что изменится после удаления — считаем заранее, чтобы решение было осознанным

  $('bOpClose').onclick = closeSheet;
