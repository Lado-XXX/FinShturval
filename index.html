/**
 * ПРОГНОЗ ДОСТИЖЕНИЯ ЦЕЛИ.
 *
 * Честная рамка: будущая доходность неизвестна. Поэтому приложение показывает
 * не одну красивую линию, а разброс — что будет при удачном, среднем и плохом
 * сценарии. Одна линия создаёт ложную уверенность, разброс отражает реальность.
 *
 * Что считается точно (это не прогноз, а арифметика):
 *   · сколько нужно вносить, чтобы уложиться в срок
 *   · за сколько лет дойдёшь при текущем темпе
 *   · сколько добавит налоговый вычет
 */

const MONTHS = 12;

/** Годовая волатильность по классам — историческая, не прогноз. */
const VOLATILITY = { stocks: 0.30, bonds: 0.08, hedge: 0.18 };

/**
 * Допущения о доходности классов. Держатся в одном месте и называются
 * допущениями, потому что таковыми и являются: акции и золото предсказать
 * нельзя. Облигации — исключение: их доходность к погашению известна, и
 * подставлять вместо неё константу значит считать хуже, чем можешь.
 */
const ASSUMED = { stocks: 0.13, bonds: 0.12, hedge: 0.06 };

/**
 * Ставки для прогноза по конкретному портфелю: доходность облигаций берётся
 * фактическая (средневзвешенная к погашению по твоим бумагам), остальное —
 * из допущений. Возвращает и пометку, что именно измерено, а что принято
 * на веру: пользователь имеет право знать, откуда взялось число.
 */
function ratesFor(bondYtm) {
  const measured = bondYtm > 0.01 && bondYtm < 1;
  return {
    rates: { ...ASSUMED, bonds: measured ? bondYtm : ASSUMED.bonds },
    measured: measured ? ['bonds'] : [],
    note: measured
      ? `Облигации — по фактической доходности твоих бумаг к погашению (${(bondYtm * 100).toFixed(1)}%). `
        + `Акции ${(ASSUMED.stocks * 100).toFixed(0)}% и защита ${(ASSUMED.hedge * 100).toFixed(0)}% — допущения: будущую доходность никто не знает.`
      : `Доходность принята по историческим допущениям: акции ${(ASSUMED.stocks * 100).toFixed(0)}%, облигации ${(ASSUMED.bonds * 100).toFixed(0)}%, защита ${(ASSUMED.hedge * 100).toFixed(0)}%. `
        + `Как только биржа отдаст доходность твоих облигаций, она подставится вместо допущения.`
  };
}

/** Ожидаемая доходность портфеля из его состава. */
function expectedReturn(byClass, securities, rates = ASSUMED) {
  if (!(securities > 0)) return rates.stocks;
  let sum = 0;
  for (const [cls, value] of Object.entries(byClass)) {
    sum += (value / securities) * (rates[cls] ?? 0.1);
  }
  return sum;
}

/**
 * Связь классов между собой. Именно ради неё держат разные активы: если бы
 * всё падало одновременно, смешивать было бы незачем. Числа — устоявшиеся
 * оценки, а не измерение: акции и облигации слабо связаны, золото обычно
 * ходит против акций.
 */
const CORRELATION = {
  stocks: { stocks: 1, bonds: 0.2, hedge: -0.2 },
  bonds:  { stocks: 0.2, bonds: 1, hedge: 0.1 },
  hedge:  { stocks: -0.2, bonds: 0.1, hedge: 1 }
};

/**
 * Волатильность портфеля из его состава.
 *
 * Считается по-настоящему — через ковариации, а не средним взвешенным.
 * Средневзвешенная завышала бы риск: она молча предполагает, что все классы
 * падают одновременно и одинаково. На деле смесь колеблется слабее своих
 * частей, и именно эта разница — то, что даёт распределение по классам.
 */
function portfolioVolatility(byClass, securities) {
  if (!(securities > 0)) return VOLATILITY.stocks;
  const keys = ['stocks', 'bonds', 'hedge'];
  const w = {}, sigma = {};
  for (const k of keys) {
    w[k] = (byClass[k] || 0) / securities;
    sigma[k] = VOLATILITY[k] ?? 0.2;
  }
  let variance = 0;
  for (const i of keys) {
    for (const j of keys) {
      variance += w[i] * w[j] * sigma[i] * sigma[j] * (CORRELATION[i]?.[j] ?? 0);
    }
  }
  return variance > 0 ? Math.sqrt(variance) : 0;
}

/** Будущая стоимость при регулярных пополнениях. Чистая арифметика. */
function futureValue(start, monthly, annualRate, years, yearlyBonus = 0) {
  let v = Number(start) || 0;
  const r = (Number(annualRate) || 0) / MONTHS;
  const m = Number(monthly) || 0;
  const n = Math.max(0, Math.round((Number(years) || 0) * MONTHS));
  for (let i = 1; i <= n; i++) {
    v = v * (1 + r) + m;
    if (i % MONTHS === 0) v += yearlyBonus;   // налоговый вычет приходит раз в год
  }
  return v;
}

/** Сколько нужно вносить в месяц, чтобы дойти за N лет. */
function requiredMonthly(start, goal, annualRate, years, yearlyBonus = 0) {
  if (!(goal > 0) || !(years > 0)) return null;
  if (futureValue(start, 0, annualRate, years, yearlyBonus) >= goal) return 0;

  let lo = 0, hi = Math.max(goal / (years * MONTHS), 1000);
  while (futureValue(start, hi, annualRate, years, yearlyBonus) < goal && hi < 1e9) hi *= 2;
  for (let i = 0; i < 60; i++) {
    const mid = (lo + hi) / 2;
    if (futureValue(start, mid, annualRate, years, yearlyBonus) < goal) lo = mid; else hi = mid;
  }
  return Math.ceil(hi / 500) * 500;
}

/** За сколько лет дойдёшь при текущем темпе. null — если не дойдёшь за 50 лет. */
function yearsToGoal(start, monthly, goal, annualRate, yearlyBonus = 0) {
  if (!(goal > 0)) return null;
  if (start >= goal) return 0;
  let v = start, r = annualRate / MONTHS;
  for (let m = 1; m <= 600; m++) {
    v = v * (1 + r) + monthly;
    if (m % MONTHS === 0) v += yearlyBonus;
    if (v >= goal) return Math.round((m / MONTHS) * 10) / 10;
  }
  return null;
}

/**
 * Разброс исходов: что будет в плохом, среднем и удачном случае.
 * Считается прогонкой множества случайных сценариев — так честнее, чем
 * одна линия «при доходности 13%».
 */
function outcomeRange(start, monthly, years, expected, volatility, yearlyBonus = 0, runs = 3000) {
  const results = [];
  const months = Math.round(years * MONTHS);
  const mr = expected / MONTHS;
  const mv = volatility / Math.sqrt(MONTHS);

  for (let i = 0; i < runs; i++) {
    let v = start;
    for (let m = 1; m <= months; m++) {
      const shock = mr + mv * gauss();
      v = Math.max(0, v * (1 + shock) + monthly);
      if (m % MONTHS === 0) v += yearlyBonus;
    }
    results.push(v);
  }
  results.sort((a, b) => a - b);

  const at = p => results[Math.min(results.length - 1, Math.floor(results.length * p))];
  return { bad: at(0.10), median: at(0.50), good: at(0.90), all: results };
}

/**
 * Честный взгляд на ближайший год: как часто такой портфель заканчивает
 * год в плюсе сверх внесённого. Не предсказание конкретного исхода —
 * частота из прогонки случайных сценариев при исторической волатильности.
 */
function yearOutlook(byClass, securities, monthly = 0, rates) {
  if (!(securities > 0)) return null;
  const expected = expectedReturn(byClass, securities, rates || ASSUMED);
  const vol = portfolioVolatility(byClass, securities);
  const range = outcomeRange(securities, monthly, 1, expected, vol);
  const base = securities + monthly * 12;
  const chance = range.all.filter(v => v > base).length / range.all.length;
  return { chance, bad: range.bad, median: range.median, good: range.good, base };
}

/**
 * Путь к цели одним взглядом: сколько пройдено и когда придёт при текущем
 * темпе — с учётом взносов, вычета и ожидаемой доходности состава.
 */
function goalProgress(state) {
  const goal = Number(state.settings?.goal?.amount) || 0;
  if (!(goal > 0)) return null;
  const total = Number(state.summary?.total) || 0;
  const monthly = Number(state.settings?.monthlyContribution) || 0;
  const rate = Number(state.settings?.ndflRate) || 0.13;
  const yearlyBonus = Math.min(monthly * 12, 400000) * rate;
  const expected = expectedReturn(state.summary?.byClass || {}, state.summary?.securities || 0,
    ratesFor(Number(state.settings?.bondYtm) || 0).rates);
  const reachIn = yearsToGoal(total, monthly, goal, expected, yearlyBonus);
  return {
    goal, total, monthly,
    pct: Math.min(1, goal > 0 ? total / goal : 0),
    reachIn,
    etaYear: reachIn != null ? new Date().getFullYear() + Math.round(reachIn) : null
  };
}

/**
 * Что сильнее двигает цель. Приём из практики финансовых консультантов:
 * вместо одной цифры прогноза показать, какой из рычагов даёт больше —
 * взнос, срок или доходность. Каждый сдвигается на одинаково «посильную»
 * величину, и сравнивается результат в рублях на горизонте цели.
 *
 * Доходность в списке нарочно последняя: её нельзя выбрать, можно лишь
 * рискнуть, — и приложение говорит об этом прямо.
 */
function whatMovesTheNeedle(current, monthly, years, expected, bonus = 0) {
  if (!(years > 0) || !(monthly >= 0)) return null;
  // Порядок аргументов futureValue: (начало, взнос, доходность, срок, вычет).
  const base = futureValue(current, monthly, expected, years, bonus);

  const levers = [
    { key: 'contribution', title: 'Взнос: +5 000 ₽ в месяц',
      value: futureValue(current, monthly + 5000, expected, years, bonus) - base,
      note: 'Единственный рычаг, который полностью в твоих руках.' },
    { key: 'term', title: 'Срок: +1 год',
      value: futureValue(current, monthly, expected, years + 1, bonus) - base,
      note: 'Работает сам, без усилий и риска, — но требует терпения.' },
    { key: 'return', title: 'Доходность: +1 процентный пункт',
      value: futureValue(current, monthly, expected + 0.01, years, bonus) - base,
      note: 'Доходность нельзя выбрать — можно только взять больше риска и надеяться. Поэтому этот рычаг ненадёжен, каким бы крупным ни выглядел.' }
  ].filter(l => isFinite(l.value));

  levers.sort((a, b) => b.value - a.value);
  return { base, levers, strongest: levers[0] || null };
}

/** Вероятность дойти до цели за срок. */
function chanceOfGoal(range, goal) {
  if (!range?.all?.length || !(goal > 0)) return null;
  const hits = range.all.filter(v => v >= goal).length;
  return hits / range.all.length;
}

function gauss() {
  let u = 0, v = 0;
  while (!u) u = Math.random();
  while (!v) v = Math.random();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

/**
 * Полный разбор цели: сходится план или нет, и какие есть рычаги.
 * Возвращает готовый ответ на вопрос «дойду ли я и что менять».
 */
function analyzeGoal({ current, monthly, goal, years, byClass, securities, taxRefund = 0, rates }) {
  if (!(goal > 0)) {
    return { hasGoal: false, message: 'Цель не задана — укажи сумму, и я посчитаю план.' };
  }

  const expected = expectedReturn(byClass, securities, rates || ASSUMED);
  const volatility = portfolioVolatility(byClass, securities);

  const reachIn = yearsToGoal(current, monthly, goal, expected, taxRefund);
  const needed = requiredMonthly(current, goal, expected, years, taxRefund);
  const range = outcomeRange(current, monthly, years, expected, volatility, taxRefund);
  const chance = chanceOfGoal(range, goal);
  const fits = reachIn != null && reachIn <= years + 0.1;

  return {
    hasGoal: true, fits, expected, volatility,
    reachIn, needed, range, chance,
    projected: futureValue(current, monthly, expected, years, taxRefund),
    levers: buildLevers({ current, monthly, goal, years, expected, taxRefund, reachIn, needed })
  };
}

/** Рычаги: что можно изменить, чтобы план сошёлся. */
function buildLevers({ current, monthly, goal, years, expected, taxRefund, reachIn, needed }) {
  const out = [];

  if (needed != null && needed > monthly) {
    out.push({
      kind: 'contribution',
      text: `Вносить ${needed.toLocaleString('ru-RU')} ₽/мес вместо ${monthly.toLocaleString('ru-RU')} — тогда уложишься в ${years} лет`,
      delta: needed - monthly
    });
  }

  if (reachIn != null && reachIn > years) {
    out.push({
      kind: 'time',
      text: `Растянуть срок до ${Math.ceil(reachIn)} лет — при нынешнем взносе цель придёт тогда`,
      delta: Math.ceil(reachIn) - years
    });
  }

  const reachable = futureValue(current, monthly, expected, years, taxRefund);
  if (reachable < goal) {
    out.push({
      kind: 'goal',
      text: `Уменьшить цель до ${Math.round(reachable / 100000) * 100000} ₽ — столько накопится за ${years} лет при нынешнем темпе`,
      delta: goal - reachable
    });
  }

  return out;
}

return {expectedReturn, portfolioVolatility, futureValue, requiredMonthly, yearsToGoal, outcomeRange, chanceOfGoal, analyzeGoal, yearOutlook, goalProgress, whatMovesTheNeedle, ratesFor, ASSUMED_RATES: ASSUMED};
})());

 * БАЗА ДАННЫХ (IndexedDB).
 *
 * Настоящая база внутри браузера — на телефоне и на компьютере одинаково.
 * Данные не покидают устройство: ни сервера, ни аккаунта, ни синхронизации.
 *
 * Почему не localStorage, с которого начинали:
 *  · лимит ~5 МБ против сотен мегабайт здесь
 *  · localStorage хранит одну строку — приходится читать и писать всё целиком
 *  · нет поиска: чтобы найти операции за год, надо разобрать весь объём
 *  · запись блокирует интерфейс, здесь работа асинхронная
 *
 * Хранилища:
 *  ops       история операций (покупки, продажи, пополнения) — источник истины
 *  prices    котировки по дням, для графиков и истории портфеля
 *  meta      настройки, цель, стратегия, резерв
 */

const DB_NAME = 'shturval';
const DB_VERSION = 1;

let dbPromise = null;

const KeyRange = typeof IDBKeyRange !== 'undefined' ? IDBKeyRange : {
  bound: (lower, upper, lowerOpen = false, upperOpen = false) => ({ lower, upper, lowerOpen, upperOpen }),
  only: v => ({ lower: v, upper: v }),
  lowerBound: (lower, lowerOpen = false) => ({ lower, lowerOpen }),
  upperBound: (upper, upperOpen = false) => ({ upper, upperOpen })

 * ЗАПАСНОЕ ХРАНИЛИЩЕ.
 *
 * Когда файл открыт напрямую с устройства, браузер считает страницу «ничьей»
 * и запрещает ей базу — indexedDB.open падает. Раньше на этом обрывался
 * запуск и экран оставался пустым: человек видел белый лист вместо причины.
 *

 * говорим об ограничении. Приложение остаётся живым, а данные — настолько
 * надёжными, насколько позволяет браузер.

let storageMode = 'idb';        // idb | local | memory
let storageReason = null;

const memory = { ops: [], prices: [], meta: [] };
let memoryLoaded = false;

const memKey = (store, r) =>

function loadMemory() {
  if (memoryLoaded) return;

  } catch { storageMode = 'memory'; }

/** Достаточно узкая замена объектному хранилищу: get, getAll, put, delete, index. */
function memoryStore(name) {
  const rows = memory[name];

  const inRange = (v, range) => {
    if (range == null) return true;
    if (typeof range !== 'object') return v === range;
    const okLow = range.lower == null || (range.lowerOpen ? v > range.lower : v >= range.lower);
    const okHigh = range.upper == null || (range.upperOpen ? v < range.upper : v <= range.upper);

    get: k => ({ result: rows.find(r => key(r) === k) }),
    getAll: () => ({ result: rows.slice() }),
    put: rec => {
      const i = rows.findIndex(r => key(r) === key(rec));

      if (i >= 0) rows.splice(i, 1);

    clear: () => { rows.length = 0; return { result: undefined }; },
    index: field => ({ getAll: range => ({ result: rows.filter(r => inRange(r[field], range)) }) })

      + 'постоянную базу. Приложение работает, но данные держатся в памяти браузера '
      + 'и могут пропасть при очистке. Чтобы это ушло, размести файл на бесплатном '

    wrap(s.index('date').getAll(KeyRange.bound(from, to))));
}

/** История по одной бумаге. */
async function opsByTicker(ticker) {
  return tx('ops', 'readonly', s => wrap(s.index('ticker').getAll(ticker)));
}

/* ─────────────────── ЦЕНЫ ─────────────────── */

async function savePrices(records) {
  await tx('prices', 'readwrite', s => { for (const r of records) s.put(r); });
  return records.length;
}

async function priceHistory(ticker, days = 90) {
  const all = await tx('prices', 'readonly', s => wrap(s.index('ticker').getAll(ticker)));
  return (all || []).sort((a, b) => (a.date < b.date ? -1 : 1)).slice(-days);
}

/** Снимок стоимости портфеля по дням — для графика. */
async function valueHistory(days = 90) {
  const all = await tx('prices', 'readonly', s => wrap(s.getAll()));
  const byDate = {};
  for (const p of all || []) {
    byDate[p.date] = (byDate[p.date] || 0) + (p.value || 0);
  }
  return Object.entries(byDate)
    .sort(([a], [b]) => (a < b ? -1 : 1))
    .slice(-days)
    .map(([date, value]) => ({ date, value }));
}

/* ─────────────────── НАСТРОЙКИ ─────────────────── */

async function getMeta(key, fallback = null) {
  const rec = await tx('meta', 'readonly', s => wrap(s.get(key)));
  return rec ? rec.value : fallback;
}

async function setMeta(key, value) {
  await tx('meta', 'readwrite', s => wrap(s.put({ key, value })));
  return value;
}

async function allMeta() {
  const list = await tx('meta', 'readonly', s => wrap(s.getAll()));
  const out = {};
  for (const r of list || []) out[r.key] = r.value;
  return out;
}

/* ─────────────────── ОБСЛУЖИВАНИЕ ─────────────────── */

/** Полная выгрузка для копии в файл. */
/** Что не выгружается в копию: ключ доступа к брокерскому счёту. */
const SECRET_KEYS = ['tiToken'];

async function exportAll() {
  const [ops, rawMeta] = await Promise.all([allOps(), allMeta()]);
  // Копия — обычный файл: человек перешлёт его себе на почту или в облако.
  // Токену там не место, а восстанавливается он одним вводом.
  const meta = { ...rawMeta };
  for (const key of SECRET_KEYS) delete meta[key];
  const prices = await tx('prices', 'readonly', s => wrap(s.getAll()));
  return {
    format: 'shturval-backup',
    version: DB_VERSION,
    exportedAt: new Date().toISOString(),
    ops, meta, prices: prices || []
  };
}

/** Загрузка копии. Существующие данные заменяются. */
async function importAll(backup) {
  if (!backup || backup.format !== 'shturval-backup' || !Array.isArray(backup.ops)) {
    return { ok: false, error: 'Файл не от Штурвала или повреждён' };
  }

  // Очистка и запись — разными шагами. В одной транзакции порядок операций
  // не гарантирован: очистка может выполниться после записи и стереть данные.
  //
  // Всё идёт через общий доступ к хранилищу: раньше здесь база вызывалась
  // напрямую, и загрузка копии падала там, где база недоступна, — то есть
  // ровно тогда, когда копия и нужна.
  for (const store of ['ops', 'prices', 'meta']) {
    await tx(store, 'readwrite', s => wrap(s.clear()));
  }

  await tx('ops', 'readwrite', s => { for (const op of backup.ops) s.put(op); });
  await tx('prices', 'readwrite', s => { for (const p of backup.prices || []) s.put(p); });
  await tx('meta', 'readwrite', s => {
    for (const [key, value] of Object.entries(backup.meta || {})) s.put({ key, value });
  });

  return { ok: true, ops: backup.ops.length };
}

/** Сколько места занято и сколько доступно. */
async function storageInfo() {
  if (!navigator.storage?.estimate) return null;
  const est = await navigator.storage.estimate();
  return {
    usedMB: Math.round((est.usage || 0) / 1048576 * 10) / 10,
    quotaMB: Math.round((est.quota || 0) / 1048576),
    percent: est.quota ? Math.round((est.usage / est.quota) * 1000) / 10 : 0
  };
}

/**
 * Просьба к браузеру не удалять данные при нехватке места.
 * Без этого браузер вправе очистить хранилище — а это потеря истории.
 */
async function requestPersistence() {
  if (!navigator.storage?.persist) return false;
  if (await navigator.storage.persisted?.()) return true;
  return navigator.storage.persist();
}

/** Перенос данных из localStorage прошлой версии. Выполняется один раз. */
async function migrateFromLocalStorage(legacyState) {
  if (!legacyState) return { migrated: 0 };
  const done = await getMeta('migratedFromLocalStorage');
  if (done) return { migrated: 0, skipped: true };

  const ops = [];
  let counter = 0;
  const mkId = () => `legacy${Date.now().toString(36)}${(counter++).toString(36)}`;

  // остатки превращаем в стартовые покупки: истории сделок в старой версии не было
  for (const a of legacyState.assets || []) {
    if (!(a.qty > 0)) continue;
    ops.push({
      id: mkId(), type: 'buy', ticker: a.ticker, name: a.name,
      qty: a.qty, price: a.avgPrice || a.price || 0, fee: 0,
      amount: a.qty * (a.avgPrice || a.price || 0),
      date: legacyState.meta?.createdAt?.slice(0, 10) || '2026-01-01',
      note: 'перенесено из прошлой версии'
    });
  }

  for (const c of legacyState.contributions || []) {
    ops.push({
      id: mkId(), type: c.type === 'deposit' ? 'deposit' : c.type,
      amount: c.amount, date: c.date, note: 'перенесено'
    });
  }

  if (ops.length) await addOps(ops);
  await setMeta('migratedFromLocalStorage', new Date().toISOString());
  return { migrated: ops.length };
}

function storageState() { return { mode: storageMode, reason: storageReason }; }

return {BUILD_ID, storageState, addOp, addOps, deleteOp, allOps, opsBetween, opsByTicker, savePrices, priceHistory, valueHistory, getMeta, setMeta, allMeta, exportAll, importAll, storageInfo, requestPersistence, migrateFromLocalStorage};
})());

/* ─── data/moex.js ─── */
Object.assign(SH, (function(){
/**
 * БИРЖЕВЫЕ ДАННЫЕ (Московская биржа).
 *
 * Ключевой урок прошлой версии: у облигаций разные поля приходят в разных
 * единицах — цена последней сделки в процентах номинала, а MARKETPRICE может
 * быть в рублях. Взятие «первого непустого поля» раздувало ОФЗ в десять раз.
 * Здесь для каждого типа инструмента задан строгий порядок полей.
 */


const ISS = 'https://iss.moex.com/iss';
const COLS = 'SECID,BOARDID,LAST,MARKETPRICE,WAPRICE,LCLOSEPRICE,PREVPRICE';

/** Различаем причины неудачи: без этого «нет интернета» и «браузер заблокировал» неотличимы. */
const FAIL = { OFFLINE: 'offline', BLOCKED: 'blocked', TIMEOUT: 'timeout', SERVER: 'server' };

async function fetchJSON(url, timeoutMs = 8000) {
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    const e = new Error('нет сети'); e.reason = FAIL.OFFLINE; throw e;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.reason = FAIL.SERVER; throw e; }
    return await r.json();
  } catch (err) {
    if (err.reason) throw err;
    if (err.name === 'AbortError') { err.reason = FAIL.TIMEOUT; throw err; }
    // При открытии файла напрямую (file://) браузер запрещает запросы наружу.
    // Ошибка сети в этом случае неотличима от отсутствия интернета — различаем по адресу.
    err.reason = (typeof location !== 'undefined' && location.protocol === 'file:')
      ? FAIL.BLOCKED : FAIL.OFFLINE;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

/** Рынки, где искать инструмент, в порядке вероятности. */
function marketsFor(asset) {
  const kind = classify(asset);
  if (kind === KIND.BOND) return [['stock', 'bonds'], ['stock', 'shares']];
  if (kind === KIND.CURRENCY) return [['currency', 'selt']];
  return [['stock', 'shares'], ['stock', 'bonds']];
}

/**
 * Выбор цены. Для облигаций и фондов — только поля в процентах номинала,
 * строго по приоритету. Смешивать единицы нельзя.
 */
function pickPrice(row, boardId) {
  const isPercentBoard = ['TQOB', 'TQCB', 'TQTF'].includes(boardId);
  const candidates = isPercentBoard
    ? [row[2], row[5], row[6]]              // последняя сделка → закрытие → предыдущая
    : [row[2], row[3], row[4], row[5], row[6]];
  return candidates.find(v => v != null && Number.isFinite(v) && v > 0) ?? null;
}

/** Запрос по одному инструменту на конкретном рынке. */
async function fetchOne(secId, engine, market) {
  const url = `${ISS}/engines/${engine}/markets/${market}/securities/${encodeURIComponent(secId)}.json`
            + `?iss.meta=off&iss.only=marketdata,securities&marketdata.columns=${COLS}`
            + `&securities.columns=BOARDID,ACCRUEDINT,FACEVALUE,LOTVALUE,LOTSIZE`;

  const j = await fetchJSON(url);
  const mdRows = j?.marketdata?.data || [];
  const secRows = j?.securities?.data || [];

  // накопленный купон и номинал по площадке
  const secByBoard = {};
  // Размер лота: на бирже покупают лотами, а не штуками. Сбер торгуется
  // по 10 акций в лоте — совет «купи 111 штук» исполнить невозможно.
  for (const r of secRows) secByBoard[r[0]] = { accrued: r[1], face: r[2], lot: r[4] };

  for (const row of mdRows) {
    const board = row[1];
    const raw = pickPrice(row, board);
    if (raw == null) continue;

    const isBondBoard = ['TQOB', 'TQCB'].includes(board);
    if (isBondBoard) {
      const info = secByBoard[board] || {};
      const face = info.face > 0 ? info.face : 1000;
      const accrued = Number(info.accrued) || 0;
      // цена в процентах номинала → рубли, плюс накопленный купон (как показывает брокер)
      return { price: roundPrice(raw / 100 * face + accrued), accrued, board,
               lot: Number(info.lot) > 0 ? Number(info.lot) : 1 };
    }
    const lot = Number((secByBoard[board] || {}).lot) || 1;
    return { price: roundPrice(raw), accrued: 0, board, lot };
  }
  return null;
}

/** Обновление цен для списка активов. Ошибка по одному не роняет остальные. */
async function fetchPrices(assets) {
  const updated = [];
  const failed = [];
  let lastReason = null;

  for (const asset of assets) {
    if (!(Number(asset.qty) > 0)) continue;
    const secId = asset.moexId || asset.ticker;
    let result = null;

    for (const [engine, market] of marketsFor(asset)) {
      try {
        result = await fetchOne(secId, engine, market);
        if (result) break;
      } catch (e) { lastReason = e.reason || lastReason; }
    }

    if (result) {
      updated.push({ ticker: asset.ticker, price: result.price, accrued: result.accrued,
                     lot: result.lot || 1 });
    } else {
      failed.push(asset.ticker);
    }
  }

  return { updated, failed, at: Date.now(), reason: lastReason };
}

/** Поиск инструмента по названию или тикеру. */
async function search(query) {
  if (!query || query.length < 2) return [];
  try {
    const j = await fetchJSON(`${ISS}/securities.json?iss.meta=off&limit=10&q=${encodeURIComponent(query)}`);
    const cols = j?.securities?.columns || [];
    const idx = n => cols.indexOf(n);
    return (j?.securities?.data || [])
      .filter(r => r[idx('is_traded')] === 1)
      .map(r => ({
        ticker: r[idx('secid')],
        name: r[idx('name')] || r[idx('shortname')],
        type: r[idx('type')]
      }))
      .slice(0, 8);
  } catch {
    return [];
  }
}

/** Индекс Мосбиржи и ставка денежного рынка — ориентир ключевой ставки. */
async function fetchMarketPulse() {
  const out = { imoex: null, moneyRate: null, monthChange: null };
  try {
    const j = await fetchJSON(`${ISS}/engines/stock/markets/index/securities/IMOEX.json`
      + `?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,CURRENTVALUE,LASTVALUE`);
    const row = (j?.marketdata?.data || [])[0];
    if (row) out.imoex = row[1] ?? row[2] ?? null;
  } catch { /* индекс недоступен */ }

  // Динамика за месяц: уровень индекса сам по себе ни о чём не говорит,
  // сравнение с месячной давностью — говорит, ушли ли доли от плана.
  try {
    const from = new Date(Date.now() - 35 * 86400000).toISOString().slice(0, 10);
    const j = await fetchJSON(`${ISS}/history/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json`
      + `?iss.meta=off&iss.only=history&history.columns=TRADEDATE,CLOSE&from=${from}`);
    const rows = (j?.history?.data || []).filter(r => r && r[1] > 0);
    const past = rows.length ? rows[0][1] : null;
    if (past > 0 && out.imoex > 0) out.monthChange = Math.round((out.imoex / past - 1) * 1000) / 1000;
  } catch { /* динамика недоступна — карточка пульса просто не появится */ }

  for (const id of ['RUSFAR', 'RUONIA']) {
    try {
      const j = await fetchJSON(`${ISS}/engines/currency/markets/index/securities/${id}.json`
        + `?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,CURRENTVALUE,LASTVALUE`);
      const row = (j?.marketdata?.data || [])[0];
      const v = row ? (row[1] ?? row[2]) : null;
      if (v != null && v > 1 && v < 50) { out.moneyRate = Math.round(v * 10) / 10; break; }
    } catch { /* пробуем следующий индикатор */ }
  }
  return out;
}

/**
 * Жива ли биржа с этого устройства. Крошечный запрос с коротким сроком:
 * если он не проходит, дело не в объёме данных, а в самом доступе — чаще
 * всего его режет VPN. Лучше сказать это за пять секунд, чем заставлять
 * ждать минуту и выдавать туманное «не ответила».
 */
async function pingExchange(timeout = 5000) {
  try {
    const j = await fetchJSON(`${ISS}/engines/stock/markets/index/boards/SNDX/securities/IMOEX.json`
      + `?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID`, timeout);
    return !!(j && j.marketdata);
  } catch { return false; }
}

/**
 * История индекса с даты. MCFTR — индекс ПОЛНОЙ доходности (с дивидендами):
 * только с ним сравнение с портфелем честно — портфель ведь получает выплаты.
 * Страницы истории листаются с потолком, чтобы не зависнуть на длинной истории.
 */
async function fetchIndexHistory(from, secid = 'MCFTR') {
  const points = [];
  for (let start = 0, page = 0; page < 8; page++, start = points.length) {
    const j = await fetchJSON(`${ISS}/history/engines/stock/markets/index/boards/SNDX/securities/${secid}.json`
      + `?iss.meta=off&iss.only=history&history.columns=TRADEDATE,CLOSE&from=${from}&start=${start}`);
    const rows = (j?.history?.data || []).filter(r => r && r[0] && r[1] > 0);
    for (const r of rows) points.push({ date: r[0], close: r[1] });
    if (rows.length < 100) break;         // страница неполная — история кончилась
  }
  return points;
}

/** Разбор таблицы ISS в объекты: колонки приходят отдельно от данных. */
function tableRows(block) {
  if (!block || !block.columns || !block.data) return [];
  const c = block.columns;
  return block.data.map(row => {
    const o = {};
    c.forEach((name, i) => { o[name] = row[i]; });
    return o;
  });
}

/**
 * Все акции основного режима торгов (TQBR) с ценой и капитализацией.
 * P/E и прибыли ISS не отдаёт — ни здесь, ни где-либо ещё: см. screener.js,
 * где об этом сказано прямо, вместо того чтобы подсунуть выдуманное число.
 */
async function fetchAllStocks(maxPages = 3) {
  // Биржа отдаёт доску одним куском в несколько сотен строк. На мобильной
  // сети такой ответ не успевает прийти за отведённое время, и поиск падал
  // ещё на списке. Просим страницами по сотне: каждая приходит за секунды,
  // а первых трёхсот бумаг по обороту хватает с запасом.
  const securities = [], marketdata = [];
  for (let page = 0; page < maxPages; page++) {
    const j = await fetchJSON(`${ISS}/engines/stock/markets/shares/boards/TQBR/securities.json`
      + `?iss.meta=off&iss.only=securities,marketdata&start=${page * 100}`
      + `&securities.columns=SECID,SHORTNAME,PREVPRICE,ISSUESIZE,LOTSIZE`
      + `&marketdata.columns=SECID,LAST,MARKETPRICE,ISSUECAPITALIZATION`, 15000);
    const secPage = tableRows(j?.securities);
    securities.push(...secPage);
    marketdata.push(...tableRows(j?.marketdata));
    if (secPage.length < 100) break;      // страница неполная — доска кончилась
  }

  const md = new Map(marketdata.map(r => [r.SECID, r]));
  const out = [];
  for (const r of securities) {
    const m = md.get(r.SECID) || {};
    const price = m.LAST > 0 ? m.LAST : (m.MARKETPRICE > 0 ? m.MARKETPRICE : r.PREVPRICE);
    if (!(price > 0)) continue;
    out.push({
      ticker: r.SECID, name: r.SHORTNAME || r.SECID, price,
      lot: r.LOTSIZE || 1,
      cap: m.ISSUECAPITALIZATION > 0 ? m.ISSUECAPITALIZATION
         : (r.ISSUESIZE > 0 ? r.ISSUESIZE * price : null)
    });
  }
  return out;
}

/**
 * Облигации: ОФЗ (TQOB) и корпоративные (TQCB). Доходность к погашению
 * и срок биржа отдаёт сама — здесь ничего считать на глазок не нужно.
 */
async function fetchAllBonds(kinds = ['gov'], maxPages = 3) {
  // По умолчанию только ОФЗ: их шесть десятков, ответ приходит мгновенно.
  // Доска корпоративных — тысячи выпусков и мегабайты, из-за неё поиск
  // не доживал до конца. Корпоративные просим отдельно и тоже страницами.
  const boards = [];
  if (kinds.includes('gov')) boards.push(['TQOB', 'gov']);
  if (kinds.includes('corp')) boards.push(['TQCB', 'corp']);
  const out = [];
  for (const [board, type] of boards) {
    const rows = [], yieldRows = [];
    for (let page = 0; page < maxPages; page++) {
      let j;
      try {
        j = await fetchJSON(`${ISS}/engines/stock/markets/bonds/boards/${board}/securities.json`
          + `?iss.meta=off&iss.only=securities,marketdata_yields&start=${page * 100}`
          + `&securities.columns=SECID,SHORTNAME,SECNAME,MATDATE,OFFERDATE,COUPONVALUE,COUPONPERCENT,COUPONPERIOD,FACEVALUE,PREVPRICE`
          + `&marketdata_yields.columns=SECID,EFFECTIVEYIELD,DURATION`, 15000);
      } catch { break; }
      const secPage = tableRows(j?.securities);
      rows.push(...secPage);
      yieldRows.push(...tableRows(j?.marketdata_yields));
      if (secPage.length < 100) break;
    }
    const yields = new Map(yieldRows.map(r => [r.SECID, r]));
    for (const r of rows) {
      const y = yields.get(r.SECID) || {};
      const face = r.FACEVALUE > 0 ? r.FACEVALUE : 1000;
      const price = r.PREVPRICE > 0 ? r.PREVPRICE * face / 100 : null;
      const mat = r.MATDATE && r.MATDATE !== '0000-00-00' ? r.MATDATE : null;
      const yearsLeft = mat ? Math.round(daysBetween(today(), mat) / 365.25 * 10) / 10 : null;
      // Оферта — день, когда эмитент вправе выкупить бумагу (или обязан по
      // требованию держателя). До неё известен купон, после — часто нет.
      // Доходность к погашению для такой бумаги считается до срока, которого
      // может не быть: это самая частая ловушка в корпоративных облигациях.
      const offer = r.OFFERDATE && r.OFFERDATE !== '0000-00-00' ? r.OFFERDATE : null;
      const yearsToOffer = offer ? Math.round(daysBetween(today(), offer) / 365.25 * 10) / 10 : null;
      if (!(y.EFFECTIVEYIELD > 0) || !(yearsLeft > 0)) continue;
      out.push({
        ticker: r.SECID, name: r.SHORTNAME || r.SECID, issuer: r.SECNAME || r.SHORTNAME,
        ytm: y.EFFECTIVEYIELD / 100, yearsLeft, matDate: mat, price, face,
        offerDate: offer, yearsToOffer: yearsToOffer > 0 ? yearsToOffer : null,
        coupon: r.COUPONVALUE > 0 ? r.COUPONVALUE : null,
        couponPct: r.COUPONPERCENT > 0 ? r.COUPONPERCENT / 100 : null,
        // Переменный купон биржа помечает пустым значением ближайшего купона:
        // у флоатеров он неизвестен заранее — это и есть признак.
        couponType: r.COUPONVALUE > 0 ? 'fixed' : 'float',
        type
      });
    }
  }
  return out;
}

/** История дивидендов бумаги: суммы и даты закрытия реестра. */
async function fetchDividendHistory(ticker) {
  const j = await fetchJSON(`${ISS}/securities/${encodeURIComponent(ticker)}/dividends.json?iss.meta=off`, 8000);

async function tiAccounts(token) {
  const data = await tiCall(token, 'UsersService', 'GetAccounts', {});
  return (data.accounts || []).map(a => ({
    id: a.id,
    name: a.name || 'Счёт',
    isIis: /IIS/i.test(a.type || ''),
    opened: TI_DATE(a.openedDate),
    readOnly: /READ_ONLY/i.test(a.accessLevel || '')
  }));
}

/** Тикер и название по идентификатору бумаги. Запрашивается по разу на бумагу. */
async function tiInstrument(token, id, cache) {
  if (!id) return null;
  if (cache.has(id)) return cache.get(id);
  let found = null;
  try {
    const data = await tiCall(token, 'InstrumentsService', 'GetInstrumentBy',
      { idType: 'INSTRUMENT_ID_TYPE_UID', id });
    const i = data.instrument;
    // Размер лота: на бирже покупают лотами. Берём его здесь, потому что
    // цены в приложении обновляются от брокера, а не с биржи — иначе лот
    // так и остался бы неизвестным, и план советовал бы «111 штук».
    if (i) found = { ticker: (i.ticker || '').toUpperCase(), name: i.name || i.ticker,
                     kind: i.instrumentKind || '', lot: Number(i.lot) > 0 ? Number(i.lot) : 1 };
  } catch { /* бумага могла быть делистингована — вернём пусто */ }
  cache.set(id, found);
  return found;
}

const TI_KIND = {
  OPERATION_TYPE_BUY: 'buy',
  OPERATION_TYPE_BUY_CARD: 'buy',
  OPERATION_TYPE_BUY_MARGIN: 'buy',
  OPERATION_TYPE_SELL: 'sell',
  OPERATION_TYPE_SELL_MARGIN: 'sell',
  OPERATION_TYPE_INPUT: 'deposit',
  OPERATION_TYPE_OUTPUT: 'withdraw',
  OPERATION_TYPE_DIVIDEND: 'dividend',
  OPERATION_TYPE_COUPON: 'dividend',
  OPERATION_TYPE_DIVIDEND_TAX: 'tax',
  OPERATION_TYPE_TAX: 'tax',
  OPERATION_TYPE_TAX_CORRECTION: 'tax',
  OPERATION_TYPE_BROKER_FEE: 'fee',
  OPERATION_TYPE_SERVICE_FEE: 'fee',
  OPERATION_TYPE_MARGIN_FEE: 'fee'
};

/**
 * История операций по счёту. Листается курсором, пока API не скажет «всё».
 * Возвращает операции в том же виде, в каком их даёт разбор отчётов, —
 * дальше они идут по общему пути.
 */
async function tiOperations(token, accountId, from = '2000-01-01') {
  const cache = new Map();
  const raw = [];
  let cursor = '', guard = 0;

  while (guard++ < 60) {
    const data = await tiCall(token, 'OperationsService', 'GetOperationsByCursor', {
      accountId,
      from: new Date(from).toISOString(),
      to: new Date().toISOString(),
      cursor,
      limit: 1000,
      state: 'OPERATION_STATE_EXECUTED'
    });
    for (const it of (data.items || [])) raw.push(it);
    if (!data.hasNext || !data.nextCursor) break;
    cursor = data.nextCursor;
  }

  const trades = [], cash = [], skipped = [];
  let feesInTrades = 0, feesSeparate = [];

  for (const it of raw) {
    const kind = TI_KIND[it.type];
    const date = TI_DATE(it.date);
    const payment = Math.abs(tiAmount(it.payment));
    const commission = Math.abs(tiAmount(it.commission));

    if (kind === 'buy' || kind === 'sell') {
      const qty = Math.abs(Number(it.quantityDone || it.quantity || 0));
      if (!(qty > 0) || !(payment > 0)) { skipped.push(it.description || it.type); continue; }
      const sec = await tiInstrument(token, it.instrumentUid, cache);
      const ticker = sec && sec.ticker ? sec.ticker : (it.figi || '').toUpperCase();
      if (!ticker) { skipped.push(it.description || it.type); continue; }
      feesInTrades += commission;
      trades.push({
        type: kind, date, ticker,
        moexId: /^[A-Z]{2}\d/.test(ticker) ? ticker : undefined,
        name: sec ? sec.name : ticker,
        qty,
        price: roundPrice(payment / qty),   // столько реально стоила одна бумага
        fee: Math.round(commission * 100) / 100
      });
      continue;
    }

    if (kind === 'deposit' || kind === 'withdraw') {
      if (payment > 0) cash.push({ type: kind, date, amount: payment });
      continue;
    }

    if (kind === 'dividend') {
      const sec = await tiInstrument(token, it.instrumentUid, cache);
      if (payment > 0) cash.push({ type: 'dividend', date, amount: payment,
        ticker: sec ? sec.ticker : '', name: sec ? sec.name : '' });
      continue;
    }

    if (kind === 'tax') {
      if (payment > 0) cash.push({ type: 'fee', date, amount: payment, note: 'налог' });
      continue;
    }

    if (kind === 'fee') { feesSeparate.push({ date, amount: payment }); continue; }

    if (payment > 0) skipped.push(it.description || it.type || 'без названия');
  }

  // Комиссия приходит и внутри сделки, и отдельной операцией. Берём что-то
  // одно, иначе деньги спишутся дважды.
  if (feesInTrades < 0.005) {
    for (const f of feesSeparate) if (f.amount > 0) cash.push({ type: 'fee', ...f, note: 'комиссия' });
  }

  return { trades, cash, skipped: [...new Set(skipped)], total: raw.length };
}

/** Портфель и остаток по версии брокера — для сверки того, что мы насчитали. */
/**
 * Портфель у брокера.
 *
 * `known` — ранее выясненные имена бумаг: uid → {ticker, name}. Нужны потому,
 * что запрос названия может не ответить (сеть, лимит запросов), и тогда без
 * запаса пришлось бы выдать технический код брокера за тикер. Так рождались
 * ложные расхождения в сверке («GOLD 2533 ≠ 0» рядом с «TCSM… 0 ≠ 2533»)
 * и, что хуже, цены могли записаться под чужим именем.
 *
 * Возвращает `resolved` — то, что удалось выяснить: вызывающий сохранит это
 * и в следующий раз обойдётся без запроса.
 */
async function tiPortfolio(token, accountId, known = {}) {
  const cache = new Map();
  const data = await tiCall(token, 'OperationsService', 'GetPortfolio', { accountId });
  const rows = [], prices = [];
  const resolved = {};
  let cash = 0, unresolved = 0;

  for (const p of (data.positions || [])) {
    const qty = tiAmount(p.quantity);
    if (p.instrumentType === 'currency') { cash += qty; continue; }
    if (!(qty > 0)) continue;

    let sec = null;
    try { sec = await tiInstrument(token, p.instrumentUid, cache); } catch { sec = null; }

    const remembered = known[p.instrumentUid];
    let ticker, name;
    if (sec && sec.ticker) {
      ticker = sec.ticker; name = sec.name || sec.ticker;
      resolved[p.instrumentUid] = { ticker, name, lot: sec.lot || 1 };
    } else if (remembered && remembered.ticker) {
      // Имя не ответило — берём выясненное раньше. Это факт, а не догадка.
      ticker = remembered.ticker; name = remembered.name || ticker;
    } else {
      ticker = (p.figi || p.instrumentUid || '').toUpperCase();
      name = ticker;
      unresolved += 1;
    }

    const price = tiAmount(p.currentPrice) + tiAmount(p.currentNkd);
    const lot = (sec && sec.lot) || (remembered && remembered.lot) || 1;
    rows.push({ ticker, name, qty, price: roundPrice(price), lot,
                uid: p.instrumentUid, kind: p.instrumentType,
                unresolved: !(sec && sec.ticker) && !(remembered && remembered.ticker) });
    if (price > 0) prices.push({ ticker, price: roundPrice(price), lot });
  }

  if (!cash) cash = tiAmount(data.totalAmountCurrencies);
  return { rows, prices, cash: Math.round(cash * 100) / 100, resolved, unresolved };
}

/**
 * ФАКТЫ ПО БУМАГАМ ОТ БРОКЕРА: выплаты, купоны, погашения.
 *
 * Нужно потому, что Мосбиржу браузер пускает не всегда, а Т-Банк — всегда.
 * Возвращает то же, что даёт разбор биржевых данных, чтобы советы и
 * денежный поток считались одинаково независимо от источника.
 *
 * Если ответ окажется не той формы, какую я жду, бумага просто не попадёт
 * в список. Выдуманная дата хуже отсутствующей.
 */
async function tiFacts(token, positions) {
  const now = new Date();
  const from = now.toISOString();
  const yearAhead = new Date(now.getTime() + 366 * 864e5).toISOString();
  const yearBack = new Date(now.getTime() - 366 * 864e5).toISOString();

  const rows = [], dividends = [];

  for (const p of positions) {
    if (!p.uid || !(p.qty > 0)) continue;
    const value = p.qty * (p.price || 0);

    if (/bond/i.test(p.kind || '')) {
      let maturity = null, nominal = 0, perYear = 0;
      try {
        const b = (await tiCall(token, 'InstrumentsService', 'BondBy',
          { idType: 'INSTRUMENT_ID_TYPE_UID', id: p.uid })).instrument;
        if (b) { maturity = b.maturityDate ? TI_DATE(b.maturityDate) : null; nominal = tiAmount(b.nominal); }
      } catch { /* без этого бумага останется без срока — так и покажем */ }

      try {
        const data = await tiCall(token, 'InstrumentsService', 'GetBondCoupons',
          { instrumentId: p.uid, from, to: yearAhead });
        for (const c of (data.events || [])) perYear += tiAmount(c.payOneBond);
      } catch { /* купоны неизвестны */ }

      const yearsLeft = maturity ? Math.max(0, (new Date(maturity) - now) / 31557600000) : null;
      // Купон облагается налогом так же, как дивиденд. Биржевой источник
      // уже отдаёт чистую сумму — здесь надо привести к тому же виду,
      // иначе один и тот же купон считался бы по-разному.
      const yearlyNet = Math.round(perYear * p.qty * 0.87);
      // Простая доходность к погашению: купон плюс разница с номиналом,
      // размазанная по оставшимся годам. Приблизительная — так и подписано.
      const price = p.price || 0;
      const ytm = price > 0 && yearsLeft > 0 && nominal > 0
        ? (perYear + (nominal - price) / yearsLeft) / price : null;

      rows.push({
        ticker: p.ticker, name: p.name, kind: 'bond', guaranteed: true,
        perYear: yearlyNet, yieldPct: value > 0 ? yearlyNet / value : 0,
        ytm: ytm != null ? Math.round(ytm * 10000) / 10000 : null,
        yearsLeft: yearsLeft != null ? Math.round(yearsLeft * 10) / 10 : null,
        maturity, repayment: nominal > 0 ? Math.round(nominal * p.qty) : null,
        detail: perYear > 0 ? `купон ${Math.round(perYear)} ₽ на бумагу в год до налога` : 'купоны неизвестны',
        approximate: true
      });
      continue;
    }

    // Акции и фонды: что заплатили за последний год и что объявлено вперёд.
    let paidBack = 0;
    try {
      const past = await tiCall(token, 'InstrumentsService', 'GetDividends',
        { instrumentId: p.uid, from: yearBack, to: from });
      for (const d of (past.dividends || [])) paidBack += tiAmount(d.dividendNet);
    } catch { /* выплат могло не быть */ }

    try {
      const next = await tiCall(token, 'InstrumentsService', 'GetDividends',
        { instrumentId: p.uid, from, to: yearAhead });
      for (const d of (next.dividends || [])) {
        const date = TI_DATE(d.lastBuyDate || d.recordDate || d.paymentDate);
        const perShare = tiAmount(d.dividendNet);
        if (!date || !(perShare > 0)) continue;
        dividends.push({
          ticker: p.ticker, name: p.name, date,
          perShare: Math.round(perShare * 100) / 100,
          net: Math.round(perShare * p.qty * 0.87)
        });
      }
    } catch { /* объявленных выплат может не быть */ }

    const yearlyNet = Math.round(paidBack * p.qty * 0.87);
    rows.push({
      ticker: p.ticker, name: p.name, kind: 'stock', guaranteed: false,
      perYear: yearlyNet, yieldPct: value > 0 ? yearlyNet / value : 0,
      detail: paidBack > 0 ? `выплачено ${Math.round(paidBack * 100) / 100} ₽ на бумагу за 12 мес` : 'выплат не было'
    });
  }

  dividends.sort((a, b) => (a.date < b.date ? -1 : 1));
  const totalNet = rows.reduce((s, r) => s + (r.perYear || 0), 0);
  const value = positions.reduce((s, p) => s + p.qty * (p.price || 0), 0);
  return {
    rows, dividends, totalNet,
    yieldOnPortfolio: value > 0 ? totalNet / value : 0,
    monthly: Math.round(totalNet / 12),
    source: 'broker'
  };
}

/** Сверка: то, что вышло из операций, против того, что показывает брокер. */
function tiReconcile(ours, theirs) {
  const mine = new Map(ours.positions.map(p => [p.ticker, p.qty]));
  const problems = [];

  for (const row of theirs.rows) {
    const have = mine.get(row.ticker);
    if (have == null) problems.push(`${row.name || row.ticker}: у брокера ${row.qty} шт, у нас нет`);
    else if (Math.abs(have - row.qty) > 0.0001) problems.push(`${row.name || row.ticker}: у брокера ${row.qty} шт, у нас ${have}`);
    mine.delete(row.ticker);
  }
  for (const [ticker, qty] of mine) if (qty > 0) problems.push(`${ticker}: у нас ${qty} шт, у брокера нет`);

  const gap = Math.round((ours.cash - theirs.cash) * 100) / 100;
  if (Math.abs(gap) > 1) problems.push(`деньги: у брокера ${theirs.cash} ₽, у нас ${ours.cash} ₽`);

  return { ok: problems.length === 0, problems, gap };
}

return {tiAccounts, tiOperations, tiPortfolio, tiFacts, tiReconcile};
})());

/* ─── data/report.js ─── */
Object.assign(SH, (function(){
/**
 * ЗАГРУЗКА ИЗ ФАЙЛА ОТЧЁТА.
 *
 * Вставка списка руками не масштабируется: при сотнях позиций это мучение.
 * Брокеры отдают отчёт таблицей — её и читаем.
 *
 * Формат заранее неизвестен и у разных брокеров разный, поэтому колонки
 * определяются по заголовкам, а не по номерам. Если чего-то не хватает —
 * говорим прямо, что не поняли, вместо догадок.
 */



/** Синонимы заголовков: у каждого брокера свои названия колонок. */
const COLUMNS = {
  name:   [/наимен/i, /бумага/i, /инструмент/i, /актив/i, /название/i, /security/i, /name/i],
  ticker: [/тикер/i, /код\s*бумаг/i, /^код$/i, /ticker/i, /symbol/i],
  isin:   [/isin/i, /регистрацион[а-яё]*\s*номер/i, /гос\.?\s*номер/i],
  qty:    [/количест/i, /^кол-?во/i, /шт\.?$/i, /остаток/i, /quantity/i, /qty/i],
  price:  [/текущ[а-яё]*\s*цена/i, /цена\s*(?:закрыт|посл)/i, /рыночн[а-яё]*\s*цена/i, /^цена$/i, /^price$/i],
  avg:    [/средн[а-яё]*\s*цена/i, /цена\s*приобрет/i, /цена\s*покупк/i, /average/i, /^avg/i],
  value:  [/стоимост/i, /оценк/i, /сумма/i, /value/i, /amount/i]
};

/** Разбор строки таблицы с учётом кавычек: «"Иванов, И.И.";100» → два поля. */
function splitRow(line, sep) {
  const out = [];
  let cur = '', inQuotes = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (ch === '"') {
      if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === sep && !inQuotes) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(s => s.trim());   // структурные кавычки сняты выше
}

/** Разделитель определяем по первой содержательной строке. */
function detectSeparator(lines) {
  const candidates = [';', '\t', ','];
  let best = ';', bestCount = 0;
  for (const sep of candidates) {
    const counts = lines.slice(0, 10).map(l => splitRow(l, sep).length);
    const median = counts.sort((a, b) => a - b)[Math.floor(counts.length / 2)] || 0;
    if (median > bestCount) { bestCount = median; best = sep; }
  }
  return { sep: best, columns: bestCount };
}

/** Поиск строки заголовков: та, где узнаётся хотя бы количество и название. */
function findHeader(rows) {
  for (let i = 0; i < Math.min(rows.length, 40); i++) {
    const cells = rows[i];
    const map = mapColumns(cells);
    if (map.qty != null && (map.name != null || map.ticker != null || map.isin != null)) {
      return { index: i, map };
    }
  }
  return null;
}

/**
 * Сопоставление колонок. Порядок проверки важен: «средняя цена» должна
 * распознаться как средняя, а не как просто «цена» — поэтому конкретные
 * признаки проверяются раньше общих.
 */
const CHECK_ORDER = ['avg', 'price', 'isin', 'ticker', 'qty', 'value', 'name'];

function mapColumns(cells) {
  const map = {}, taken = new Set();
  for (const key of CHECK_ORDER) {
    cells.forEach((cell, i) => {
      if (map[key] != null || taken.has(i) || !cell) return;
      if (COLUMNS[key].some(re => re.test(cell))) { map[key] = i; taken.add(i); }
    });
  }
  return map;
}

/** Известные ISIN. Код в отчёте бывает склеен с регистрационным номером. */
const ISIN_MAP = {
  RU0009029540: { ticker: 'SBER', name: 'Сбер' },
  RU0006944147: { ticker: 'TATNP', name: 'Татнефть-п' },
  RU0007775219: { ticker: 'MTSS', name: 'МТС' },
  RU000A109B25: { ticker: 'OZPH', name: 'Озон Фармацевтика' },
  RU000A107T19: { ticker: 'YDEX', name: 'Яндекс' },
  RU000A108X38: { ticker: 'X5', name: 'X5' },
  RU000A0JS4Z0: { ticker: 'GOLD', name: 'ВИМ — Фонд Золото' },
  RU0009024277: { ticker: 'LKOH', name: 'Лукойл' },
  RU0007661625: { ticker: 'GAZP', name: 'Газпром' },
  RU0007288411: { ticker: 'NVTK', name: 'Новатэк' },
  RU0007288411_: { ticker: 'GMKN', name: 'Норникель' }
};

function byIsin(raw) {
  if (!raw) return null;
  const m = String(raw).match(/\b([A-Z]{2}[A-Z0-9]{9}\d)\b/);
  if (!m) return null;
  const isin = m[1];
  if (ISIN_MAP[isin]) return { ...ISIN_MAP[isin], isin };

  // ОФЗ: регистрационный номер вида «26244RMFS» содержит номер выпуска
  const gov = String(raw).match(/(\d{5})RMFS/i);
  if (gov) return { ticker: `SU${gov[1]}`, name: `ОФЗ ${gov[1]}`, kind: 'bond', isin };

  return null;
}

/**
 * Чтение отчёта. Возвращает позиции и честный отчёт о том, что не разобрано.
 */
function parseReport(text) {
  const lines = String(text || '').split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) {
    return { rows: [], unknown: [], error: 'Файл пустой или не похож на таблицу' };
  }

  const { sep } = detectSeparator(lines);
  const rows = lines.map(l => splitRow(l, sep));
  const header = findHeader(rows);

  if (!header) {
    return {
      rows: [], unknown: [],
      error: 'Не нашёл колонки с количеством и названием бумаги. Проверь, что это отчёт по портфелю, а не по сделкам.'
    };
  }

  const { map } = header;
  const out = [], unknown = [];

  for (let i = header.index + 1; i < rows.length; i++) {
    const cells = rows[i];
    if (cells.length < 2) continue;

    const qty = parseNumber(cells[map.qty]);
    if (!(qty > 0)) continue;                        // итоговые строки и пустые пропускаем

    const rawName = (map.name != null ? cells[map.name] : '') || '';
    const rawTicker = (map.ticker != null ? cells[map.ticker] : '') || '';

    // Порядок: ISIN → тикер → название. ISIN однозначен и не зависит от того,
    // как брокер написал имя эмитента.
    const rawIsin = (map.isin != null ? cells[map.isin] : '') || '';
    let match = byIsin(rawIsin);
    if (!match && rawTicker && /^[A-Z0-9]{3,12}$/i.test(rawTicker.trim())) {
      match = recognize(rawTicker.trim()) || { ticker: rawTicker.trim().toUpperCase(), name: rawName || rawTicker };
    }
    if (!match) match = recognize(rawName);
    if (!match) {
      if (rawName || rawTicker) unknown.push(rawName || rawTicker);
      continue;
    }

    const price = map.price != null ? parseNumber(cells[map.price]) : null;
    const avg = map.avg != null ? parseNumber(cells[map.avg]) : null;
    const value = map.value != null ? parseNumber(cells[map.value]) : null;

    // Цены может не быть вовсе: депозитарный отчёт подтверждает права на бумаги,
    // но не их оценку. Это не повод отбрасывать позицию — количество известно,
    // а цену подтянем с биржи.
    const effectivePrice = price ?? (value != null && qty > 0 ? value / qty : null);

    out.push({
      ...match,
      qty,
      price: effectivePrice > 0 ? roundPrice(effectivePrice) : 0,
      avgPrice: avg > 0 ? roundPrice(avg) : (effectivePrice > 0 ? roundPrice(effectivePrice) : 0),
      avgPriceUnknown: !(avg > 0),
      priceUnknown: !(effectivePrice > 0),
      rawName: rawName || rawTicker
    });
  }

  return {
    rows: out,
    unknown,
    cash: findCash(rows),
    columns: Object.keys(map),
    error: out.length ? null : 'Строк с количеством не нашлось — проверь файл'
  };
}

  kind:   [/вид\s*сделки/i, /операция/i, /тип\s*операции/i, /направлен/i, /side/i],

function splitRow(line, sep) {
  // Та же реализация, что в data/report.js: удвоенная кавычка внутри

function parseDate(text) {

  const ru = s.match(/(\d{2})[.\-/](\d{2})[.\-/](\d{4})/);
  if (ru) return `${ru[3]}-${ru[2]}-${ru[1]}`;
  const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);

  }

    const price = parseNumber(c[map.price]);

    if (!(qty > 0) || !(price > 0) || !date) continue;

    const kind = map.kind != null ? tradeKind(c[map.kind]) : 'buy';
    if (!kind) continue;

    const ticker = (map.ticker != null ? c[map.ticker] : '').trim().toUpperCase();
    const name = (map.name != null ? c[map.name] : '').trim();

    // и добавляем накопленный купон, как это делает брокер.
    const currency = map.currency != null ? String(c[map.currency] || '') : '';
    const isPercent = /%/.test(currency) || /%/.test(String(c[map.price] || ''));
    const nkd = map.nkd != null ? (parseNumber(c[map.nkd]) || 0) : 0;
    const face = 1000;
    const byPercent = price / 100 * face + nkd / qty;

    // бумаг это уже рубли. Если известна сумма сделки, берём её: это реально
    // уплаченные деньги, а не восстановленные из округлённого процента.
    const gross = map.sum != null ? parseNumber(c[map.sum]) : null;
    const net = map.sumNet != null ? parseNumber(c[map.sumNet]) : null;

      type: kind,
      date,
      ticker: ticker || name.toUpperCase().slice(0, 12),
      name: name || ticker,
      qty,
      price: roundPrice(unitPrice),
      fee: map.fee != null ? (parseNumber(c[map.fee]) || 0) : 0,

      .replace(/\d{2}[.\-/]\d{2}[.\-/]\d{4}/g, ' ')

      .map(m => parseNumber(m[1])).filter(n => n != null && n > 0);

    if (!(amount > 0)) continue;

    ops.push({ type: isDeposit ? 'deposit' : 'withdraw', date, amount });
  }
  return ops;
}

/**
 * ФАКТЫ О БУМАГАХ (Московская биржа).
 *
 * Принцип: приложение оперирует тем, что можно проверить, а не оценками
 * «★★★★☆ хорошая компания». Дивиденды — реально выплаченные. Доходность
 * облигации — из её цены и купона. Всё остальное честно помечается как
 * неизвестное, а не додумывается.

const ISS = 'https://iss.moex.com/iss';

async function fetchJSON(url, timeoutMs = 8000) {
  // Та же реализация, что в data/moex.js: причина отказа важна не меньше
  // самого отказа. Раньше здесь была упрощённая версия, и одно и то же
  // молчание биржи объяснялось человеку по-разному в зависимости от того,
  // какой экран спросил.
  if (typeof navigator !== 'undefined' && navigator.onLine === false) {
    const e = new Error('нет сети'); e.reason = FAIL.OFFLINE; throw e;
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!r.ok) { const e = new Error(`HTTP ${r.status}`); e.reason = FAIL.SERVER; throw e; }
    return await r.json();
  } catch (err) {
    if (err.reason) throw err;
    if (err.name === 'AbortError') { err.reason = FAIL.TIMEOUT; throw err; }
    // При открытии файла напрямую (file://) браузер запрещает запросы наружу.
    // Ошибка сети в этом случае неотличима от отсутствия интернета — различаем по адресу.
    err.reason = (typeof location !== 'undefined' && location.protocol === 'file:')
      ? FAIL.BLOCKED : FAIL.OFFLINE;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

const col = (data, name) => {
  const i = (data.columns || []).indexOf(name);
  return row => (i >= 0 ? row[i] : null);
};

/**
 * История дивидендов по акции.
 * Возвращает выплаты и фактическую доходность к текущей цене —
 * не «обещанные проценты», а то, что компания реально платила.
 */
async function dividendHistory(ticker, currentPrice) {
  try {
    const j = await fetchJSON(`${ISS}/securities/${encodeURIComponent(ticker)}/dividends.json?iss.meta=off`);
    const d = j?.dividends;
    if (!d?.data?.length) return { payments: [], ttm: 0, yieldTtm: null, known: false };

    const getDate = col(d, 'registryclosedate');
    const getValue = col(d, 'value');
    const getCur = col(d, 'currencyid');
    const getSec = col(d, 'secid');

    // Биржа отвечает по конкретной бумаге, но проверяем принадлежность:
    // чужие выплаты в сводке — хуже, чем отсутствие данных.
    const want = String(ticker).toUpperCase();
    const payments = d.data
      .filter(r => { const s = getSec(r); return !s || String(s).toUpperCase() === want; })
      .map(r => ({ date: getDate(r), value: Number(getValue(r)) || 0, currency: getCur(r) || 'RUB' }))
      .filter(p => p.date && p.value > 0 && p.currency === 'RUB')
      .sort((a, b) => (a.date < b.date ? -1 : 1));

    const yearAgo = new Date(); yearAgo.setFullYear(yearAgo.getFullYear() - 1);
    const cutoff = yearAgo.toISOString().slice(0, 10);
    const ttm = payments.filter(p => p.date >= cutoff).reduce((s, p) => s + p.value, 0);

    // сколько лет подряд платили — важнее размера разовой выплаты
    const byYear = {};
    for (const p of payments) byYear[p.date.slice(0, 4)] = true;
    const years = Object.keys(byYear).sort();
    let streak = 0;
    const thisYear = new Date().getFullYear();
    for (let y = thisYear; y >= thisYear - 12; y--) {
      if (byYear[String(y)]) streak++;
      else if (y < thisYear) break;   // текущий год может быть ещё без выплат
    }

    return {
      payments: payments.slice(-12),
      ttm: Math.round(ttm * 100) / 100,
      yieldTtm: currentPrice > 0 ? ttm / currentPrice : null,
      lastPayment: payments[payments.length - 1] || null,
      yearsPaying: years.length,
      streak,
      known: true

    return { payments: [], ttm: 0, yieldTtm: null, known: false };

/**
 * Параметры облигации: доходность к погашению, срок, купон.
 * Считается из реальных данных выпуска, а не берётся из справочника.
 */
async function bondFacts(secId) {
  try {
    const j = await fetchJSON(`${ISS}/securities/${encodeURIComponent(secId)}.json?iss.meta=off&iss.only=description`);
    const d = j?.description;
    if (!d?.data?.length) return { known: false };

    const facts = {};
    const nameIdx = (d.columns || []).indexOf('name');
    const valIdx = (d.columns || []).indexOf('value');
    for (const row of d.data) facts[row[nameIdx]] = row[valIdx];

    const maturity = facts.MATDATE || null;
    const faceValue = Number(facts.FACEVALUE) || 1000;
    const couponValue = Number(facts.COUPONVALUE) || 0;
    const couponPeriod = Number(facts.COUPONPERIOD) || 182;
    const couponsPerYear = couponPeriod > 0 ? Math.round(365 / couponPeriod) : 2;
    const annualCoupon = couponValue * couponsPerYear;

    return {
      known: true,
      name: facts.SECNAME || facts.NAME || secId,
      maturity,
      yearsLeft: maturity ? Math.max(0, daysBetween(today(), maturity) / 365) : null,
      faceValue,
      couponValue,
      couponsPerYear,
      annualCoupon: Math.round(annualCoupon * 100) / 100,
      couponRate: faceValue > 0 ? annualCoupon / faceValue : null
    };
  } catch {
    return { known: false };
  }
}

/**
 * Доходность облигации к погашению — сколько получишь в год, если додержишь.
 * Учитывает и купоны, и разницу между ценой покупки и номиналом.
 */
function bondYieldToMaturity(cleanPrice, facts) {
  if (!facts?.known || !(cleanPrice > 0) || !facts.yearsLeft) return null;
  const { faceValue, annualCoupon, yearsLeft } = facts;
  if (yearsLeft < 0.05) return null;

  // приближение: купонный доход плюс равномерное подтягивание цены к номиналу
  const gain = (faceValue - cleanPrice) / yearsLeft;
  const avgPrice = (faceValue + cleanPrice) / 2;
  return avgPrice > 0 ? (annualCoupon + gain) / avgPrice : null;
}

/** Ближайшие дивидендные отсечки по всем бумагам портфеля. */
async function upcomingDividends(positions) {
  const out = [];
  for (const p of positions) {
    if (!(p.qty > 0)) continue;
    const hist = await dividendHistory(p.ticker, p.price);
    if (!hist.known || !hist.lastPayment) continue;

    const next = hist.payments.find(x => x.date >= today());
    if (next) {
      out.push({
        ticker: p.ticker, name: p.name, date: next.date,
        perShare: next.value,
        total: Math.round(next.value * p.qty),
        net: Math.round(next.value * p.qty * 0.87)   // минус налог 13%
      });
    }
  }
  return out.sort((a, b) => (a.date < b.date ? -1 : 1));
}

/**
 * Сводка фактов по бумаге для экрана «почему она в портфеле».
 * Ничего не выдумывает: если данных нет — так и говорит.
 */
async function securityFacts(position) {
  const isBond = /^SU\d|ОФЗ/i.test(`${position.ticker}${position.name || ''}`);

  if (isBond) {
    const facts = await bondFacts(position.moexId || position.ticker);
    if (!facts.known) return { kind: 'bond', known: false };
    const clean = position.price;   // цена уже с купоном, для оценки этого достаточно
    return {
      kind: 'bond', known: true, ...facts,
      ytm: bondYieldToMaturity(clean * 0.96, facts),
      yearlyIncome: Math.round(facts.annualCoupon * position.qty),
      netYearly: Math.round(facts.annualCoupon * position.qty * 0.87)
    };
  }

  const div = await dividendHistory(position.ticker, position.price);
  return {
    kind: 'stock',
    known: div.known,
    ...div,
    yearlyIncome: Math.round(div.ttm * position.qty),
    netYearly: Math.round(div.ttm * position.qty * 0.87)
  };
}

return {dividendHistory, bondFacts, bondYieldToMaturity, upcomingDividends, securityFacts};
})());

/**
 * Разбор одной бумаги по данным биржи, а не по оценкам.
 * Кешируется на сутки: дивидендная история меняется редко.
 */
async function explainSecurity(state, ticker) {
  const pos = state.positions.find(p => p.ticker === ticker);
  if (!pos) return null;

  const key = `facts:${ticker}`;
  const cached = await db.getMeta(key);
  if (cached && cached.date === today()) return { ...cached.data, position: pos };

  const facts = await securityFacts(pos);
  await db.setMeta(key, { date: today(), data: facts });
  return { ...facts, position: pos };
}

/** Ближайшие выплаты по всему портфелю. */
async function upcomingPayments(state) {
  const cached = await db.getMeta('upcomingDividends');
  if (cached && cached.date === today()) return cached.list;

  const list = await upcomingDividends(state.positions);
  await db.setMeta('upcomingDividends', { date: today(), list });
  return list;
}

/**
 * Денежный поток портфеля: сколько приносят бумаги.
 * Считается из фактических выплат, а не из обещанных процентов.
 */
async function cashflowSummary(state) {
  const rows = [];
  let totalNet = 0;

  for (const p of state.positions.filter(x => x.qty > 0)) {
    const f = await explainSecurity(state, p.ticker);
    if (!f || !f.known) { rows.push({ ticker: p.ticker, name: p.name, kind: 'unknown' }); continue; }

    const net = f.netYearly || 0;
    totalNet += net;
    rows.push({
      ticker: p.ticker, name: p.name,
      kind: f.kind,
      guaranteed: f.kind === 'bond',
      ytm: f.ytm || null,
      yearsLeft: f.yearsLeft || null,
      maturity: f.maturity || null,
      repayment: f.faceValue ? Math.round(f.faceValue * p.qty) : null,
      perYear: net,
      yieldPct: p.qty * p.price > 0 ? net / (p.qty * p.price) : 0,
      detail: f.kind === 'bond'
        ? `купон ${f.couponValue} ₽ × ${f.couponsPerYear} раза в год`
        : (f.ttm > 0 ? `выплачено ${f.ttm} ₽ на акцию за 12 мес` : 'выплат не было')
    });
  }

  // Средневзвешенная доходность к погашению по своим облигациям: измеренная
  // величина, которая дальше заменяет допущение в прогнозе.
  let bondValue = 0, bondWeighted = 0;
  for (const r of rows) {
    if (r.kind !== 'bond' || !(r.ytm > 0)) continue;
    const pos = state.positions.find(p => p.ticker === r.ticker);
    const v = pos ? pos.qty * pos.price : 0;
    if (v > 0) { bondValue += v; bondWeighted += v * r.ytm; }
  }

  rows.sort((a, b) => (b.perYear || 0) - (a.perYear || 0));
  return {
    rows, totalNet,
    bondYtm: bondValue > 0 ? bondWeighted / bondValue : null,
    yieldOnPortfolio: state.summary.securities > 0 ? totalNet / state.summary.securities : 0,
    monthly: Math.round(totalNet / 12)
  };
}

/** Разбор варианта покупки: что получишь, чем рискуешь, сколько брать. */
async function analyzeBuy(state, ticker, amount) {
  const pos = state.positions.find(p => p.ticker === ticker);
  const facts = pos
    ? await explainSecurity(state, ticker)
    : await securityFacts({ ticker, name: ticker, qty: 1, price: 0 });

  const gaps = whatIsNeeded(state.summary, state.targets);
  const purpose = gaps.length ? gaps[0].purpose : PURPOSE.GROWTH;

  const candidate = {
    ticker,
    name: facts?.name || pos?.name || ticker,
    // вид определяем по самой бумаге: facts.kind говорит про источник данных
    // (акция или облигация), но не различает золото и валюту
    kind: pos ? classify(pos) : facts?.kind,
    sector: pos?.sector,
    price: pos?.price || 0,
    ytm: facts?.ytm,
    yearsLeft: facts?.yearsLeft,
    annualCoupon: facts?.annualCoupon,
    yieldTtm: facts?.yieldTtm,
    streak: facts?.streak,
    ttm: facts?.ttm
  };

  return {
    ...evaluate(candidate, purpose, {
      summary: state.summary, targets: state.targets, amount, existing: state.positions
    }),
    purpose,
    facts: candidate,
    shares: candidate.price > 0 ? Math.floor(amount / candidate.price) : 0
  };
}

/** Чего не хватает портфелю прямо сейчас. */
function portfolioGaps(state) {
  return whatIsNeeded(state.summary, state.targets);
}

/**
 * История стоимости портфеля по дням.
 * Если истории мало — честно говорим об этом, а не рисуем прямую линию.
 */
async function valueChart(days = 90) {
  const points = await db.valueHistory(days);
  // На двух точках «изменение» ничего не значит: пара снимков подряд
  // легко даёт +150%, если между ними правился журнал.
  if (points.length < 7) {
    return { points: [], enough: false, note: 'История появится через несколько дней — она собирается при обновлении цен.' };
  }
  const values = points.map(p => p.value);
  const first = values[0], last = values[values.length - 1];
  return {
    points, enough: true,
    min: Math.min(...values), max: Math.max(...values),
    first, last,
    change: first > 0 ? (last - first) / first : 0,
    days: points.length
  };
}

/**
 * Рыночный контекст: индекс и ставка денежного рынка.
 * Обновляется раз в день.
 */
async function marketContext() {
  const cached = await db.getMeta('market');
  if (cached && cached.date === today()) return { ...cached.data, at: cached.at || null, stale: false };

  try {
    const pulse = await fetchMarketPulse();
    const at = Date.now();
    const data = { ...pulse, date: today() };
    await db.setMeta('market', { date: today(), at, data });
    return { ...data, at, stale: false };
  } catch {
    // Биржа не ответила. Отдаём последнее известное, но ПОМЕЧАЕМ возрастом:
    // иначе вчерашний индекс выглядит как сегодняшний, и это обман.
    return cached
      ? { ...cached.data, at: cached.at || null, stale: true }
      : { imoex: null, moneyRate: null, unavailable: true, stale: true };
  }
}

/** Что означает текущая ставка для твоего портфеля. Без прогнозов — только связь. */
function rateMeaning(rate, summary, targets) {
  if (!(rate > 0)) return null;
  const bondShare = summary.securities > 0 ? (summary.byClass.bonds || 0) / summary.securities : 0;
  const target = targets.bonds || 0;
  const high = rate >= 12;

  return {
    rate, high,
    text: high
      ? `Ставка около ${rate}% — облигации сейчас дают доход, сопоставимый с ожиданиями от акций, но с куда меньшим риском. ` +
        (bondShare < target * 0.9
          ? `У тебя их ${Math.round(bondShare * 100)}% при цели ${Math.round(target * 100)}% — добор зафиксирует высокую доходность на годы вперёд.`
          : `Твоя облигационная часть (${Math.round(bondShare * 100)}%) уже работает на этом уровне.`)
      : `Ставка около ${rate}% — невысокая. Облигации приносят меньше, зато уже купленные длинные выпуски дорожают: при снижении ставки их тело растёт.`
  };
}

/**
 * Что будет с портфелем при обвале рынка.
 * Не предсказание, а проверка устойчивости.
 */
function crashTest(state, drop = -0.30) {
  const assets = state.positions.filter(p => p.qty > 0).map(p => ({
    ...p,
    cyclical: /нефт|газ|метал|уголь|сталь|алмаз/i.test(`${p.name} ${p.sector || ''}`),
    defensiveSector: /ритейл|телеком|фарм|энерго|продукт/i.test(`${p.name} ${p.sector || ''}`)
  }));

  const r = stressTest(assets, drop);
  const reserveMonths = state.settings.monthlyExpenses > 0
    ? state.reserve / state.settings.monthlyExpenses : null;

  return {
    ...r,
    lossRub: r.before - r.after,
    softening: drop !== 0 ? 1 - (r.totalChange / drop) : 0,
    reserveMonths,
    canWait: reserveMonths != null && reserveMonths >= 3
  };
}

return {explainSecurity, upcomingPayments, cashflowSummary, analyzeBuy, portfolioGaps, valueChart, marketContext, rateMeaning, crashTest};
})());

const listeners = new Set();

/** Подписка на изменения. Интерфейс перерисовывается сам. */
function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

function notify() {
  cache = null;
  cacheSignature = '';
  for (const fn of listeners) {

  }

/** Полное состояние: операции, позиции, сводка, советы. */
async function getState() {

  // слоя (загрузка копии, вторая вкладка), устаревшее состояние покажет
  // неверные цифры. Дешёвая сверка надёжнее доверия к флагу.
  const [ops, meta] = await Promise.all([db.allOps(), db.allMeta()]);
  const signature = ops.length + ':' + (ops[ops.length - 1]?.id || '') + ':' + Object.keys(meta).length;
  if (cache && cacheSignature === signature) return cache;
  cacheSignature = signature;

    strategy: meta.strategy || 'balance',
    goal: meta.goal || { amount: 0, years: 5 },
    monthlyExpenses: meta.monthlyExpenses || 0,

    // раньше неё счёта не было.
    iisOpenDate: meta.iisOpenDate || (ops.length ? ops.map(o => o.date).sort()[0] : null),
    iisTermYears: meta.iisTermYears || 5,
    // Измеренная доходность своих облигаций к погашению. Прогноз подставит
    // её вместо допущения; протухшую (старше месяца) не берём.
    bondYtm: (meta.bondYtm && meta.bondYtm.value > 0
      && daysBetween(meta.bondYtm.date, today()) <= 31) ? meta.bondYtm.value : null,
    prices: meta.prices || {},          // последние известные цены

    assets: positions,
    cash,
    reserve: { balance: reserve, monthlyExpenses: settings.monthlyExpenses, isSet: settings.monthlyExpenses > 0 },
    goal: settings.goal,
    strategy: settings.strategy,
    settings: { monthlyContribution: settings.monthlyContribution, ndflRate: settings.ndflRate },
    contributions: ops.filter(o => o.type === OP.DEPOSIT).map(o => ({ date: o.date, type: 'deposit', amount: o.amount, technical: !!o.technical }))
  };

  cache = {
    ops, positions, cash, reserve, summary, settings, targets,
    contributions: forAdvisor.contributions,

/** Запись операции с проверкой. Возвращает описание проблемы или null. */
async function addOperation(type, fields) {
  const op = makeOp(type, fields);
  if (!op) return 'Не понял операцию — проверь числа';

  const st = await getState();
  const problem = validate(op, st.positions, st.cash);
  if (problem) return problem;

  await db.addOp(op);
  notify();
  return null;
}

async function removeOperation(id) {
  await db.deleteOp(id);
  notify();
}

/**
 * Указание средней цены покупки вручную.
 *
 * Нужно после сверки с брокером: там показана текущая цена, а не та, по которой
 * покупал. Переписываем цену в операциях этой бумаги — история остаётся,
 * но становится правдивой.
 */
async function setAveragePrice(ticker, avgPrice) {
  const price = Number(avgPrice);
  if (!(price > 0)) return 'Цена должна быть больше нуля';

  const all = await db.allOps();
  const mine = all.filter(o => o.ticker === ticker && (o.type === OP.BUY || o.type === OP.SELL));
  if (!mine.length) return 'По этой бумаге нет операций';

  const updated = mine.map(o => ({
    ...o,
    price: roundPrice(price),
    amount: Math.round(o.qty * price * 100) / 100,
    priceIsCurrent: false,                       // цена теперь известна точно
    note: o.priceIsCurrent ? 'средняя указана вручную' : o.note
  }));

  await db.addOps(updated);
  notify();
  return null;
}

async function setSetting(key, value) {
  await db.setMeta(key, value);
  notify();
}

/** Применение результатов сверки с брокером: приводим портфель к списку. */
async function applySync(changes, brokerCash) {
  const ops = [];
  const date = today();

  for (const c of changes) {
    if (c.kind === 'add') {
      // Цена из списка брокера — текущая, а не покупки. Записываем её как цену
      // сделки: другой информации нет, но помечаем операцию, чтобы приложение
      // не выдавало вычисленную «прибыль» за настоящую.
      const op = makeOp(OP.BUY, {
        ticker: c.ticker, name: c.name, qty: c.qty,
        price: c.avgPrice || c.price || 1, date,
        note: 'по сверке с брокером — цена покупки неизвестна'
      });
      // биржевой код нужен для запроса купонов: без него облигация выглядит
      // бумагой без выплат
      // Если среднюю удалось вывести из строки результата — цена покупки известна
      // точно, и прибыль можно считать честно.
      if (op) {
        if (c.avgPriceUnknown) op.priceIsCurrent = true;
        if (c.moexId) op.moexId = c.moexId;
        ops.push(op);
      }
    } else if (c.kind === 'qty') {
      const delta = c.to - c.from;
      ops.push(makeOp(delta > 0 ? OP.BUY : OP.SELL, {
        ticker: c.ticker, name: c.name, qty: Math.abs(delta),
        price: c.avgPrice || 1, date, note: 'корректировка по сверке'
      }));
    } else if (c.kind === 'gone') {
      ops.push(makeOp(OP.SELL, {
        ticker: c.ticker, name: c.name, qty: c.from,
        price: 1, date, note: 'нет у брокера — списано по сверке'
      }));
    }
  }

  const valid = ops.filter(Boolean);

  // Деньги на покупки должны откуда-то взяться: при сверке мы восстанавливаем
  // портфель, но история пополнений неизвестна. Вносим ровно столько, сколько
  // нужно, чтобы после всех покупок остаток совпал с данными брокера —
  // иначе кэш уходит в минус, а сумма расходится.
  const spent = valid.reduce((sum, o) =>
    sum + (o.type === OP.BUY ? o.amount : (o.type === OP.SELL ? -o.amount : 0)), 0);

  if (spent > 0 || Number.isFinite(brokerCash)) {
    cache = null;
    const before = (await getState()).cash;
    const targetCash = Number.isFinite(brokerCash) ? brokerCash : before;
    const need = Math.round((spent + targetCash - before) * 100) / 100;
    if (need > 0) {
      const op = makeOp(OP.DEPOSIT, { amount: need, date, note: 'внесено по сверке' });
      // Технический признак: это НЕ взнос текущего года, а восстановление истории.
      // Без него приложение засчитает сумму в базу вычета и пообещает деньги,
      // которых налоговая не вернёт.
      if (op) { op.technical = true; valid.unshift(op); }
    }
  }

  if (valid.length) await db.addOps(valid);

  // Проверяем результат и выравниваем, только если расхождение осталось.
  // Расчёт выше уже учёл нужный остаток — повторное внесение задвоило бы деньги.
  if (Number.isFinite(brokerCash)) {
    cache = null;                                  // читаем свежее состояние, а не кеш
    const st = await getState();
    const gap = Math.round((brokerCash - st.cash) * 100) / 100;
    if (Math.abs(gap) >= 1) {
      const op = makeOp(gap > 0 ? OP.DEPOSIT : OP.WITHDRAW, {
        amount: Math.abs(gap), date, note: 'выравнивание по сверке'
      });
      if (op) { op.technical = true; await db.addOp(op); }
    }
  }

  // Цена из списка брокера — рыночная. Сохраняем её как котировку: иначе после
  // указания средней цены покупки приложению нечем считать текущую стоимость.
  const quotes = {};
  for (const c of changes) {
    const px = Number(c.price ?? c.avgPrice);
    if (c.ticker && px > 0) quotes[c.ticker] = px;
  }
  if (Object.keys(quotes).length) {
    const prev = (await db.getMeta('prices')) || {};
    await db.setMeta('prices', { ...prev, ...quotes });
    await db.setMeta('lastPriceUpdate', Date.now());
  }

  await db.setMeta('lastSync', today());
  notify();
  return valid.length;
}

/** Сохранение цен, полученных с биржи. */
async function updatePrices(updates) {
  const st = await getState();
  const prices = { ...st.settings.prices };
  const lots = { ...(st.settings.lots || {}) };
  for (const u of updates) {
    prices[u.ticker] = u.price;
    if (Number(u.lot) > 0) lots[u.ticker] = Number(u.lot);
  }

  await db.setMeta('prices', prices);
  await db.setMeta('lots', lots);
  await db.setMeta('lastPriceUpdate', Date.now());

  // снимок стоимости на сегодня — для графика
  const records = updates.map(u => {
    const pos = st.positions.find(p => p.ticker === u.ticker);
    return { ticker: u.ticker, date: today(), price: u.price, value: (pos?.qty || 0) * u.price };
  });
  if (records.length) await db.savePrices(records);

  notify();
