<!-- Установка на домашний экран. Манифест и метки iOS нужны, чтобы система
     показала приложение своим: без адресной строки, с иконкой и названием.
     Пути относительные — приложение живёт в подпапке репозитория. -->

<style>
:root{
  --bg:#0b0e14; --panel:#141922; --panel2:#1a212c; --line:#232c3a; --line2:#2e3a4d;
  --text:#e8edf5; --dim:#8a97ab; --accent:#e3b765;
  --ok:#4ec99a; --warn:#e3b765; --danger:#f0776f; --info:#6aa5e0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  /* Приложение про деньги: цифры одной ширины не дёргаются при обновлении
     цен и выстраиваются в колонку без табличной вёрстки. */
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.wrap{max-width:620px;margin:0 auto;padding:18px 16px calc(92px + env(safe-area-inset-bottom))}

.hero{padding:6px 0 18px}
.hero .lbl{font-size:10.5px;letter-spacing:1.4px;color:var(--dim);text-transform:uppercase}
.hero .sum{font-size:40px;font-weight:800;letter-spacing:-1px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .sub{font-size:12.5px;color:var(--dim)}
.chip{display:inline-block;padding:3px 9px;border-radius:8px;font-size:12.5px;font-weight:700;margin-top:8px}
.chip.up{background:rgba(78,201,154,.14);color:var(--ok)}
.chip.down{background:rgba(240,119,111,.14);color:var(--danger)}

.act{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
  border-radius:16px;padding:17px;margin-bottom:12px;position:relative;overflow:hidden}
.act::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dim)}
.act.critical::before{background:var(--danger)} .act.attention::before{background:var(--warn)}
.act.info::before{background:var(--info)} .act.ok::before{background:var(--ok)}
.act .tag{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.act h2{margin:0 0 7px;font-size:18px;font-weight:750;line-height:1.3}
.act p{margin:0;font-size:13.5px;color:#c3cddb;line-height:1.6}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:12px}
.card h3{margin:0 0 12px;font-size:12px;letter-spacing:.7px;color:var(--dim);text-transform:uppercase;font-weight:700}

.bar-row{display:grid;grid-template-columns:74px 1fr 88px;align-items:center;gap:9px;font-size:13px;margin-bottom:9px}
.track{height:8px;background:#0e131b;border-radius:5px;overflow:hidden;position:relative}
.fill{height:100%;border-radius:5px;transition:width .4s}
.mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dim);opacity:.55}
.val{text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px}

.pos{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.pos:last-child{border-bottom:0}
.pos .t{font-weight:650;font-size:14px}
.pos .n{font-size:11px;color:var(--dim);margin-top:1px}
.pos .v{text-align:right;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.pos .p{font-size:11.5px;margin-top:1px}
.up{color:var(--ok)} .down{color:var(--danger)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);
  color:#1a1206;border:0;border-radius:11px;padding:11px 15px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line2)}
.btn.wide{width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(12,14,18,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;background:0;border:0;color:var(--dim);font:inherit;font-size:11px;
  padding:9px 4px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button.on{color:var(--accent)}
.tabs .ic{font-size:18px;line-height:1}

.sheet{position:fixed;inset:0;z-index:100;display:none;align-items:flex-end;background:rgba(4,8,18,.7)}
.sheet.open{display:flex}
.sheet-body{width:100%;max-height:88vh;overflow-y:auto;background:linear-gradient(180deg,var(--panel),var(--bg));
  border-radius:20px 20px 0 0;border:1px solid var(--line);padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.grip{width:38px;height:4px;background:var(--line2);border-radius:3px;margin:0 auto 14px}

input,textarea,select{width:100%;background:#0e131b;border:1px solid var(--line2);color:var(--text);
  border-radius:10px;padding:11px 12px;font:inherit;font-size:15px;margin-bottom:10px}
textarea{min-height:130px;resize:vertical;font-size:13px}
label{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}

/* Список строк вместо стопки одинаковых кнопок: у каждой строки своё имя,
   пояснение и шеврон. Так видно, что это разные вещи, а не восемь клонов. */
.rows{margin:0 -14px}
.rowitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:none;border:0;color:var(--text);font:inherit;padding:13px 14px;cursor:pointer;
  border-radius:0;transition:background .16s ease}
.rowitem+.rowitem{box-shadow:inset 0 1px 0 var(--line)}
.rowitem:active{background:rgba(255,255,255,.045)}
.rowitem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
/* Порог качества: любой управляемый элемент обязан показывать фокус —
   иначе с клавиатуры и с внешнего управления приложением не пользоваться. */
.btn:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,.nav button:focus-visible,[data-idea]:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}
.rowitem .rt{flex:1;min-width:0}
.rowitem .rt b{display:block;font-size:14px;font-weight:620;line-height:1.35}
.rowitem .rt span{display:block;font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:2px}
.chev{flex:none;width:7px;height:7px;border-right:1.6px solid var(--dim);
  border-bottom:1.6px solid var(--dim);transform:rotate(-45deg);transition:transform .22s ease}
.rowitem[aria-expanded="true"] .chev{transform:rotate(45deg)}
.dot{flex:none;width:7px;height:7px;border-radius:50%}
.fold{overflow:hidden;max-height:0;transition:max-height .28s ease}
.fold.open{max-height:420px}
/* Уважаем системную настройку целиком: человек попросил меньше движения —
   значит, никаких переходов и выездов, а не «кроме тех, что мы забыли». */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;
    animation-iteration-count:1 !important;scroll-behavior:auto !important}
}
.muted{color:var(--dim);font-size:12px;line-height:1.5}
.empty{text-align:center;padding:44px 20px}
.empty h1{font-size:24px;margin:0 0 8px}
.diff{padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.diff:last-child{border-bottom:0}
.err{color:var(--danger);font-size:13px;margin:8px 0}
</style>

<div class="wrap" id="view"><div class="empty"><h1>Штурвал</h1><p class="muted">Загрузка…</p></div></div>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="home" class="on"><span class="ic">🧭</span>Сегодня</button>
  <button data-tab="portfolio"><span class="ic">📊</span>Портфель</button>
  <button data-tab="journal"><span class="ic">📋</span>Журнал</button>
  <button data-tab="settings"><span class="ic">⚙️</span>Ещё</button>

<div class="sheet" id="sheet"><div class="sheet-body"><div class="grip"></div><div id="sheetContent"></div></div></div>

<script>
const SH = {};
const BUILD_ID = '2026-07-30am';   // сменился — журнал пересобирается начисто
var db = SH;
var reports = SH;
var store = SH;

/* ─── core/model.js ─── */
Object.assign(SH, (function(){
/**
 * ЯДРО: единая модель активов.
 *
 * Принцип: одно правило — одно место. Все свойства актива определяются здесь.
 * Именно отсутствие этого слоя породило баг «золото невидимо»: класс актива
 * проверялся в 14 местах по-разному, и часть проверок про фонды не знала.
 */

const KIND = {
  STOCK: 'stock',       // акция
  BOND: 'bond',         // облигация
  GOLD: 'gold',         // золото (фонд или металл)
  CURRENCY: 'currency', // валюта
  FUND: 'fund'          // прочий фонд
};

const HEDGE_KINDS = new Set([KIND.GOLD, KIND.CURRENCY]);
const HEDGE_PATTERN = /GOLD|GLD|SLV|CNY|USD|EUR|замещ/i;

/** Определение вида инструмента. Вызывается везде, где нужен тип. */
function classify(asset) {
  if (!asset) return KIND.STOCK;
  if (asset.kind && Object.values(KIND).includes(asset.kind)) return asset.kind;

  const text = `${asset.ticker || ''} ${asset.name || ''} ${asset.sector || ''}`;
  if (/^SU\d|ОФЗ|облигац/i.test(text)) return KIND.BOND;
  if (/золот|gold|gld/i.test(text)) return KIND.GOLD;
  if (/^(USD|EUR|CNY)RUB|юань|доллар|евро/i.test(text)) return KIND.CURRENCY;
  if (/фонд|etf|бпиф/i.test(text)) return KIND.FUND;
  return KIND.STOCK;
}

/** Защитный ли актив (растёт при падении рынка или ослаблении рубля). */
function isHedge(asset) {
  if (HEDGE_KINDS.has(classify(asset))) return true;
  return HEDGE_PATTERN.test(`${asset?.ticker || ''}${asset?.name || ''}`);
}

/** Оборонительный: облигации плюс любая защита. */
function isDefensive(asset) {
  return classify(asset) === KIND.BOND || isHedge(asset);
}

/** Класс для целевого распределения стратегии. */
function allocationClass(asset) {
  if (classify(asset) === KIND.BOND) return 'bonds';
  if (isHedge(asset)) return 'hedge';
  return 'stocks';
}

/** Стоимость позиции. Битые числа дают ноль, а не отравляют весь расчёт. */
function positionValue(asset) {
  const q = Number(asset?.qty), p = Number(asset?.price);
  return (Number.isFinite(q) && Number.isFinite(p) && q > 0 && p > 0) ? q * p : 0;
}

/** Вложено в позицию по средней цене покупки. */
function positionCost(asset) {
  const q = Number(asset?.qty), a = Number(asset?.avgPrice);
  return (Number.isFinite(q) && Number.isFinite(a) && q > 0 && a > 0) ? q * a : 0;
}

/** Округление цены: дешёвые паи требуют 4 знаков, иначе теряются рубли. */
function roundPrice(v) {
  const x = Number(v);
  if (!Number.isFinite(x) || x < 0) return 0;
  return x < 50 ? Math.round(x * 10000) / 10000 : Math.round(x * 100) / 100;
}

/** Дата по местному времени. Гринвич ночью даёт вчерашний день. */
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function daysBetween(from, to) {
  return Math.round((new Date(to) - new Date(from)) / 86400000);
}

/**
 * Число из отчёта или из текста, вставленного человеком.
 * Форматы встречаются оба: «18 730,97» с запятой-разделителем дробной части
 * и «1,919.00» с запятой-разделителем тысяч. Одна реализация на всё
 * приложение: три разных давали три разных ответа на одну строку.
 */
function parseNumber(text) {
  if (text == null) return null;
  let s = String(text).trim().replace(/[\s\u00a0\u202f]/g, '');
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');   // 1,919.00
  else s = s.replace(',', '.');
  s = s.replace(/[^\d.\-]/g, '');
  if (!s || s === '.' || s === '-') return null;
  const n = parseFloat(s);
  return Number.isFinite(n) ? n : null;
}

/**
 * Доля в процентах. Десятая доля показывается только когда она есть:
 * «25%», но «2,5%». Раньше правил было два — в советах округляли до целых,
 * в таблицах до десятых, и на одном экране одно и то же число выглядело
 * как 2% и как 2,5%.
 */
const pct = v => {
  const x = (v || 0) * 100;
  const rounded = Math.round(x * 10) / 10;
  return (Number.isInteger(rounded) ? rounded : rounded.toFixed(1).replace('.', ',')) + '%';
};

/**
 * Сектор акции по названию. Честная грубость: биржа секторов не отдаёт,
 * поэтому распознаётся по имени — и об этом говорится там, где показывается.
 * Облигации и защита секторов не имеют: их риск — другой природы.
 */
const SECTOR_PATTERNS = [
  [/сбер|втб|т-?банк|тиньк|bspb|банк\s*санкт|мкб(?![а-яё])|совкомбанк/i, 'Банки'],
  [/татнефт|лукойл|роснефт|газпром|новатэк|сургут|башнефт|нефт/i, 'Нефть и газ'],
  [/^мтс|мтс(?![а-яё])|ростелеком|таттелеком/i, 'Телеком'],
  [/яндекс|yandex|^vk|позитив|астра(?![а-яё])|софтлайн|диасофт|хэдхантер|аренадата/i, 'ИТ и интернет'],
  [/фарм|промомед|мать\s*и\s*дитя|медси/i, 'Медицина и фарма'],
  [/x5|икс\s*5|магнит|лента(?![а-яё])|фикс\s*прайс|окей|озон(?!\s*фарм)|ozon/i, 'Ритейл'],
  [/норник|гмк|северсталь|ммк(?![а-яё])|нлмк|русал|полюс|селигдар|южуралзолото|мечел|распадск|алроса|метал/i, 'Металлы и добыча'],
  [/интер\s*рао|русгидро|россети|юнипро|мосэнерго|огк|тгк|энерго/i, 'Энергетика'],
  [/фосагро|акрон|куйбышевазот/i, 'Химия и удобрения'],
  [/аэрофлот|совкомфлот|нмтп|двмп/i, 'Транспорт'],
  [/самолет|лср(?![а-яё])|эталон|^пик(?![а-яё])/i, 'Застройщики'],
  [/мосбирж|спб\s*бирж|афк|система(?![а-яё])/i, 'Финансы и холдинги']
];
function sectorOf(asset) {
  if (!asset || classify(asset) !== KIND.STOCK || isHedge(asset)) return null;
  const text = `${asset.name || ''} ${asset.ticker || ''}`;
  for (const [re, sec] of SECTOR_PATTERNS) if (re.test(text)) return sec;
  return null;
}

return {parseNumber, pct, KIND, classify, isHedge, isDefensive, allocationClass, positionValue, positionCost, roundPrice, today, daysBetween, sectorOf};
})());

/* ─── core/operations.js ─── */
Object.assign(SH, (function(){
/**
 * ОПЕРАЦИИ — источник истины.
 *
 * Ключевое отличие от прошлой версии: хранятся не остатки («57 акций по 318,64»),
 * а история сделок. Остатки, средние цены и доходность выводятся из неё.
 *
 * Почему так правильнее:
 *  · снимок не помнит, КОГДА покупал — нельзя честно посчитать доходность
 *  · нельзя отличить твой результат от движения рынка
 *  · ошибка ввода необратима: перезаписал остаток — история потеряна
 *  · нет данных для налогов (какие лоты продавать) и для отчёта за период
 *
 * Подход подсмотрен у зрелых трекеров портфелей (Ghostfolio, Portfolio Performance):
 * там это стандарт. Код не заимствован — у Ghostfolio лицензия AGPL, несовместимая
 * с личным закрытым проектом.
 */


const OP = {
  BUY: 'buy',           // покупка бумаги
  SELL: 'sell',         // продажа
  DEPOSIT: 'deposit',   // пополнение счёта
  WITHDRAW: 'withdraw', // вывод денег
  DIVIDEND: 'dividend', // дивиденд или купон
  FEE: 'fee',           // комиссия
  RESERVE: 'reserve'    // движение подушки (вне брокерского счёта)
};

/** Полный биржевой код выпуска ОФЗ по его номеру. */
function guessBondCode(number) {
  const known = { '26244': 'SU26244RMFS2', '26238': 'SU26238RMFS4', '26247': 'SU26247RMFS5',
                  '26233': 'SU26233RMFS8', '26226': 'SU26226RMFS3', '26243': 'SU26243RMFS4',
                  '26240': 'SU26240RMFS0', '26241': 'SU26241RMFS8' };
  return known[number] || `SU${number}RMFS0`;
}

let counter = 0;
const newId = () => `${Date.now().toString(36)}${(counter++).toString(36)}`;

/** Создание операции с проверкой. Возвращает null, если данные бессмысленны. */
/**
 * Дата операции к виду «2026-07-04».
 *
 * Принимает и «04.07.2026» — так её пишут люди и брокерские отчёты.
 * Отвергает мусор и даты из будущего дальше завтрашнего дня: расчёты по
 * сделке приходят следующим днём, а всё, что дальше, — опечатка. Кривая
 * дата не просто некрасива: она ломает порядок журнала, разбивку по
 * месяцам и подсчёт длины истории.
 */
function normalizeDate(value) {
  if (!value) return today();
  const s = String(value).trim();
  const ru = s.match(/^(\d{2})[.\-/](\d{2})[.\-/](\d{4})$/);
  const iso = ru ? `${ru[3]}-${ru[2]}-${ru[1]}` : (s.match(/^\d{4}-\d{2}-\d{2}$/) ? s : null);
  if (!iso) return null;

  const [y, m, d] = iso.split('-').map(Number);
  const probe = new Date(Date.UTC(y, m - 1, d));
  if (probe.getUTCFullYear() !== y || probe.getUTCMonth() !== m - 1 || probe.getUTCDate() !== d) return null;

  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  if (iso > tomorrow.toISOString().slice(0, 10)) return null;
  return iso;
}

function makeOp(type, fields = {}) {
  if (!Object.values(OP).includes(type)) return null;

  const date = normalizeDate(fields.date);
  if (!date) return null;

  const op = {
    id: fields.id || newId(),
    type,
    date,
    note: String(fields.note || '').slice(0, 120)
  };

  if (type === OP.BUY || type === OP.SELL) {
    const qty = Number(fields.qty), price = Number(fields.price);
    if (!(qty > 0) || !(price > 0) || !fields.ticker) return null;
    op.ticker = String(fields.ticker).toUpperCase();
    // Биржевой код облигации: без него не найти купоны. Для ОФЗ он выводится
    // из номера выпуска, для остального — берётся как есть.
    if (fields.moexId) op.moexId = String(fields.moexId);
    else {
      const gov = op.ticker.match(/^SU(\d{5})$/);
      if (gov) op.moexId = guessBondCode(gov[1]);
    }
    op.name = String(fields.name || op.ticker).slice(0, 80);
    op.qty = qty;
    op.price = roundPrice(price);
    op.fee = Math.max(0, Number(fields.fee) || 0);
    op.amount = Math.round((qty * op.price + (type === OP.BUY ? op.fee : -op.fee)) * 100) / 100;
  } else {
    const amount = Number(fields.amount);
    if (!Number.isFinite(amount) || amount <= 0) return null;
    op.amount = Math.round(amount * 100) / 100;
    if (fields.ticker) op.ticker = String(fields.ticker).toUpperCase();
  }

  return op;
}

/**
 * Восстановление позиций из истории операций.
 * Средняя цена считается методом скользящего среднего: продажа не меняет среднюю
 * оставшихся бумаг — это соответствует и здравому смыслу, и налоговому учёту.
 */
function rebuildPositions(ops) {
  const positions = new Map();
  const sorted = [...ops].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  for (const op of sorted) {
    if (op.type !== OP.BUY && op.type !== OP.SELL) continue;

    const p = positions.get(op.ticker) || {
      ticker: op.ticker, name: op.name, qty: 0, cost: 0,
      realized: 0, firstBuy: op.date, lastOp: op.date
    };

    if (op.type === OP.BUY) {
      p.qty += op.qty;
      p.cost += op.qty * op.price + op.fee;
    } else {
      const sellQty = Math.min(op.qty, p.qty);      // продать больше, чем есть, нельзя
      const avg = p.qty > 0 ? p.cost / p.qty : 0;
      p.realized += sellQty * (op.price - avg) - op.fee;
      p.cost -= sellQty * avg;
      p.qty -= sellQty;
      if (p.qty <= 0) { p.qty = 0; p.cost = 0; }
    }

    p.name = op.name || p.name;
    p.lastOp = op.date;
    positions.set(op.ticker, p);
  }

  return [...positions.values()].map(p => ({
    ...p,
    avgPrice: p.qty > 0 ? roundPrice(p.cost / p.qty) : 0
  }));
}

/** Остаток свободных денег на счёте, выведенный из операций. */
function rebuildCash(ops) {
  // Продажа не может дать денег за бумаги, которых не было. Считаем вместе
  // с позициями: сколько реально ушло из портфеля — за столько и начисляем.
  const held = new Map();
  const sorted = [...ops].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));

  let cash = 0;
  for (const op of sorted) {
    switch (op.type) {
      case OP.DEPOSIT:  cash += op.amount; break;
      case OP.WITHDRAW: cash -= Math.min(op.amount, Math.max(0, cash)); break;
      case OP.DIVIDEND: cash += op.amount; break;
      case OP.FEE:      cash -= op.amount; break;
      case OP.BUY:
        cash -= op.amount;
        held.set(op.ticker, (held.get(op.ticker) || 0) + op.qty);
        break;
      case OP.SELL: {
        const have = held.get(op.ticker) || 0;
        const real = Math.min(op.qty, have);          // продать больше, чем есть, нельзя
        cash += real * op.price - op.fee;
        held.set(op.ticker, have - real);
        break;
      }
    }
  }
  return Math.round(cash * 100) / 100;
}

/** Остаток подушки — она вне брокерского счёта. */
function rebuildReserve(ops) {
  let sum = 0;
  for (const op of ops) if (op.type === OP.RESERVE) sum += op.amount;
  return Math.round(sum * 100) / 100;
}

/**
 * Денежные потоки для расчёта доходности с учётом дат.
 * Внешними считаются только пополнения и выводы: покупка бумаг и дивиденды —
 * движение внутри портфеля, они не должны искажать доходность.
 */
function cashFlows(ops, currentValue) {
  const flows = [];
  for (const op of ops) {
    const time = new Date(op.date + 'T12:00:00').getTime();
    if (op.type === OP.DEPOSIT) flows.push({ time, value: -op.amount });
    if (op.type === OP.WITHDRAW) flows.push({ time, value: op.amount });
  }
  if (flows.length) flows.push({ time: Date.now(), value: currentValue });
  return flows.sort((a, b) => a.time - b.time);
}

/**
 * Взносы на ИИС за календарный год — база налогового вычета.
 *
 * Технические пополнения (созданные при сверке для восстановления истории)
 * исключаются: они не были реальными переводами на счёт в этом году,
 * и налоговая их не зачтёт.
 */
function yearContributions(ops, year = new Date().getFullYear()) {
  return ops
    .filter(o => o.type === OP.DEPOSIT && !o.technical && String(o.date).startsWith(String(year)))
    .reduce((s, o) => s + o.amount, 0);
}

/**
 * Итоги периода из журнала: что внесено, что выплачено, что съели комиссии.
 * Только записанные операции — никакой оценки стоимости: она в сводке,
 * а здесь движение денег, которое можно сверить с брокером строка в строку.
 */
function periodReport(ops, from = null, to = null) {
  const inRange = o => (!from || o.date >= from) && (!to || o.date <= to);
  const r = { deposits: 0, withdrawals: 0, dividends: 0, payouts: 0,
              fees: 0, bought: 0, buys: 0, sold: 0, sells: 0 };
  for (const o of ops) {
    if (o.type === OP.RESERVE) continue;   // подушка — вне брокерского счёта
    if (!inRange(o)) continue;
    switch (o.type) {
      case OP.DEPOSIT:  if (!o.technical) r.deposits += o.amount; break;
      case OP.WITHDRAW: r.withdrawals += o.amount; break;
      case OP.DIVIDEND: r.dividends += o.amount; r.payouts += 1; break;
      case OP.FEE:      r.fees += o.amount; break;
      case OP.BUY:      r.bought += o.amount; r.buys += 1; break;
      case OP.SELL:     r.sold += o.qty * o.price - (o.fee || 0); r.sells += 1; break;
    }
  }
  for (const k of Object.keys(r)) r[k] = Math.round(r[k] * 100) / 100;
  return r;
}

/**
 * Доходность без влияния дат взносов (TWR, «истинная взвешенная по времени»).
 *
 * Идея — из Portfolio Performance и Wealthfolio, формула общеизвестна;
 * код здесь свой: те проекты под AGPL и EPL, их исходники в это приложение
 * переносить нельзя.
 *
 * Зачем вторая цифра рядом с XIRR: XIRR отвечает «сколько заработали ТВОИ
 * деньги» и зависит от того, когда ты вносил; TWR отвечает «как сработал
 * сам портфель» — взносы из него вычищены, поэтому его честно сравнивать
 * с индексом. Снимки хранят стоимость бумаг, поэтому потоком считаются
 * покупки и продажи: они меняют стоимость, не будучи результатом.
 */
function timeWeightedReturn(points, ops = []) {
  const pts = (points || []).filter(p => p && p.date && p.value > 0)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
  if (pts.length < 7) return null;      // на паре снимков «доходность» бессмысленна

  const flowAt = new Map();
  for (const o of ops) {
    const d = String(o.date).slice(0, 10);
    if (o.type === OP.BUY) flowAt.set(d, (flowAt.get(d) || 0) + o.amount);
    else if (o.type === OP.SELL) flowAt.set(d, (flowAt.get(d) || 0) - (o.qty * o.price - (o.fee || 0)));
  }

  let chain = 1;
  for (let i = 1; i < pts.length; i++) {
    let flow = 0;
    for (const [d, sum] of flowAt) if (d > pts[i - 1].date && d <= pts[i].date) flow += sum;
    const prev = pts[i - 1].value;
    if (!(prev > 0)) continue;
    const r = (pts[i].value - flow) / prev - 1;
    // Защита от мусорного снимка: ±50% за день на портфеле из бумаг —
    // это не рынок, это сбой данных. Такой отрезок пропускаем.
    if (!isFinite(r) || Math.abs(r) > 0.5) continue;
    chain *= (1 + r);
  }

  const days = daysBetween(pts[0].date, pts[pts.length - 1].date);
  const twr = chain - 1;
  return {
    twr, days, from: pts[0].date, to: pts[pts.length - 1].date,
    // Годовые проценты на коротком отрезке — обман: 2% за месяц превращаются
    // в «27% годовых», которых никто не обещал.
    annual: days >= 180 ? Math.pow(1 + twr, 365 / days) - 1 : null
  };
}

/**
 * «Те же взносы — в индекс»: честное сравнение с рынком.
 * На каждый взнос покупаются «паи» индекса по ближайшему закрытию не раньше
 * даты взноса. Чистая функция: историю индекса приносит вызывающий.
 * Служебные пополнения от сверок — не деньги пользователя, отбрасываются.
 */
function benchmarkCompare(ops, indexPoints) {
  const points = (indexPoints || []).filter(p => p && p.date && p.close > 0)
    .sort((a, b) => (a.date < b.date ? -1 : 1));
  if (points.length < 2) return null;

  let units = 0, invested = 0, used = 0;
  for (const o of ops) {
    if (o.type !== OP.DEPOSIT || o.technical || !(o.amount > 0)) continue;
    const at = points.find(p => p.date >= String(o.date).slice(0, 10));
    if (!at) continue;                    // взнос позже всей истории — не с чем сопоставить
    units += o.amount / at.close;
    invested += o.amount;
    used += 1;
  }
  if (!(invested > 0)) return null;

  const last = points[points.length - 1];
  const value = units * last.close;
  return {
    invested: Math.round(invested),
    value: Math.round(value),
    changePct: (value - invested) / invested,
    deposits: used,
    lastDate: last.date
  };
}

/**
 * Выплаты по месяцам — последние N месяцев, включая пустые: провалы
 * между дивидендными сезонами это правда жизни, а не дефект графика.
 */
function payoutsByMonth(ops, months = 12, now = new Date()) {
  const out = [];
  const y0 = now.getFullYear(), m0 = now.getMonth();
  for (let k = months - 1; k >= 0; k--) {
    const d = new Date(y0, m0 - k, 1);
    out.push({ month: `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`, amount: 0 });
  }
  const map = new Map(out.map(x => [x.month, x]));
  for (const o of ops) {
    if (o.type !== OP.DIVIDEND) continue;
    const cell = map.get(String(o.date).slice(0, 7));
    if (cell) cell.amount = Math.round((cell.amount + o.amount) * 100) / 100;
  }
  return out;
}

/** Полученные дивиденды и купоны за период. */
function incomeReceived(ops, sinceDate) {
  return ops
    .filter(o => o.type === OP.DIVIDEND && (!sinceDate || o.date >= sinceDate))
    .reduce((s, o) => s + o.amount, 0);
}

/**
 * Настоящий результат позиции: цена ПЛЮС полученные по ней выплаты.
 *
 * Считать только по цене — обманывать себя, особенно на дивидендных бумагах:
 * в день отсечки цена падает примерно на размер дивиденда, и человек видит
 * минус там, где деньги уже пришли на счёт. Выплаты берутся из журнала, то
 * есть это факт, а не оценка.
 */
function positionResult(ops, position) {
  if (!position) return null;
  const value = positionValue(position);
  const cost = positionCost(position);
  const paid = (ops || [])
    .filter(o => o.type === OP.DIVIDEND && o.ticker === position.ticker)
    .reduce((sum, o) => sum + o.amount, 0);

  const priceDelta = value - cost;
  const total = priceDelta + paid;
  return {
    value, cost, paid,
    priceDelta, pricePct: cost > 0 ? priceDelta / cost : 0,
    total, totalPct: cost > 0 ? total / cost : 0,
    // Выплаты вытянули позицию из минуса — это стоит сказать словами,
    // потому что на экране цена всё ещё красная.
    rescued: priceDelta < 0 && total >= 0
  };
}

/** Проверка: можно ли выполнить операцию. Возвращает описание проблемы или null. */
function validate(op, positions, cash) {
  if (!op) return 'Не понял операцию';

  // Дата из будущего — почти всегда опечатка в году. Молча принять её значит
  // испортить расчёт доходности и налоговый год.
  if (op.date > today()) {
    return `Дата ${op.date.split('-').reverse().join('.')} ещё не наступила — проверь год`;
  }

  if (op.type === OP.SELL) {
    const p = positions.find(x => x.ticker === op.ticker);
    if (!p || p.qty <= 0) return `${op.ticker} нет в портфеле`;
    if (op.qty > p.qty) return `В портфеле ${p.qty} шт, продать больше нельзя`;
  }

  if (op.type === OP.BUY && op.amount > cash) {
    return `Не хватает денег: нужно ${Math.round(op.amount)} ₽, свободно ${Math.round(cash)} ₽`;
  }

  if (op.type === OP.WITHDRAW && op.amount > cash) {
    return `Свободно только ${Math.round(cash)} ₽`;
  }

  return null;
}

return {OP, makeOp, normalizeDate, rebuildPositions, rebuildCash, rebuildReserve, cashFlows, yearContributions, incomeReceived, periodReport, payoutsByMonth, benchmarkCompare, timeWeightedReturn, positionResult, validate};
})());

 * к интерфейсу или хранилищу — поэтому каждую можно проверить тестом напрямую.

/** Полная сводка по портфелю. Единственный источник всех чисел на экране. */
function summarize(assets = [], cash = 0) {

        kind: 'over', cls: high.cls, urgency: 'info',
        title: `${label[high.cls][0].toUpperCase() + label[high.cls].slice(1)}: ${(high.actual * 100).toFixed(0)}% вместо ${Math.round(high.target * 100)}%`,
        detail: `Перевес на ${Math.round(high.off * 100)} п.п. Продавать не нужно — доля выровняется сама, `
          + `когда новые взносы пойдут в другие классы.`,
        note: `Перевес возникает и просто от того, что бумага дорожает: это не ошибка, а следствие роста.`
      });
    }
  }

  // ── 3. Слишком много в одной бумаге ─────────────────────────────────
  // Только про акции: риск здесь в том, что у отдельной компании что-то
  // случится. У гособлигации риск не в этом, и пугать им — вводить в
  // заблуждение; её перевес разбирается выше как перевес класса.
  for (const p of owned) {
    if (allocationClass(p) !== 'stocks') continue;
    const w = positionValue(p) / s.securities;
    if (w > 0.25) {
      out.push({
        kind: 'concentration', urgency: w > 0.35 ? 'attention' : 'info', ticker: p.ticker,
        title: `${p.name} — ${(w * 100).toFixed(0)}% портфеля`,
        detail: `Одна компания занимает больше четверти. Плохая новость по ней ударит по портфелю `
          + `сильнее, чем по рынку.`,
        note: `Это не повод продавать: доля растёт и от того, что бумага дорожает. `
          + `Достаточно не докупать её, пока остальные подтягиваются.`
      });
    }
  }

  // ── 4. Облигации: доходность и срок — одной карточкой на бумагу ─────
  for (const r of (flow.rows || [])) {
    if (r.kind !== 'bond') continue;
    const rate = market.moneyRate ? market.moneyRate / 100 : null;
    const cheap = r.ytm && rate && r.ytm < rate - 0.01;
    const long = r.yearsLeft > 5;
    if (!cheap && !long) continue;

    // Грубая длительность: у купонной бумаги она заметно меньше срока,
    // потому что часть денег возвращается купонами по дороге.
    const y = r.ytm || 0.1;
    const duration = y > 0 ? (1 - Math.pow(1 + y, -r.yearsLeft)) / y : r.yearsLeft;

    const parts = [], notes = [];
    if (cheap) {
      parts.push(`К погашению даёт ${(r.ytm * 100).toFixed(1)}% годовых, а деньги на бирже стоят ${market.moneyRate}% — `
        + `ради текущей доходности держать смысла нет.`);
      notes.push(`Смысл может быть в другом: при снижении ставки длинная ОФЗ дорожает. Тогда она работает ценой, а не купоном.`);
    }
    if (long) {
      parts.push(`До погашения ${r.yearsLeft.toFixed(1)} лет. Каждый процент изменения ставки двигает цену `
        + `примерно на ${duration.toFixed(1)}% — вниз при росте ставки и вверх при снижении.`);
      notes.push(`Если держать до погашения, колебания цены не важны: государство вернёт номинал.`);
    }

    out.push({
      kind: 'bond', urgency: 'info', ticker: r.ticker,
      title: `${r.name}: что важно знать`,
      detail: parts.join(' '),
      note: notes.join(' ')
    });
  }

  // ── 5. Защита ───────────────────────────────────────────────────────
  const hedgeShare = share('hedge'), hedgeTarget = targets.hedge || 0;
  const hedgeNames = owned.filter(p => isHedge(p));
  if (hedgeNames.length && hedgeShare > hedgeTarget + 0.05) {
    out.push({
      kind: 'hedge', urgency: 'info', ticker: hedgeNames[0].ticker,
      title: `Защиты больше плана: ${(hedgeShare * 100).toFixed(1)}% вместо ${Math.round(hedgeTarget * 100)}%`,
      detail: `${hedgeNames.map(p => p.name).join(', ')} не приносит ни купонов, ни дивидендов — `
        + `доход только от роста цены. Сверх плана эта часть тормозит накопление.`,
      note: `Страховка нужна, но ровно в том размере, который заложен в стратегию.`
    });
  }
  if (hedgeNames.length === 0 && hedgeTarget > 0) {
    out.push({
      kind: 'hedge', urgency: 'info', ticker: null,
      title: 'Защитных активов нет совсем',
      detail: `Стратегия отводит им ${Math.round(hedgeTarget * 100)}%. Они нужны не ради доходности, `
        + `а чтобы портфель падал мягче рынка.`,
      note: `Обычно это золото: оно дорожает тогда, когда акции дешевеют — но платит только ценой.`
    });
  }

  // ── 6. Разница фактических выплат внутри акций ──────────────────────
  // Не «продай А, купи Б» — предсказаний тут нет. Только измеримое:
  // сколько бумаги одного класса заплатили за 12 месяцев и во что
  // разница обходится на твоей позиции за год.
  const payers = owned
    .map(p => ({ p, row: byTicker.get(p.ticker) }))
    .filter(x => allocationClass(x.p) === 'stocks' && x.row && x.row.yieldPct != null);
  if (payers.length >= 2) {
    const ranked = [...payers].sort((a, b) => (b.row.yieldPct || 0) - (a.row.yieldPct || 0));
    // С чем сравнивать: только с бумагой, которую действительно имеет смысл
    // держать больше. Бумага за лимитом доли отпадает — иначе приложение
    // предлагало бы наращивать то, что соседняя карточка велит не наращивать.
    const eligible = ranked.filter(x =>
      s.securities > 0 && positionValue(x.p) / s.securities <= LIMITS.singlePosition);
    const top = eligible[0], last = ranked[ranked.length - 1];
    if (top && last && top.p.ticker !== last.p.ticker) {
    const lastValue = positionValue(last.p);
    const gapPct = (top.row.yieldPct || 0) - (last.row.yieldPct || 0);
    const gapMoney = lastValue * gapPct * 0.87;
    if (gapPct > 0.04 && gapMoney > 500) {
      const rub = v => Math.round(v).toLocaleString('ru-RU') + ' ₽';
      const lastPct = ((last.row.yieldPct || 0) * 100).toFixed(1);
      const topPct = ((top.row.yieldPct || 0) * 100).toFixed(1);
      out.push({
        kind: 'yieldgap', urgency: 'info', ticker: last.p.ticker,
        title: last.row.yieldPct > 0
          ? `Разница в выплатах: ${last.p.name} ${lastPct}% против ${topPct}% у ${top.p.name}`
          : `${last.p.name} за 12 месяцев не выплатила ничего`,
        detail: `На твоей позиции в ${last.p.name} (${rub(lastValue)}) эта разница стоит `
          + `примерно ${rub(gapMoney)} в год чистыми — если бы те же деньги лежали в ${top.p.name}. `
          + `Это факт о прошлых выплатах, а не предсказание будущих.`,
        note: `Если бумага бралась ради роста цены, а не выплат — низкий дивиденд не изъян. `
          + `Перекладка — это комиссия и превращение бумажного результата в настоящий. `
          + `И высокие выплаты ${top.p.name} — решение компании, его могут урезать в любой год.`
          + ((top.row.yieldPct || 0) > 0.20
            ? ` Выплата больше 20% почти всегда разовая: обычно это особый дивиденд, который в следующем году не повторится.`
            : '')
      });
    }
    }
  }

  // ── 7. Срок облигаций против срока цели ─────────────────────────────
  // Приём пенсионных фондов (иммунизация): бумага, погашаемая до цели,
  // вернёт номинал — её итог известен заранее. Бумага длиннее цели к
  // нужному дню будет продаваться по рыночной цене, зависящей от ставки.
  const goalYears = Number(state.settings?.goal?.years) || 0;
  if (goalYears > 0) {
    for (const r of (flow.rows || [])) {
      if (r.kind !== 'bond' || !(r.yearsLeft > goalYears + 0.5)) continue;
      out.push({
        kind: 'horizon', urgency: 'info', ticker: r.ticker,
        title: `${r.name} погашается позже цели`,
        detail: `До погашения ${r.yearsLeft.toFixed(1)} лет, а до цели ${goalYears} — к нужному дню `
          + `бумагу придётся продавать по рыночной цене, и она зависит от ставки в тот момент. `
          + `Облигация, погашаемая до цели, вернула бы номинал: её итог известен заранее.`,
        note: `Это не команда продавать: при снижении ставки длинная бумага, наоборот, дороже. `
          + `Но новые облигационные взносы разумно класть в выпуски со сроком не длиннее цели.`
      });
    }
  }

  // ── 7а. Концентрация в секторе ──────────────────────────────────────
  // Разные бумаги одной отрасли падают вместе: у них общий риск.
  // Сектор определяется по названию — грубо, зато проверяемо глазами.
  const bySec = {};
  for (const p of owned) {
    if (allocationClass(p) !== 'stocks') continue;
    const sec = p.sector || sectorOf(p);
    if (!sec) continue;
    bySec[sec] = (bySec[sec] || 0) + positionValue(p);
  }
  for (const [sec, v] of Object.entries(bySec)) {
    const w = s.securities > 0 ? v / s.securities : 0;
    if (w > LIMITS.sectorMax) {
      const rub2 = x => Math.round(x).toLocaleString('ru-RU') + ' ₽';
      out.push({
        kind: 'sector', urgency: 'info', ticker: null,
        title: `Сектор «${sec}» — ${Math.round(w * 100)}% портфеля`,
        detail: `${rub2(v)} в одной отрасли при ориентире не больше ${Math.round(LIMITS.sectorMax * 100)}%. `
          + `Бумаги одного сектора падают вместе: у них общие цены, регулятор и покупатели.`,
        note: `Не повод продавать — повод направлять новые взносы в другие сектора, пока доля не разбавится. `
          + `Сектор определён по названию бумаги: если он распознан неверно, скажи об этом разработчику.`
      });
    }
  }

  // ── 8. Пульс рынка: связь с планом, а не предсказание ───────────────
  const mc = market.monthChange;
  if (mc != null && Math.abs(mc) >= 0.08) {
    const pct = Math.abs(Math.round(mc * 100));
    out.push(mc < 0 ? {
      kind: 'pulse', urgency: 'info', ticker: null,
      title: `Рынок за месяц просел на ${pct}%`,
      detail: `Для покупателя это скидка: те же бумаги дешевле, чем месяц назад. `
        + `План не меняется: взнос по расписанию, резерв не трогается.`,
      note: `Прошлое движение ничего не говорит о будущем — рынок может пойти и ниже. `
        + `Именно поэтому план не меняется ни в панику, ни в азарт. Что ты решил делать в такие дни — `
        + `записано в твоём уставе: «Ещё» → «Мой устав».`
    } : {
      kind: 'pulse', urgency: 'info', ticker: null,
      title: `Рынок за месяц вырос на ${pct}%`,
      detail: `Быстрый рост уводит доли от плана: проверь, не вышли ли классы за полосы `
        + `(5 п.п. или четверть от цели) — карточки выше скажут, если вышли.`,
      note: `Рост — не повод докупать на радостях: взнос по расписанию работает лучше догоняющих покупок.`
    });
  }

  const rank = { attention: 0, info: 1 };
  // Внутри одной срочности — смысловой порядок: сначала «что сделать»
  // (докупка, перекладка), потом «что заметить» (перевесы, концентрации,
  // выплаты), затем справки о бумагах, и контекст рынка — в самом конце.
  const kindOrder = { buy: 0, swap: 1, over: 2, hedge: 3, concentration: 4,
                      sector: 5, yieldgap: 6, bond: 7, horizon: 8, pulse: 9 };
  return out.sort((a, b) =>
    (rank[a.urgency] ?? 2) - (rank[b.urgency] ?? 2)
    || (kindOrder[a.kind] ?? 5) - (kindOrder[b.kind] ?? 5));
}


/**
 * БЛИЖАЙШИЕ СОБЫТИЯ — то, что известно заранее и что стыдно проспать.
 *
 * Сюда попадает только календарь: отсечки по дивидендам, погашения облигаций,
 * последний день пополнить счёт ради вычета, окончание минимального срока ИИС.
 * Никаких «пора покупать»: угадывать момент входа приложение не умеет
 * и делать вид не будет.
 */
function upcomingEvents(state, dividends = [], flow = { rows: [] }, limit = 6) {
  const now = today();
  const days = date => Math.round(daysBetween(now, date));
  const out = [];

  for (const d of dividends) {
    if (!d.date || d.date < now) continue;
    out.push({
      kind: 'dividend', date: d.date, ticker: d.ticker,
      title: `${d.name || d.ticker}: отсечка по дивидендам`,
      detail: `${Math.round(d.net).toLocaleString('ru-RU')} ₽ чистыми с твоих бумаг. `
        + `Чтобы получить выплату, бумага должна быть в портфеле в этот день.`
    });
  }

  for (const r of (flow.rows || [])) {
    if (r.kind !== 'bond' || !r.maturity || r.maturity < now) continue;
    out.push({
      kind: 'maturity', date: r.maturity, ticker: r.ticker,
      title: `${r.name}: погашение`,
      detail: r.repayment
        ? `Государство вернёт ${r.repayment.toLocaleString('ru-RU')} ₽ номинала — деньги окажутся `
          + `на счёте свободными, и их надо будет куда-то деть.`
        : `Номинал вернётся на счёт свободными деньгами.`
    });
  }

  // Вычет считается по календарному году: не внёс до 31 декабря — год потерян.
  const tax = taxDeduction(state);
  if (tax.room > 0) {
    const lastDay = `${tax.year}-12-31`;
    if (lastDay >= now) out.push({
      kind: 'tax', date: lastDay,
      title: 'Последний день пополнить счёт ради вычета',
      detail: `За ${tax.year} внесено ${Math.round(tax.paid).toLocaleString('ru-RU')} ₽. `
        + `До лимита остаётся ${Math.round(tax.room).toLocaleString('ru-RU')} ₽ — это ещё `
        + `${Math.round(tax.extraIfFilled).toLocaleString('ru-RU')} ₽ возврата. `
        + `Взнос 1 января засчитается уже в следующий год.`
    });
  }

  const opened = state.settings?.iisOpenDate;
  const term = Number(state.settings?.iisTermYears) || 5;
  if (opened) {
    const end = new Date(opened);
    end.setFullYear(end.getFullYear() + term);
    const date = end.toISOString().slice(0, 10);
    if (date >= now) out.push({
      kind: 'iis', date,
      title: 'Заканчивается минимальный срок ИИС',
      detail: `Счёт открыт ${String(opened).split('-').reverse().join('.')}. До этой даты закрытие `
        + `означает возврат полученных вычетов. Срок взят из настроек — правила по ИИС менялись, `
        + `сверься с брокером.`
    });
  }

  return out
    .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0))
    .slice(0, limit)
    .map(e => ({ ...e, daysLeft: days(e.date) }));
}

/**
 * КАКОЙ СТРАТЕГИИ ДЕРЖАТЬСЯ.
 *
 * Решает не вкус, а срок: чем ближе цель, тем меньше времени пересидеть
 * просадку. Поэтому подсказка выводится из горизонта и состояния резерва,
 * а не из ощущений рынка.
 */
function suggestStrategy(state) {
  const years = Number(state.settings?.goal?.years) || 0;
  const expenses = Number(state.settings?.monthlyExpenses) || 0;
  const reserve = Number(state.reserve) || 0;
  if (!years) return null;

  const months = expenses > 0 ? reserve / expenses : null;
  const thin = months != null && months < 3;

  const key = years >= 7 ? 'growth' : years >= 3 ? 'balance' : 'defend';
  const current = state.settings?.strategy;

  // Горизонт до года — особый случай: рынок не успевает компенсировать
  // просадку, и честная задача — сохранить, а не вырастить. Единственный
  // почти гарантированный годовой результат — облигация, погашаемая до цели.
  const finalKey = years < 1 ? 'preserve' : key;

  const why = years < 1
    ? `До цели меньше года. Почти гарантированный результат на этом сроке дают только облигации, погашаемые до цели: их номинал вернут в известный день. Всё остальное на годовом отрезке — везение, а не стратегия.`
    : years >= 7
    ? `До цели ${years} лет — просадку есть чем пересидеть, поэтому доля акций может быть высокой.`
    : years >= 3
      ? `До цели ${years} лет. Времени на восстановление после обвала хватает, но впритык — половинчатая доля защиты уместна.`
      : `До цели меньше трёх лет. Обвал на этом сроке восстановиться не успеет, поэтому сохранность важнее роста.`;

  const caution = thin
    ? `Резерва хватает на ${months.toFixed(1)} мес вместо трёх. Пока он не собран, любая стратегия рискованна: `
      + `непредвиденный расход заставит продавать бумаги в неподходящий момент. Резерв важнее выбора стратегии.`
    : null;

  // Смена стратегии по мере приближения цели готовится заранее и взносами —
  // так работает «скользящая» траектория фондов с целевой датой: доли
  // смещаются пополнениями, без комиссий и фиксации результата разом.
  const ahead = years > 3 && years <= 4 ? { edge: 3, to: 'defend' }
              : years > 7 && years <= 8 ? { edge: 7, to: 'balance' } : null;
  const transition = ahead
    ? `Меньше чем через год горизонт станет короче ${ahead.edge === 3 ? 'трёх' : 'семи'} лет и подсказка сменится на `
      + `«${STRATEGIES[ahead.to].name}». Готовься заранее: новые взносы — в ${ahead.to === 'defend' ? 'облигации' : 'облигации и защиту'}, `
      + `тогда доли сместятся сами, без распродажи, комиссий и фиксации результата.`
    : null;

  return { key: finalKey, why, caution, transition, matches: finalKey === current };
}

function drift(summary, targets) {
  if (!summary.securities) return 0;
  let d = 0;
  for (const key of Object.keys(targets)) {
    const actual = (summary.byClass[key] || 0) / summary.securities;
    d += Math.abs(actual - (targets[key] || 0));
  }
  return d / 2;
}

/**
 * План размещения новых денег.
 * Приоритет — по СТЕПЕНИ недобора, а не по абсолютному разрыву: класс вдвое
 * ниже цели важнее того, что почти на месте. Сумма ограничена реальным
 * разрывом, чтобы не перебросить класс через цель.
 */
function allocate(amount, summary, targets) {
  if (!(amount > 0) || !(summary.securities > 0)) return [];

  const future = summary.securities + amount;
  const gap = {}, weighted = {};
  let weightedSum = 0;

  for (const key of Object.keys(targets)) {
    const current = summary.byClass[key] || 0;
    const g = Math.max(0, future * targets[key] - current);
    gap[key] = g;

    const fill = targets[key] > 0
      ? Math.min(1, (current / summary.securities) / targets[key])
      : 1;
    const boost = fill < 0.5 ? 2 : (fill < 0.8 ? 1.4 : 1);
    weighted[key] = g * boost;
    weightedSum += weighted[key];
  }

  if (weightedSum <= 0) return [];

  const k = Math.min(1, amount / weightedSum);
  const result = {};
  let assigned = 0;
  for (const key of Object.keys(targets)) {
    result[key] = Math.min(Math.round(weighted[key] * k), Math.round(gap[key]));
    assigned += result[key];
  }

  // остаток раздаём по незакрытым разрывам
  let rest = Math.round(amount) - assigned;
  if (rest > 0) {
    const room = {}; let roomSum = 0;
    for (const key of Object.keys(targets)) {
      room[key] = Math.max(0, Math.round(gap[key]) - result[key]);
      roomSum += room[key];
    }
    if (roomSum > 0) {
      for (const key of Object.keys(targets)) {
        result[key] += Math.min(Math.round(rest * room[key] / roomSum), room[key]);
      }
    }
  }

  return Object.entries(result)
    .filter(([, sum]) => sum >= 100)
    .map(([cls, sum]) => ({
      cls, sum,
      currentShare: (summary.byClass[cls] || 0) / summary.securities,
      targetShare: targets[cls]
    }))
    .sort((a, b) => b.sum - a.sum);
}

/** Доходность с учётом дат вложений (XIRR). null — если посчитать нельзя. */
function xirr(flows) {
  if (!Array.isArray(flows) || flows.length < 2) return null;
  let neg = 0, pos = 0;
  for (const f of flows) {
    const v = Number(f.value);
    if (!Number.isFinite(v)) return null;
    if (v < 0) neg += -v; else pos += v;
  }
  if (neg < 1 || pos < 1) return null;

  const t0 = flows[0].time, YEAR = 365.25 * 86400000;
  const npv = r => flows.reduce((s, f) =>
    s + f.value / Math.pow(1 + r, (f.time - t0) / YEAR), 0);

  let lo = -0.95, hi = 9, flo = npv(lo), fhi = npv(hi);
  if (!Number.isFinite(flo) || !Number.isFinite(fhi) || flo * fhi > 0) return null;

  for (let i = 0; i < 200; i++) {
    const mid = (lo + hi) / 2, fm = npv(mid);
    if (!Number.isFinite(fm)) return null;
    if (Math.abs(fm) < 1e-7) return mid;
    if (flo * fm < 0) { hi = mid; fhi = fm; } else { lo = mid; flo = fm; }
  }
  return (lo + hi) / 2;
}

/** Симуляция обвала рынка с учётом характера каждой бумаги. */
function stressTest(assets, marketDrop = -0.30) {
  const beta = a => {
    if (isHedge(a)) return -0.5;                    // золото растёт в кризис
    if (classify(a) === KIND.BOND) return 0.15;     // облигации почти не двигаются
    return a.cyclical ? 1.4 : (a.defensiveSector ? 0.6 : 1.0);
  };

  let before = 0, after = 0;
  const items = [];
  for (const a of assets.filter(x => Number(x?.qty) > 0)) {
    const v = positionValue(a);
    const change = marketDrop * beta(a);
    before += v;
    after += v * (1 + change);
    items.push({ ticker: a.ticker, value: v, change, delta: v * change });
  }
  return {
    before, after,
    totalChange: before > 0 ? (after - before) / before : 0,
    marketDrop, items: items.sort((x, y) => x.delta - y.delta)
  };
}

/**
 * Куда положить ближайший взнос — с точностью до бумаги и рубля.
 * Сумма делится между классами по степени недобора (allocate), внутри
 * класса называется бумага с наибольшей фактической доходностью из уже
 * имеющихся. Новых имён приложение не выдумывает: подбор новой бумаги —
 * отдельный осознанный шаг, а не строка в плане.
 */
/**
 * Зачем бумага в портфеле — роль словами и числами. Роль не мнение:
 * она следует из вида бумаги и её фактических выплат. Если у бумаги
 * нет внятной роли, ей честно говорится об этом.
 */
function positionRole(state, pos, row = null) {
  const cls = allocationClass(pos);
  const share = state.summary?.securities > 0 ? positionValue(pos) / state.summary.securities : 0;
  const sharePct = Math.round(share * 100);
  const caution = share > 0.25
    ? `Доля ${sharePct}% — выше лимита 25% из устава: просадка одной бумаги ударит по всему портфелю. Новые взносы — в другие имена.`
    : null;

  if (cls === 'hedge') return { role: 'Защита', cls, share, caution,
    text: `Дорожает тогда, когда акции дешевеют, — её работа смягчать обвал, а не приносить доход: `
      + `выплат не даёт. В стресс-тесте «рынок −30%» эта часть прибавляет около 15%.` };

  if (cls === 'bonds') return { role: 'Предсказуемый доход', cls, share, caution,
    text: `Купон известен заранее и не может быть отменён`
      + (row?.ytm ? `; к погашению даёт ${(row.ytm * 100).toFixed(1)}% годовых` : '')
      + `. Якорь портфеля: держит стоимость, когда акции штормит, и платит независимо от настроения рынка.` };

  if (row && row.yieldPct > 0.02) return { role: 'Доход и рост', cls, share, caution,
    text: `Платит ${(row.yieldPct * 100).toFixed(1)}% фактических выплат — кирпич твоей будущей `
      + `«пенсии с акций» — и участвует в росте бизнеса. Двойная работа: за это акции и держат.` };

  return { role: 'Ставка на рост', cls, share, caution,
    text: `Заметных выплат нет — весь расчёт на рост цены. Такая бумага заслуживает место, `
      + `пока жив ответ «почему этот бизнес будет дороже». Проверяй его при годовом пересмотре по уставу; `
      + `нет ответа — нет и места.` };
}

/**
 * Взнос на текущий месяц. Разовая правка («в этом месяце вношу больше»)
 * сильнее базового плана, но живёт ровно один месяц: со сменой месяца
 * возвращается база — иначе разовое решение тихо стало бы постоянным.
 */
function plannedContribution(state, now = new Date()) {
  const base = Number(state.settings?.monthlyContribution) || 0;
  const ym = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
  const o = state.settings?.plannedThisMonth;
  if (o && o.month === ym && Number(o.amount) > 0) {
    return { amount: Number(o.amount), base, overridden: true, month: ym };
  }
  return { amount: base, base, overridden: false, month: ym };
}

function contributionPlan(state, flow = { rows: [] }, amountOpt = null) {
  const s = state.summary, targets = state.targets || {};
  const amount = Number(amountOpt) > 0 ? Number(amountOpt) : plannedContribution(state).amount;
  if (!s || !(s.securities > 0) || !(amount > 0)) return null;

  const split = allocate(amount, s, targets);
  if (!split.length) return null;

  const byTicker = new Map((flow.rows || []).map(r => [r.ticker, r]));
  const owned = state.positions.filter(p => p.qty > 0);

  // Веса секторов до взноса — чтобы не загонять деньги в перегруженную отрасль.
  const sectorValue = {};
  for (const p of owned) {
    if (allocationClass(p) !== 'stocks') continue;
    const sec = p.sector || sectorOf(p);
    if (sec) sectorValue[sec] = (sectorValue[sec] || 0) + positionValue(p);
  }
  const totalAfter = s.securities + amount;

  const steps = split.map(part => {
    const inClass = owned.filter(p => allocationClass(p) === part.cls);
    const byYield = [...inClass].sort((a, b) => {
      const ra = byTicker.get(a.ticker), rb = byTicker.get(b.ticker);
      return (rb?.ytm ?? rb?.yieldPct ?? 0) - (ra?.ytm ?? ra?.yieldPct ?? 0);
    });

    // Доходность — не единственное правило. Докупать бумагу, которая после
    // покупки перевалит за лимит доли (или добьёт сектор), нельзя: иначе
    // приложение противоречило бы собственному совету «не докупай её».
    const okAfter = p => {
      const after = (positionValue(p) + part.sum) / totalAfter;
      if (after > LIMITS.singlePosition) return false;
      if (part.cls === 'stocks') {
        const sec = p.sector || sectorOf(p);
        if (sec && ((sectorValue[sec] || 0) + part.sum) / totalAfter > LIMITS.sectorMax) return false;
      }
      return true;
    };
    // Бумага, которая УЖЕ за лимитом, исключается всегда: доливать в неё —
    // прямое противоречие совету «не докупай её».
    const notOverYet = p => positionValue(p) / s.securities <= LIMITS.singlePosition;

    // Сначала те, кто и после покупки останется в пределах. Если таких нет
    // (в маленьком портфеле любая покупка — большая доля), берём лучшую из
    // тех, кто хотя бы не перегружен сейчас: иначе портфель не смог бы расти.
    const allowed = byYield.filter(p => notOverYet(p) && okAfter(p));
    const fallback = byYield.filter(notOverYet);

    const pick = allowed[0] || fallback[0] || null;
    const blocked = !pick && byYield.length > 0;

    // Покупают лотами: у Сбера в лоте 10 акций, и «111 штук» купить нельзя.
    // Считаем целые лоты и честно показываем остаток, который не потратится.
    const lotSize = pick ? (Number(state.settings?.lots?.[pick.ticker]) || 1) : 1;
    const lotPrice = pick && pick.price > 0 ? pick.price * lotSize : 0;
    const wholeLots = lotPrice > 0 ? Math.floor(part.sum / lotPrice) : null;
    const lots = wholeLots != null ? wholeLots * lotSize : null;   // штук всего
    const spent = wholeLots != null ? wholeLots * lotPrice : 0;

    return { cls: part.cls, amount: Math.round(part.sum),
             ticker: pick ? pick.ticker : null, name: pick ? pick.name : null,
             price: pick ? pick.price : null, lots,
             lotSize, wholeLots, leftover: pick ? Math.round(part.sum - spent) : 0,
             // Причина молчания важнее молчания: человек должен понимать,
             // почему бумага не названа.
             blocked, blockReason: blocked
               ? `Все бумаги этого класса уже у предела доли (${Math.round(LIMITS.singlePosition * 100)}% на бумагу, `
                 + `${Math.round(LIMITS.sectorMax * 100)}% на сектор) — докупать их значит усиливать перекос. Нужна новая бумага.`
               : null };
  });
  return { amount, steps };
}

return {rebalancePlan, upcomingEvents, suggestStrategy, summarize, drift, allocate, xirr, stressTest, contributionPlan, plannedContribution, positionRole};
})());

  sectorMax: 0.35,        // максимум в одном секторе

function primaryAction(state, summary) {

        : `Недобор на ${Math.round((worst.target - worst.actual) * 100)} п.п. Это ${worst.actual < worst.target * 0.5 ? 'существенно' : 'заметно'} ниже плана — направь туда ближайшие покупки.`,

  for (const [cls, target] of Object.entries(targets)) {

    if (abs > LIMITS.rebalanceAbs || rel > LIMITS.rebalanceRel) {
      out.push({ cls, actual, target, abs, rel });
    }
  }
  return out.sort((a, b) => b.rel - a.rel);
}

  const goal = state.settings?.goal || {};
  const monthly = Number(state.settings?.monthlyContribution) || 0;
  const expenses = Number(state.settings?.monthlyExpenses) || 0;
  const opened = state.settings?.iisOpenDate;
  let termDate = null;
  if (opened && /^\d{4}-\d{2}-\d{2}/.test(String(opened))) {
    const years = Number(state.settings?.iisTermYears) || 5;
    termDate = `${Number(opened.slice(0, 4)) + years}${opened.slice(4, 10)}`;
  }

  const out = [];
  out.push({ title: 'Цель', text: goal.amount > 0
    ? `${money(goal.amount)}${goal.years ? ` через ${goal.years} лет` : ''}. Всё остальное в этом уставе служит ей.`
    : 'Не задана. Задай её в настройках — без цели половина правил повисает в воздухе.' });
  out.push({ title: 'Доли', text: `Стратегия «${strat.name}»: акции ${Math.round(t.stocks * 100)}%, `
    + `облигации ${Math.round(t.bonds * 100)}%, защита ${Math.round(t.hedge * 100)}%.` });
  out.push({ title: 'Ребалансировка', text: `По правилу 5/25: класс возвращается к цели, когда ушёл на `
    + `${Math.round(LIMITS.rebalanceAbs * 100)} п.п. или на четверть от целевой доли. `
    + `В первую очередь — новыми взносами; продажа — крайний случай.` });
  out.push({ title: 'Лимиты риска', text: `Не больше ${Math.round(LIMITS.singlePosition * 100)}% в одной бумаге `
    + `и ${Math.round(LIMITS.sectorMax * 100)}% в одном секторе. Облигации — со сроком не длиннее цели.` });
  out.push({ title: 'Взнос', text: monthly > 0
    ? `${money(monthly)} в месяц, по расписанию, независимо от новостей и настроения рынка.`
    : 'Размер не задан. Регулярность важнее размера — задай посильный.' });
  out.push({ title: 'Резерв', text: expenses > 0
    ? `${money(expenses * LIMITS.reserveMonths)} — ${LIMITS.reserveMonths} месяца расходов, отдельно от портфеля. Пока не собран, он важнее инвестиций.`
    : 'Расходы не заданы — размер резерва не посчитать.' });
  out.push({ title: 'При обвале', text: 'План не меняется. Взнос по расписанию — упавшие цены это скидка. '
    + 'Резерв не трогается. Ничего не продаётся в день новости: любое решение о продаже — только по правилам выше и на холодную голову.' });
  if (termDate) out.push({ title: 'Срок ИИС', text: `Счёт держится минимум до ${termDate.split('-').reverse().join('.')}. `
    + `Досрочное закрытие — возврат вычетов и потеря льготы.` });
  out.push({ title: 'Пересмотр', text: 'Раз в год или при перемене жизни: доход, семья, сама цель. '
    + 'Движение рынка — не повод менять устав.' });
  return out;
}

/**
 * Что купить: пересечение отбора с тем, чего портфелю не хватает.
 * Никаких предсказаний роста — только недобор класса и измеримые данные
 * бумаги. Если класс уже с перевесом, честно говорится, что покупать
 * его сейчас незачем, вместо услужливой пятёрки «идей».
 */
function buyRecommendations(state, screenerResults, limit = 5) {
  const rows = (screenerResults || []).filter(r => r && r.ticker);
  if (!rows.length) return { need: null, items: [], note: 'Отбор ничего не вернул — смягчи условия.' };

  const s = state.summary, targets = state.targets || {};
  const need = [];
  if (s && s.securities > 0) {
    for (const cls of ['stocks', 'bonds', 'hedge']) {
      const now = (s.byClass?.[cls] || 0) / s.securities;
      const gap = (targets[cls] || 0) - now;
      if (gap > 0.02) need.push({ cls, gap, sum: Math.round(gap * s.securities) });
    }
    need.sort((a, b) => b.gap - a.gap);
  }
  const wantClass = need.length ? need[0].cls : null;
  const kindOf = r => (r.kind === 'bond' ? 'bonds' : 'stocks');

  let items = rows;
  let note;
  if (wantClass === 'hedge') {
    note = 'Сильнее всего не хватает защитных активов — а их отбор по выплатам не ищет: у золота выплат нет. '
      + 'Смотри фонды на золото отдельно; ниже — лучшее из того, что нашлось по твоим условиям.';
  } else if (wantClass) {
    const matching = rows.filter(r => kindOf(r) === wantClass);
    if (matching.length) {
      items = matching;
      note = `Сильнее всего не хватает: ${classLabel(wantClass)} — около ${need[0].sum.toLocaleString('ru-RU')} \u20bd до плана. `
        + 'Показаны бумаги этого класса.';
    } else {
      note = `До плана не хватает ${classLabel(wantClass)}, но по твоим условиям таких бумаг не нашлось — `
        + 'ниже остальное, что подошло.';
    }
  } else {
    note = 'Доли уже близки к плану — срочной нужды покупать что-то определённое нет. '
      + 'Ниже просто то, что лучше подходит портфелю по измеримым признакам.';
  }

  return {
    need: need[0] || null,
    // Сортировка обязательна ещё раз: списки классов сливались, и порядок
    // из отдельных отборов здесь уже ничего не значит.
    items: [...items].sort((a, b) => (b.score || 0) - (a.score || 0)).slice(0, limit),
    note,
    disclaimer: 'Это не прогноз роста. Это данные о прошлых выплатах, доходности к погашению и сроках. '
      + 'Будущие доходы и цены неизвестны.'
  };
}

/**
 * ЧТО ПОМЕНЯТЬ: сравнение своих бумаг с рынком по измеримому.
 *
 * Твёрдое правило: замена предлагается ТОЛЬКО там, где выгода известна
 * заранее, а не предполагается. Для облигаций это доходность к погашению —
 * величина договорная. Для акций — фактические выплаты за 12 месяцев;
 * это прошлое, поэтому такая идея подаётся как наблюдение с оговорками,
 * а не как указание. Роста цены здесь нет вообще: его никто не знает.
 *
 * Из выгоды всегда вычитается цена вопроса — комиссии за продажу и покупку.
 */
function replacementIdeas(state, candidates = [], opts = {}) {
  const owned = (state.positions || []).filter(p => p.qty > 0);
  const fee = Number(state.settings?.brokerFee) || 0.0004;
  const goalYears = Number(state.settings?.goal?.years) || 0;
  const ndfl = Number(state.settings?.ndflRate) || 0.13;
  const ownedTickers = new Set(owned.map(p => p.ticker));
  // Пороги смысла. Замена — это сделка, комиссии, налоговые последствия и
  // новый, менее знакомый эмитент. Ради двухсот рублей в год этого не делают,
  // поэтому мелкие разницы не показываются вовсе: совет, который не стоит
  // исполнения, хуже молчания.
  const MIN_GAIN_RUB = 500;          // меньше — не окупает хлопот
  const MIN_YTM_GAP = 0.015;         // 1,5 п.п. по облигациям
  const MIN_YIELD_GAP = 0.04;        // 4 п.п. по выплатам акций

  // Доли секторов ПОСЛЕ гипотетической замены: выгодная бумага бесполезна,
  // если она загоняет портфель в один сектор. Считаем текущие веса заранее.
  const totalValue = owned.reduce((a, p) => a + positionValue(p), 0);
  const sectorValue = {};
  for (const p of owned) {
    if (allocationClass(p) !== 'stocks') continue;
    const sec = p.sector || sectorOf(p);
    if (sec) sectorValue[sec] = (sectorValue[sec] || 0) + positionValue(p);
  }
  const byTicker = new Map((opts.facts || []).map(f => [f.ticker, f]));
  const out = [];

  for (const p of owned) {
    const cls = allocationClass(p);
    if (cls === 'hedge') continue;              // защита нужна не ради дохода
    const value = positionValue(p);
    if (!(value > 1000)) continue;              // мелочь менять дороже, чем держать
    const mine = byTicker.get(p.ticker) || {};
    const cost = value * fee * 2;               // продать и купить

    let best = null;
    for (const c of candidates) {
      if (ownedTickers.has(c.ticker)) continue;
      if ((c.kind === 'bond' ? 'bonds' : 'stocks') !== cls) continue;

      if (cls === 'bonds') {
        if (!(c.ytm > 0) || !(mine.ytm > 0)) continue;
        if (c.ytm - mine.ytm < MIN_YTM_GAP) continue;
        // С офертой раньше цели «доходность к погашению» — обещание, которое
        // может не дожить до срока. Такую замену не предлагаем вовсе:
        // выгода в ней недостоверна, а совет обязан опираться на известное.
        if (c.yearsToOffer > 0 && c.yearsLeft > c.yearsToOffer + 0.1) continue;
        const gain = value * (c.ytm - mine.ytm);
        // Срок не длиннее цели — иначе к нужному дню придётся продавать по рынку
        const fitsGoal = !goalYears || !(c.yearsLeft > goalYears + 0.5);
        if (!fitsGoal || gain < MIN_GAIN_RUB || gain <= cost * 3) continue;
        if (!best || gain > best.gain) best = { c, gain, kind: 'bonds' };
      } else {
        if (!(c.yieldPct > 0) || mine.yieldPct == null) continue;
        if ((c.streak || 0) < 3) continue;      // разовая щедрость не повод меняться
        if (c.yieldPct - mine.yieldPct < MIN_YIELD_GAP) continue;
        // Куда переложим — туда добавится вес; откуда — оттуда уйдёт.
        const secTo = c.sector || sectorOf({ ticker: c.ticker, name: c.name, kind: 'stock' });
        const secFrom = p.sector || sectorOf(p);
        if (secTo && totalValue > 0) {
          const after = ((sectorValue[secTo] || 0) + value - (secFrom === secTo ? value : 0)) / totalValue;
          const fromShare = secFrom ? (sectorValue[secFrom] || 0) / totalValue : 0;
          // Запрещаем только УХУДШЕНИЕ: если сектор и так перегружен ровно
          // этой же бумагой, переход в другую отрасль концентрацию не
          // усиливает — а вот доливать в отрасль, где и без того перебор,
          // нельзя, какой бы выгодной ни выглядела бумага.
          if (after > LIMITS.sectorMax && after > fromShare + 1e-9) continue;
        }
        const gain = value * (c.yieldPct - mine.yieldPct) * (1 - ndfl);
        if (gain < MIN_GAIN_RUB || gain <= cost * 3) continue;
        if (!best || gain > best.gain) best = { c, gain, kind: 'stocks' };
      }
    }
    if (!best) continue;

    const rub = v => Math.round(v).toLocaleString('ru-RU') + ' \u20bd';
    const payback = best.gain > 0 ? cost / best.gain * 12 : null;
    out.push(best.kind === 'bonds' ? {
      kind: 'replace', cls, from: p.ticker, to: best.c.ticker, gain: best.gain, cost,
      title: `${p.name} → ${best.c.name}`,
      detail: `${(mine.ytm * 100).toFixed(1)}% против ${(best.c.ytm * 100).toFixed(1)}% к погашению. `
        + `На твоей позиции в ${rub(value)} разница даёт около ${rub(best.gain)} в год; `
        + `комиссии за обмен — примерно ${rub(cost)}, они окупятся за ${payback < 1 ? 'меньше месяца' : `${Math.round(payback)} мес`}.`
        + (best.c.yearsLeft ? ` Погашение через ${best.c.yearsLeft} лет${goalYears ? ` — до твоей цели` : ''}.` : ''),
      note: `Доходность к погашению — величина договорная, но реализуется только при удержании до конца срока. `
        + `Продажа фиксирует текущий результат по бумаге: если она в минусе, убыток станет настоящим, `
        + `а на ИИС он не уменьшит налоги по другим счетам.`
    } : {
      kind: 'replace', cls, from: p.ticker, to: best.c.ticker, gain: best.gain, cost,
      title: `${p.name} → ${best.c.name}`,
      detail: `Выплаты за 12 месяцев: ${((mine.yieldPct || 0) * 100).toFixed(1)}% против ${(best.c.yieldPct * 100).toFixed(1)}%, `
        + `и вторая платит ${best.c.streak} ${best.c.streak < 5 ? 'года' : 'лет'} подряд. На позиции в ${rub(value)} `
        + `разница — около ${rub(best.gain)} в год чистыми, комиссии обмена ${rub(cost)}.`,
      note: `Это наблюдение о прошлых выплатах, а не совет продавать: дивиденды — решение компании и могут быть урезаны. `
        + `Если бумага бралась ради роста бизнеса, низкие выплаты не изъян. Замена меняет и риск: чужой бизнес ты знаешь хуже.`
    });
  }

  out.sort((a, b) => b.gain - a.gain);
  return out;
}

return {STRATEGIES, LIMITS, primaryAction, allSteps, classLabel, taxDeduction, policyStatement, buyRecommendations, replacementIdeas};
})());

/* ─── core/screener.js ─── */
Object.assign(SH, (function(){
/**
 * ПОДБОР БУМАГ.
 *
 * Честная рамка: приложение не знает, какая бумага вырастет. Оно умеет другое —
 * измерить то, что уже произошло, и показать, какие бумаги подходят под ТВОЮ
 * задачу прямо сейчас.
 *
 * Что считается фактом (берётся с биржи):
 *   · сколько дивидендов реально выплачено за 12 месяцев
 *   · сколько лет подряд компания платит
 *   · доходность облигации к погашению, срок до погашения
 *   · текущая цена и доля бумаги в твоём портфеле
 *
 * Что НЕ используется: прогнозы, целевые цены, рейтинги «перспективности».
 * Их нельзя проверить, а значит нельзя на них опираться.
 */


/**
 * Задача, под которую подбираем. От неё зависит, что считать подходящим —
 * а не абстрактное «хорошая бумага».
 */
const PURPOSE = {
  INCOME:   'income',    // регулярные выплаты
  DEFENCE:  'defence',   // защита при падении рынка
  BALANCE:  'balance',   // выровнять перекос по классам
  GROWTH:   'growth'     // рост без выплат
};

/**
 * Что сейчас нужно портфелю. Определяется из данных, а не спрашивается.
 */
function whatIsNeeded(summary, targets) {
  const gaps = [];
  for (const [cls, target] of Object.entries(targets)) {
    const actual = summary.securities > 0 ? (summary.byClass[cls] || 0) / summary.securities : 0;
    const relative = target > 0 ? actual / target : 1;
    if (relative < 0.9) {
      gaps.push({
        cls, actual, target,
        shortfall: target - actual,
        relative,
        purpose: cls === 'hedge' ? PURPOSE.DEFENCE
               : cls === 'bonds' ? PURPOSE.INCOME
               : PURPOSE.GROWTH
      });
    }
  }
  return gaps.sort((a, b) => a.relative - b.relative);
}

/**
 * Оценка кандидата под конкретную задачу.
 * Возвращает не «балл качества», а список измеримых доводов — чтобы решение
 * принимал ты, видя те же цифры, что и приложение.
 */
function evaluate(candidate, purpose, context = {}) {
  const reasons = [];
  const cautions = [];
  let fits = false;

  const kind = classify(candidate);
  const cls = allocationClass(candidate);

  // ── соответствие задаче
  if (purpose === PURPOSE.DEFENCE) {
    fits = isHedge(candidate);
    if (fits) reasons.push('защитный актив: дорожает, когда падает рынок или слабеет рубль');
    else cautions.push('это не защитный актив — задачу закрыть не поможет');
  }

  if (purpose === PURPOSE.INCOME) {
    if (kind === KIND.BOND) {
      fits = true;
      if (candidate.ytm != null) {
        reasons.push(`доходность к погашению ${(candidate.ytm * 100).toFixed(1)}% годовых`);
      }
      if (candidate.yearsLeft != null) {
        reasons.push(`погашение через ${candidate.yearsLeft.toFixed(1)} ${yearsWord(candidate.yearsLeft)} — деньги вернутся по номиналу`);
      }
      if (candidate.yearsLeft > 7) {
        cautions.push('длинный выпуск: сильно дешевеет при росте ставки ЦБ, но и дорожает при снижении');
      }
    } else if (candidate.yieldTtm > 0) {
      fits = true;
      reasons.push(`выплачено ${(candidate.yieldTtm * 100).toFixed(1)}% за последние 12 месяцев`);
      if (candidate.streak >= 5) reasons.push(`платит ${candidate.streak} лет подряд`);
      else if (candidate.streak <= 2) cautions.push(`платит всего ${candidate.streak} ${candidate.streak === 1 ? 'год' : 'года'} — история короткая`);
      cautions.push('дивиденд не обязательство: совет директоров вправе его отменить');
    } else {
      cautions.push('выплат за последний год не было');
    }
  }

  if (purpose === PURPOSE.GROWTH) {
    fits = kind === KIND.STOCK;
    if (fits) reasons.push('акция: доход от роста цены, а не от выплат');
    else if (isHedge(candidate)) reasons.push('защитный актив: не для роста, но страхует портфель при обвале');
    else if (kind === KIND.BOND) cautions.push('облигация даёт предсказуемый доход, но не рост — для этой задачи не подходит');
  }

  // ── влияние на структуру портфеля
  if (context.summary && context.amount > 0) {
    const current = context.summary.byClass[cls] || 0;
    const future = context.summary.securities + context.amount;
    const shareAfter = (current + context.amount) / future;
    const target = context.targets?.[cls];

    if (target != null) {
      if (shareAfter > target * 1.15) {
        // не просто предупреждаем, а считаем сумму, которая выводит ровно на цель
        const fair = Math.max(0, Math.round((target * context.summary.securities - current) / (1 - target)));
        cautions.push(
          `${labelOf(cls)} станет ${Math.round(shareAfter * 100)}% при цели ${Math.round(target * 100)}% — перебор. ` +
          (fair >= 100 ? `Ровно на цель выведет ${fair.toLocaleString('ru-RU')} ₽.` : 'Цель уже достигнута.')
        );
      } else {
        reasons.push(`${labelOf(cls)} выйдет на ${Math.round(shareAfter * 100)}% при цели ${Math.round(target * 100)}%`);
      }
    }
  }

  // ── концентрация: уже есть в портфеле
  if (context.existing) {
    const pos = context.existing.find(p => p.ticker === candidate.ticker);
    if (pos && context.summary?.securities > 0) {
      const share = (pos.qty * pos.price) / context.summary.securities;
      const after = (pos.qty * pos.price + (context.amount || 0)) / (context.summary.securities + (context.amount || 0));
      if (after > 0.25) {
        cautions.push(`доля вырастет до ${Math.round(after * 100)}% — выше твоего лимита в 25%`);
      } else if (share > 0) {
        reasons.push(`уже есть в портфеле (${Math.round(share * 100)}%), докупка не добавит новых рисков`);
      }
    }
  }

  return { ticker: candidate.ticker, name: candidate.name, fits, reasons, cautions };
}

function labelOf(cls) {
  return { stocks: 'доля акций', bonds: 'доля облигаций', hedge: 'доля защиты' }[cls] || cls;
}

function yearsWord(n) {
  const i = Math.floor(n) % 10, j = Math.floor(n) % 100;
  if (j >= 11 && j <= 14) return 'лет';
  if (i === 1) return 'год';
  if (i >= 2 && i <= 4) return 'года';
  return 'лет';
}

/**
 * Сравнение двух вариантов вложения одной суммы.
 * Показывает разницу в измеримых величинах — что получишь и чем рискуешь.
 */
function compare(optionA, optionB, amount) {
  const line = (o) => {
    const perYear = o.kind === 'bond'
      ? (o.annualCoupon || 0) * Math.floor(amount / (o.price || 1))
      : (o.ttm || 0) * Math.floor(amount / (o.price || 1));
    return {
      ticker: o.ticker,
      name: o.name,
      shares: Math.floor(amount / (o.price || 1)),
      incomePerYear: Math.round(perYear),
      netPerYear: Math.round(perYear * 0.87),
      yieldPct: o.price > 0 ? perYear / amount : 0,
      guaranteed: o.kind === 'bond'
    };
  };

  const a = line(optionA), b = line(optionB);
  return {
    a, b,
    incomeDiff: a.netPerYear - b.netPerYear,
    note: a.guaranteed !== b.guaranteed
      ? 'Купон облигации известен заранее и не может быть отменён. Дивиденд акции — решение компании, его размер меняется и может стать нулём.'
      : null
  };
}

return {PURPOSE, whatIsNeeded, evaluate, compare};
})());

/* ─── core/forecast.js ─── */
